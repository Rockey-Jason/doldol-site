<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050716">
<title>돌이 사이트 - 비밀번호 재설정</title>
<style>
@font-face{font-family:HancomMalrangmalrang;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f7f8ff;font-family:HancomMalrangmalrang,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(73,92,255,.2),transparent 28rem),radial-gradient(circle at 90% 90%,rgba(110,55,255,.16),transparent 25rem),linear-gradient(135deg,#070b22,#03040e)}
.panel{width:min(460px,100%);padding:clamp(24px,6vw,38px);border:1px solid rgba(150,170,255,.18);border-radius:26px;background:linear-gradient(145deg,rgba(17,25,63,.94),rgba(7,11,33,.92));box-shadow:0 30px 80px rgba(0,0,0,.42);animation:enter .55s ease both}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;color:white;background:linear-gradient(145deg,#536dce,#252b69);font-size:22px}
h1{margin:22px 0 8px;font-size:27px;font-weight:400}.desc{margin:0 0 24px;color:#9ca8d0;font-size:14px;line-height:1.75}
label{display:block;margin:16px 0 8px;color:#dce2ff;font-size:13px}input{width:100%;height:54px;padding:0 15px;border:1px solid rgba(144,161,235,.18);border-radius:14px;outline:none;color:#f7f8ff;background:rgba(3,7,24,.55);font:inherit}input:focus{border-color:#8297ff;box-shadow:0 0 0 4px rgba(130,151,255,.1)}
button{width:100%;min-height:54px;margin-top:22px;border:1px solid rgba(184,196,255,.3);border-radius:15px;color:white;background:linear-gradient(135deg,#6078e8,#7b5cdb);font:inherit;cursor:pointer;transition:transform .2s ease,filter .2s ease}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:disabled{opacity:.6;cursor:wait;transform:none}
.message{min-height:22px;margin-top:16px;color:#aebcff;font-size:13px;line-height:1.7;overflow-wrap:anywhere}.message.error{color:#f1a7b0}.back{display:block;margin-top:18px;color:#aebcff;text-align:center;font-size:13px;text-decoration:none}.back:hover{color:white}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<main class="panel"><div class="mark" aria-hidden="true">D</div><h1>새 비밀번호 설정</h1>
<p class="desc">이메일로 받은 재설정 링크를 통해 새 비밀번호를 설정해 주세요. 비밀번호는 7자 이상이어야 합니다.</p>
<form id="resetForm"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" minlength="7" required placeholder="7자 이상 입력">
<label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="7" required placeholder="비밀번호를 한 번 더 입력">
<button id="saveButton" type="submit">비밀번호 변경하기</button><div class="message" id="message" role="status" aria-live="polite"></div></form>
<a class="back" href="login.html">로그인 페이지로 돌아가기</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
(() => {
 const message=document.getElementById("message"),form=document.getElementById("resetForm"),button=document.getElementById("saveButton");
 const client=window.doriSupabase||window.supabase.createClient("https://scttowfhygcpdirrekqm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzY3R0b3dmeHlnY3BkaXJyZWtxbSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzgwMTk4NDI2LCJleHAiOjIwOTU3NzQ0MjZ9.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY");
 if(!window.doriSupabase)window.doriSupabase=client;
 form.addEventListener("submit",async(event)=>{
  event.preventDefault();const password=document.getElementById("newPassword").value,confirmation=document.getElementById("confirmPassword").value;
  message.classList.remove("error");
  if(password.length<7){message.classList.add("error");message.textContent="비밀번호는 7자 이상이어야 합니다.";return}
  if(password!==confirmation){message.classList.add("error");message.textContent="두 비밀번호가 일치하지 않습니다.";return}
  button.disabled=true;button.textContent="변경 중...";message.textContent="";
  try{
   const {data:{session},error:sessionError}=await client.auth.getSession();
   if(sessionError||!session)throw new Error("재설정 링크가 만료되었거나 유효하지 않습니다. 로그인 페이지에서 새 링크를 요청해 주세요.");
   const {error}=await client.auth.updateUser({password});if(error)throw error;
   message.textContent="비밀번호가 변경되었습니다. 로그인 페이지로 돌아가 새 비밀번호로 로그인해 주세요.";
   form.querySelectorAll("input").forEach(input=>{input.value="";input.disabled=true});button.textContent="변경 완료";button.disabled=true;
   await client.auth.signOut();
  }catch(error){console.error("Password update failed:",error);message.classList.add("error");message.textContent=error?.message||"비밀번호 변경에 실패했습니다. 재설정 링크를 다시 요청해 주세요.";button.disabled=false;button.textContent="비밀번호 변경하기"}
 });
})();
</script></body></html>
