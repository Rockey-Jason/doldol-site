<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
<title id="title">돌이 웰시코기 캐릭터</title><desc id="desc">짧은 다리와 황갈색 털, 흰 가슴과 주둥이를 가진 귀여운 웰시코기 봉제인형 돌이</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6c98f"/><stop offset=".48" stop-color="#d99a58"/><stop offset="1" stop-color="#ad693b"/></linearGradient>
 <linearGradient id="cream" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#e9ddca"/></linearGradient>
 <radialGradient id="face"><stop stop-color="#f8d9a8"/><stop offset="1" stop-color="#c98248"/></radialGradient>
 <linearGradient id="shadow" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="plush" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="12" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer><feBlend in="SourceGraphic" in2="mono" mode="soft-light"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<ellipse cx="256" cy="605" rx="150" ry="19" fill="#000" opacity=".24" filter="url(#soft)"/>
<!-- tail -->
<path d="M365 457 Q430 435 425 475 Q421 500 389 488" fill="none" stroke="#bd7c46" stroke-width="33" stroke-linecap="round"/>
<path d="M395 459 Q420 456 421 477" fill="none" stroke="#f5eadb" stroke-width="13" stroke-linecap="round"/>
<!-- body -->
<g filter="url(#plush)">
 <path d="M132 359 Q135 307 184 292 Q256 263 328 292 Q378 311 382 371 L397 524 Q397 561 359 565 L153 565 Q115 561 118 524Z" fill="url(#fur)" stroke="#a9683b" stroke-width="5"/>
 <path d="M183 314 Q256 282 329 314 Q354 339 354 392 L345 533 Q256 571 167 533 L158 392Q158 339 183 314Z" fill="url(#cream)"/>
 <!-- front paws -->
 <path d="M140 486 Q106 488 108 548 Q111 578 162 577 L208 574 Q218 554 203 524 Q183 489 140 486Z" fill="url(#fur)" stroke="#a9683b" stroke-width="4"/>
 <path d="M372 486 Q406 488 404 548 Q401 578 350 577 L304 574 Q294 554 309 524 Q329 489 372 486Z" fill="url(#fur)" stroke="#a9683b" stroke-width="4"/>
 <path d="M119 558 Q157 570 202 556" fill="none" stroke="#fff5e7" stroke-width="12" stroke-linecap="round"/>
 <path d="M310 556 Q355 570 393 558" fill="none" stroke="#fff5e7" stroke-width="12" stroke-linecap="round"/>
 <!-- neck / head -->
 <path d="M91 174 Q80 111 112 54 Q130 21 165 55 L206 105 Q256 78 306 105 L347 55 Q382 21 400 54 Q432 111 421 174 Q417 267 357 313 Q311 345 256 344 Q201 345 155 313 Q95 267 91 174Z" fill="url(#fur)" stroke="#a9683b" stroke-width="5"/>
 <!-- forehead light -->
 <path d="M183 101 Q256 69 329 101 Q358 128 354 191 Q344 254 256 273 Q168 254 158 191 Q154 128 183 101Z" fill="url(#face)" opacity=".7"/>
 <!-- inner ears -->
 <path d="M115 70 Q133 47 153 74 L180 117 Q151 147 125 135Z" fill="#b86f50" opacity=".82"/>
 <path d="M397 70 Q379 47 359 74 L332 117 Q361 147 387 135Z" fill="#b86f50" opacity=".82"/>
 <!-- muzzle cheeks -->
 <ellipse cx="205" cy="223" rx="65" ry="48" fill="url(#cream)"/>
 <ellipse cx="307" cy="223" rx="65" ry="48" fill="url(#cream)"/>
 <path d="M181 205 Q202 185 224 205" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".65"/>
 <path d="M288 205 Q310 185 331 205" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".65"/>
 <!-- eyes -->
 <ellipse cx="190" cy="175" rx="11" ry="15" fill="#30221d"/>
 <ellipse cx="322" cy="175" rx="11" ry="15" fill="#30221d"/>
 <circle cx="194" cy="169" r="4" fill="#fff"/>
 <circle cx="326" cy="169" r="4" fill="#fff"/>
 <!-- brows -->
 <path d="M168 151 Q188 140 208 151 M304 151 Q324 140 344 151" fill="none" stroke="#9d603c" stroke-width="6" stroke-linecap="round" opacity=".6"/>
 <!-- nose and smile -->
 <path d="M235 218 Q256 204 277 218 Q276 237 256 241 Q236 237 235 218Z" fill="#2b2423"/>
 <ellipse cx="247" cy="216" rx="6" ry="3" fill="#fff" opacity=".8"/>
 <path d="M256 240 Q255 257 237 262 M256 240 Q257 257 275 262" fill="none" stroke="#704534" stroke-width="4" stroke-linecap="round"/>
 <!-- chest bib -->
 <path d="M215 300 Q256 282 297 300 Q320 350 306 404 Q256 438 206 404 Q192 350 215 300Z" fill="url(#cream)" opacity=".96"/>
 <!-- plush seams and highlights -->
 <path d="M130 116 Q111 180 137 235 M382 116 Q401 180 375 235" fill="none" stroke="#ffe1b7" stroke-width="5" stroke-linecap="round" opacity=".25"/>
 <path d="M176 335 Q256 358 336 335" fill="none" stroke="#fff" stroke-width="7" opacity=".18" stroke-linecap="round"/>
 <path d="M149 411 Q132 467 151 493 M363 411 Q380 467 361 493" fill="none" stroke="#fff0d7" stroke-width="6" opacity=".2" stroke-linecap="round"/>
</g>
<!-- fur glints -->
<g fill="#fff4df" opacity=".38"><circle cx="135" cy="158" r="3"/><circle cx="153" cy="118" r="2"/><circle cx="375" cy="158" r="3"/><circle cx="357" cy="118" r="2"/><circle cx="183" cy="294" r="3"/><circle cx="330" cy="294" r="3"/></g>
</svg>