<span class="제목">-개요<br></span>

<span class="제목">-생김새<br></span>
돌이는 짧을 다리를 가지고 있으며 짧은 꼬리를 가지고 있다. 돌이는 발, 배, 입주변, 목, 가슴 쪽에는 흰색 털을 가지고, 나머지 곳들은 주로 황갈색 털을 가진다. 돌이의 신장은 약 17cm 정도로 일반 웰시코기의 신장인 25~32cm에 비해 매우 작은 편이다. (그외 추가할 내용들)<br>
<span class="제목">-성격<br></span>
돌이는 잠시도 가만히 있지 못할 정도로 매우 활동적이고 활발하다. 
<del>근데 너무 활발해서 정신 사납기 까지 한 정도다</del>. 
활동적인 돌이는 'Rockey Party come on, come on. Rockey Party (Rockey Party!)'라는 가사가 반복되는 노래를 반복적으로 부르고 듣는 
Rockey Party(로키 파티)를 열어서 Rockey Party에 같이 있는 사람들 또한 활발하게 만든다.  돌이는 설정상 수능에 나오는 4짜리 문제를 
공부하지 않고도 맞출수 있을 정도로 매우 영리하다.

  `,

  5: `

  돌돌행성에서 발견된 신비한 바이러스입니다.
  돌이다!
  `,

  6: `
  <h1>★ 돌이의 기지들</h1>
  돌이가 만든 여러 기지에 대한 정보입니다.
  `,

  `,

  8: `
  <h1>★ 로키랜드</h1>
  돌이 세계 최고의 놀이공원입니다.
  `,

  9: `
  <h1>★ 돌이 사이트</h1>
  돌이와 관련된 모든 정보를 볼 수 있는 사이트입니다.
  `
};


function 정보보기(번호){
  볼정보 = 번호;
  정보창.innerHTML = 내용[볼정보];
}


// 버튼 연결

  정보보기(1);
};

document.getElementById("돌이의 친구들").onclick = () => {
  정보보기(2);
};

document.getElementById("돌이신문").onclick = () => {
  정보보기(3);
};

document.getElementById("도로늄").onclick = () => {
  정보보기(4);
};

document.getElementById("돌돌바이러스").onclick = () => {
  정보보기(5);
};

document.getElementById("돌이의 기지들").onclick = () => {
  정보보기(6);
};

document.getElementById("돌이 암호").onclick = () => {
  정보보기(7);
};

document.getElementById("로키랜드").onclick = () => {
  정보보기(8);
};

document.getElementById("돌이 사이트").onclick = () => {
  정보보기(9);
};
