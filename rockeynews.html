<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>돌이 사이트 - 돌이신문</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   폰트
   ===================================================== */

@font-face {
    font-family: "Hancom";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2")
        format("woff2");
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: "Hancom";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2")
        format("woff2");
    font-weight: 700;
    font-display: swap;
}


/* =====================================================
   기본 색상
   ===================================================== */

:root {
    --background: #040511;
    --background-light: #0a1030;

    --panel: rgba(17, 24, 58, 0.72);
    --panel-strong: rgba(20, 28, 68, 0.9);
    --panel-soft: rgba(255, 255, 255, 0.045);

    --border: rgba(255, 255, 255, 0.12);
    --border-light: rgba(143, 168, 255, 0.28);

    --text: #f7f8ff;
    --muted: #aab3d0;
    --muted-dark: #707998;

    --blue: #86aaff;
    --blue-light: #b8caff;

    --green: #64e6a0;
    --yellow: #ffdb68;
    --red: #ff8e9e;

    --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
}


/* =====================================================
   초기화
   ===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
    background: var(--background);
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    color: var(--text);
    font-family: "Hancom", "Jua", system-ui, sans-serif;

    background:
        radial-gradient(
            circle at 12% 0%,
            rgba(53, 76, 170, 0.32),
            transparent 36%
        ),
        radial-gradient(
            circle at 92% 18%,
            rgba(39, 91, 151, 0.25),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(80, 40, 150, 0.13),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #050718 0%,
            #03030d 72%,
            #050515 100%
        );

    overflow-x: hidden;
}


/* =====================================================
   배경 장식
   ===================================================== */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.025),
            transparent 35%,
            rgba(110, 150, 255, 0.025)
        );

    z-index: -3;
}

body::after {
    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    top: -180px;
    right: -130px;

    border-radius: 50%;

    background: rgba(82, 113, 255, 0.08);

    filter: blur(80px);

    pointer-events: none;

    animation: backgroundFloat 12s ease-in-out infinite alternate;

    z-index: -2;
}

@keyframes backgroundFloat {
    from {
        transform: translate3d(0, 0, 0) scale(1);
    }

    to {
        transform: translate3d(-35px, 30px, 0) scale(1.08);
    }
}


/* =====================================================
   전체 페이지
   ===================================================== */

.page {
    width: min(1120px, calc(100% - 32px));

    margin: 0 auto;

    padding:
        24px
        0
        70px;

    position: relative;
}


/* =====================================================
   상단 네비게이션
   ===================================================== */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;

    margin-bottom: 48px;

    animation: pageEnter 0.7s cubic-bezier(.2, .8, .2, 1) both;
}

.home-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    padding: 11px 18px;

    border: 1px solid var(--border);
    border-radius: 999px;

    color: var(--text);
    background: rgba(255, 255, 255, 0.045);

    text-decoration: none;
    font-size: 15px;
    font-weight: 700;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    transition:
        transform 0.35s cubic-bezier(.2, .8, .2, 1),
        background 0.35s,
        border-color 0.35s,
        box-shadow 0.35s;
}

.home-button:hover {
    transform: translateY(-3px);

    background: rgba(126, 155, 255, 0.12);
    border-color: var(--border-light);

    box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.2),
        0 0 24px rgba(112, 145, 255, 0.08);
}

.home-button:active {
    transform: scale(0.96);
}

.home-icon {
    font-size: 17px;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 11px 16px;

    border: 1px solid transparent;
    border-radius: 999px;

    color: var(--muted);
    background: transparent;

    font-family: inherit;
    font-size: 14px;
    cursor: pointer;

    transition:
        color 0.3s,
        background 0.3s,
        transform 0.3s;
}

.back-button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    transform: translateX(-3px);
}

.back-button:active {
    transform: scale(0.95);
}


/* =====================================================
   제목 영역
   ===================================================== */

.hero {
    position: relative;

    margin-bottom: 36px;

    animation:
        pageEnter 0.8s 0.08s
        cubic-bezier(.2, .8, .2, 1)
        both;
}

.hero-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 16px;
    padding: 8px 13px;

    border: 1px solid rgba(134, 170, 255, 0.2);
    border-radius: 999px;

    color: var(--blue-light);
    background: rgba(111, 143, 255, 0.08);

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
}

.hero-label::before {
    content: "";

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--blue);

    box-shadow: 0 0 12px rgba(134, 170, 255, 0.8);
}

.hero h1 {
    margin: 0;

    font-family: "Black Han Sans", "Hancom", sans-serif;
    font-size: clamp(42px, 7vw, 78px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.045em;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #dce5ff 45%,
            #9eafff 100%
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 8px 28px rgba(98, 127, 255, 0.1));
}

.hero p {
    margin: 18px 0 0;

    max-width: 680px;

    color: var(--muted);
    font-size: clamp(16px, 2vw, 19px);
    line-height: 1.8;
}


/* =====================================================
   안내 카드
   ===================================================== */

.info-card {
    display: flex;
    align-items: center;
    gap: 16px;

    margin-bottom: 28px;
    padding: 18px 20px;

    border: 1px solid var(--border);
    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.07),
            rgba(255, 255, 255, 0.025)
        );

    box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.16),
        inset 0 1px rgba(255, 255, 255, 0.045);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation:
        pageEnter 0.8s 0.16s
        cubic-bezier(.2, .8, .2, 1)
        both;
}

.info-icon {
    display: grid;
    place-items: center;

    flex: 0 0 42px;

    width: 42px;
    height: 42px;

    border-radius: 14px;

    color: var(--blue-light);
    background: rgba(119, 154, 255, 0.13);

    font-size: 20px;
}

.info-text {
    min-width: 0;
}

.info-title {
    margin-bottom: 4px;

    font-size: 15px;
    font-weight: 700;
}

.info-description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}


/* =====================================================
   상태 범례
   ===================================================== */

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    margin-bottom: 26px;

    animation:
        pageEnter 0.8s 0.22s
        cubic-bezier(.2, .8, .2, 1)
        both;
}

.legend-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 9px 13px;

    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;

    color: var(--muted);

    background: rgba(255, 255, 255, 0.035);

    font-size: 13px;
}

.legend-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: currentColor;
    box-shadow: 0 0 10px currentColor;
}

.legend-read {
    color: var(--green);
}

.legend-available {
    color: #e9edff;
}

.legend-new {
    color: var(--yellow);
}

.legend-locked {
    color: #777f9e;
}


/* =====================================================
   신문 목록 영역
   ===================================================== */

.news-section {
    position: relative;

    animation:
        pageEnter 0.8s 0.28s
        cubic-bezier(.2, .8, .2, 1)
        both;
}

.section-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;

    margin-bottom: 18px;
}

.section-heading h2 {
    margin: 0;

    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
}

.section-heading span {
    color: var(--muted-dark);
    font-size: 13px;
}

.news-list {
    display: grid;
    gap: 13px;
}


/* =====================================================
   신문 카드
   ===================================================== */

.신문 {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;

    width: 100%;
    min-height: 82px;

    padding: 20px 23px;

    border: 1px solid var(--border);
    border-radius: 22px;

    color: var(--text);
    background:
        linear-gradient(
            135deg,
            rgba(22, 30, 70, 0.82),
            rgba(9, 13, 35, 0.74)
        );

    box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.18),
        inset 0 1px rgba(255, 255, 255, 0.055);

    font-family: inherit;
    text-align: left;

    cursor: pointer;

    overflow: hidden;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    transition:
        transform 0.38s cubic-bezier(.2, .8, .2, 1),
        border-color 0.38s,
        box-shadow 0.38s,
        background 0.38s,
        opacity 0.38s;
}

.신문::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255, 255, 255, 0.055) 50%,
            transparent 80%
        );

    transform: translateX(-120%);

    transition: transform 0.8s ease;

    pointer-events: none;
}

.신문:hover:not(:disabled) {
    transform: translateY(-5px) scale(1.008);

    border-color: rgba(134, 170, 255, 0.32);

    background:
        linear-gradient(
            135deg,
            rgba(31, 43, 91, 0.9),
            rgba(12, 17, 43, 0.82)
        );

    box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.28),
        0 0 30px rgba(105, 139, 255, 0.08),
        inset 0 1px rgba(255, 255, 255, 0.08);
}

.신문:hover:not(:disabled)::before {
    transform: translateX(120%);
}

.신문:active:not(:disabled) {
    transform: translateY(-1px) scale(0.985);
}

.신문:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 4px;
}

.신문제목 {
    position: relative;
    z-index: 1;

    display: flex;
    align-items: center;
    gap: 12px;

    min-width: 0;

    font-size: clamp(17px, 2vw, 20px);
    font-weight: 700;
    letter-spacing: -0.025em;
}

.신문제목::before {
    content: "신문";

    display: inline-flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 auto;

    min-width: 43px;
    height: 27px;

    padding: 0 8px;

    border: 1px solid rgba(134, 170, 255, 0.2);
    border-radius: 8px;

    color: var(--blue-light);
    background: rgba(119, 154, 255, 0.1);

    font-size: 11px;
    font-weight: 700;
}

.신문상태 {
    position: relative;
    z-index: 1;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 auto;

    min-height: 29px;

    padding: 6px 11px;

    border-radius: 999px;

    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;

    background: rgba(255, 255, 255, 0.055);
}

.읽음 {
    border-color: rgba(100, 230, 160, 0.22);
}

.읽음 .신문상태 {
    color: var(--green);
    background: rgba(100, 230, 160, 0.09);
}

.읽기가능 .신문상태 {
    color: #e9edff;
    background: rgba(233, 237, 255, 0.08);
}

.최근발행 {
    border-color: rgba(255, 219, 104, 0.28);

    background:
        linear-gradient(
            135deg,
            rgba(72, 61, 29, 0.5),
            rgba(20, 25, 52, 0.8)
        );

    box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.2),
        0 0 28px rgba(255, 210, 80, 0.055),
        inset 0 1px rgba(255, 255, 255, 0.06);
}

.최근발행 .신문상태 {
    color: var(--yellow);
    background: rgba(255, 219, 104, 0.1);
}

.잠금 {
    color: #777f9e;
    border-color: rgba(255, 255, 255, 0.06);

    background:
        linear-gradient(
            135deg,
            rgba(17, 21, 43, 0.62),
            rgba(8, 11, 28, 0.68)
        );

    opacity: 0.62;
    filter: saturate(0.55);

    cursor: not-allowed;
}

.잠금 .신문제목::before {
    color: #707894;
    background: rgba(255, 255, 255, 0.035);
    border-color: rgba(255, 255, 255, 0.06);
}

.잠금 .신문상태 {
    color: #777f9e;
    background: rgba(255, 255, 255, 0.035);
}


/* =====================================================
   로딩
   ===================================================== */

.loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;

    min-height: 260px;

    border: 1px solid var(--border);
    border-radius: 24px;

    background: rgba(255, 255, 255, 0.035);

    color: var(--muted);

    animation: fadeIn 0.5s ease both;
}

.loading-spinner {
    width: 34px;
    height: 34px;

    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--blue);

    border-radius: 50%;

    animation: spin 0.85s linear infinite;
}

.loading-text {
    font-size: 14px;
}


/* =====================================================
   오류 / 빈 상태
   ===================================================== */

.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;

    min-height: 230px;

    padding: 35px 20px;

    border: 1px solid var(--border);
    border-radius: 24px;

    background: rgba(255, 255, 255, 0.035);

    text-align: center;
    color: var(--muted);

    animation: fadeIn 0.5s ease both;
}

.empty-icon {
    font-size: 38px;
    opacity: 0.8;
}

.empty-title {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
}

.empty-description {
    font-size: 14px;
    line-height: 1.7;
}


/* =====================================================
   하단
   ===================================================== */

.footer {
    margin-top: 54px;
    padding-top: 22px;

    border-top: 1px solid rgba(255, 255, 255, 0.07);

    color: var(--muted-dark);
    font-size: 12px;
    text-align: center;

    animation:
        pageEnter 0.8s 0.35s
        cubic-bezier(.2, .8, .2, 1)
        both;
}


/* =====================================================
   애니메이션
   ===================================================== */

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   반응형
   ===================================================== */

@media (max-width: 700px) {

    .page {
        width: min(100% - 24px, 1120px);
        padding-top: 16px;
        padding-bottom: 45px;
    }

    .topbar {
        margin-bottom: 38px;
    }

    .home-button {
        padding: 10px 14px;
        font-size: 13px;
    }

    .back-button {
        padding: 10px 12px;
        font-size: 13px;
    }

    .hero {
        margin-bottom: 28px;
    }

    .hero h1 {
        font-size: clamp(42px, 14vw, 66px);
    }

    .hero p {
        margin-top: 14px;
        font-size: 15px;
        line-height: 1.7;
    }

    .info-card {
        align-items: flex-start;
        padding: 16px;
        border-radius: 18px;
    }

    .info-icon {
        flex-basis: 36px;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 17px;
    }

    .legend {
        gap: 8px;
    }

    .legend-item {
        padding: 8px 10px;
        font-size: 12px;
    }

    .section-heading h2 {
        font-size: 20px;
    }

    .신문 {
        align-items: flex-start;
        gap: 12px;
        min-height: 76px;
        padding: 17px;
        border-radius: 18px;
    }

    .신문제목 {
        align-items: flex-start;
        gap: 9px;
        font-size: 16px;
        line-height: 1.45;
    }

    .신문제목::before {
        min-width: 38px;
        height: 24px;
        padding: 0 6px;
        font-size: 10px;
    }

    .신문상태 {
        min-height: 26px;
        padding: 5px 8px;
        font-size: 10px;
    }

}

@media (max-width: 430px) {

    .topbar {
        align-items: flex-start;
    }

    .back-button {
        padding: 8px;
        font-size: 0;
    }

    .back-button span {
        font-size: 18px;
    }

    .신문 {
        flex-direction: column;
    }

    .신문상태 {
        margin-left: 47px;
    }

}


/* =====================================================
   모션 줄이기 설정
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }

}

</style>
</head>


<body>

<div class="page">

    <!-- =================================================
         상단 네비게이션
         ================================================= -->

    <header class="topbar">

        <a
            class="home-button"
            href="https://rockey-jason.github.io/doldol-site/"
        >
            <span class="home-icon">◈</span>
            <span>돌이 사이트</span>
        </a>

        <button
            class="back-button"
            id="뒤로가기"
            type="button"
        >
            <span>←</span>
            <span>뒤로가기</span>
        </button>

    </header>


    <!-- =================================================
         제목
         ================================================= -->

    <section class="hero">

        <div class="hero-label">
            돌이사이트 공식 소식
        </div>

        <h1>돌이신문</h1>

        <p>
            돌이와 관련된 새로운 이야기와 소식을 확인해보세요.
            <br>
            읽을 수 있는 신문부터 차근차근 만나볼 수 있어요.
        </p>

    </section>


    <!-- =================================================
         안내 카드
         ================================================= -->

    <section class="info-card">

        <div class="info-icon">
            ✦
        </div>

        <div class="info-text">

            <div class="info-title">
                돌이신문 이용 안내
            </div>

            <div class="info-description">
                읽을 수 있는 신문을 선택하면 해당 신문의 내용을 확인할 수 있습니다.
                잠긴 신문은 나중에 공개될 예정입니다.
            </div>

        </div>

    </section>


    <!-- =================================================
         상태 범례
         ================================================= -->

    <div class="legend">

        <div class="legend-item legend-read">
            <span class="legend-dot"></span>
            읽음
        </div>

        <div class="legend-item legend-available">
            <span class="legend-dot"></span>
            읽기 가능
        </div>

        <div class="legend-item legend-new">
            <span class="legend-dot"></span>
            최근 발행
        </div>

        <div class="legend-item legend-locked">
            <span class="legend-dot"></span>
            잠금
        </div>

    </div>


    <!-- =================================================
         신문 목록
         ================================================= -->

    <section class="news-section">

        <div class="section-heading">

            <h2>신문 목록</h2>

            <span id="신문개수">
                불러오는 중
            </span>

        </div>

        <div
            class="news-list"
            id="신문목록"
        >

            <div class="loading">

                <div class="loading-spinner"></div>

                <div class="loading-text">
                    돌이신문을 불러오는 중...
                </div>

            </div>

        </div>

    </section>


    <!-- =================================================
         하단
         ================================================= -->

    <footer class="footer">
        돌이사이트 · 돌이신문
    </footer>

</div>


<!-- =====================================================
     신문 복제용 원본
     ===================================================== -->

<button
    id="돌이신문"
    class="신문"
    type="button"
    style="display:none;"
></button>


<script type="module">

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


// =====================================================
// Supabase
// =====================================================

const supabase = createClient(

    "https://scttowfhygcpdirrekqm.supabase.co",

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"

);


// =====================================================
// DOM
// =====================================================

const 신문목록영역 =
    document.getElementById("신문목록");

const 신문개수 =
    document.getElementById("신문개수");

const 원본신문 =
    document.getElementById("돌이신문");

const 뒤로가기버튼 =
    document.getElementById("뒤로가기");


// =====================================================
// 페이지 이동
// =====================================================

function 페이지이동(url) {

    document.body.style.transition =
        "opacity 0.25s ease";

    document.body.style.opacity =
        "0";

    setTimeout(() => {

        location.href = url;

    }, 250);

}


// =====================================================
// 뒤로가기
// =====================================================

뒤로가기버튼.addEventListener(
    "click",
    () => {

        if (
            document.referrer &&
            document.referrer.includes(
                "rockey-jason.github.io"
            )
        ) {

            history.back();

        } else {

            페이지이동(
                "https://rockey-jason.github.io/doldol-site/"
            );

        }

    }
);


// =====================================================
// 로그인 확인
// =====================================================

async function 로그인확인() {

    const {
        data,
        error
    } = await supabase.auth.getSession();

    if (error) {

        console.error(
            "로그인 상태 확인 오류:",
            error
        );

        return null;

    }

    return data?.session ?? null;

}


// =====================================================
// 사용자 정보 불러오기
// =====================================================

async function 사용자정보불러오기(userId) {

    const {
        data,
        error
    } = await supabase

        .from("users")

        .select(
            "read_dori_news, read_dori_news_numbers"
        )

        .eq(
            "user_id",
            userId
        )

        .single();


    if (error) {

        console.error(
            "사용자 정보 조회 오류:",
            error
        );

        return null;

    }

    return data;

}


// =====================================================
// 신문 목록 불러오기
// =====================================================

async function 신문목록불러오기() {

    const {
        data,
        error
    } = await supabase

        .from("rockey_news")

        .select("news_number")

        .order(
            "news_number",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "신문 목록 조회 오류:",
            error
        );

        return null;

    }

    return data || [];

}


// =====================================================
// 오류 화면
// =====================================================

function 오류화면(
    제목,
    설명,
    아이콘 = "⚠️"
) {

    신문개수.textContent =
        "확인 필요";

    신문목록영역.innerHTML = `

        <div class="empty-state">

            <div class="empty-icon">
                ${아이콘}
            </div>

            <div class="empty-title">
                ${제목}
            </div>

            <div class="empty-description">
                ${설명}
            </div>

        </div>

    `;

}


// =====================================================
// 신문 카드 생성
// =====================================================

function 신문카드생성(
    신문,
    index,
    읽을수있는신문,
    읽은신문,
    최근신문번호
) {

    const 번호 =
        Number(
            신문.news_number
        );


    const 카드 =
        원본신문.cloneNode(true);


    카드.id =
        "news" + 번호;

    카드.style.display =
        "flex";

    카드.style.animation =
        `cardEnter 0.55s ${index * 0.055}s cubic-bezier(.2,.8,.2,1) both`;


    const 제목 =
        document.createElement("span");

    제목.className =
        "신문제목";

    제목.textContent =
        `제${번호}회 돌이신문`;


    const 상태 =
        document.createElement("span");

    상태.className =
        "신문상태";


    // =================================================
    // 읽은 신문
    // =================================================

    if (
        읽은신문.includes(번호)
    ) {

        카드.classList.add("읽음");

        상태.textContent =
            "✓ 읽음";

    }


    // =================================================
    // 잠긴 신문
    // =================================================

    else if (
        번호 > 읽을수있는신문
    ) {

        카드.classList.add("잠금");

        상태.textContent =
            "🔒 잠금";

        카드.disabled =
            true;

        카드.setAttribute(
            "aria-disabled",
            "true"
        );

    }


    // =================================================
    // 읽을 수 있는 신문
    // =================================================

    else {

        if (
            번호 === 최근신문번호
        ) {

            카드.classList.add("최근발행");

            상태.textContent =
                "✦ 최근 발행";

        } else {

            카드.classList.add("읽기가능");

            상태.textContent =
                "📖 읽기 가능";

        }

    }


    카드.appendChild(제목);
    카드.appendChild(상태);


    // =================================================
    // 클릭
    // =================================================

    카드.addEventListener(
        "click",
        () => {

            if (
                번호 > 읽을수있는신문
            ) {

                return;

            }


            localStorage.setItem(
                "rockeynews",
                String(번호)
            );


            페이지이동(
                "readingrockeynews.html"
            );

        }
    );


    return 카드;

}


// =====================================================
// 메인 실행
// =====================================================

async function 시작() {

    console.log(
        "돌이신문 페이지 시작"
    );


    // -------------------------------------------------
    // 로그인 확인
    // -------------------------------------------------

    const session =
        await 로그인확인();


    if (!session) {

        alert(
            "로그인을 하지 않아 이 기능을 사용할 수 없습니다. 먼저 로그인을 완료해주세요."
        );

        location.href =
            "login.html";

        return;

    }


    // -------------------------------------------------
    // 사용자 정보
    // -------------------------------------------------

    const userInfo =
        await 사용자정보불러오기(
            session.user.id
        );


    if (!userInfo) {

        오류화면(
            "사용자 정보를 불러오지 못했습니다.",
            "잠시 후 다시 시도해주세요."
        );

        return;

    }


    // -------------------------------------------------
    // 읽을 수 있는 신문 번호
    // -------------------------------------------------

    const 읽을수있는신문 =
        Number(
            userInfo.read_dori_news
        ) || 0;


    // -------------------------------------------------
    // 읽은 신문 번호
    // -------------------------------------------------

    let 읽은신문 =
        userInfo.read_dori_news_numbers;


    if (
        !Array.isArray(읽은신문)
    ) {

        읽은신문 = [];

    }


    읽은신문 =
        읽은신문

            .map(
                번호 => Number(번호)
            )

            .filter(
                번호 => Number.isInteger(번호)
            );


    // -------------------------------------------------
    // 전체 신문
    // -------------------------------------------------

    const 목록 =
        await 신문목록불러오기();


    if (!목록) {

        오류화면(
            "신문 목록을 불러오지 못했습니다.",
            "Supabase 연결 상태를 확인해주세요."
        );

        return;

    }


    if (
        목록.length === 0
    ) {

        오류화면(
            "등록된 돌이신문이 없습니다.",
            "새로운 신문이 발행되면 이곳에 표시됩니다.",
            "📰"
        );

        return;

    }


    // -------------------------------------------------
    // 최근 신문 번호
    // -------------------------------------------------

    const 최근신문번호 =
        Math.max(
            ...목록.map(
                신문 =>
                    Number(
                        신문.news_number
                    )
            )
        );


    // -------------------------------------------------
    // 개수 표시
    // -------------------------------------------------

    신문개수.textContent =
        `총 ${목록.length}개`;


    // -------------------------------------------------
    // 로딩 제거
    // -------------------------------------------------

    신문목록영역.innerHTML =
        "";


    // -------------------------------------------------
    // 카드 생성
    // -------------------------------------------------

    목록.forEach(
        (신문, index) => {

            const 카드 =
                신문카드생성(
                    신문,
                    index,
                    읽을수있는신문,
                    읽은신문,
                    최근신문번호
                );


            신문목록영역.appendChild(
                카드
            );

        }
    );


    console.log(
        "돌이신문 목록 표시 완료"
    );

}


// =====================================================
// 인증 상태 변화
// =====================================================

supabase.auth.onAuthStateChange(
    (event, session) => {

        console.log(
            "Auth:",
            event
        );


        if (
            event === "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }
);


// =====================================================
// 실행
// =====================================================

시작();

</script>

</body>
</html>
