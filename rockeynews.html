<!DOCTYPE html>
<html>
<head>

<title>돌이 사이트-돌이신문</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

@font-face{font-family:Hancom;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Hancom;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--bg:#050718;--panel:rgba(15,20,45,.72);--line:rgba(255,255,255,.11);--text:#f7f8ff;--muted:#aeb5cf;--green:#55e89a;--yellow:#ffd85a;--blue:#77a8ff}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Hancom,system-ui,sans-serif;background:radial-gradient(circle at 15% 0%,#18245b 0,transparent 38%),radial-gradient(circle at 90% 20%,#10284d 0,transparent 34%),linear-gradient(135deg,#050718,#03030d 70%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%,rgba(110,150,255,.025));z-index:-1}
.신문{position:absolute;left:clamp(16px,4vw,56px);width:min(900px,calc(100% - 32px));min-height:64px;padding:18px 24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(20,28,60,.82),rgba(10,13,32,.72));box-shadow:0 14px 40px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--text);font-size:clamp(17px,2.2vw,21px);text-align:left;cursor:pointer;white-space:normal;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s, border-color .35s, opacity .35s}
.신문:hover:not(:disabled){transform:translateY(-4px) scale(1.012);box-shadow:0 22px 55px rgba(0,0,0,.36),0 0 30px rgba(100,140,255,.08);border-color:rgba(119,168,255,.3)}
.신문:active:not(:disabled){transform:scale(.985)}
.신문제목{font-weight:700;letter-spacing:.01em}
.신문상태{display:inline-block;margin-left:14px;font-size:.88em;font-weight:700}
.읽음{color:var(--green)}
.읽기가능{color:#f5f7ff}
.최근발행{color:var(--yellow);border-color:rgba(255,216,90,.28);box-shadow:0 0 28px rgba(255,216,90,.08)}
.잠금{color:#6e748b;cursor:not-allowed;filter:saturate(.45);opacity:.7}
#상태안내{position:absolute;top:clamp(145px,18vw,190px);left:clamp(16px,4vw,56px);display:flex;flex-wrap:wrap;gap:10px 18px;width:min(900px,calc(100% - 32px));padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);color:var(--muted);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
#상태안내 span{white-space:nowrap}
a{color:inherit}
body>a:first-of-type{display:block;position:relative;width:max-content;max-width:90%;margin:0;padding:20px 0 0 clamp(16px,4vw,56px);text-decoration:none}
body>a:first-of-type button{position:static!important;background:linear-gradient(135deg,#fff,#bfc9ff);-webkit-background-clip:text;background-clip:text;color:transparent!important;border:0!important;font-family:'Black Han Sans',Hancom,sans-serif!important;font-size:clamp(48px,9vw,100px)!important;line-height:1;cursor:pointer;transition:filter .35s,transform .35s}
body>a:first-of-type:hover button{filter:drop-shadow(0 0 18px rgba(120,150,255,.25));transform:translateX(5px)}
body p{font-size:clamp(17px,2.5vw,22px)!important;color:#e8ebf8!important;margin:32px 16px 0 clamp(16px,4vw,56px)!important;white-space:normal!important;max-width:850px;line-height:1.65}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.신문{animation:rise .65s both;animation-delay:calc(var(--i,0)*.055s)}
@media(max-width:700px){.신문{min-height:58px;padding:15px 17px;border-radius:16px}.신문상태{display:block;margin:5px 0 0;font-size:13px}#상태안내{top:155px;line-height:1.4}body p{margin-top:25px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

</style>

</head>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
  rel="stylesheet"
>


<body>


<!-- ==================================================
     사이트 홈 버튼
     ================================================== -->

<a
  href="https://rockey-jason.github.io/doldol-site/"
  style="text-decoration:none;"
>

<button
  style="
    position:absolute;
    top:0;
    left:0;
    background:none;
    border:none;
    color:#f5f5f5;
    font-family:'Black Han Sans';
    font-size:100px;
    cursor:pointer;
    white-space:nowrap;
  "
>
  돌이 사이트
</button>

</a>


<!-- ==================================================
     설명
     ================================================== -->

<p
  style="
    font-size:20px;
    color:#f5f5f5;
    font-family:'HancomMalrangmalrang';
    margin-top:120px;
    margin-left:20px;
    white-space:nowrap;
  "
>
  돌이신문 확인-돌이와 관련된 이야기를 읽어보세요!
</p>


<!-- ==================================================
     상태 안내
     ================================================== -->

<div id="상태안내">

  <span style="color:#4ade80;">
    ● 읽음
  </span>

  &nbsp;&nbsp;

  <span style="color:#f5f5f5;">
    ● 읽기 가능
  </span>

  &nbsp;&nbsp;

  <span style="color:#ffd43b;">
    ● 최근 발행 돌이신문
  </span>

  &nbsp;&nbsp;

  <span style="color:#777777;">
    ● 잠금
  </span>

</div>


<!-- ==================================================
     신문 복제용 원본
     ================================================== -->

<button
  id="돌이신문"
  class="신문"
  style="display:none;"
>
</button>


<script type="module">

import {
  createClient
}
from "https://esm.sh/@supabase/supabase-js@2";


/* ==================================================
   Supabase
   ================================================== */

const supabase = createClient(

  "https://scttowfhygcpdirrekqm.supabase.co",

  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"

);


/* ==================================================
   페이지 시작
   ================================================== */

window.addEventListener(
  "DOMContentLoaded",
  async () => {


    /* ==================================================
       로그인 확인
       ================================================== */

    const {

      data: {
        session
      }

    } = await supabase.auth.getSession();


    if (!session) {

      alert(
        "로그인을 하지 않아 이 기능을 사용할 수 없습니다. 먼저 로그인을 완료해주세요."
      );

      location.href = "login.html";

      return;

    }


    /* ==================================================
       로그인한 사용자 가져오기
       ================================================== */

    const {

      data: {
        user
      },

      error: userError

    } = await supabase.auth.getUser();


    if (userError || !user) {

      console.error(
        "사용자 확인 오류:",
        userError
      );

      alert(
        "사용자 정보를 확인할 수 없습니다."
      );

      location.href = "login.html";

      return;

    }


    /* ==================================================
       users에서 사용자 정보 가져오기
       
       read_dori_news
       → 현재 사용자가 읽을 수 있는 마지막 신문 번호

       read_dori_news_numbers
       → 실제로 읽은 신문 번호들
       ================================================== */

    const {

      data: userInfo,

      error: userInfoError

    } = await supabase

      .from("users")

      .select(
        "read_dori_news, read_dori_news_numbers"
      )

      .eq(
        "user_id",
        user.id
      )

      .single();


    if (userInfoError) {

      console.error(
        "사용자 정보 조회 오류:",
        userInfoError
      );

      alert(
        "사용자 정보를 불러오지 못했습니다."
      );

      return;

    }


    /* ==================================================
       읽을 수 있는 마지막 신문
       ================================================== */

    const 읽을수있는신문 =
      Number(
        userInfo.read_dori_news
      ) || 0;


    /* ==================================================
       읽은 신문 번호 가져오기
       
       JSONB 예:
       
       [1, 2, 3, 5, 7]
       
       ================================================== */

    let 읽은신문 =
      userInfo.read_dori_news_numbers;


    /* ==================================================
       JSONB가 null이거나 배열이 아닐 경우
       ================================================== */

    if (!Array.isArray(읽은신문)) {

      읽은신문 = [];

    }


    /* ==================================================
       숫자로 변환
       
       ["1", "2", "3"]
       같은 값이 들어와 있어도
       
       [1, 2, 3]
       
       으로 처리
       ================================================== */

    읽은신문 =
      읽은신문

        .map(
          번호 => Number(번호)
        )

        .filter(
          번호 => Number.isInteger(번호)
        );


    /* ==================================================
       현재 DB에 존재하는 모든 신문 가져오기
       ================================================== */

    const {

      data: 신문목록,

      error: newsError

    } = await supabase

      .from("rockey_news")

      .select("news_number")

      .order(
        "news_number",
        {
          ascending: true
        }
      );


    if (newsError) {

      console.error(
        "신문 목록 조회 오류:",
        newsError
      );

      alert(
        "돌이신문 목록을 불러오지 못했습니다."
      );

      return;

    }


    if (
      !신문목록 ||
      신문목록.length === 0
    ) {

      alert(
        "등록된 돌이신문이 없습니다."
      );

      return;

    }


    /* ==================================================
       가장 최근 발행된 신문 번호
       ================================================== */

    const 최근신문번호 =
      Math.max(
        ...신문목록.map(
          신문 =>
            Number(
              신문.news_number
            )
        )
      );


    /* ==================================================
       원본 버튼
       ================================================== */

    const 원본 =
      document.getElementById(
        "돌이신문"
      );


    if (!원본) {

      console.error(
        "신문 원본 버튼을 찾을 수 없습니다."
      );

      return;

    }


    /* ==================================================
       신문 목록 생성
       ================================================== */

    신문목록.forEach(
      (신문, index) => {


        const 번호 =
          Number(
            신문.news_number
          );


        /* ==================================================
           복제
           ================================================== */

        const clone =
          원본.cloneNode(
            true
          );


        clone.id =
          "news" + 번호;


        clone.style.display =
          "block";


        clone.style.setProperty("--i", String(index));

        clone.style.top =
          (
            250 +
            index * 70
          ) + "px";


        clone.style.left =
          "20px";


        /* ==================================================
           제목
           ================================================== */

        const 제목 =
          document.createElement(
            "span"
          );


        제목.className =
          "신문제목";


        제목.textContent =
          `-제${번호}회 돌이신문`;


        clone.appendChild(
          제목
        );


        /* ==================================================
           상태
           ================================================== */

        const 상태 =
          document.createElement(
            "span"
          );


        상태.className =
          "신문상태";


        /* ==================================================
           이미 읽은 신문
           ================================================== */

        if (
          읽은신문.includes(
            번호
          )
        ) {


          clone.classList.add(
            "읽음"
          );


          상태.textContent =
            "✅ 읽음";


        }


        /* ==================================================
           아직 읽을 수 없는 신문
           ================================================== */

        else if (
          번호 >
          읽을수있는신문
        ) {


          clone.classList.add(
            "잠금"
          );


          상태.textContent =
            "🔒 잠금";


          clone.disabled =
            true;


        }


        /* ==================================================
           아직 읽지 않은 신문
           ================================================== */

        else {


          /* ================================================
             가장 최근 발행된 신문
             ================================================ */

          if (
            번호 ===
            최근신문번호
          ) {


            clone.classList.add(
              "최근발행"
            );


            상태.textContent =
              "🆕 최근 발행 돌이신문";


          }


          /* ================================================
             일반적으로 읽을 수 있는 신문
             ================================================ */

          else {


            clone.classList.add(
              "읽기가능"
            );


            상태.textContent =
              "📖 읽기 가능";


          }

        }


        /* ==================================================
           상태 추가
           ================================================== */

        clone.appendChild(
          상태
        );


        /* ==================================================
           클릭 이벤트
           ================================================== */

        clone.onclick =
          () => {


            /* ==============================================
               잠긴 신문
               ============================================== */

            if (
              번호 >
              읽을수있는신문
            ) {

              return;

            }


            /* ==============================================
               현재 신문 번호 저장
               ============================================== */

            localStorage.setItem(
              "rockeynews",
              String(번호)
            );


            /* ==============================================
               읽기 페이지 이동
               ============================================== */

            location.href =
              "readingrockeynews.html";

          };


        /* ==================================================
           페이지에 추가
           ================================================== */

        document.body.appendChild(
          clone
        );

      }

    );

  }

);

</script>


</body>
</html>
