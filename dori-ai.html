<html lang="ko">
<head>

<style>
:root{
  --bg:#020617;--panel:rgba(7,15,32,.72);--panel2:rgba(10,20,40,.86);
  --line:rgba(148,163,184,.14);--line2:rgba(96,165,250,.28);
  --text:#f8fafc;--muted:#94a3b8;--dim:#64748b;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#22d3ee;
  --shadow:0 24px 80px rgba(0,0,0,.38);--radius:24px;
}
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font-family:Inter,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
color:var(--text);background:var(--bg);overflow-x:hidden}
button,input{font:inherit}
button{border:0}
button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.dori-bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:
 radial-gradient(circle at 50% -15%,rgba(37,99,235,.22),transparent 38%),
 radial-gradient(circle at 10% 80%,rgba(34,211,238,.08),transparent 30%),
 linear-gradient(180deg,#020617 0%,#030814 48%,#01040c 100%)}
.dori-bg:before{content:"";position:absolute;inset:-25%;
background-image:linear-gradient(rgba(96,165,250,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.035) 1px,transparent 1px);
background-size:56px 56px;transform:perspective(700px) rotateX(55deg) translateY(28%);mask-image:linear-gradient(to bottom,transparent 0%,black 35%,transparent 95%);animation:gridMove 18s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.22;animation:orbFloat 12s ease-in-out infinite}
.orb.a{width:260px;height:260px;background:#2563eb;left:-100px;top:12%}
.orb.b{width:210px;height:210px;background:#06b6d4;right:-90px;top:48%;animation-delay:-5s}
.orb.c{width:170px;height:170px;background:#4f46e5;left:38%;bottom:-80px;animation-delay:-8s}
@keyframes gridMove{to{transform:perspective(700px) rotateX(55deg) translateY(31%)}}
@keyframes orbFloat{50%{transform:translate3d(18px,-24px,0) scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(59,130,246,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
.hero.leaving{overflow:hidden;min-height:0;height:var(--exit-height);opacity:0;transform:translateY(-12px) scale(.99);filter:blur(3px);margin:0;pointer-events:none;transition:height .42s cubic-bezier(.22,.8,.25,1),opacity .28s ease,transform .42s cubic-bezier(.22,.8,.25,1),filter .3s ease,margin .42s ease}
.message.leaving{overflow:hidden;max-height:var(--exit-height);opacity:0;transform:translateY(-8px) scale(.99);pointer-events:none;margin-top:0!important;margin-bottom:0!important;transition:max-height .34s cubic-bezier(.22,.8,.25,1),opacity .24s ease,transform .34s cubic-bezier(.22,.8,.25,1),margin .34s ease}
.hero.leaving.is-collapsing{height:0;filter:blur(0);transform:translateY(-20px) scale(.985)}
.message.leaving.is-collapsing{max-height:0;transform:translateY(-12px) scale(.985)}
@media(prefers-reduced-motion:reduce){.hero.leaving,.message.leaving,.send:before,.send .button-icon{transition:none!important}}

.app{min-height:100svh;display:flex;flex-direction:column}
.nav{position:sticky;top:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;
padding:0 max(22px,calc((100vw - 1180px)/2));background:rgba(2,6,23,.62);backdrop-filter:blur(22px) saturate(150%);
-webkit-backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-icon{position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
font-size:23px;background:linear-gradient(145deg,#2563eb,#1d4ed8 55%,#0f2f9e);box-shadow:0 0 35px rgba(37,99,235,.28),inset 0 1px rgba(255,255,255,.25)}
.brand-icon:after{content:"";position:absolute;inset:-4px;border:1px solid rgba(96,165,250,.18);border-radius:17px;animation:pulse 2.8s infinite}
.brand-name{font-size:18px;font-weight:850;letter-spacing:-.5px}.brand-sub{font-size:10px;color:var(--dim);margin-top:2px}
.status{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(15,23,42,.52);font-size:11px;color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}.status.loading .status-dot{background:#f59e0b;box-shadow:0 0 12px #f59e0b}

.main{width:min(1040px,100%);margin:0 auto;padding:54px 20px 150px;flex:1}
.hero{text-align:center;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1)}
.hero-mark{width:86px;height:86px;margin:0 auto 20px;border-radius:28px;display:grid;place-items:center;font-size:43px;
background:linear-gradient(145deg,rgba(37,99,235,.95),rgba(30,64,175,.78));border:1px solid rgba(147,197,253,.28);
box-shadow:0 24px 70px rgba(37,99,235,.22),inset 0 1px rgba(255,255,255,.25);animation:heroFloat 5s ease-in-out infinite}
@keyframes heroFloat{50%{transform:translateY(-5px) rotate(.5deg)}}
.hero h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-2.2px;font-weight:900;
background:linear-gradient(120deg,#fff 20%,#bfdbfe 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.8}
.hero p strong{color:#dbeafe;font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px auto 42px}
.chip{cursor:pointer;color:#cbd5e1;background:rgba(15,23,42,.58);border:1px solid var(--line);border-radius:999px;
padding:9px 13px;font-size:12px;transition:.22s transform,.22s border-color,.22s background}
.chip:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(30,64,175,.18);color:#fff}

.chat{display:flex;flex-direction:column;gap:22px}
.message{display:flex;align-items:flex-start;gap:11px;max-width:min(820px,92%);animation:pop .34s cubic-bezier(.2,.8,.2,1)}
.message.user{margin-left:auto;flex-direction:row-reverse}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;font-size:19px;
background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.17);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.bot .avatar{background:linear-gradient(145deg,#2563eb,#1e40af);border-color:rgba(96,165,250,.4);box-shadow:0 0 25px rgba(37,99,235,.17)}
.bubble{position:relative;padding:14px 17px;border-radius:18px;background:rgba(10,20,40,.78);border:1px solid var(--line);
box-shadow:0 12px 38px rgba(0,0,0,.16);color:#e2e8f0;font-size:14px;line-height:1.78;white-space:pre-wrap;word-break:break-word}
.bot .bubble{border-top-left-radius:6px}.user .bubble{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:rgba(96,165,250,.4);color:#fff;border-top-right-radius:6px;box-shadow:0 14px 40px rgba(29,78,216,.2)}
.bubble a{color:#93c5fd}
.generating{display:flex;align-items:center;gap:8px;color:#93c5fd;font-weight:750}.generating i{width:8px;height:8px;flex:0 0 8px;border:2px solid #60a5fa;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.thinking-panel{display:flex;flex-direction:column;gap:7px;min-width:0;padding:2px 0}
.thinking-activity{display:flex;align-items:flex-start;gap:7px;padding-left:16px;color:#94a3b8;font-size:12px;line-height:1.55;animation:activityIn .28s ease both}
.thinking-activity:before{content:"";width:5px;height:5px;flex:0 0 5px;margin-top:6px;border-radius:50%;background:#60a5fa;box-shadow:0 0 10px rgba(96,165,250,.7)}
.thinking-activity.changing{animation:activityIn .28s ease both}
@keyframes activityIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.thinking-activity,.thinking-activity.changing{animation:none!important}}

.composer-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px max(16px,calc((100vw - 1040px)/2));
padding-bottom:max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(2,6,23,.86) 30%,rgba(2,6,23,.96))}
.composer{width:100%;max-width:1000px;margin:auto}
.modebar{display:flex;align-items:center;gap:7px;margin:0 0 9px 4px;min-height:30px}
.mode{cursor:pointer;padding:7px 11px;border-radius:9px;color:#94a3b8;background:rgba(15,23,42,.7);border:1px solid var(--line);font-size:11px;font-weight:800;transition:.2s}
.mode:hover{border-color:var(--line2);color:#dbeafe}.mode.active{color:#fff;background:rgba(37,99,235,.8);border-color:rgba(96,165,250,.6);box-shadow:0 5px 20px rgba(37,99,235,.15)}
.mode-desc{color:#64748b;font-size:10px;margin-left:3px}
.input-shell{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 17px;border-radius:21px;
background:rgba(9,18,36,.9);border:1px solid rgba(148,163,184,.18);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.035);transition:.25s}
.input-shell:focus-within{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 4px rgba(59,130,246,.08),var(--shadow)}
.input{flex:1;min-width:0;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#f8fafc;padding:9px 0;font-size:14px;line-height:1.55}
.input::placeholder{color:#64748b}
.send{position:relative;isolation:isolate;overflow:hidden;width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(145deg,#60a5fa,#2563eb 58%,#1d4ed8);border:1px solid rgba(147,197,253,.4);box-shadow:0 8px 25px rgba(37,99,235,.25),inset 0 1px rgba(255,255,255,.2);font-size:19px;transition:box-shadow .3s ease,transform .28s cubic-bezier(.2,.8,.2,1),border-color .3s ease,border-radius .3s ease}
.send:before{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;background:linear-gradient(145deg,#fb7185,#dc2626 65%,#991b1b);opacity:0;transition:opacity .3s ease}
.send:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,99,235,.35)}.send:active{transform:scale(.94)}
.send.is-stop{border-color:rgba(252,165,165,.45);box-shadow:0 8px 25px rgba(220,38,38,.23),inset 0 1px rgba(255,255,255,.17)}
.send.is-stop:before{opacity:1}.send.is-stop:hover{box-shadow:0 12px 30px rgba(220,38,38,.32)}
.send .button-icon-wrap{position:relative;display:block;width:21px;height:21px}
.send .button-icon{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;line-height:1;opacity:0;transform:scale(.65) rotate(-35deg);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
.send .send-icon{opacity:1;transform:scale(1) rotate(0)}
.send.is-stop .send-icon{opacity:0;transform:scale(.65) rotate(35deg)}
.send.is-stop .stop-icon{opacity:1;transform:scale(1) rotate(0)}
.send:hover .button-icon-wrap{transform:scale(1.07)}.send .button-icon-wrap{transition:transform .22s ease}
.send:focus-visible{outline:3px solid rgba(147,197,253,.8);outline-offset:3px}.send:disabled{opacity:.55;cursor:wait}.fineprint{text-align:center;color:#475569;font-size:9px;margin-top:7px}

@media(max-width:700px){
 .nav{height:64px;padding:0 14px}.brand-icon{width:37px;height:37px;border-radius:12px;font-size:20px}.brand-name{font-size:16px}.status{padding:7px 9px}
 .main{padding:40px 12px 150px}.hero-mark{width:70px;height:70px;border-radius:22px;font-size:35px}.hero h1{letter-spacing:-1.5px}.hero p{font-size:12px}.chips{margin-bottom:32px}
 .chip{font-size:11px;padding:8px 10px}.message{max-width:95%;gap:8px}.avatar{width:34px;height:34px;flex-basis:34px;font-size:17px}.bubble{font-size:13px;padding:12px 14px}
 .composer-wrap{padding-left:10px;padding-right:10px}.modebar{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;margin-left:1px}.mode-desc{display:none}.input-shell{border-radius:18px;padding-left:13px}.input{font-size:14px}.send,.stop{width:41px;height:41px;flex-basis:41px}
}
@media(min-width:1400px){.main{padding-top:76px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

.github-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 13px;
border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(15,23,42,.72);color:#e2e8f0;
text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap;transition:background .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease}
.github-link:hover{transform:translateY(-1px);background:rgba(30,41,59,.94);border-color:rgba(96,165,250,.5);box-shadow:0 8px 24px rgba(0,0,0,.2);color:#fff}
.github-link:active{transform:scale(.97)}
.github-link svg{width:17px;height:17px;flex:0 0 17px;fill:currentColor}
.nav-actions{display:flex;align-items:center;gap:10px}
.render-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 13px;
border:1px solid rgba(52,211,153,.25);border-radius:12px;background:rgba(6,78,59,.22);color:#d1fae5;
text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap;transition:background .22s ease,border-color .22s ease,transform .22s ease,box-shadow .22s ease}
.render-link:hover{transform:translateY(-1px);background:rgba(6,78,59,.4);border-color:rgba(52,211,153,.55);box-shadow:0 8px 24px rgba(0,0,0,.2);color:#fff}
.render-link:active{transform:scale(.97)}
.render-link svg{width:17px;height:17px;flex:0 0 17px;fill:currentColor}
@media(max-width:700px){.nav-actions{gap:6px}.github-link,.render-link{min-height:35px;padding:0 8px;font-size:11px;gap:5px}.github-link svg,.render-link svg{width:15px;height:15px;flex-basis:15px}.status{font-size:10px}}
@media(max-width:390px){.github-link .github-label,.render-link .render-label{display:none}.github-link,.render-link{width:35px;padding:0}}

</style>

/*
 * 기존 돌이사이트가 이미 Supabase client를 가지고 있다면
 * 아래 후보 중 하나를 자동으로 사용한다.
 *
 * 권장:
 *   window.doriSupabase = supabase.createClient(...)
 *
 * 또는:
 *   window.supabaseClient
 *   window.sb
 *
 * 별도 client가 없고 DORI_SUPABASE_URL / DORI_SUPABASE_ANON_KEY가
 * window에 있으면 Supabase CDN client도 사용할 수 있다.
 */
let supabaseClient = null;
let supabaseLoadPromise = null;

async function getSupabaseClient() {
  if (supabaseClient && supabaseClient.auth) return supabaseClient;

  // 같은 페이지에서 이미 만들어진 client가 있으면 그대로 사용한다.
  if (window.doriSupabase && window.doriSupabase.auth) {
    supabaseClient = window.doriSupabase;
    return supabaseClient;
  }
  if (window.supabaseClient && window.supabaseClient.auth) {
    supabaseClient = window.supabaseClient;
    return supabaseClient;
  }
  if (window.sb && window.sb.auth) {
    supabaseClient = window.sb;
    return supabaseClient;
  }

  // dori-ai.html은 index.html의 module scope를 공유하지 않으므로
  // 여기서 같은 Supabase 프로젝트의 client를 직접 만든다.
  if (!supabaseLoadPromise) {
    supabaseLoadPromise = Promise.resolve().then(() => {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          throw new Error("로컬 Supabase 라이브러리를 불러오지 못했습니다.");
        }
        const createClient = window.supabase.createClient;
        supabaseClient = createClient(
          DORI_SUPABASE_URL,
          DORI_SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
              storageKey: "sb-scttowfhygcpdirrekqm-auth-token"
            }
          }
        );
        return supabaseClient;
      })
      .catch((e) => {
        console.warn("Supabase 모듈 로드 실패:", e);
        supabaseLoadPromise = null;
        return null;
      });
  }

  return await supabaseLoadPromise;
}

async function getAuthState() {
  const client = await getSupabaseClient();
  if (!client || !client.auth) {
    return { user: null, session: null, accessToken: null };
  }

  try {
    // getSession()은 브라우저에 저장된 Supabase 세션을 읽는다.
    const sessionResult = await client.auth.getSession();
    let session = sessionResult?.data?.session || null;

    // This page may be left open in the background long enough for a JWT to
    // expire. Refresh it before sending requests so the backend can verify the
    // user and apply the correct Dori News read limit.
    if (session?.refresh_token) {
      const expiresAt = Number(session.expires_at || 0);
      if (expiresAt && expiresAt * 1000 <= Date.now() + 60_000) {
        const refreshed = await client.auth.refreshSession();
        if (!refreshed?.error && refreshed?.data?.session) {
          session = refreshed.data.session;
        }
      }
    }

    if (session?.user?.id && session?.access_token) {
      return {
        user: session.user,
        session,
        accessToken: session.access_token
      };
    }

    // 세션이 없을 때만 getUser()를 보조적으로 확인한다.
    const userResult = await client.auth.getUser();
    const user = userResult?.data?.user || null;
    return { user, session: null, accessToken: null };
  } catch (e) {
    console.warn("Supabase 로그인 사용자 확인 실패:", e);
    return { user: null, session: null, accessToken: null };
  }
}

async function getLoggedInUser() {
  const state = await getAuthState();
  return state.user;
}

async function updateConnectionStatus() {
  statusBox.classList.add("loading");
  statusText.textContent = "연결 확인 중";

  try {
    const response = await fetch(`${DORI_AI_API_URL}/health`, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error("AI server unavailable");

    statusBox.classList.remove("loading");
    statusText.textContent = "AI 연결됨";
  } catch (e) {
    statusBox.classList.add("loading");
    statusText.textContent = "AI 연결 대기";
  }
}

function setGeneratingState(value) {
  generating = value;
  input.disabled = value;
  // 전송과 취소를 같은 버튼에서 전환한다. 생성 중에도 버튼은 활성 상태다.
  send.disabled = false;
  send.classList.toggle("is-stop", value);
  // 아이콘 노드를 유지해 전송 ↔ 취소 전환이 페이드·회전·스케일로 자연스럽게 이어진다.
  send.setAttribute("aria-label", value ? "답변 생성 취소" : "메시지 전송");
  send.setAttribute("title", value ? "답변 생성 취소" : "메시지 전송");
  document.querySelectorAll(".mode").forEach(b => b.disabled = value);
  input.placeholder = value ? "돌이가 답변을 생성하고 있어요..." : "돌이 AI에게 물어보세요...";
}

function dismissWelcomeOnFirstMessage() {
  if (conversationStarted) return;
  conversationStarted = true;

  const collapseAndRemove = (element, isHero = false) => {
    if (!element) return;
    // 현재 높이를 고정한 뒤 다음 프레임에서 0으로 줄여, 투명해질 때 레이아웃도 함께 접는다.
    const height = element.getBoundingClientRect().height;
    element.style.setProperty("--exit-height", `${height}px`);
    element.classList.add("leaving");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => element.classList.add("is-collapsing"));
    });
    const finish = () => {
      if (element.isConnected) element.remove();
    };
    element.addEventListener("transitionend", (event) => {
      if ((isHero && event.propertyName === "height") || (!isHero && event.propertyName === "max-height")) finish();
    }, { once: false });
    window.setTimeout(finish, 520); // transitionend 미발생 환경을 위한 안전망
  };

  collapseAndRemove(welcome, true);
  collapseAndRemove(chat.querySelector(".message.bot"));
}

function scrollToBottom(smooth = true) {
  requestAnimationFrame(() => {
    window.scrollTo({
      top: document.documentElement.scrollHeight,
      behavior: smooth ? "smooth" : "auto"
    });
  });
}

function addMessage(text, type) {
  const row = document.createElement("div");
  row.className = `message ${type}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = type === "bot" ? "🐶" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.append(avatar, bubble);
  chat.appendChild(row);
  scrollToBottom(true);

  return { row, bubble };
}

function createStreamingMessage() {
  const row = document.createElement("div");
  row.className = "message bot";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "🐶";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const panel = document.createElement("div");
  panel.className = "thinking-panel";

  const loading = document.createElement("div");
  loading.className = "generating";
  loading.innerHTML = '<i aria-hidden="true"></i><span>돌이가 생각하는 중...</span>';

  const activity = document.createElement("div");
  activity.className = "thinking-activity";
  activity.setAttribute("aria-live", "polite");
  activity.textContent = "질문을 확인하고 있어요.";

  panel.append(loading, activity);

  const answer = document.createElement("div");
  answer.className = "answer-content";
  answer.style.opacity = "0";
  answer.style.transform = "translateY(4px)";
  answer.style.transition = "opacity .24s ease,transform .28s cubic-bezier(.2,.8,.2,1)";

  bubble.append(panel, answer);
  row.append(avatar, bubble);
  chat.appendChild(row);
  scrollToBottom(true);

  return { row, bubble, panel, activity, answer };
}

function updateThinkingActivity(activity, text) {
  if (!activity || activity.textContent === text) return;
  activity.classList.remove("changing");
  // Reflow restarts the short entrance transition when the activity changes.
  void activity.offsetWidth;
  activity.textContent = text;
  activity.classList.add("changing");
}

function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}
input.addEventListener("input", autoResize);

document.querySelectorAll(".mode").forEach(button => {
  button.addEventListener("click", () => {
    if (generating) return;
    doriAiMode = button.dataset.mode;

    document.querySelectorAll(".mode").forEach(x => x.classList.remove("active"));
    button.classList.add("active");

    modeDesc.textContent = doriAiMode === "fast"
      ? "짧고 빠르게 답변해요."
      : "코드와 복잡한 질문을 자세히 분석해요.";
  });
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    if (generating) return;
    input.value = chip.dataset.prompt || "";
    autoResize();
    input.focus();
  });
});

/*
 * Render 백엔드에 현재 로그인 사용자의 ID를 함께 전달한다.
 *
 * 현재 백엔드 계약:
 *   { message, mode, stream, user_id }
 *
 * 중요:
 * user_id는 로그인한 Supabase 사용자의 실제 id를 사용한다.
 * 로그인하지 않았다면 null을 보낸다.
 */
async function askDoriAI(message, bubble, activity, answerElement) {
  controller = new AbortController();
  updateThinkingActivity(activity, "로그인 상태와 요청 정보를 확인하고 있어요.");

  const auth = await getAuthState();
  const user = auth.user;
  const accessToken = auth.accessToken;

  const payload = {
    message,
    mode: doriAiMode,
    stream: true,
    // 서버는 access token을 검증해서 실제 user.id를 얻는다.
    // user_id도 함께 보내 호환성을 유지한다.
    user_id: user ? user.id : null
  };

  console.log("Dori AI request:", {
    mode: payload.mode,
    authenticated: Boolean(user && accessToken),
    user_id: user ? user.id : null,
    has_access_token: Boolean(accessToken)
  });

  const headers = {
    "Content-Type": "application/json",
    "Accept": "text/event-stream"
  };

  if (accessToken) {
    headers["Authorization"] = `Bearer ${accessToken}`;
  }

  let response = null;
  let lastError = null;

  // Render Free 서비스가 잠들었거나 프록시가 일시적으로 502/503/504를
  // 반환할 수 있으므로, 네트워크 계열 오류를 포함해 최대 3회 재시도한다.
  updateThinkingActivity(activity, "돌이 AI 서버에 질문을 보내고 응답을 기다리고 있어요.");
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      response = await fetch(DORI_AI_CHAT_URL, {
        method: "POST",
        headers,
        body: JSON.stringify(payload),
        signal: controller.signal,
        cache: "no-store"
      });

      if (response.ok) break;
      if (![502, 503, 504].includes(response.status)) break;
      lastError = new Error("AI 서버가 아직 준비 중이야. (" + response.status + ")");
    } catch (error) {
      if (error?.name === "AbortError") throw error;
      lastError = error;
    }

    if (attempt < 3) {
      statusBox.classList.add("loading");
      statusText.textContent = "AI 서버 깨우는 중 (" + attempt + "/3)";
      updateThinkingActivity(activity, "AI 서버가 응답할 수 있도록 다시 연결하고 있어요. (" + attempt + "/3)");
      await new Promise(resolve => setTimeout(resolve, attempt * 2000));
    }
  }

  if (!response || !response.ok) {
    throw lastError || new Error("AI 서버 응답 오류: " + (response?.status || "network"));
  }

  if (!response.ok) {
    let detail = "";
    try {
      const data = await response.json();
      detail = data.error ? `\n${data.error}` : "";
    } catch (_) {}
    throw new Error(`AI 서버 응답 오류: ${response.status}${detail}`);
  }

  updateThinkingActivity(activity, "서버에 연결됐어요. 첫 답변 내용을 기다리고 있어요.");

  if (!response.body) {
    throw new Error("이 브라우저에서는 스트리밍 응답을 지원하지 않아.");
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let fullAnswer = "";
  let firstChunk = true;
  let doneReceived = false;

  function handleEvent(eventText) {
    const lines = eventText.split(/\r?\n/);

    for (const line of lines) {
      if (!line.startsWith("data:")) continue;

      const raw = line.slice(5).trim();
      if (!raw) continue;

      let data;
      try {
        data = JSON.parse(raw);
      } catch (_) {
        continue;
      }

      if (data.type === "error" || data.error) {
        throw new Error(data.content || data.error || "AI 응답 오류");
      }

      if (data.type === "done") {
        doneReceived = true;
        return;
      }

      if (data.type === "token" && data.content) {
        if (firstChunk) {
          // 답변이 도착하면 생각 중 표시를 부드럽게 접고 실제 답변으로 전환한다.
          const panel = bubble.querySelector(".thinking-panel");
          if (panel) {
            panel.style.opacity = "0";
            panel.style.transform = "translateY(-5px)";
            panel.style.maxHeight = panel.scrollHeight + "px";
            panel.style.overflow = "hidden";
            panel.style.transition = "opacity .2s ease,transform .24s ease,max-height .24s ease,margin .24s ease";
            requestAnimationFrame(() => { panel.style.maxHeight = "0"; panel.style.margin = "0"; });
            window.setTimeout(() => panel.remove(), 260);
          }
          if (answerElement) {
            answerElement.style.opacity = "1";
            answerElement.style.transform = "translateY(0)";
          }
          firstChunk = false;
        }

        fullAnswer += data.content;
        if (answerElement) answerElement.textContent = fullAnswer;
        else bubble.textContent = fullAnswer;
        scrollToBottom(true);
      }
    }
  }

  while (!doneReceived) {
    const result = await reader.read();
    if (result.done) break;

    buffer += decoder.decode(result.value, { stream: true });

    const events = buffer.split(/\r?\n\r?\n/);
    buffer = events.pop() || "";

    for (const event of events) {
      handleEvent(event);
      if (doneReceived) break;
    }
  }

  // done 이벤트를 받은 즉시 스트림을 닫아 '생성 중' 상태가 남지 않도록 한다.
  if (doneReceived) {
    try { await reader.cancel(); } catch (_) {}
  } else {
    buffer += decoder.decode();
    if (buffer.trim()) handleEvent(buffer);
  }

  if (!fullAnswer.trim()) {
    bubble.textContent = "답변이 비어 있어. 다시 한 번 물어봐줘! 🐶";
  }

  return fullAnswer;
}

// 하나의 전송 버튼은 생성 중 취소 버튼 역할을 한다.
send.addEventListener("click", (event) => {
  if (!generating) return;
  event.preventDefault();
  event.stopPropagation();
  if (controller) controller.abort();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (generating) return;

  const message = input.value.trim();
  if (!message) return;

  dismissWelcomeOnFirstMessage();
  addMessage(message, "user");
  input.value = "";
  autoResize();

  setGeneratingState(true);
  const streaming = createStreamingMessage();

  try {
    await askDoriAI(message, streaming.bubble, streaming.activity, streaming.answer);
  } catch (error) {
    if (error.name === "AbortError") {
      streaming.bubble.textContent = "답변 생성을 중지했어. 🐶";
    } else {
      console.error("돌이 AI 오류:", error);
      streaming.bubble.textContent =
        "AI 서버에 연결하지 못했어. 🐶\n" +
        "잠시 후 다시 시도해줘.";
    }
  } finally {
    controller = null;
    setGeneratingState(false);
    scrollToBottom(true);
  }
});

/*
 * Enter = 전송
 * Shift + Enter = 줄바꿈
 */
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

window.addEventListener("load", async () => {
  autoResize();
  input.focus({ preventScroll: true });
  updateConnectionStatus();

  // 페이지가 열리자마자 현재 로그인 세션을 준비한다.
  const client = await getSupabaseClient();
  if (client?.auth) {
    client.auth.onAuthStateChange((_event, session) => {
      console.log("Dori AI auth state changed:", {
        authenticated: Boolean(session?.user?.id),
        user_id: session?.user?.id || null
      });
    });
  }
});

/*
 * 돌이사이트가 별도의 인증 이벤트를 발생시키는 경우에도
 * 다음 요청에서 최신 Supabase 세션을 다시 읽는다.
 */
window.addEventListener("dori-auth-changed", () => {
  supabaseClient = null;
  supabaseLoadPromise = null;
});
