<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">
<meta name="description" content="돌이사이트 전용 AI">
<title>돌이 AI</title>
<style>
:root{
  --bg:#020617;--panel:rgba(7,15,32,.72);--panel2:rgba(10,20,40,.86);
  --line:rgba(148,163,184,.14);--line2:rgba(96,165,250,.28);
  --text:#f8fafc;--muted:#94a3b8;--dim:#64748b;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#22d3ee;
  --shadow:0 24px 80px rgba(0,0,0,.38);--radius:24px;
}
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font-family:Inter,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
color:var(--text);background:var(--bg);overflow-x:hidden}
button,input{font:inherit}
button{border:0}
button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.dori-bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:
 radial-gradient(circle at 50% -15%,rgba(37,99,235,.22),transparent 38%),
 radial-gradient(circle at 10% 80%,rgba(34,211,238,.08),transparent 30%),
 linear-gradient(180deg,#020617 0%,#030814 48%,#01040c 100%)}
.dori-bg:before{content:"";position:absolute;inset:-25%;
background-image:linear-gradient(rgba(96,165,250,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.035) 1px,transparent 1px);
background-size:56px 56px;transform:perspective(700px) rotateX(55deg) translateY(28%);mask-image:linear-gradient(to bottom,transparent 0%,black 35%,transparent 95%);animation:gridMove 18s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.22;animation:orbFloat 12s ease-in-out infinite}
.orb.a{width:260px;height:260px;background:#2563eb;left:-100px;top:12%}
.orb.b{width:210px;height:210px;background:#06b6d4;right:-90px;top:48%;animation-delay:-5s}
.orb.c{width:170px;height:170px;background:#4f46e5;left:38%;bottom:-80px;animation-delay:-8s}
@keyframes gridMove{to{transform:perspective(700px) rotateX(55deg) translateY(31%)}}
@keyframes orbFloat{50%{transform:translate3d(18px,-24px,0) scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(59,130,246,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}

.app{min-height:100svh;display:flex;flex-direction:column}
.nav{position:sticky;top:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;
padding:0 max(22px,calc((100vw - 1180px)/2));background:rgba(2,6,23,.62);backdrop-filter:blur(22px) saturate(150%);
-webkit-backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-icon{position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
font-size:23px;background:linear-gradient(145deg,#2563eb,#1d4ed8 55%,#0f2f9e);box-shadow:0 0 35px rgba(37,99,235,.28),inset 0 1px rgba(255,255,255,.25)}
.brand-icon:after{content:"";position:absolute;inset:-4px;border:1px solid rgba(96,165,250,.18);border-radius:17px;animation:pulse 2.8s infinite}
.brand-name{font-size:18px;font-weight:850;letter-spacing:-.5px}.brand-sub{font-size:10px;color:var(--dim);margin-top:2px}
.status{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(15,23,42,.52);font-size:11px;color:var(--muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e}.status.loading .status-dot{background:#f59e0b;box-shadow:0 0 12px #f59e0b}

.main{width:min(1040px,100%);margin:0 auto;padding:54px 20px 150px;flex:1}
.hero{text-align:center;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1)}
.hero-mark{width:86px;height:86px;margin:0 auto 20px;border-radius:28px;display:grid;place-items:center;font-size:43px;
background:linear-gradient(145deg,rgba(37,99,235,.95),rgba(30,64,175,.78));border:1px solid rgba(147,197,253,.28);
box-shadow:0 24px 70px rgba(37,99,235,.22),inset 0 1px rgba(255,255,255,.25);animation:heroFloat 5s ease-in-out infinite}
@keyframes heroFloat{50%{transform:translateY(-5px) rotate(.5deg)}}
.hero h1{margin:0;font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-2.2px;font-weight:900;
background:linear-gradient(120deg,#fff 20%,#bfdbfe 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.8}
.hero p strong{color:#dbeafe;font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px auto 42px}
.chip{cursor:pointer;color:#cbd5e1;background:rgba(15,23,42,.58);border:1px solid var(--line);border-radius:999px;
padding:9px 13px;font-size:12px;transition:.22s transform,.22s border-color,.22s background}
.chip:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(30,64,175,.18);color:#fff}

.chat{display:flex;flex-direction:column;gap:22px}
.message{display:flex;align-items:flex-start;gap:11px;max-width:min(820px,92%);animation:pop .34s cubic-bezier(.2,.8,.2,1)}
.message.user{margin-left:auto;flex-direction:row-reverse}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;font-size:19px;
background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.17);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.bot .avatar{background:linear-gradient(145deg,#2563eb,#1e40af);border-color:rgba(96,165,250,.4);box-shadow:0 0 25px rgba(37,99,235,.17)}
.bubble{position:relative;padding:14px 17px;border-radius:18px;background:rgba(10,20,40,.78);border:1px solid var(--line);
box-shadow:0 12px 38px rgba(0,0,0,.16);color:#e2e8f0;font-size:14px;line-height:1.78;white-space:pre-wrap;word-break:break-word}
.bot .bubble{border-top-left-radius:6px}.user .bubble{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:rgba(96,165,250,.4);color:#fff;border-top-right-radius:6px;box-shadow:0 14px 40px rgba(29,78,216,.2)}
.bubble a{color:#93c5fd}
.generating{display:inline-flex;align-items:center;gap:8px;color:#93c5fd}.generating i{width:8px;height:8px;border:2px solid #60a5fa;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}

.composer-wrap{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px max(16px,calc((100vw - 1040px)/2));
padding-bottom:max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(2,6,23,.86) 30%,rgba(2,6,23,.96))}
.composer{width:100%;max-width:1000px;margin:auto}
.modebar{display:flex;align-items:center;gap:7px;margin:0 0 9px 4px;min-height:30px}
.mode{cursor:pointer;padding:7px 11px;border-radius:9px;color:#94a3b8;background:rgba(15,23,42,.7);border:1px solid var(--line);font-size:11px;font-weight:800;transition:.2s}
.mode:hover{border-color:var(--line2);color:#dbeafe}.mode.active{color:#fff;background:rgba(37,99,235,.8);border-color:rgba(96,165,250,.6);box-shadow:0 5px 20px rgba(37,99,235,.15)}
.mode-desc{color:#64748b;font-size:10px;margin-left:3px}
.input-shell{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 17px;border-radius:21px;
background:rgba(9,18,36,.9);border:1px solid rgba(148,163,184,.18);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.035);transition:.25s}
.input-shell:focus-within{border-color:rgba(96,165,250,.55);box-shadow:0 0 0 4px rgba(59,130,246,.08),var(--shadow)}
.input{flex:1;min-width:0;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:#f8fafc;padding:9px 0;font-size:14px;line-height:1.55}
.input::placeholder{color:#64748b}
.send,.stop{width:43px;height:43px;flex:0 0 43px;border-radius:13px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:.2s}
.send{background:linear-gradient(145deg,#3b82f6,#1d4ed8);box-shadow:0 8px 25px rgba(37,99,235,.22);font-size:19px}
.send:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,99,235,.32)}.send:active,.stop:active{transform:scale(.94)}
.stop{background:#991b1b;font-size:15px}.stop:hover{background:#b91c1c}
.send:disabled{opacity:.55;cursor:wait}.fineprint{text-align:center;color:#475569;font-size:9px;margin-top:7px}

@media(max-width:700px){
 .nav{height:64px;padding:0 14px}.brand-icon{width:37px;height:37px;border-radius:12px;font-size:20px}.brand-name{font-size:16px}.status{padding:7px 9px}
 .main{padding:40px 12px 150px}.hero-mark{width:70px;height:70px;border-radius:22px;font-size:35px}.hero h1{letter-spacing:-1.5px}.hero p{font-size:12px}.chips{margin-bottom:32px}
 .chip{font-size:11px;padding:8px 10px}.message{max-width:95%;gap:8px}.avatar{width:34px;height:34px;flex-basis:34px;font-size:17px}.bubble{font-size:13px;padding:12px 14px}
 .composer-wrap{padding-left:10px;padding-right:10px}.modebar{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap;margin-left:1px}.mode-desc{display:none}.input-shell{border-radius:18px;padding-left:13px}.input{font-size:14px}.send,.stop{width:41px;height:41px;flex-basis:41px}
}
@media(min-width:1400px){.main{padding-top:76px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="dori-bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div class="app">
<header class="nav">
  <div class="brand">
    <div class="brand-icon">🐶</div>
    <div><div class="brand-name">돌이 AI</div><div class="brand-sub">돌이사이트 전용 AI</div></div>
  </div>
  <div class="status" id="connectionStatus"><span class="status-dot"></span><span id="statusText">연결 준비 중</span></div>
</header>

<main class="main">
  <section class="hero" id="welcome">
    <div class="hero-mark">🐶</div>
    <h1>무엇을 도와줄까?</h1>
    <p>안녕! 나는 <strong>돌이 AI</strong>야. 🐶<br>돌이사이트의 세계와 정보에 대해 자유롭게 물어봐.</p>
    <div class="chips">
      <button class="chip" data-prompt="돌이신문 최신 내용을 알려줘">📰 돌이신문</button>
      <button class="chip" data-prompt="현재 돌돌증권 상황을 알려줘">📈 돌돌증권</button>
      <button class="chip" data-prompt="돌이 퀴즈를 내줘">🧠 돌이 퀴즈</button>
      <button class="chip" data-prompt="돌이에 대해 알려줘">🐶 돌이 이야기</button>
    </div>
  </section>

  <section class="chat" id="doriAiChat" aria-live="polite">
    <div class="message bot">
      <div class="avatar">🐶</div>
      <div class="bubble">안녕! 나는 돌이 AI야. 🐶<br>돌이사이트에 대해 궁금한 걸 물어봐!</div>
    </div>
  </section>
</main>

<div class="composer-wrap">
  <div class="composer">
    <div class="modebar">
      <button type="button" class="mode active" data-mode="fast">⚡ 빠른 모드</button>
      <button type="button" class="mode" data-mode="deep">🧠 고급 모드</button>
      <span class="mode-desc" id="modeDesc">짧고 빠르게 답변해요.</span>
    </div>
    <form class="input-shell" id="doriAiForm">
      <textarea class="input" id="doriAiInput" rows="1" maxlength="2000" placeholder="돌이 AI에게 물어보세요..." autocomplete="off" aria-label="메시지 입력"></textarea>
      <button type="submit" class="send" id="doriAiSend" aria-label="전송">➤</button>
      <button type="button" class="stop" id="doriAiStop" aria-label="생성 중지" hidden>■</button>
    </form>
    <div class="fineprint">돌이 AI는 돌이사이트의 전용 AI입니다.</div>
  </div>
</div>
</div>

<script>
/* =========================================================
   돌이 AI — 프리미엄 프론트엔드
   핵심 연결:
   1) Supabase 로그인 사용자 확인
   2) user.id를 Dori AI /chat에 전달
   3) 백엔드가 users.read_dori_news를 기준으로 신문 접근 제한
   ========================================================= */

const DORI_AI_API_URL = "https://dori-ai-u3kf.onrender.com";
const DORI_AI_CHAT_URL = `${DORI_AI_API_URL.replace(/\/$/, "")}/chat`;

const $ = (s) => document.querySelector(s);
const chat = $("#doriAiChat");
const form = $("#doriAiForm");
const input = $("#doriAiInput");
const send = $("#doriAiSend");
const stop = $("#doriAiStop");
const statusBox = $("#connectionStatus");
const statusText = $("#statusText");
const modeDesc = $("#modeDesc");

let doriAiMode = "fast";
let controller = null;
let generating = false;

/*
 * 기존 돌이사이트가 이미 Supabase client를 가지고 있다면
 * 아래 후보 중 하나를 자동으로 사용한다.
 *
 * 권장:
 *   window.doriSupabase = supabase.createClient(...)
 *
 * 또는:
 *   window.supabaseClient
 *   window.sb
 *
 * 별도 client가 없고 DORI_SUPABASE_URL / DORI_SUPABASE_ANON_KEY가
 * window에 있으면 Supabase CDN client도 사용할 수 있다.
 */
let supabaseClient = null;

function findSupabaseClient() {
  if (window.doriSupabase && window.doriSupabase.auth) return window.doriSupabase;
  if (window.supabaseClient && window.supabaseClient.auth) return window.supabaseClient;
  if (window.sb && window.sb.auth) return window.sb;

  if (
    window.supabase &&
    typeof window.supabase.createClient === "function" &&
    window.DORI_SUPABASE_URL &&
    window.DORI_SUPABASE_ANON_KEY
  ) {
    try {
      return window.supabase.createClient(
        window.DORI_SUPABASE_URL,
        window.DORI_SUPABASE_ANON_KEY
      );
    } catch (e) {
      console.warn("Supabase client 생성 실패:", e);
    }
  }
  return null;
}

async function getLoggedInUser() {
  supabaseClient = supabaseClient || findSupabaseClient();

  if (!supabaseClient || !supabaseClient.auth) {
    return null;
  }

  try {
    const result = await supabaseClient.auth.getUser();
    return result && result.data ? result.data.user || null : null;
  } catch (e) {
    console.warn("로그인 사용자 확인 실패:", e);
    return null;
  }
}

async function updateConnectionStatus() {
  statusBox.classList.add("loading");
  statusText.textContent = "연결 확인 중";

  try {
    const response = await fetch(`${DORI_AI_API_URL}/health`, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error("AI server unavailable");

    statusBox.classList.remove("loading");
    statusText.textContent = "AI 연결됨";
  } catch (e) {
    statusBox.classList.add("loading");
    statusText.textContent = "AI 연결 대기";
  }
}

function setGeneratingState(value) {
  generating = value;
  input.disabled = value;
  send.hidden = value;
  stop.hidden = !value;
  document.querySelectorAll(".mode").forEach(b => b.disabled = value);
  input.placeholder = value ? "돌이가 답변을 생성하고 있어요..." : "돌이 AI에게 물어보세요...";
}

function scrollToBottom(smooth = true) {
  requestAnimationFrame(() => {
    window.scrollTo({
      top: document.documentElement.scrollHeight,
      behavior: smooth ? "smooth" : "auto"
    });
  });
}

function addMessage(text, type) {
  const row = document.createElement("div");
  row.className = `message ${type}`;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = type === "bot" ? "🐶" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.append(avatar, bubble);
  chat.appendChild(row);
  scrollToBottom(true);

  return { row, bubble };
}

function createStreamingMessage() {
  const row = document.createElement("div");
  row.className = "message bot";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "🐶";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const loading = document.createElement("span");
  loading.className = "generating";
  loading.innerHTML = '<i></i><span>돌이가 생각하는 중...</span>';

  bubble.appendChild(loading);
  row.append(avatar, bubble);
  chat.appendChild(row);
  scrollToBottom(true);

  return { row, bubble };
}

function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
}
input.addEventListener("input", autoResize);

document.querySelectorAll(".mode").forEach(button => {
  button.addEventListener("click", () => {
    if (generating) return;
    doriAiMode = button.dataset.mode;

    document.querySelectorAll(".mode").forEach(x => x.classList.remove("active"));
    button.classList.add("active");

    modeDesc.textContent = doriAiMode === "fast"
      ? "짧고 빠르게 답변해요."
      : "코드와 복잡한 질문을 자세히 분석해요.";
  });
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    if (generating) return;
    input.value = chip.dataset.prompt || "";
    autoResize();
    input.focus();
  });
});

/*
 * Render 백엔드에 현재 로그인 사용자의 ID를 함께 전달한다.
 *
 * 현재 백엔드 계약:
 *   { message, mode, stream, user_id }
 *
 * 중요:
 * user_id는 로그인한 Supabase 사용자의 실제 id를 사용한다.
 * 로그인하지 않았다면 null을 보낸다.
 */
async function askDoriAI(message, bubble) {
  controller = new AbortController();

  const user = await getLoggedInUser();

  const payload = {
    message,
    mode: doriAiMode,
    stream: true,
    user_id: user ? user.id : null
  };

  console.log("Dori AI request:", {
    mode: payload.mode,
    authenticated: Boolean(user),
    user_id: user ? user.id : null
  });

  const response = await fetch(DORI_AI_CHAT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "text/event-stream"
    },
    body: JSON.stringify(payload),
    signal: controller.signal
  });

  if (!response.ok) {
    let detail = "";
    try {
      const data = await response.json();
      detail = data.error ? `\n${data.error}` : "";
    } catch (_) {}
    throw new Error(`AI 서버 응답 오류: ${response.status}${detail}`);
  }

  if (!response.body) {
    throw new Error("이 브라우저에서는 스트리밍 응답을 지원하지 않아.");
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let fullAnswer = "";
  let firstChunk = true;

  function handleEvent(eventText) {
    const lines = eventText.split(/\r?\n/);

    for (const line of lines) {
      if (!line.startsWith("data:")) continue;

      const raw = line.slice(5).trim();
      if (!raw) continue;

      let data;
      try {
        data = JSON.parse(raw);
      } catch (_) {
        continue;
      }

      if (data.type === "error" || data.error) {
        throw new Error(data.content || data.error || "AI 응답 오류");
      }

      if (data.type === "done") continue;

      if (data.type === "token" && data.content) {
        if (firstChunk) {
          bubble.textContent = "";
          firstChunk = false;
        }

        fullAnswer += data.content;
        bubble.textContent = fullAnswer;
        scrollToBottom(true);
      }
    }
  }

  while (true) {
    const result = await reader.read();
    if (result.done) break;

    buffer += decoder.decode(result.value, { stream: true });

    const events = buffer.split(/\r?\n\r?\n/);
    buffer = events.pop() || "";

    for (const event of events) {
      handleEvent(event);
    }
  }

  buffer += decoder.decode();

  if (buffer.trim()) {
    handleEvent(buffer);
  }

  if (!fullAnswer.trim()) {
    bubble.textContent = "답변이 비어 있어. 다시 한 번 물어봐줘! 🐶";
  }

  return fullAnswer;
}

stop.addEventListener("click", () => {
  if (controller) controller.abort();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (generating) return;

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  autoResize();

  setGeneratingState(true);
  const streaming = createStreamingMessage();

  try {
    await askDoriAI(message, streaming.bubble);
  } catch (error) {
    if (error.name === "AbortError") {
      streaming.bubble.textContent = "답변 생성을 중지했어. 🐶";
    } else {
      console.error("돌이 AI 오류:", error);
      streaming.bubble.textContent =
        "AI 서버에 연결하지 못했어. 🐶\n" +
        "잠시 후 다시 시도해줘.";
    }
  } finally {
    controller = null;
    setGeneratingState(false);
    scrollToBottom(true);
  }
});

/*
 * Enter = 전송
 * Shift + Enter = 줄바꿈
 */
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

window.addEventListener("load", async () => {
  autoResize();
  input.focus({ preventScroll: true });
  updateConnectionStatus();
});

/*
 * 페이지가 돌이사이트의 기존 Supabase 인증 상태를 공유한다면
 * auth 상태가 바뀌어도 다음 요청부터 최신 user.id를 자동 사용한다.
 */
window.addEventListener("dori-auth-changed", () => {
  supabaseClient = null;
});
</script>
