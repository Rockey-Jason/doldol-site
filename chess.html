<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>돌이 사이트 - 체스</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>

body{

margin:0;

background:linear-gradient(to right,#000033,#000010);

font-family:Jua;

overflow-x:hidden;

}

#title{

font-size:65px;

color:white;

text-align:center;

margin-top:40px;

}

#subtitle{

font-size:28px;

color:white;

text-align:center;

margin-top:10px;

opacity:.8;

}

#bots{

width:900px;

max-width:95%;

margin:50px auto;

display:flex;

flex-direction:column;

gap:20px;

}

.bot{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

background:rgba(255,255,255,.08);

border:2px solid rgba(255,255,255,.15);

border-radius:18px;

transition:.25s;

cursor:pointer;

}

.bot:hover{

transform:scale(1.02);

background:rgba(255,255,255,.14);

}

.name{

font-size:35px;

color:white;

}

.rating{

font-size:25px;

color:#7bd8ff;

}

.desc{

margin-top:6px;

font-size:18px;

color:#cccccc;

}

#back{

position:absolute;

left:20px;

top:20px;

background:none;

border:none;

font-family:Jua;

font-size:35px;

color:white;

cursor:pointer;

}

@media(max-width:700px){

#title{

font-size:40px;

}

.name{

font-size:25px;

}

.rating{

font-size:18px;

}

.desc{

font-size:15px;

}

}

</style>

</head>

<body>

<button id="back">← 돌이 사이트</button>

<div id="title">
♔ Rockey Chess ♚
</div>

<div id="subtitle">
플레이할 체스 봇을 선택하세요.
</div>

<div id="bots"></div>

<script>

const bots=[

{

name:"Talc Rockey",

rating:1,

desc:"말 움직이는 법을 겨우 아는 돌이"

},

{

name:"Sleeping Rockey",

rating:100,

desc:"졸면서 체스를 둡니다."

},

{

name:"Rockey's Fur",

rating:300,

desc:"초보자용 봇"

},

{

name:"Rockey",

rating:1000,

desc:"평범한 돌이"

},

{

name:"Rockey Army",

rating:2000,

desc:"강력한 돌이 군단"

},

{

name:"Doronum",

rating:3500,

desc:"도로늄으로 만들어진 AI"

},

{

name:"Brilliant Rockey",

rating:5000,

desc:"세계 최강의 돌이"

}

];

const list=document.getElementById("bots");

bots.forEach(bot=>{

const card=document.createElement("div");

card.className="bot";

card.innerHTML=`

<div>

<div class="name">${bot.name}</div>

<div class="desc">${bot.desc}</div>

</div>

<div class="rating">

⭐ ${bot.rating}

</div>

`;

card.onclick=()=>{

location.href=

`chessgame.html?bot=${encodeURIComponent(bot.name)}`;

};

list.appendChild(card);

});

document.getElementById("back").onclick=()=>{

location.href="index.html";

};

</script>

</body>

</html>
