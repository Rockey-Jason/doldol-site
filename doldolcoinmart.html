<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>돌이 사이트 - 돌돌코인 상점</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "HancomMalrangmalrang";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2")
       format("woff2");
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: "HancomMalrangmalrang";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2")
       format("woff2");
  font-weight: 700;
  font-display: swap;
}

:root {
  --background: #03031b;
  --surface: rgba(18, 18, 57, 0.78);
  --surface-light: rgba(37, 37, 89, 0.72);
  --border: rgba(145, 145, 255, 0.22);
  --text: #ffffff;
  --subtext: #b7b8e8;
  --blue: #6c8cff;
  --cyan: #48d9ff;
  --purple: #a66cff;
  --pink: #ff6ccf;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: "HancomMalrangmalrang", sans-serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(76, 91, 255, 0.2), transparent 30%),
    radial-gradient(circle at 90% 20%, rgba(157, 73, 255, 0.16), transparent 30%),
    linear-gradient(135deg, #05052b 0%, #03031b 48%, #00000d 100%);
  overflow-x: hidden;
}

button {
  font-family: inherit;
}

button:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 4px;
}

.page {
  width: min(1180px, calc(100% - 36px));
  margin: 0 auto;
  padding: 28px 0 70px;
}

/* 상단 네비게이션 */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 55px;
}

.logo {
  color: white;
  text-decoration: none;
  font-family: "Black Han Sans", sans-serif;
  font-size: clamp(28px, 5vw, 52px);
  letter-spacing: -2px;
  text-shadow:
    0 0 18px rgba(108, 140, 255, 0.5),
    0 0 35px rgba(166, 108, 255, 0.2);
  transition: 0.25s;
}

.logo:hover {
  transform: translateY(-2px);
  text-shadow:
    0 0 22px rgba(72, 217, 255, 0.8),
    0 0 40px rgba(166, 108, 255, 0.4);
}

.home-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  color: white;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 17px;
  transition: 0.25s;
  backdrop-filter: blur(12px);
}

.home-button:hover {
  background: rgba(108, 140, 255, 0.2);
  border-color: rgba(108, 140, 255, 0.7);
  transform: translateY(-2px);
}

/* 히어로 */

.hero {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 25px;
  align-items: stretch;
  margin-bottom: 70px;
}

.hero-content {
  position: relative;
  overflow: hidden;
  padding: clamp(28px, 5vw, 58px);
  border: 1px solid var(--border);
  border-radius: 30px;
  background:
    linear-gradient(135deg, rgba(47, 57, 135, 0.48), rgba(19, 19, 62, 0.78)),
    var(--surface);
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.28);
  animation: fadeUp 0.7s ease both;
}

.hero-content::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: -100px;
  top: -120px;
  border-radius: 50%;
  background: rgba(72, 217, 255, 0.18);
  filter: blur(15px);
}

.hero-content::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  left: -80px;
  bottom: -100px;
  border-radius: 50%;
  background: rgba(166, 108, 255, 0.2);
  filter: blur(20px);
}

.eyebrow {
  position: relative;
  z-index: 1;
  display: inline-block;
  margin-bottom: 18px;
  color: var(--cyan);
  font-size: 15px;
  letter-spacing: 3px;
  font-weight: 700;
}

.hero h1 {
  position: relative;
  z-index: 1;
  margin: 0 0 18px;
  font-size: clamp(34px, 5vw, 65px);
  line-height: 1.1;
  letter-spacing: -2px;
}

.hero h1 span {
  background: linear-gradient(90deg, #ffffff, #8cceff, #c09aff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-description {
  position: relative;
  z-index: 1;
  max-width: 550px;
  margin: 0;
  color: var(--subtext);
  font-size: clamp(16px, 2vw, 20px);
  line-height: 1.8;
}

/* 코인 카드 */

.wallet-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 290px;
  padding: 30px;
  border: 1px solid rgba(72, 217, 255, 0.25);
  border-radius: 30px;
  background:
    radial-gradient(circle at 90% 10%, rgba(72, 217, 255, 0.18), transparent 38%),
    linear-gradient(145deg, rgba(26, 42, 88, 0.9), rgba(18, 18, 53, 0.9));
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
  animation: fadeUp 0.7s 0.12s ease both;
}

.wallet-label {
  color: var(--subtext);
  font-size: 16px;
}

.coin-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 62px;
  height: 62px;
  margin: 22px 0 12px;
  border-radius: 50%;
  color: #fff4a6;
  font-size: 32px;
  background: linear-gradient(145deg, #ffe477, #ffad27);
  box-shadow:
    0 0 0 7px rgba(255, 205, 69, 0.1),
    0 0 35px rgba(255, 194, 45, 0.25);
}

.coin-value {
  margin: 0;
  font-family: "Jua", sans-serif;
  font-size: clamp(30px, 4vw, 48px);
  letter-spacing: 1px;
  word-break: break-word;
}

.coin-unit {
  margin-left: 5px;
  color: #ffe477;
  font-size: 18px;
}

.level-badge {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 7px;
  margin-top: 22px;
  padding: 9px 15px;
  color: #dce7ff;
  border: 1px solid rgba(108, 140, 255, 0.35);
  border-radius: 999px;
  background: rgba(108, 140, 255, 0.15);
  font-size: 16px;
}

/* 상품 영역 */

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
  animation: fadeUp 0.7s 0.2s ease both;
}

.section-heading h2 {
  margin: 0;
  font-size: clamp(27px, 4vw, 40px);
  letter-spacing: -1px;
}

.section-heading p {
  margin: 0;
  color: var(--subtext);
  font-size: 16px;
}

.product-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.product-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 300px;
  padding: 24px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(28, 28, 75, 0.92), rgba(12, 12, 40, 0.92));
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
  opacity: 0;
  animation: productAppear 0.65s ease forwards;
  transition:
    transform 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}

.product-card::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  right: -80px;
  top: -80px;
  border-radius: 50%;
  background: rgba(108, 140, 255, 0.14);
  transition: 0.35s;
}

.product-card:hover {
  transform: translateY(-8px);
  border-color: rgba(108, 140, 255, 0.65);
  box-shadow:
    0 20px 45px rgba(0, 0, 0, 0.3),
    0 0 25px rgba(108, 140, 255, 0.08);
}

.product-card:hover::before {
  transform: scale(1.5);
  background: rgba(72, 217, 255, 0.12);
}

.product-number {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  margin-bottom: 20px;
  border-radius: 12px;
  color: #cbd7ff;
  background: rgba(108, 140, 255, 0.15);
  border: 1px solid rgba(108, 140, 255, 0.2);
  font-family: "Jua", sans-serif;
  font-size: 19px;
}

.product-title {
  position: relative;
  z-index: 1;
  min-height: 65px;
  margin: 0 0 22px;
  color: white;
  font-size: 21px;
  line-height: 1.45;
  word-break: keep-all;
}

.product-price {
  position: relative;
  z-index: 1;
  margin-top: auto;
  margin-bottom: 20px;
  color: #ffe477;
  font-family: "Jua", sans-serif;
  font-size: 22px;
  line-height: 1.4;
  word-break: break-word;
}

.product-price small {
  color: #b7b8e8;
  font-family: "HancomMalrangmalrang", sans-serif;
  font-size: 13px;
}

.buy-button {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  color: white;
  background: linear-gradient(100deg, #5575ff, #8b5cff);
  box-shadow: 0 8px 20px rgba(91, 91, 255, 0.2);
  font-size: 18px;
  cursor: pointer;
  transition: 0.25s;
}

.buy-button:hover {
  background: linear-gradient(100deg, #6684ff, #a06fff);
  box-shadow: 0 10px 28px rgba(91, 91, 255, 0.38);
  transform: translateY(-2px);
}

.buy-button:active {
  transform: scale(0.96);
}

.buy-button:disabled {
  cursor: not-allowed;
  color: #aaaed0;
  background: rgba(255, 255, 255, 0.1);
  box-shadow: none;
  transform: none;
}

.product-card.owned {
  border-color: rgba(81, 220, 171, 0.45);
}

.product-card.owned .product-number {
  color: #7ff0c6;
  background: rgba(81, 220, 171, 0.13);
  border-color: rgba(81, 220, 171, 0.25);
}

/* 안내 */

.notice {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 28px;
  padding: 20px 22px;
  color: var(--subtext);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.035);
  font-size: 15px;
  line-height: 1.7;
}

/* 로딩 */

.loading-screen {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #03031b;
  transition: opacity 0.45s, visibility 0.45s;
}

.loading-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-box {
  text-align: center;
}

.loader {
  width: 52px;
  height: 52px;
  margin: 0 auto 20px;
  border: 4px solid rgba(255, 255, 255, 0.12);
  border-top-color: var(--cyan);
  border-right-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.loader-box p {
  margin: 0;
  color: var(--subtext);
  font-size: 17px;
}

/* 토스트 */

.toast {
  position: fixed;
  z-index: 1100;
  right: 25px;
  bottom: 25px;
  max-width: min(420px, calc(100% - 50px));
  padding: 17px 22px;
  color: white;
  border: 1px solid rgba(108, 140, 255, 0.45);
  border-radius: 16px;
  background: rgba(22, 22, 63, 0.95);
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(18px);
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  transition: 0.3s;
  font-size: 16px;
  line-height: 1.5;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.success {
  border-color: rgba(81, 220, 171, 0.55);
}

.toast.error {
  border-color: rgba(255, 108, 145, 0.55);
}

/* 애니메이션 */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes productAppear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* 반응형 */

@media (max-width: 1050px) {
  .product-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 780px) {
  .page {
    width: min(100% - 28px, 600px);
    padding-top: 20px;
  }

  .topbar {
    margin-bottom: 35px;
  }

  .hero {
    grid-template-columns: 1fr;
    margin-bottom: 50px;
  }

  .hero-content {
    padding: 32px 25px;
  }

  .wallet-card {
    min-height: auto;
    padding: 25px;
  }

  .product-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .product-card {
    min-height: 285px;
    padding: 19px;
  }

  .product-title {
    font-size: 18px;
  }

  .product-price {
    font-size: 19px;
  }
}

@media (max-width: 480px) {
  .topbar {
    align-items: flex-start;
  }

  .logo {
    font-size: 30px;
  }

  .home-button {
    padding: 9px 13px;
    font-size: 14px;
  }

  .hero h1 {
    font-size: 38px;
  }

  .hero-description {
    font-size: 16px;
  }

  .section-heading {
    display: block;
  }

  .section-heading h2 {
    margin-bottom: 8px;
  }

  .product-list {
    grid-template-columns: 1fr;
  }

  .product-card {
    min-height: 0;
  }

  .product-title {
    min-height: 0;
  }

  .toast {
    right: 14px;
    bottom: 14px;
    max-width: calc(100% - 28px);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

</main>

}

function 토스트메시지(message, type = "success") {

function 상품카드생성(상품, index, 현재레벨) {

    </h3>

    <div class="product-price">
      ${숫자표시(상품.price)} 돌돌코인
      <br>
      <small>구매 후 등급: ${상품.levelName}</small>
    </div>

    <button
      class="buy-button"
      type="button"
      ${이미보유 ? "disabled" : ""}
    >
      ${이미보유 ? "✓ 보유 중" : "구매하기"}
    </button>
  `;

  const buyButton = card.querySelector(".buy-button");

  if (!이미보유) {
    buyButton.addEventListener("click", () => 상품구매(상품, buyButton));
  }

  productList.appendChild(card);
}

async function 사용자정보가져오기(userId) {
  const { data, error } = await supabase
    .from("users")
    .select("doldolcoin,user_level")
    .eq("user_id", userId)
    .single();

  if (error) {
    throw error;
  }

  return data;
}

function 화면갱신(userInfo) {
  const 현재코인 = Number(userInfo.doldolcoin || 0);
  const 현재레벨 = Number(userInfo.user_level || 1);

  coinDisplay.textContent = 숫자표시(현재코인);
  levelDisplay.textContent = 등급이름[현재레벨] || `레벨 ${현재레벨}`;

  productList.innerHTML = "";

  상품목록.forEach((상품, index) => {
    상품카드생성(상품, index, 현재레벨);
  });
}

async function 상품구매(상품, buyButton) {
  if (!현재사용자) {
    토스트메시지("로그인이 필요합니다.", "error");
    return;
  }

  buyButton.disabled = true;
  buyButton.textContent = "구매 중...";

  try {
    const 최신정보 = await 사용자정보가져오기(현재사용자.id);

    const 현재코인 = Number(최신정보.doldolcoin || 0);
    const 현재레벨 = Number(최신정보.user_level || 1);

    if (현재코인 < 상품.price) {
      토스트메시지("돌돌코인이 부족합니다.", "error");
      buyButton.disabled = false;
      buyButton.textContent = "구매하기";
      return;
    }

    if (현재레벨 >= 상품.level) {
      토스트메시지("이미 보유하고 있는 쿠폰입니다.", "error");
      화면갱신(최신정보);
      return;
    }

    const 남은코인 = 현재코인 - 상품.price;

    const { error: updateError } = await supabase
      .from("users")
      .update({
        doldolcoin: 남은코인,
        user_level: 상품.level
      })
      .eq("user_id", 현재사용자.id);

    if (updateError) {
      throw updateError;
    }

    const 변경된정보 = {
      doldolcoin: 남은코인,
      user_level: 상품.level
    };

    화면갱신(변경된정보);

    토스트메시지(
      `${상품.name} 구매 완료! 남은 돌돌코인: ${숫자표시(남은코인)}`,
      "success"
    );

  } catch (error) {
    console.error("상품 구매 오류:", error);
    토스트메시지("구매에 실패했습니다. 잠시 후 다시 시도해 주세요.", "error");

    buyButton.disabled = false;
    buyButton.textContent = "구매하기";
  }
}

async function 시작하기() {
  try {
    const {
      data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
      alert("로그인이 필요합니다.");
      location.href = "https://rockey-jason.github.io/doldol-site/";
      return;
    }

    현재사용자 = session.user;

    const userInfo = await 사용자정보가져오기(현재사용자.id);

    화면갱신(userInfo);

  } catch (error) {
    console.error("상점 로딩 오류:", error);
    토스트메시지("사용자 정보를 불러오지 못했습니다.", "error");
  } finally {
    setTimeout(() => {
      loadingScreen.classList.add("hidden");
    }, 350);
  }
}

시작하기();
</script>
