<script type=module>
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://scttowfhygcpdirrekqm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"
);

// 상품 이름
const 버튼이름 = [
    "프리미엄 쿠폰 - 100000돌돌코인",
    "돌프리미엄 쿠폰 - 1000000돌돌코인",
    "돌돌프리미엄 쿠폰 - 10000000돌돌코인",
    "돌돌돌프리미엄 쿠폰 - 100000000돌돌코인",
    "돌돌돌돌프리미엄 쿠폰 - 1000000000돌돌코인",
    "돌돌돌돌돌프리미엄 쿠폰 - 10000000000돌돌코인",
    "유사돌이 쿠폰 - 100000000000돌돌코인",
    "돌이 쿠폰 - 1000000000000돌돌코인"
];

// 가격
const 가격 = [
    100000,
    1000000,
    10000000,
    100000000,
    1000000000,
    10000000000,
    100000000000,
    1000000000000
];

// 구매 후 변경될 레벨
const 레벨 = [
    2, // 프리미엄
    3, // 돌프리미엄
    4, // 돌돌프리미엄
    5, // 돌돌돌프리미엄
    6, // 돌돌돌돌프리미엄
    7, // 돌돌돌돌돌프리미엄
    8, // 유사돌이
    9  // 돌이
];

window.addEventListener("DOMContentLoaded", async () => {

    // 로그인 확인
    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        alert("로그인이 필요합니다.");
        return;
    }

    const {
        data: { user }
    } = await supabase.auth.getUser();

    const {
        data: userInfo,
        error
    } = await supabase
        .from("users")
        .select("doldolcoin,user_level")
        .eq("user_id", user.id)
        .single();

    if (error) {
        console.log(error);
        return;
    }

    const 복사본 = document.getElementById("버튼복사본");
    const 구매복사본 = document.getElementById("구매버튼복사본");
    const 목록 = document.getElementById("버튼목록");

    버튼이름.forEach((이름, 번호) => {

        const 줄 = document.createElement("div");
        줄.style.display = "flex";
        줄.style.alignItems = "center";
        줄.style.gap = "10px";

        // 이름
        const 새버튼 = 복사본.content.cloneNode(true);
        새버튼.querySelector("button").textContent = 이름;

        // 구매 버튼
        const 구매버튼 = 구매복사본.content.cloneNode(true);

        구매버튼.querySelector("button").onclick = async () => {

            // 최신 정보
            const {
                data: 최신정보,
                error: 최신오류
            } = await supabase
                .from("users")
                .select("doldolcoin,user_level")
                .eq("user_id", user.id)
                .single();

            if (최신오류) {
                console.log(최신오류);
                return;
            }

            const 현재코인 = 최신정보.doldolcoin;
            const 현재레벨 = 최신정보.user_level;
            const 필요코인 = 가격[번호];
            const 목표레벨 = 레벨[번호];

            if (현재코인 < 필요코인) {
                alert("돌돌코인이 부족합니다.");
                return;
            }

            if (현재레벨 >= 목표레벨) {
                alert("이미 보유하고 있는 쿠폰입니다.");
                return;
            }

            const 남은코인 = 현재코인 - 필요코인;

            const { error: updateError } = await supabase
                .from("users")
                .update({
                    doldolcoin: 남은코인,
                    user_level: 목표레벨
                })
                .eq("user_id", user.id);

            if (updateError) {
                console.log(updateError);
                alert("구매에 실패했습니다.");
                return;
            }

            alert(
                `${이름} 구매 완료!\n남은 돌돌코인 : ${남은코인}`
            );

        };

        줄.appendChild(새버튼);
        줄.appendChild(구매버튼);

        목록.appendChild(줄);

    });

});
</script>
