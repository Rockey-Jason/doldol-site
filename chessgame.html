<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rockey Chess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
#board{
    width:700px;
    max-width:90vw;
    margin:100px auto;
}
</style>

<link rel="stylesheet" href="lib/chessboard.css">
</head>

  
<body>
  

<div id="board"></div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/css/chessboard-1.0.0.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/js/chessboard-1.0.0.min.js"></script>
<script>
const game = new Chess();

const board = Chessboard("board", {

    position: "start",

    draggable: true,

    pieceTheme: "pieces/{piece}.png",

    onDragStart: onDragStart,

    onDrop: onDrop,

    onSnapEnd: onSnapEnd

});

// 자신의 턴의 말만 움직이기
function onDragStart(source, piece) {

    if (game.isGameOver()) return false;

    if (
        (game.turn() === "w" && piece.startsWith("b")) ||
        (game.turn() === "b" && piece.startsWith("w"))
    ) {
        return false;
    }

}

// 말 놓기
function onDrop(source, target) {

    const move = game.move({

        from: source,

        to: target,

        promotion: "q"

    });

    // 불가능한 수
    if (move === null) {
        return "snapback";
    }

}

// 이동 후 체스판 새로고침
function onSnapEnd() {

    board.position(game.fen());

}
</script>
  
</body>
</html>
