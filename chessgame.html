<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rockey Chess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<link rel="stylesheet" href="chess.css">

</head>

<body>

<div id="topBar">

    <button id="homeButton">
        ← 돌이 사이트
    </button>

    <h1>Rockey Chess</h1>

</div>


<div id="game">

    <div id="leftPanel">

        <h2>플레이</h2>

        <button class="botButton" data-level="1">
            Talc Rockey
            <span>≈1</span>
        </button>

        <button class="botButton" data-level="100">
            Sleeping Rockey
            <span>≈100</span>
        </button>

        <button class="botButton" data-level="300">
            Rockey's Fur
            <span>≈300</span>
        </button>

        <button class="botButton" data-level="1000">
            Rockey
            <span>≈1000</span>
        </button>

        <button class="botButton" data-level="2000">
            Rockey Army
            <span>≈2000</span>
        </button>

        <button class="botButton" data-level="3500">
            Doronum
            <span>≈3500</span>
        </button>

        <button class="botButton" data-level="5000">
            Brilliant Rockey
            <span>≈5000</span>
        </button>

    </div>


    <div id="centerPanel">

        <div id="board"></div>

    </div>


    <div id="rightPanel">

        <h2>게임 정보</h2>

        <p id="turnText">
            White to move
        </p>

        <p id="statusText">
            Ready
        </p>

        <button id="restartButton">
            다시 시작
        </button>

    </div>

</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/js/chessboard-1.0.0.min.js"></script>

<script src="chessgame.js"></script>

</body>
</html>
