/* =====================================================

===================================================== */

html,

===================================================== */

   이미지
===================================================== */

// =====================================================

let 초기화완료 = false;

let 현재사용자 = null;

let 현재유저정보 = null;

let 프로필열림 = false;


// =====================================================
// 회원 레벨
// =====================================================

const 회원레벨이름 = {

    1: "일반",

    2: "프리미엄",

    3: "돌프리미엄",

    4: "돌돌프리미엄",

    8: "유사돌이",

    10: "관리자"

};


// =====================================================
// EXP 레벨
// =====================================================

const EXP레벨필요경험치 = {

    1: 0,

    2: 100,

    3: 500,

    4: 1000,

    5: 5000,

    6: 10000,

    7: 20000,

    8: 30000,

    9: 40000,

    10: 50000,

    11: 100000

};


// =====================================================
// EXP 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    const 숫자 =
        Number(exp) || 0;

    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            숫자 >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// DOM
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    초기화
);


// =====================================================
// 초기화
// =====================================================

async function 초기화() {

    if (초기화완료) {

        return;

    }


    초기화완료 = true;


    console.log(
        "🐶 돌이사이트 초기화 시작"
    );


    이벤트설정();


    await 로그인상태처리();


    console.log(
        "🐶 돌이사이트 초기화 완료"
    );

}


// =====================================================
// DOM 가져오기
// =====================================================

function el(id) {

    return document.getElementById(id);

}


// =====================================================
// 이벤트
// =====================================================

function 이벤트설정() {


    /* --------------------------------------------------
       돌이신문
    -------------------------------------------------- */

    const 신문버튼 =
        document.querySelector(
            '[data-page="news"]'
        );


    const 신문이미지 =
        el("돌이신문확인");


    function 신문이동() {

        location.href =
            "rockeynews.html";

    }


    if (신문버튼) {

        신문버튼.onclick =
            신문이동;

    }


    if (신문이미지) {

        신문이미지.onclick =
            신문이동;

    }


    /* --------------------------------------------------
       돌돌코인 상점
    -------------------------------------------------- */

    const 상점버튼 =
        el("돌돌코인상점");


    const 상점이미지 =
        el("돌돌코인상점!!!");


    function 상점이동() {

        location.href =
            "doldolcoinmart.html";

    }


    if (상점버튼) {

        상점버튼.onclick =
            상점이동;

    }


    if (상점이미지) {

        상점이미지.onclick =
            상점이동;

    }


    /* --------------------------------------------------
       돌이 관련 정보
    -------------------------------------------------- */

    const 정보버튼 =
        el("돌이와 관련된 정보");


    const 정보이미지 =
        el("돌이와관련된정보!");


    function 정보이동() {

        location.href =
            "knowledgeofrockey.html";

    }


    if (정보버튼) {

        정보버튼.onclick =
            정보이동;

    }


    if (정보이미지) {

        정보이미지.onclick =
            정보이동;

    }


    /* --------------------------------------------------
       게임
    -------------------------------------------------- */

    const 게임버튼 =
        el("돌이게임");


    const 게임이미지 =
        el("돌이게임사진");


    function 게임이동() {

        location.href =
            "gamepage.html";

    }


    if (게임버튼) {

        게임버튼.onclick =
            게임이동;

    }


    if (게임이미지) {

        게임이미지.onclick =
            게임이동;

    }


    /* --------------------------------------------------
       로그인
    -------------------------------------------------- */

    const 로그인 =
        el("로그인");


    if (로그인) {

        로그인.onclick =
            () => {

                location.href =
                    "login.html";

            };

    }


    /* --------------------------------------------------
       회원가입
    -------------------------------------------------- */

    const 회원가입 =
        el("회원가입");


    if (회원가입) {

        회원가입.onclick =
            () => {

                location.href =
                    "signin.html";

            };

    }


    /* --------------------------------------------------
       설정
    -------------------------------------------------- */

    const 설정 =
        el("설정");


    if (설정) {

        설정.onclick =
            () => {

                location.href =
                    "settings.html";

            };

    }


    /* --------------------------------------------------
       프로필
    -------------------------------------------------- */

    const 사진 =
        el("돌이사진");


    if (사진) {

        사진.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                프로필메뉴토글();

            }
        );

    }


    /* --------------------------------------------------
       프로필 상점
    -------------------------------------------------- */

    const 프로필상점 =
        el("돌돌코인");


    if (프로필상점) {

        프로필상점.onclick =
            () => {

                location.href =
                    "doldolcoinmart.html";

            };

    }


    /* --------------------------------------------------
       로그아웃
    -------------------------------------------------- */

    const 로그아웃 =
        el("로그아웃");


    if (로그아웃) {

        로그아웃.onclick =
            로그아웃처리;

    }


    /* --------------------------------------------------
       메뉴 바깥 클릭
    -------------------------------------------------- */

    document.addEventListener(
        "click",
        (event) => {

            const 메뉴 =
                el("프로필메뉴");


            const 사진 =
                el("돌이사진");


            if (!메뉴 || !사진) {

                return;

            }


            if (
                !메뉴.contains(event.target) &&
                event.target !== 사진
            ) {

                프로필닫기();

            }

        }
    );

}


// =====================================================
// 로그인 상태
// =====================================================

async function 로그인상태처리() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            console.error(
                "세션 확인 오류:",
                error
            );


            비로그인화면();

            return;

        }


        if (!data.session) {

            비로그인화면();

            return;

        }


        현재사용자 =
            data.session.user;


        await 로그인화면();

    }

    catch (error) {

        console.error(
            "로그인 처리 오류:",
            error
        );


        비로그인화면();

    }

}


// =====================================================
// 비로그인 화면
// =====================================================

        el("로그인");


    const 회원가입 =
        el("회원가입");

    }


    if (사진) {

        사진.style.display =
            "none";

    }

// =====================================================
// 로그인 화면
// =====================================================

async function 로그인화면() {

    const 로그인 =
        el("로그인");


    const 회원가입 =
        el("회원가입");


    const 사진 =
        el("돌이사진");


    if (로그인) {

        로그인.style.display =
            "none";

    }


    if (회원가입) {

            "none";

    }


    if (사진) {

        사진.style.display =
            "block";

    }


    await 사용자정보불러오기();

}


// =====================================================
// 사용자 정보
// =====================================================

async function 사용자정보불러오기() {

    if (!현재사용자) {

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabase

                .from("users")

                .select(`
                    user_id,
                    user_number,
                    user_level,
                    doldolcoin,
                    exp,
                    exp_level,
                    profile_image,
                    equipped_title
                `)

                .eq(
                    "user_id",
                    현재사용자.id
                )

                .maybeSingle();


        if (error) {

            console.error(
                "users 조회 오류:",
                error
            );

            return;

        }


        if (!data) {

            console.warn(
                "users에 현재 사용자가 없습니다."
            );

            return;

        }


        현재유저정보 =
            data;


        사용자정보표시();

    }

    catch (error) {

        console.error(
            "사용자 정보 처리 오류:",
            error
        );

    }

}


// =====================================================
// 사용자 정보 표시
//
// 중요:
// 정보 자체는 불러오지만
// 화면에는 프로필을 눌렀을 때만 표시.
// =====================================================

function 사용자정보표시() {

    if (!현재유저정보) {

        return;

    }


    const 사진 =
        el("돌이사진");


    if (
        사진 &&
        현재유저정보.profile_image
    ) {

        사진.src =
            현재유저정보.profile_image;

    }


    const 회원레벨 =
        Number(
            현재유저정보.user_level
        ) || 1;


    const exp =
        Number(
            현재유저정보.exp
        ) || 0;


    const expLevel =
        Number(
            현재유저정보.exp_level
        )
        ||
        경험치로레벨계산(exp);


    const 레벨 =
        el("레벨");


    if (레벨) {

        레벨.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;

    }


    const 코인 =
        el("돌돌코인수량");


    if (코인) {

        코인.textContent =
            `돌돌코인: ${
                Number(
                    현재유저정보.doldolcoin
                ) || 0
            }`;

    }


    const EXP =
        el("EXP정보");


    if (EXP) {

        EXP.textContent =
            `EXP Lv.${expLevel} · ${exp} EXP`;

    }


    const 칭호 =
        el("현재칭호");


    if (칭호) {

        칭호.textContent =
            현재유저정보.equipped_title
            ||
            "칭호 없음";

    }

}


// =====================================================
// 프로필 메뉴 토글
// =====================================================

function 프로필메뉴토글() {

    if (!현재사용자) {

        return;

    }


    const 메뉴 =
        el("프로필메뉴");


    const 상태 =
        el("프로필상태");


    if (!메뉴) {

        return;

    }


    프로필열림 =
        !프로필열림;


    if (프로필열림) {

        메뉴.classList.add(
            "show"
        );


        if (상태) {

            상태.classList.add(
                "show"
            );

        }

    }

    else {

        프로필닫기();

    }

}


// =====================================================
// 프로필 닫기
// =====================================================

function 프로필닫기() {

    프로필열림 =
        false;


    const 메뉴 =
        el("프로필메뉴");


    const 상태 =
        el("프로필상태");


    if (메뉴) {

        메뉴.classList.remove(
            "show"
        );

    }


    if (상태) {

        상태.classList.remove(
            "show"
        );

    }

}


// =====================================================
// 로그아웃
// =====================================================

async function 로그아웃처리() {

    try {

        const {
            error
        } =
            await supabase.auth.signOut();


        if (error) {

            console.error(
                "로그아웃 오류:",
                error
            );


            alert(
                "로그아웃에 실패했습니다."
            );


            return;

        }


        현재사용자 =
            null;


        현재유저정보 =
            null;


        프로필닫기();


        location.href =
            "index.html";

    }

    catch (error) {

        console.error(
            "로그아웃 예외:",
            error
        );

    }

}
