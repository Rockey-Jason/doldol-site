<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap');

@font-face{
  font-family:'HancomMalrangmalrang';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2') format('woff2');
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:'HancomMalrangmalrang';
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2') format('woff2');
  font-weight:700;
  font-display:swap;
}

:root{
  --bg1:#03034a;
  --bg2:#050516;
  --card:rgba(255,255,255,.075);
  --card-border:rgba(255,255,255,.12);
  --text:#f7f8ff;
  --muted:#aeb5cf;
  --accent:#8d8cff;
  --accent2:#6b63ff;
  --gold:#ffd84d;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box}
html{min-height:100%;overflow-x:hidden}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:'HancomMalrangmalrang','Jua',sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(92,91,255,.20),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(0,184,255,.10),transparent 25%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 70%);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.07),transparent 35%),
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:auto,100% 5px;
  mask-image:linear-gradient(to bottom,black,transparent 80%);
  z-index:-1;
}

button,img{ -webkit-tap-highlight-color:transparent }
button{font:inherit}
button:focus-visible{
  outline:3px solid rgba(141,140,255,.65);
  outline-offset:4px;
}

#사이트{
  width:min(1440px,100%);
  min-height:100vh;
  margin:0 auto;
  padding:clamp(22px,4vw,58px) clamp(16px,4vw,56px) 70px;
  position:relative;
  isolation:isolate;
}

#사이트::after{
  content:"";
  position:absolute;
  width:520px;height:520px;
  right:-220px;top:120px;
  border-radius:50%;
  background:rgba(99,92,255,.08);
  filter:blur(20px);
  pointer-events:none;
  z-index:-1;
}

#사이트로고{
  appearance:none;
  border:0;
  background:none;
  color:#fff;
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(48px,7vw,92px);
  line-height:1;
  letter-spacing:-3px;
  padding:0;
  cursor:pointer;
  text-shadow:0 8px 35px rgba(100,95,255,.28);
  transition:transform .45s var(--ease),text-shadow .45s var(--ease);
}
#사이트로고:hover{transform:translateY(-3px) scale(1.015);text-shadow:0 12px 45px rgba(100,95,255,.45)}
#사이트로고 .사이트로고이미지{display:block;width:clamp(96px,16vw,180px);height:auto;aspect-ratio:1;object-fit:cover;border-radius:28px;box-shadow:0 14px 45px rgba(0,0,0,.35),0 0 34px rgba(64,210,255,.22),0 0 18px rgba(255,216,77,.12);transition:transform .45s var(--ease),filter .45s ease,box-shadow .45s ease}
#사이트로고:hover .사이트로고이미지{transform:translateY(-3px) scale(1.025);filter:brightness(1.08) saturate(1.08);box-shadow:0 18px 55px rgba(0,0,0,.42),0 0 48px rgba(64,210,255,.32),0 0 25px rgba(255,216,77,.18)}

#사이트설명{
  margin:16px 0 0;
  max-width:720px;
  color:var(--muted);
  font-size:clamp(15px,2vw,20px);
  line-height:1.65;
  font-weight:700;
}

.상단영역{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  margin-bottom:clamp(35px,6vw,70px);
}

.인증영역{
  display:flex;
  align-items:center;
  gap:8px;
  padding-top:4px;
}

#로그인,#회원가입{
  appearance:none;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.055);
  color:#e9ebff;
  border-radius:999px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700;
  transition:transform .25s var(--ease),background .25s ease,border-color .25s ease;
}
#로그인:hover,#회원가입:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.11);
  border-color:rgba(255,255,255,.25);
}

.메뉴영역{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:clamp(14px,2vw,24px);
}

.메뉴카드{
  position:relative;
  display:flex;
  flex-direction:column;
  min-width:0;
  border:1px solid var(--card-border);
  border-radius:28px;
  padding:14px 14px 20px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035));
  box-shadow:0 18px 55px rgba(0,0,0,.22);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  overflow:hidden;
  opacity:0;
  transform:translateY(28px);
  animation:카드등장 .75s var(--ease) forwards;
  transition:transform .4s var(--ease),border-color .4s ease,box-shadow .4s ease;
}
.메뉴카드:nth-child(1){animation-delay:.05s}
.메뉴카드:nth-child(2){animation-delay:.11s}
.메뉴카드:nth-child(3){animation-delay:.17s}
.메뉴카드:nth-child(4){animation-delay:.23s}
.메뉴카드:nth-child(5){animation-delay:.29s}

.메뉴카드::before{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:-85px;top:-90px;
  border-radius:50%;
  background:rgba(141,140,255,.13);
  transition:transform .6s var(--ease);
}
.메뉴카드:hover{
  transform:translateY(-9px);
  border-color:rgba(170,169,255,.36);
  box-shadow:0 28px 75px rgba(0,0,0,.34);
}
.메뉴카드:hover::before{transform:scale(1.5)}

.메인버튼{
  width:100%;
  order:2;
  border:0;
  background:none;
  color:#fff;
  padding:15px 8px 2px;
  font-size:clamp(18px,1.8vw,25px);
  font-weight:700;
  cursor:pointer;
  text-align:left;
  transition:transform .3s var(--ease),color .3s ease;
}
.메인버튼:hover{transform:translateX(4px);color:#dcdcff}

.이미지틀{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
  border-radius:21px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.08);
}
.메인이미지{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
  transition:transform .65s var(--ease),filter .5s ease;
}
.메뉴카드:hover .메인이미지{
  transform:scale(1.065);
  filter:brightness(1.08);
}

.카드설명{
  margin:7px 8px 0;
  color:#969db8;
  font-size:13px;
  line-height:1.5;
  order:3;
}

#랜덤박스이미지{
  background:linear-gradient(135deg,rgba(112,110,255,.14),rgba(255,255,255,.035));
}
#랜덤박스이미지::after{
  content:"IMAGE";
  display:grid;
  place-items:center;
  width:100%;height:100%;
  color:rgba(255,255,255,.16);
  font-family:Arial,sans-serif;
  font-weight:700;
  letter-spacing:4px;
}

#돌이사진{
  position:fixed;
  top:18px;right:20px;
  width:58px;height:58px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
  cursor:pointer;
  display:none;
  z-index:100;
  transition:transform .35s var(--ease),box-shadow .35s ease;
}
#돌이사진:hover{transform:scale(1.08);box-shadow:0 14px 45px rgba(100,95,255,.32)}

#메뉴{
  position:fixed;
  top:88px;right:20px;
  width:min(290px,calc(100vw - 28px));
  padding:10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  background:rgba(13,14,43,.91);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  display:none;
  z-index:99;
  transform-origin:top right;
}
#메뉴.menu-show{display:block;animation:메뉴등장 .35s var(--ease)}
#메뉴.menu-hide{display:block;animation:메뉴퇴장 .25s var(--ease) forwards}

.프로필버튼{
  width:100%;
  border:0;
  border-radius:14px;
  background:transparent;
  color:#fff;
  padding:13px 14px;
  text-align:left;
  cursor:pointer;
  font-weight:700;
  transition:transform .25s var(--ease),background .25s ease;
}
.프로필버튼:hover{background:rgba(255,255,255,.09);transform:translateX(3px)}

#레벨,#EXP정보,#돌돌코인수량,#현재칭호{
  position:fixed;
  right:92px;
  z-index:100;
  display:none;
  max-width:calc(100vw - 180px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#레벨{top:18px;border:0;background:none;color:#fff;font-weight:700;cursor:pointer}
#EXP정보{top:44px;color:#aeb5cf;font-size:13px}
#돌돌코인수량{top:64px;color:#aeb5cf;font-size:13px}
#현재칭호{top:84px;color:var(--gold);font-size:13px}

#패널배경{
  position:fixed;
  inset:0;
  background:rgba(0,0,8,.72);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  z-index:99997;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease,visibility 0s linear .35s;
}
#패널배경.show{
  opacity:1;
  visibility:visible;
  transition:opacity .35s ease;
}

#패널{
  position:fixed;
  top:50%;left:50%;
  width:min(700px,calc(100vw - 28px));
  max-height:min(82vh,850px);
  overflow-y:auto;
  padding:28px;
  color:#fff;
  background:linear-gradient(145deg,rgba(20,21,61,.97),rgba(8,8,28,.97));
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  box-shadow:0 35px 110px rgba(0,0,0,.6);
  z-index:99998;
  opacity:0;
  visibility:hidden;
  transform:translate(-50%,-46%) scale(.94);
  transition:opacity .35s ease,transform .45s var(--ease),visibility 0s linear .45s;
}
#패널.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,-50%) scale(1);
  transition:opacity .35s ease,transform .45s var(--ease);
}
#패널::-webkit-scrollbar{width:7px}
#패널::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px}

#패널제목{font-size:30px;font-weight:700;margin-bottom:20px}
#패널닫기{
  position:absolute;top:15px;right:18px;
  width:42px;height:42px;
  border:0;border-radius:50%;
  background:rgba(255,255,255,.07);
  color:#fff;font-size:23px;cursor:pointer;
  transition:transform .25s ease,background .25s ease;
}
#패널닫기:hover{transform:rotate(90deg);background:rgba(255,255,255,.14)}

.탭{display:flex;gap:9px;margin-bottom:20px}
.탭버튼{
  flex:1;border:0;border-radius:14px;padding:12px;
  background:rgba(255,255,255,.07);color:#cdd1e8;
  cursor:pointer;font-weight:700;
  transition:.25s ease;
}
.탭버튼:hover{background:rgba(255,255,255,.12)}
.탭버튼.active{background:linear-gradient(135deg,#6964ff,#514bbd);color:#fff}

.업적카드,.칭호카드{
  padding:17px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  background:rgba(255,255,255,.045);
  transition:transform .3s var(--ease),background .3s ease;
}
.업적카드:hover,.칭호카드:hover{transform:translateY(-2px);background:rgba(255,255,255,.065)}
.업적카드.미획득{opacity:.42}
.업적이름{font-size:20px;font-weight:700}
.업적설명{margin-top:5px;color:#b7bbd0;line-height:1.5}
.업적정보{margin-top:9px;color:#d5d8e8;font-size:14px;line-height:1.65}
.칭호태그{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:999px;background:rgba(128,107,0,.45);color:#ffe75e}
.칭호이름{font-size:22px;color:var(--gold);font-weight:700}
.칭호상태{margin-top:5px;color:#9da3bc}
.칭호선택,#칭호저장{
  margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;
  background:#383878;color:#fff;cursor:pointer;font-weight:700;
  transition:transform .25s var(--ease),filter .25s ease;
}
.칭호선택:hover,#칭호저장:hover{transform:translateY(-2px);filter:brightness(1.12)}
.칭호선택.장착중{background:#806b00}
#칭호저장{background:linear-gradient(135deg,#e1bd23,#a98900);color:#171300}


/* ===== ACHIEVEMENT FULL-SITE BACKGROUND ===== */
#achievementFullSiteEffect{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  overflow:hidden;
  background:#03034a;
  transition:opacity .9s ease,visibility 0s linear .9s,background 1.25s ease;
}
#achievementFullSiteEffect::before{
  content:"";
  position:absolute;
  inset:-18%;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.20),transparent 18%),
    radial-gradient(circle at 14% 15%,rgba(255,255,255,.16),transparent 30%),
    radial-gradient(circle at 86% 78%,rgba(255,255,255,.12),transparent 34%);
  filter:blur(8px);
  transform:scale(1.05);
  animation:achievementWorldBreath 3.6s ease-in-out infinite;
}
#achievementFullSiteEffect::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%,transparent 0 35%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.46) 100%);
  background-size:100% 6px,100% 100%;
  opacity:.7;
  mix-blend-mode:screen;
}
#achievementFullSiteEffect.show{
  opacity:1;
  visibility:visible;
  transition:opacity .8s ease,background 1.25s ease;
}
#achievementFullSiteEffect.rarity-legendary{
  background:
    radial-gradient(circle at 50% 40%,rgba(255,248,170,.48),transparent 25%),
    radial-gradient(circle at 8% 18%,rgba(255,197,45,.42),transparent 34%),
    radial-gradient(circle at 92% 82%,rgba(255,123,20,.34),transparent 42%),
    linear-gradient(135deg,#5a3b00 0%,#241500 48%,#100b03 100%);
}
#achievementFullSiteEffect.rarity-myth{
  background:
    radial-gradient(circle at 50% 40%,rgba(255,70,90,.42),transparent 25%),
    radial-gradient(circle at 8% 18%,rgba(180,0,38,.48),transparent 35%),
    radial-gradient(circle at 92% 82%,rgba(90,0,25,.46),transparent 43%),
    linear-gradient(135deg,#5b071c 0%,#26000b 48%,#0f0207 100%);
}
#achievementFullSiteEffect.rarity-doronum{
  background:
    radial-gradient(circle at 50% 40%,rgba(220,255,255,.52),transparent 24%),
    radial-gradient(circle at 8% 18%,rgba(55,235,255,.48),transparent 34%),
    radial-gradient(circle at 92% 82%,rgba(55,145,255,.44),transparent 42%),
    linear-gradient(135deg,#07506c 0%,#07304c 45%,#06172f 100%);
}
body.achievement-bg-legendary,
body.achievement-bg-myth,
body.achievement-bg-doronum{
  background:var(--bg2) !important;
}
body.achievement-bg-legendary #achievementFullSiteEffect,
body.achievement-bg-myth #achievementFullSiteEffect,
body.achievement-bg-doronum #achievementFullSiteEffect{
  opacity:1;
  visibility:visible;
}
#사이트{
  position:relative;
  z-index:1;
}
@keyframes achievementWorldBreath{
  0%,100%{transform:scale(1.02) translate3d(0,0,0);filter:blur(8px) brightness(.92) saturate(1)}
  50%{transform:scale(1.10) translate3d(0,-1.5%,0);filter:blur(5px) brightness(1.16) saturate(1.35)}
}
@media(prefers-reduced-motion:reduce){
  #achievementFullSiteEffect::before{animation:none}
}

/* ===== ACHIEVEMENT CHAINED BACKGROUND VARIATIONS ===== */
#achievementFullSiteEffect{
  --chainHue:0deg;
  --chainFlash:rgba(255,255,255,.18);
}
#achievementFullSiteEffect.chain-1{filter:hue-rotate(0deg)}
#achievementFullSiteEffect.chain-2{filter:hue-rotate(18deg)}
#achievementFullSiteEffect.chain-3{filter:hue-rotate(-18deg)}
#achievementFullSiteEffect.chain-4{filter:hue-rotate(35deg)}
#achievementFullSiteEffect.chain-5{filter:hue-rotate(-35deg)}
#achievementFullSiteEffect.chain-6{filter:hue-rotate(55deg)}
#achievementFullSiteEffect.chain-7{filter:hue-rotate(-55deg)}
#achievementFullSiteEffect.chain-8{filter:hue-rotate(80deg)}
#achievementFullSiteEffect.chain-9{filter:hue-rotate(-80deg)}
#achievementFullSiteEffect.chain-10{filter:hue-rotate(105deg)}
#achievementFullSiteEffect.chain-11{filter:hue-rotate(-105deg)}
#achievementFullSiteEffect.chain-12{filter:hue-rotate(135deg)}
#achievementFullSiteEffect.chain-13{filter:hue-rotate(-135deg)}
#achievementFullSiteEffect.chain-14{filter:hue-rotate(165deg)}
#achievementFullSiteEffect.chain-15{filter:hue-rotate(-165deg)}
#achievementFullSiteEffect.chain-pulse::before{
  animation:achievementWorldBreath .95s cubic-bezier(.2,.8,.2,1) 2;
}
#achievementFullSiteEffect.chain-pulse::after{
  animation:achievementChainScan .7s ease-out 1;
}
@keyframes achievementChainScan{
  0%{opacity:.15;transform:scaleY(.2)}
  45%{opacity:.9;transform:scaleY(1)}
  100%{opacity:.35;transform:scaleY(1)}
}
@media(prefers-reduced-motion:reduce){
  #achievementFullSiteEffect.chain-pulse::before,
  #achievementFullSiteEffect.chain-pulse::after{animation:none}
}

/* ===== ACHIEVEMENT WORLD CELEBRATION ===== */

#achievementCelebration{
  position:fixed;
  inset:0;
  z-index:999998;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  overflow:hidden;
  isolation:isolate;
  transition:opacity 1.05s cubic-bezier(.22,1,.36,1),visibility 0s linear 1.1s;
  --celebration:#ffd45a;
  --celebration2:#ff8b25;
  --celebration-bg:rgba(255,190,50,.28);
  --celebration-glow:rgba(255,190,50,.48);
}
#achievementCelebration.show{
  opacity:1;
  visibility:visible;
  transition:opacity .85s cubic-bezier(.22,1,.36,1),visibility 0s;
}
#achievementCelebration .celebration-bg{
  position:absolute;
  inset:-15%;
  opacity:0;
  transform:scale(1.08);
  background:
    radial-gradient(circle at 50% 44%,rgba(255,255,255,.18),transparent 14%),
    radial-gradient(circle at 50% 50%,var(--celebration-bg),transparent 47%),
    radial-gradient(circle at 20% 15%,var(--celebration-glow),transparent 32%),
    radial-gradient(circle at 82% 78%,var(--celebration-glow),transparent 35%);
  filter:saturate(1.2);
  transition:opacity 1s ease,transform 7s cubic-bezier(.22,1,.36,1);
}
#achievementCelebration.show .celebration-bg{
  opacity:1;
  transform:scale(1);
  animation:celebrationBgBreath 4.6s ease-in-out infinite;
}
#achievementCelebration .celebration-vignette{

#로그인,
#회원가입 {
    position: fixed;
    left: auto;
    right: 28px;

    display: none;

    align-items: center;
    justify-content: center;

    min-width: 112px;
    height: 42px;

    padding: 0 18px;

    border: 1px solid rgba(150, 170, 255, 0.22);
    border-radius: 14px;

    color: #dce3ff;
    background: rgba(19, 27, 67, 0.72);

    font-family: 'HancomMalrangmalrang', sans-serif;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;
}

#로그인 {
    top: 24px;
}

#회원가입 {
    top: 76px;
}

#로그인:hover,
#회원가입:hover {
    transform: translateY(-3px);
    border-color: rgba(150, 170, 255, 0.45);
    background: rgba(48, 62, 135, 0.8);
    box-shadow:
        0 12px 30px rgba(35, 50, 130, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

#로그인:active,
#회원가입:active {
    transform: translateY(-1px) scale(0.97);
}

    /* =====================================================
   돌이 AI 카드
===================================================== */

.돌이AI카드 {
  --ai-purple: #8d8cff;
  --ai-blue: #5c8dff;
  --ai-glow: rgba(141, 140, 255, .28);
}

    /* 돌이 AI 카드 크기 통일 */
.돌이AI카드 {
  width: 100%;
  min-width: 0;
}

/* 다른 카드와 동일한 이미지 비율 */
.돌이AI비주얼 {
  aspect-ratio: 4 / 3;
}

/* AI 전용 비주얼 영역 */
.돌이AI비주얼 {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: 21px;
  border: 1px solid rgba(141, 140, 255, .22);

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(141, 140, 255, .18),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(40, 42, 105, .85),
      rgba(8, 10, 35, .95)
    );

  isolation: isolate;
}

/* 은은하게 움직이는 빛 */
.돌이AI빛 {
  position: absolute;
  width: 180px;
  height: 180px;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);

  border-radius: 50%;
  background: rgba(141, 140, 255, .22);
  filter: blur(35px);

  animation: 돌이AI빛호흡 4s ease-in-out infinite;
  z-index: -1;
}

@keyframes 돌이AI빛호흡 {
  0%, 100% {
    transform: translate(-50%, -50%) scale(.85);
    opacity: .55;
  }

  50% {
    transform: translate(-50%, -50%) scale(1.18);
    opacity: 1;
  }
}

/* 아이콘 */
.돌이AI아이콘 {
  position: absolute;
  left: 50%;
  top: 43%;
  transform: translate(-50%, -50%);

  width: 112px;
  height: 112px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.035)
    );

  border: 1px solid rgba(255,255,255,.2);

  box-shadow:
    0 0 0 10px rgba(141,140,255,.035),
    0 0 0 22px rgba(141,140,255,.02),
    0 18px 50px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.15);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  animation: 돌이AI아이콘호흡 4s ease-in-out infinite;
  z-index: 2;
}

.돌이AI아이콘 span:first-child {
  position: absolute;
  top: 16px;
  right: 18px;

  color: #c8c7ff;
  font-size: 19px;

  animation: 돌이AI별빛 2.5s ease-in-out infinite;
}

.돌이AI아이콘 span:last-child {
  font-size: 48px;
  filter: drop-shadow(0 5px 12px rgba(0,0,0,.2));
}

@keyframes 돌이AI아이콘호흡 {
  0%, 100% {
    transform: translate(-50%, -50%) scale(1);
  }

  50% {
    transform: translate(-50%, -50%) scale(1.045);
  }
}

@keyframes 돌이AI별빛 {
  0%, 100% {
    opacity: .45;
    transform: scale(.85) rotate(-10deg);
  }

  50% {
    opacity: 1;
    transform: scale(1.15) rotate(10deg);
  }
}

/* 아이콘 주변 파동 */
.돌이AI파동 {
  position: absolute;
  left: 50%;
  top: 43%;

  width: 112px;
  height: 112px;

  border: 1px solid rgba(141,140,255,.25);
  border-radius: 50%;

  transform: translate(-50%, -50%);
  animation: 돌이AI파동확장 3.5s ease-out infinite;
  pointer-events: none;
}

@keyframes 돌이AI파동확장 {
  0% {
    width: 112px;
    height: 112px;
    opacity: .7;
  }

  100% {
    width: 230px;
    height: 230px;
    opacity: 0;
  }
}

/* 상태 표시 */
.돌이AI상태 {
  position: absolute;
  left: 50%;
  bottom: 17px;
  transform: translateX(-50%);

  display: flex;
  align-items: center;
  gap: 6px;

  width: max-content;
  max-width: calc(100% - 24px);

  padding: 8px 13px;

  border: 1px solid rgba(255,255,255,.1);
  border-radius: 999px;

  background: rgba(5,6,25,.48);
  color: #bfc5e8;

  font-size: 12px;
  font-weight: 700;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  z-index: 3;
}

.돌이AI점 {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #7dffb2;
  box-shadow: 0 0 10px rgba(125,255,178,.8);
  animation: 돌이AI점깜빡임 2s ease-in-out infinite;
}

.돌이AI상태구분 {
  color: #5d6388;
}

@keyframes 돌이AI점깜빡임 {
  0%, 100% { opacity: .55; }
  50% { opacity: 1; }
}

/* 버튼 */
.돌이AI카드 .메인버튼 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.돌이AI화살표 {
  display: inline-block;
  font-size: 24px;
  color: #aaaaff;

  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    color .3s ease;
}

.돌이AI카드:hover .돌이AI화살표 {
  transform: translateX(6px);
  color: #ffffff;
}

/* 카드에 마우스를 올렸을 때 AI 빛 강화 */
.돌이AI카드:hover .돌이AI빛 {
  animation-duration: 2.2s;
  opacity: 1;
}

.돌이AI카드:hover .돌이AI아이콘 {
  box-shadow:
    0 0 0 10px rgba(141,140,255,.055),
    0 0 0 22px rgba(141,140,255,.035),
    0 20px 65px rgba(80,75,255,.25),
    inset 0 1px 0 rgba(255,255,255,.2);
}

/* 모바일 */
@media (max-width: 650px) {
  .돌이AI비주얼 {
    aspect-ratio: 4 / 3;
  }


  .돌이AI아이콘 {
    width: 94px;
    height: 94px;
  }

  .돌이AI아이콘 span:last-child {
    font-size: 40px;
  }

  .돌이AI파동 {
    width: 94px;
    height: 94px;
  }

  .돌이AI상태 {
    bottom: 12px;
    font-size: 11px;
    padding: 7px 11px;
  }
}

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"

);

// 업적 모듈과 동일한 인증 세션/클라이언트를 공유
window.doriSupabase = supabase;


// =====================================================
// 회원 레벨 이름
// =====================================================

const 회원레벨이름 = {

    1: "일반",

    2: "프리미엄",

    3: "돌프리미엄",

    4: "돌돌프리미엄",

    5: "돌돌돌프리미엄",

    6: "돌돌돌돌프리미엄",

    7: "돌돌돌돌돌프리미엄",

    8: "유사돌이",

    9: "돌이",

    10: "관리자"

};


// =====================================================
// EXP 레벨
// =====================================================

const EXP레벨필요경험치 = {

    1: 0,

    2: 100,

    3: 500,

    4: 1000,

    5: 5000,

    6: 10000,

    7: 20000,

    8: 30000,

    9: 40000,

    10: 50000,

    11: 100000

};


// =====================================================
// DOM
// =====================================================

const 사진 =
    document.getElementById("돌이사진");

const 로그인버튼 =
    document.getElementById("로그인");

const 회원가입버튼 =
    document.getElementById("회원가입");

    // =====================================================
// 로그인 / 로그아웃 상태에 따른 버튼 표시
// =====================================================

function 로그인상태UI(session) {

    const 로그인됨 = Boolean(session);

    if (로그인됨) {

        // 로그인 상태
        if (로그인버튼) {
            로그인버튼.style.display = "none";
        }

        if (회원가입버튼) {
            회원가입버튼.style.display = "none";
        }

        document.body.classList.add("로그인상태");
        document.body.classList.remove("로그아웃상태");

    } else {

        // 로그아웃 상태
        if (로그인버튼) {
            로그인버튼.style.display = "inline-block";
        }

        if (회원가입버튼) {
            회원가입버튼.style.display = "inline-block";
        }

        document.body.classList.add("로그아웃상태");
        document.body.classList.remove("로그인상태");

    }

}

const 로그아웃버튼 =
    document.getElementById("로그아웃");

const 설정버튼 =
    document.getElementById("설정");

const 메뉴 =
    document.getElementById("메뉴");

const 레벨버튼 =
    document.getElementById("레벨");

const EXP정보 =
    document.getElementById("EXP정보");

const 돌돌코인수량 =
    document.getElementById("돌돌코인수량");

const 현재칭호 =
    document.getElementById("현재칭호");

const 업적버튼 =
    document.getElementById("업적버튼");

const 칭호버튼 =
    document.getElementById("칭호버튼");

const 패널 =
    document.getElementById("패널");

const 패널배경 =
    document.getElementById("패널배경");

const 패널제목 =
    document.getElementById("패널제목");

const 패널내용 =
    document.getElementById("패널내용");

const 업적탭 =
    document.getElementById("업적탭");

const 칭호탭 =
    document.getElementById("칭호탭");

const 칭호저장버튼 =
    document.getElementById("칭호저장");


// =====================================================
// 현재 상태
// =====================================================

let 현재사용자 = null;

let 현재유저정보 = null;

let 업적목록 = [];

let 획득업적 = {};

let 선택한칭호 = null;


// =====================================================
// 팝업
// =====================================================

let 팝업타이머 = null;


function 팝업열기(
    내용,
    시간 = 3000
) {

    const popup =
        document.getElementById(
            "achievementPopup"
        );

    if (!popup) {

        return;

    }


    if (팝업타이머) {

        clearTimeout(
            팝업타이머
        );

    }


    popup.innerHTML =
        내용;


    popup.classList.add(
        "show"
    );


    팝업타이머 =
        setTimeout(

            () => {

                popup.classList.remove(
                    "show"
                );

            },

            시간

        );

}


// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(
    exp
) {

    exp =
        Number(exp) || 0;


    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// 업적 데이터 정규화
//
// Supabase 컬럼명이 조금 달라도
// 가능한 범위에서 자동 대응
// =====================================================

function 업적정규화(
    row
) {

    if (!row) {

        return null;

    }


    const id =
        row.id ??
        row.achievement_id ??
        row.code ??
        row.key;


    const 이름 =
        row.name ??
        row.이름 ??
        row.title_name ??
        row.achievement_name ??
        id;


    const 설명 =
        row.description ??
        row.설명 ??
        row.desc ??
        "";


    const 희귀도 =
        row.rarity ??
        row.희귀도 ??
        "Common";


    const 코인 =
        Number(
            row.reward_coins ??
            row.reward_coin ??
            row.doldolcoin ??
            row.보상_돌돌코인 ??
            row.coins ??
            0
        );


    const 경험치 =
        Number(
            row.reward_exp ??
            row.exp_reward ??
            row.experience ??
            row.경험치 ??
            0
        );


    // =================================================
    // 칭호
    // =================================================

    const 칭호 =
        row.title ??
        row.reward_title ??
        row.칭호 ??
        row.title_name ??
        null;


    return {

        ...row,

        id: String(id),

        이름: String(이름),

        설명: String(설명),

        희귀도: String(희귀도),

        보상: {

            돌돌코인: 코인,

            경험치: 경험치

        },

        칭호:
            칭호 === null ||
            칭호 === undefined ||
            String(칭호).trim() === ""

                ? null

                : String(칭호)

    };

}

async function 업적불러오기() {

    const {

        data,

        error

    } = await supabase

        .from("achievements")

        .select("*");


    if (error) {

        console.error(
            "Supabase 업적 조회 오류:",
            error
        );

        팝업열기(
            "⚠️ 업적 정보를 불러오지 못했습니다.",
            4000
        );

        return [];

    }


    return (data || [])

        .map(업적정규화)

        .filter(Boolean);

}


// =====================================================
// user_achievement JSON 처리
// =====================================================

function 획득업적정리(
    value
) {

    if (!value) {

        return {};

    }


    if (
        typeof value ===
        "object"
    ) {

        return value;

    }


    if (
        typeof value ===
        "string"
    ) {

        try {

            const parsed =
                JSON.parse(value);

            if (
                parsed &&
                typeof parsed ===
                "object"
            ) {

                return parsed;

            }

        } catch (error) {

            console.error(
                "user_achievement JSON 오류:",
                error
            );

        }

    }


    return {};

}

function 업적대형연출(achievement) {
    const rarity = String(achievement?.희귀도 || "Common").trim().toLowerCase();
    if (!["legendary","myth","doronum"].includes(rarity)) return;

    let bg = document.getElementById("achievementFullSiteEffect");
    if (!bg) {
        bg = document.createElement("div");
        bg.id = "achievementFullSiteEffect";
        bg.setAttribute("aria-hidden", "true");
        document.body.insertBefore(bg, document.body.firstChild);
    }

    // 연속 달성마다 1→15로 변하는 체인 단계.
    // 기존 타이머를 취소하지 않고 같은 배경 레이어를 재사용하므로
    // 업적이 빠르게 여러 개 해금되어도 이전 효과가 끊기지 않습니다.
    window.__doriAchievementChain = (window.__doriAchievementChain || 0) + 1;
    const chain = ((window.__doriAchievementChain - 1) % 15) + 1;

    clearTimeout(window.__doriAchievementChainResetTimer);
    window.__doriAchievementChainResetTimer = setTimeout(() => {
        window.__doriAchievementChain = 0;
    }, 7600);

    bg.className = `rarity-${rarity} show chain-${chain} chain-pulse`;
    void bg.offsetWidth;
    bg.className = `rarity-${rarity} show chain-${chain} chain-pulse`;
    setTimeout(() => {
        if (bg.classList.contains("show")) bg.classList.remove("chain-pulse");
    }, 1500);

    document.body.classList.remove(
        "achievement-bg-legendary",
        "achievement-bg-myth",
        "achievement-bg-doronum"
    );
    document.body.classList.add(`achievement-bg-${rarity}`);

    let layer = document.getElementById("achievementCelebration");
    if (!layer) {
        layer = document.createElement("div");
        layer.id = "achievementCelebration";
        layer.innerHTML = `
            <div class="celebration-bg"></div>
            <div class="celebration-vignette"></div>
            <div class="celebration-rays"></div>
            <div class="celebration-flash"></div>
            <div class="celebration-core"></div>
            <div class="celebration-ring"></div>
            <div class="celebration-ring"></div>
            <div class="celebration-ring"></div>
            <div class="celebration-particles" aria-hidden="true"></div>
        `;
        document.body.appendChild(layer);
    }

    layer.className = `rarity-${rarity}`;
    const particles = layer.querySelector(".celebration-particles");
    particles.innerHTML = "";

    // 체인이 올라갈수록 파티클/속도/확산 범위를 조금씩 강화합니다.
    const intensity = 1 + Math.min(chain - 1, 14) * 0.035;
    const count = Math.round((rarity === "doronum" ? 72 : rarity === "myth" ? 52 : 38) * intensity);
    const palette = rarity === "doronum"
        ? ["#ffffff","#dfffff","#78f7ff","#4b9cff","#7dffd8"]
        : rarity === "myth"
            ? ["#ffffff","#fff0f3","#ff6278","#ff315c","#b51f4e"]
            : ["#ffffff","#fff9cf","#ffe36a","#ffbd45","#fff4a0"];

    for (let i = 0; i < count; i++) {
        const p = document.createElement("i");
        const angle = Math.round((360 / count) * i + (Math.random() * 14 - 7));
        const baseDistance = rarity === "doronum" ? 300 : rarity === "myth" ? 245 : 220;
        const maxDistance = rarity === "doronum" ? 520 : 390;
        const distance = Math.round((baseDistance + Math.random() * maxDistance) * intensity);
        const size = (2 + Math.random() * (rarity === "doronum" ? 6 : 4.5) + chain * .08).toFixed(1) + "px";
        const delay = (Math.random() * .30).toFixed(2) + "s";
        const duration = (2.9 + Math.random() * (rarity === "doronum" ? 2.5 : 1.8)).toFixed(2) + "s";
        const spin = (Math.random() > .5 ? 1 : -1) * (120 + Math.random() * 420);

        p.className = "celebration-particle";
        p.style.setProperty("--angle", angle + "deg");
        p.style.setProperty("--distance", distance + "px");
        p.style.setProperty("--size", size);
        p.style.setProperty("--delay", delay);
        p.style.setProperty("--duration", duration);
        p.style.setProperty("--spin", spin + "deg");
        p.style.setProperty("--particle", palette[i % palette.length]);
        if (rarity === "doronum" && i % 6 === 0) {
            p.style.borderRadius = "1px";
            p.style.transform += " rotate(45deg)";
        }
        particles.appendChild(p);
    }

    layer.classList.add("show");

    clearTimeout(window.__doriAchievementCelebrationTimer);
    clearTimeout(window.__doriAchievementBackgroundTimer);

    const popupDuration = 6500;
    window.__doriAchievementCelebrationTimer = setTimeout(() => {
        layer.classList.remove("show");
        window.__doriAchievementBackgroundTimer = setTimeout(() => {
            bg.classList.remove("show");
            document.body.classList.remove(
                "achievement-bg-legendary",
                "achievement-bg-myth",
                "achievement-bg-doronum"
            );
            if (!layer.classList.contains("show")) layer.className = "";
            setTimeout(() => {
                if (!bg.classList.contains("show")) bg.className = "";
            }, 1100);
        }, 850);
    }, popupDuration);
}

async function 업적획득(achievement) {
    if (!현재사용자 || !achievement) return false;

    // 업적의 실제 지급/팝업/대형 연출은 공통 모듈 하나에서만 처리합니다.
    // 두 시스템이 동시에 RPC를 호출해 중복 연출이 생기던 문제를 방지합니다.
    if (typeof window.doriClaimAchievement === "function") {
        const data = await window.doriClaimAchievement(achievement.id);

        if (data?.success && !data?.already_claimed) {
            획득업적[achievement.id] = {
                id: achievement.id,
                이름: achievement.이름,
                설명: achievement.설명,
                희귀도: achievement.희귀도,
                보상: {
                    돌돌코인: Number(data.reward_doldolcoin || 0),
                    경험치: Number(data.reward_exp || 0)
                },
                칭호: achievement.칭호,
                아이콘: achievement.icon || "🏆",
                획득시간: new Date().toISOString()
            };
            await 유저정보불러오기();
            화면업데이트();
            return true;
        }

        if (data?.already_claimed) {
            await 유저정보불러오기();
        }
        return false;
    }

    console.warn("공통 업적 모듈이 아직 준비되지 않았습니다.");
    return false;
}

async function 유저정보불러오기() {

    if (!현재사용자) {

        return null;

    }


    const {

        data,

        error

    } = await supabase

        .from("users")

        .select("*")

        .eq(
            "user_id",
            현재사용자.id
        )

        .single();


    if (error) {

        console.error(
            "유저 정보 조회 오류:",
            error
        );

        return null;

    }


    현재유저정보 =
        data;


    획득업적 =
        획득업적정리(
            data.user_achievement
        );


    return data;

}


// =====================================================
// 화면 업데이트
// =====================================================

function 화면업데이트() {

    if (
        !현재유저정보
    ) {

        return;

    }


    // 프로필
    if (
        사진 &&
        현재유저정보.profile_image
    ) {

        사진.src =
            현재유저정보.profile_image;

    }


    // 회원 레벨
    const 회원레벨 =
        Number(
            현재유저정보.user_level ?? 1
        );


    if (레벨버튼) {

        레벨버튼.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;

    }


    // EXP
    const exp =
        Number(
            현재유저정보.exp ?? 0
        );


    const expLevel =
        Number(
            현재유저정보.exp_level
            ??
            경험치로레벨계산(exp)
        );


    if (EXP정보) {

        EXP정보.textContent =
            `EXP Lv.${expLevel} · ${exp.toLocaleString()} EXP`;

    }


    // 코인
    if (돌돌코인수량) {

        const coin =
            Number(
                현재유저정보.doldolcoin ?? 0
            );


        돌돌코인수량.textContent =
            `돌돌코인: ${coin.toLocaleString()}`;

    }


    // =================================================
    // 현재 칭호
    // =================================================

    const 장착칭호 =
        현재유저정보.equipped_title;


    if (현재칭호) {

        if (
            장착칭호 &&
            String(장착칭호).trim()
        ) {

            현재칭호.textContent =
                `🏷️ ${장착칭호}`;

        } else {

            현재칭호.textContent =
                "🏷️ 칭호 없음";

        }

    }

}


// =====================================================
// 프로필 메뉴 열기
// =====================================================

function 프로필메뉴열기() {
    const 열림 = 메뉴.classList.contains("menu-show");

    if (열림) {
        메뉴.classList.remove("menu-show");
        메뉴.classList.add("menu-hide");

        [레벨버튼, EXP정보, 돌돌코인수량, 현재칭호].forEach(el => {
            if (el) el.style.display = "none";
        });

        window.setTimeout(() => {
            메뉴.classList.remove("menu-hide");
        }, 260);
        return;
    }

    메뉴.classList.remove("menu-hide");
    메뉴.classList.add("menu-show");

    [레벨버튼, EXP정보, 돌돌코인수량, 현재칭호].forEach(el => {
        if (el) el.style.display = "block";
    });
}

// =====================================================
// 보유 칭호 가져오기
// =====================================================

function 보유칭호목록() {

    const 결과 = [];

    const 중복방지 = new Set();


    for (
        const achievement
        of 업적목록
    ) {

        if (
            !achievement.칭호
        ) {

            continue;

        }


        if (
            !업적획득여부(
                achievement.id
            )
        ) {

            continue;

        }


        const title =
            achievement.칭호;


        if (
            중복방지.has(title)
        ) {

            continue;

        }


        중복방지.add(
            title
        );


        결과.push({

            title: title,

            achievement:
                achievement

        });

    }


    return 결과;

}

// =====================================================
// HTML escape
// =====================================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

  ];
  portals.forEach((p,index)=>{

    const frame=old.closest(".이미지틀");

        '<div class="포털미니텍스트">'+p.label+'</div>'+

      '</div>';
    frame.id=p.id;
    frame.onclick=()=>article.querySelector(".메인버튼")?.click();
    frame.setAttribute("role","button");
    frame.setAttribute("tabindex","0");
    frame.setAttribute("aria-label",article.querySelector(".메인버튼")?.textContent.trim()||p.status);
    frame.addEventListener("keydown",event=>{
