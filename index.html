    1: 0,
    2: 100,
    3: 300,
    4: 600,
    5: 1000,
    6: 1500,
    7: 2100,
    8: 2800,
    9: 3600,

// EXP를 기준으로 현재 레벨 계산
function 경험치로레벨계산(exp){

    let level = 1;

    for(let i = 10; i >= 1; i--){

        if(exp >= 레벨필요경험치[i]){
            level = i;
            break;
        }

    }

    return level;
}


// 경험치 지급
async function 경험치획득(amount){

    if(!amount || amount <= 0) return;

    const {
        data:{user}
    } = await supabase.auth.getUser();

    if(!user) return;


    // 현재 EXP와 레벨 가져오기
    const {data,error} = await supabase
        .from("users")
        .select("exp,user_level")
        .eq("user_id",user.id)
        .single();


    if(error){

        console.error("경험치 조회 오류:",error);

        return;

    }


    const 현재경험치 = data.exp ?? 0;

    const 기존레벨 = data.user_level ?? 1;

    const 새로운경험치 =
        현재경험치 + amount;


    const 새로운레벨 =
        경험치로레벨계산(새로운경험치);


    // DB 저장
    const {error:updateError} = await supabase
        .from("users")
        .update({

            exp:새로운경험치,

            user_level:새로운레벨

        })
        .eq("user_id",user.id);


    if(updateError){

        console.error("경험치 저장 오류:",updateError);

        return;

    }


    console.log(
        `EXP +${amount} (${현재경험치} → ${새로운경험치})`
    );


    // 레벨업
    if(새로운레벨 > 기존레벨){

        레벨업알림(
            기존레벨,
            새로운레벨
        );

    }

}

        ${레벨이름[새로운레벨] || "일반"}
        </b>

    `;


    popup.classList.add("show");


    setTimeout(()=>{

        popup.classList.remove("show");

    },4000);

}

        return;
    }

    data.user_achievement || {};

    // 이미 얻었는지 확인
    if(achievements[업적정보.id]) return;

    achievements[업적정보.id]={

        이름:업적정보.이름,

        설명:업적정보.설명,

        희귀도:업적정보.희귀도,

        보상:업적정보.보상,

        획득시간:new Date().toISOString()

    };

await supabase
.from("users")
.update({

    user_achievement:achievements,

    doldolcoin:
    (data.doldolcoin||0)
    +업적정보.보상.돌돌코인

})
.eq("user_id",user.id);


// 업적 EXP 지급
await 경험치획득(
    업적정보.보상.경험치
);
