<script type="module">

import {
    createClient
}
from
"https://esm.sh/@supabase/supabase-js@2";


// =====================================================
// Supabase
// =====================================================

const supabase =
    createClient(

        "https://scttowfhygcpdirrekqm.supabase.co",

        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"
    );


// =====================================================
// 상태
// =====================================================

let 초기화완료 = false;

let 현재사용자 = null;

let 현재유저정보 = null;


// =====================================================
// 회원 레벨 이름
// =====================================================

const 회원레벨이름 = {

    1: "일반",

    2: "프리미엄",

    3: "돌프리미엄",

    4: "돌돌프리미엄",

    5: "돌돌돌프리미엄",

    6: "돌돌돌돌프리미엄",

    7: "돌돌돌돌돌프리미엄",

    8: "유사돌이",

    9: "돌이",

    10: "관리자"

};


// =====================================================
// EXP 레벨 필요 경험치
// =====================================================

const EXP레벨필요경험치 = {

    1: 0,

    2: 100,

    3: 500,

    4: 1000,

    5: 5000,

    6: 10000,

    7: 20000,

    8: 30000,

    9: 40000,

    10: 50000,

    11: 100000

};


// =====================================================
// EXP → 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    const 숫자 =
        Number(exp) || 0;

    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            숫자 >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// DOM 준비
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    초기화
);


// =====================================================
// 초기화
// =====================================================

async function 초기화() {

    if (초기화완료) {

        return;

    }


    초기화완료 = true;


    console.log(
        "🐶 돌이사이트 초기화 시작"
    );


    이벤트설정();


    await 로그인상태처리();


    console.log(
        "🐶 돌이사이트 초기화 완료"
    );

}


// =====================================================
// DOM 가져오기
// =====================================================

function el(id) {

    return document.getElementById(id);

}


// =====================================================
// 이벤트 설정
// =====================================================

function 이벤트설정() {


    /* --------------------------------------------------
       돌이신문
    -------------------------------------------------- */

    const 신문버튼 =
        document.querySelector(
            '[data-page="news"]'
        );


    if (신문버튼) {

        신문버튼.onclick =
            () => {

                location.href =
                    "rockeynews.html";

            };

    }


    const 신문이미지 =
        el("돌이신문확인");


    if (신문이미지) {

        신문이미지.onclick =
            () => {

                location.href =
                    "rockeynews.html";

            };

    }


    /* --------------------------------------------------
       돌돌코인 상점
    -------------------------------------------------- */

    const 상점버튼 =
        el("돌돌코인상점");


    const 상점이미지 =
        el("돌돌코인상점!!!");


    function 상점이동() {

        location.href =
            "doldolcoinmart.html";

    }


    if (상점버튼) {

        상점버튼.onclick =
            상점이동;

    }


    if (상점이미지) {

        상점이미지.onclick =
            상점이동;

    }


    /* --------------------------------------------------
       돌이 관련 정보
    -------------------------------------------------- */

    const 정보버튼 =
        el("돌이와 관련된 정보");


    const 정보이미지 =
        el("돌이와관련된정보!");


    function 정보이동() {

        location.href =
            "knowledgeofrockey.html";

    }


    if (정보버튼) {

        정보버튼.onclick =
            정보이동;

    }


    if (정보이미지) {

        정보이미지.onclick =
            정보이동;

    }


    /* --------------------------------------------------
       게임
    -------------------------------------------------- */

    const 게임버튼 =
        el("돌이게임");


    const 게임이미지 =
        el("돌이게임사진");


    function 게임이동() {

        location.href =
            "gamepage.html";

    }


    if (게임버튼) {

        게임버튼.onclick =
            게임이동;

    }


    if (게임이미지) {

        게임이미지.onclick =
            게임이동;

    }


    /* --------------------------------------------------
       로그인
    -------------------------------------------------- */

    const 로그인 =
        el("로그인");


    if (로그인) {

        로그인.onclick =
            () => {

                location.href =
                    "login.html";

            };

    }


    /* --------------------------------------------------
       회원가입
    -------------------------------------------------- */

    const 회원가입 =
        el("회원가입");


    if (회원가입) {

        회원가입.onclick =
            () => {

                location.href =
                    "signin.html";

            };

    }


    /* --------------------------------------------------
       설정
    -------------------------------------------------- */

    const 설정 =
        el("설정");


    if (설정) {

        설정.onclick =
            () => {

                location.href =
                    "settings.html";

            };

    }


    /* --------------------------------------------------
       프로필 사진
    -------------------------------------------------- */

    const 사진 =
        el("돌이사진");


    if (사진) {

        사진.onclick =
            프로필메뉴토글;

    }


    /* --------------------------------------------------
       프로필 메뉴의 돌돌코인 상점
    -------------------------------------------------- */

    const 프로필상점 =
        el("돌돌코인");


    if (프로필상점) {

        프로필상점.onclick =
            () => {

                location.href =
                    "doldolcoinmart.html";

            };

    }


    /* --------------------------------------------------
       로그아웃
    -------------------------------------------------- */

    const 로그아웃 =
        el("로그아웃");


    if (로그아웃) {

        로그아웃.onclick =
            로그아웃처리;

    }


    /* --------------------------------------------------
       바깥쪽 클릭 → 프로필 메뉴 닫기
    -------------------------------------------------- */

    document.addEventListener(
        "click",
        (event) => {

            const 메뉴 =
                el("프로필메뉴");

            const 사진 =
                el("돌이사진");


            if (!메뉴 || !사진) {

                return;

            }


            if (
                !메뉴.contains(event.target) &&
                event.target !== 사진
            ) {

                메뉴.classList.remove(
                    "show"
                );

            }

        }
    );

}


// =====================================================
// 로그인 상태 처리
// =====================================================

async function 로그인상태처리() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            console.error(
                "세션 확인 오류:",
                error
            );


            비로그인화면();

            return;

        }


        if (!data.session) {

            비로그인화면();

            return;

        }


        현재사용자 =
            data.session.user;


        await 로그인화면();

    }

    catch (error) {

        console.error(
            "로그인 처리 오류:",
            error
        );


        비로그인화면();

    }

}


// =====================================================
// 비로그인 화면
// =====================================================

function 비로그인화면() {

    const 로그인 =
        el("로그인");


    const 회원가입 =
        el("회원가입");


    const 사진 =
        el("돌이사진");


    const 레벨 =
        el("레벨");


    const 코인 =
        el("돌돌코인수량");


    const EXP =
        el("EXP정보");


    const 칭호 =
        el("현재칭호");


    if (로그인) {

        로그인.style.display =
            "block";

    }


    if (회원가입) {

        회원가입.style.display =
            "block";

    }


    if (사진) {

        사진.style.display =
            "none";

    }


    if (레벨) {

        레벨.style.display =
            "none";

    }


    if (코인) {

        코인.style.display =
            "none";

    }


    if (EXP) {

        EXP.style.display =
            "none";

    }


    if (칭호) {

        칭호.style.display =
            "none";

    }

}


// =====================================================
// 로그인 화면
// =====================================================

async function 로그인화면() {

    const 로그인 =
        el("로그인");


    const 회원가입 =
        el("회원가입");


    const 사진 =
        el("돌이사진");


    if (로그인) {

        로그인.style.display =
            "none";

    }


    if (회원가입) {

        회원가입.style.display =
            "none";

    }


    if (사진) {

        사진.style.display =
            "block";

    }


    await 사용자정보불러오기();

}


// =====================================================
// 사용자 정보 불러오기
// =====================================================

async function 사용자정보불러오기() {

    if (!현재사용자) {

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabase

                .from("users")

                .select(`
                    user_id,
                    user_number,
                    user_level,
                    doldolcoin,
                    exp,
                    exp_level,
                    profile_image,
                    equipped_title
                `)

                .eq(
                    "user_id",
                    현재사용자.id
                )

                .maybeSingle();


        if (error) {

            console.error(
                "users 조회 오류:",
                error
            );

            return;

        }


        if (!data) {

            console.warn(
                "users에 현재 사용자가 없습니다."
            );

            return;

        }


        현재유저정보 =
            data;


        사용자정보표시();

    }

    catch (error) {

        console.error(
            "사용자 정보 처리 오류:",
            error
        );

    }

}


// =====================================================
// 사용자 정보 표시
// =====================================================

function 사용자정보표시() {

    if (!현재유저정보) {

        return;

    }


    /* --------------------------------------------------
       프로필 사진
    -------------------------------------------------- */

    const 사진 =
        el("돌이사진");


    if (
        사진 &&
        현재유저정보.profile_image
    ) {

        사진.src =
            현재유저정보.profile_image;

    }


    /* --------------------------------------------------
       회원등급
    -------------------------------------------------- */

    const 레벨 =
        el("레벨");


    if (레벨) {

        const 회원레벨 =
            Number(
                현재유저정보.user_level
            ) || 1;


        레벨.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;


        레벨.style.display =
            "block";

    }


    /* --------------------------------------------------
       돌돌코인
    -------------------------------------------------- */

    const 코인 =
        el("돌돌코인수량");


    if (코인) {

        코인.textContent =
            `돌돌코인: ${
                Number(
                    현재유저정보.doldolcoin
                ) || 0
            }`;


        코인.style.display =
            "block";

    }


    /* --------------------------------------------------
       EXP
    -------------------------------------------------- */

    const EXP =
        el("EXP정보");


    if (EXP) {

        const exp =
            Number(
                현재유저정보.exp
            ) || 0;


        const level =
            Number(
                현재유저정보.exp_level
            )
            ||
            경험치로레벨계산(exp);


        EXP.textContent =
            `EXP Lv.${level} · ${exp} EXP`;


        EXP.style.display =
            "block";

    }


    /* --------------------------------------------------
       현재 칭호
       
       상세 칭호 관리 기능은 settings.html에서 담당.
       메인에서는 현재 장착된 칭호만 표시.
    -------------------------------------------------- */

    const 칭호 =
        el("현재칭호");


    if (칭호) {

        칭호.textContent =
            현재유저정보.equipped_title
            ||
            "칭호 없음";


        칭호.style.display =
            "block";

    }

}


// =====================================================
// 프로필 메뉴
// =====================================================

function 프로필메뉴토글() {

    const 메뉴 =
        el("프로필메뉴");


    if (!메뉴) {

        return;

    }


    메뉴.classList.toggle(
        "show"
    );

}


// =====================================================
// 로그아웃
// =====================================================

async function 로그아웃처리() {

    try {

        const {
            error
        } =
            await supabase.auth.signOut();


        if (error) {

            console.error(
                "로그아웃 오류:",
                error
            );


            alert(
                "로그아웃에 실패했습니다."
            );


            return;

        }


        현재사용자 =
            null;


        현재유저정보 =
            null;


        /*
           페이지 전체 새로고침을 하지 않고
           로그인 화면으로 이동.
        */

        location.href =
            "index.html";

    }

    catch (error) {

        console.error(
            "로그아웃 예외:",
            error
        );

    }

}


// =====================================================
// 콘솔
// =====================================================

console.log(
    "🐶 돌이사이트 메인 스크립트 준비 완료"
);

</script>
