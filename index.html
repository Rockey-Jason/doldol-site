<script type="module">

import {
    createClient
}
from
"https://esm.sh/@supabase/supabase-js@2";


// =====================================================
// Supabase
// =====================================================

const supabase = createClient(

    "https://scttowfhygcpdirrekqm.supabase.co",

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"

);


// =====================================================
// 회원 레벨 이름
// =====================================================

const 회원레벨이름 = {

    1: "일반",

    2: "프리미엄",

    3: "돌프리미엄",

    4: "돌돌프리미엄",

    5: "돌돌돌프리미엄",

    6: "돌돌돌돌프리미엄",

    7: "돌돌돌돌돌프리미엄",

    8: "유사돌이",

    9: "돌이",

    10: "관리자"

};


// =====================================================
// EXP 레벨
// =====================================================

const EXP레벨필요경험치 = {

    1: 0,

    2: 100,

    3: 500,

    4: 1000,

    5: 5000,

    6: 10000,

    7: 20000,

    8: 30000,

    9: 40000,

    10: 50000,

    11: 100000

};


// =====================================================
// DOM
// =====================================================

const 사진 =
    document.getElementById("돌이사진");

const 로그인버튼 =
    document.getElementById("로그인");

const 회원가입버튼 =
    document.getElementById("회원가입");

const 로그아웃버튼 =
    document.getElementById("로그아웃");

const 설정버튼 =
    document.getElementById("설정");

const 메뉴 =
    document.getElementById("메뉴");

const 레벨버튼 =
    document.getElementById("레벨");

const EXP정보 =
    document.getElementById("EXP정보");

const 돌돌코인수량 =
    document.getElementById("돌돌코인수량");

const 현재칭호 =
    document.getElementById("현재칭호");

const 업적버튼 =
    document.getElementById("업적버튼");

const 칭호버튼 =
    document.getElementById("칭호버튼");

const 패널 =
    document.getElementById("패널");

const 패널배경 =
    document.getElementById("패널배경");

const 패널제목 =
    document.getElementById("패널제목");

const 패널내용 =
    document.getElementById("패널내용");

const 업적탭 =
    document.getElementById("업적탭");

const 칭호탭 =
    document.getElementById("칭호탭");

const 칭호저장버튼 =
    document.getElementById("칭호저장");


// =====================================================
// 현재 상태
// =====================================================

let 현재사용자 = null;

let 현재유저정보 = null;

let 업적목록 = [];

let 획득업적 = {};

let 선택한칭호 = null;


// =====================================================
// 팝업
// =====================================================

let 팝업타이머 = null;


function 팝업열기(
    내용,
    시간 = 3000
) {

    const popup =
        document.getElementById(
            "achievementPopup"
        );

    if (!popup) {

        return;

    }


    if (팝업타이머) {

        clearTimeout(
            팝업타이머
        );

    }


    popup.innerHTML =
        내용;


    popup.classList.add(
        "show"
    );


    팝업타이머 =
        setTimeout(

            () => {

                popup.classList.remove(
                    "show"
                );

            },

            시간

        );

}


// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(
    exp
) {

    exp =
        Number(exp) || 0;


    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// 업적 데이터 정규화
//
// Supabase 컬럼명이 조금 달라도
// 가능한 범위에서 자동 대응
// =====================================================

function 업적정규화(
    row
) {

    if (!row) {

        return null;

    }


    const id =
        row.id ??
        row.achievement_id ??
        row.code ??
        row.key;


    const 이름 =
        row.name ??
        row.이름 ??
        row.title_name ??
        row.achievement_name ??
        id;


    const 설명 =
        row.description ??
        row.설명 ??
        row.desc ??
        "";


    const 희귀도 =
        row.rarity ??
        row.희귀도 ??
        "Common";


    const 코인 =
        Number(
            row.reward_coins ??
            row.reward_coin ??
            row.doldolcoin ??
            row.보상_돌돌코인 ??
            row.coins ??
            0
        );


    const 경험치 =
        Number(
            row.reward_exp ??
            row.exp_reward ??
            row.experience ??
            row.경험치 ??
            0
        );


    // =================================================
    // 칭호
    // =================================================

    const 칭호 =
        row.title ??
        row.reward_title ??
        row.칭호 ??
        row.title_name ??
        null;


    return {

        ...row,

        id: String(id),

        이름: String(이름),

        설명: String(설명),

        희귀도: String(희귀도),

        보상: {

            돌돌코인: 코인,

            경험치: 경험치

        },

        칭호:
            칭호 === null ||
            칭호 === undefined ||
            String(칭호).trim() === ""

                ? null

                : String(칭호)

    };

}


// =====================================================
// Supabase 업적 불러오기
// =====================================================

async function 업적불러오기() {

    const {

        data,

        error

    } = await supabase

        .from("achievements")

        .select("*");


    if (error) {

        console.error(
            "Supabase 업적 조회 오류:",
            error
        );

        팝업열기(
            "⚠️ 업적 정보를 불러오지 못했습니다.",
            4000
        );

        return [];

    }


    return (data || [])

        .map(업적정규화)

        .filter(Boolean);

}


// =====================================================
// user_achievement JSON 처리
// =====================================================

function 획득업적정리(
    value
) {

    if (!value) {

        return {};

    }


    if (
        typeof value ===
        "object"
    ) {

        return value;

    }


    if (
        typeof value ===
        "string"
    ) {

        try {

            const parsed =
                JSON.parse(value);

            if (
                parsed &&
                typeof parsed ===
                "object"
            ) {

                return parsed;

            }

        } catch (error) {

            console.error(
                "user_achievement JSON 오류:",
                error
            );

        }

    }


    return {};

}


// =====================================================
// 업적 ID가 획득되었는지
// =====================================================

function 업적획득여부(
    id
) {

    return Boolean(
        획득업적[id]
    );

}


// =====================================================
// 업적 하나 획득
// =====================================================

async function 업적획득(
    achievement
) {

    if (
        !현재사용자 ||
        !achievement
    ) {

        return false;

    }


    const id =
        achievement.id;


    if (
        업적획득여부(id)
    ) {

        return false;

    }


    // 최신 users 정보
    const {

        data,
        error

    } = await supabase

        .from("users")

        .select("*")

        .eq(
            "user_id",
            현재사용자.id
        )

        .single();


    if (error) {

        console.error(
            "업적 지급 사용자 조회 오류:",
            error
        );

        return false;

    }


    const 기존업적 =
        획득업적정리(
            data.user_achievement
        );


    if (
        기존업적[id]
    ) {

        획득업적 =
            기존업적;

        return false;

    }


    // =================================================
    // 업적 저장
    // =================================================

    기존업적[id] = {

        id: id,

        이름:
            achievement.이름,

        설명:
            achievement.설명,

        희귀도:
            achievement.희귀도,

        보상:
            achievement.보상,

        칭호:
            achievement.칭호,

        획득시간:
            new Date().toISOString()

    };


    const 기존코인 =
        Number(
            data.doldolcoin ?? 0
        );


    const 기존EXP =
        Number(
            data.exp ?? 0
        );


    const 보상코인 =
        Number(
            achievement.보상.돌돌코인 ?? 0
        );


    const 보상EXP =
        Number(
            achievement.보상.경험치 ?? 0
        );


    const 새로운코인 =
        기존코인 +
        보상코인;


    const 새로운EXP =
        기존EXP +
        보상EXP;


    const 기존EXP레벨 =
        Number(
            data.exp_level ?? 1
        );


    const 새로운EXP레벨 =
        경험치로레벨계산(
            새로운EXP
        );


    // =================================================
    // 저장
    // =================================================

    const 업데이트 = {

        user_achievement:
            기존업적,

        doldolcoin:
            새로운코인,

        exp:
            새로운EXP,

        exp_level:
            새로운EXP레벨

    };


    const {

        error: updateError

    } = await supabase

        .from("users")

        .update(
            업데이트
        )

        .eq(
            "user_id",
            현재사용자.id
        );


    if (updateError) {

        console.error(
            "업적 저장 오류:",
            updateError
        );

        return false;

    }


    // =================================================
    // 메모리 업데이트
    // =================================================

    획득업적 =
        기존업적;


    현재유저정보.doldolcoin =
        새로운코인;

    현재유저정보.exp =
        새로운EXP;

    현재유저정보.exp_level =
        새로운EXP레벨;


    // =================================================
    // 알림
    // =================================================

    팝업열기(`

        🏆 <b>업적 달성!</b>

        <br><br>

        <b>${achievement.이름}</b>

        <br>

        ${achievement.설명}

        <br><br>

        ⭐ ${achievement.희귀도}

        <br>

        💰 +${보상코인.toLocaleString()}
        돌돌코인

        <br>

        ✨ +${보상EXP.toLocaleString()}
        EXP

        ${
            achievement.칭호
                ? `<br><br>🏷️ 칭호 획득: <b>${achievement.칭호}</b>`
                : ""
        }

    `, 5000);


    // =================================================
    // 레벨업
    // =================================================

    if (
        새로운EXP레벨 >
        기존EXP레벨
    ) {

        setTimeout(

            () => {

                팝업열기(`

                    ✨ <b>EXP 레벨 업!</b>

                    <br><br>

                    Lv.${기존EXP레벨}

                    →

                    Lv.${새로운EXP레벨}

                `, 4000);

            },

            1500

        );

    }


    화면업데이트();

    return true;

}


// =====================================================
// users 최신 정보
// =====================================================

async function 유저정보불러오기() {

    if (!현재사용자) {

        return null;

    }


    const {

        data,

        error

    } = await supabase

        .from("users")

        .select("*")

        .eq(
            "user_id",
            현재사용자.id
        )

        .single();


    if (error) {

        console.error(
            "유저 정보 조회 오류:",
            error
        );

        return null;

    }


    현재유저정보 =
        data;


    획득업적 =
        획득업적정리(
            data.user_achievement
        );


    return data;

}


// =====================================================
// 화면 업데이트
// =====================================================

function 화면업데이트() {

    if (
        !현재유저정보
    ) {

        return;

    }


    // 프로필
    if (
        사진 &&
        현재유저정보.profile_image
    ) {

        사진.src =
            현재유저정보.profile_image;

    }


    // 회원 레벨
    const 회원레벨 =
        Number(
            현재유저정보.user_level ?? 1
        );


    if (레벨버튼) {

        레벨버튼.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;

    }


    // EXP
    const exp =
        Number(
            현재유저정보.exp ?? 0
        );


    const expLevel =
        Number(
            현재유저정보.exp_level
            ??
            경험치로레벨계산(exp)
        );


    if (EXP정보) {

        EXP정보.textContent =
            `EXP Lv.${expLevel} · ${exp.toLocaleString()} EXP`;

    }


    // 코인
    if (돌돌코인수량) {

        const coin =
            Number(
                현재유저정보.doldolcoin ?? 0
            );


        돌돌코인수량.textContent =
            `돌돌코인: ${coin.toLocaleString()}`;

    }


    // =================================================
    // 현재 칭호
    // =================================================

    const 장착칭호 =
        현재유저정보.equipped_title;


    if (현재칭호) {

        if (
            장착칭호 &&
            String(장착칭호).trim()
        ) {

            현재칭호.textContent =
                `🏷️ ${장착칭호}`;

        } else {

            현재칭호.textContent =
                "🏷️ 칭호 없음";

        }

    }

}


// =====================================================
// 프로필 메뉴 열기
// =====================================================

function 프로필메뉴열기() {

    const 표시 =
        메뉴.style.display !== "block";


    메뉴.style.display =
        표시
            ? "block"
            : "none";


    레벨버튼.style.display =
        표시
            ? "block"
            : "none";


    EXP정보.style.display =
        표시
            ? "block"
            : "none";


    돌돌코인수량.style.display =
        표시
            ? "block"
            : "none";


    현재칭호.style.display =
        표시
            ? "block"
            : "none";

}


// =====================================================
// 패널 열기
// =====================================================

function 패널열기(
    mode
) {

    패널.classList.add(
        "show"
    );

    패널배경.classList.add(
        "show"
    );


    if (
        mode === "titles"
    ) {

        칭호탭.click();

    } else {

        업적탭.click();

    }

}


// =====================================================
// 패널 닫기
// =====================================================

function 패널닫기() {

    패널.classList.remove(
        "show"
    );

    패널배경.classList.remove(
        "show"
    );

}


// =====================================================
// 업적 화면
// =====================================================

function 업적화면표시() {

    패널제목.textContent =
        "🏆 업적";


    업적탭.classList.add(
        "active"
    );

    칭호탭.classList.remove(
        "active"
    );


    if (
        업적목록.length === 0
    ) {

        패널내용.innerHTML = `

            <div style="
                text-align:center;
                padding:40px;
                color:#aaa;
            ">

                업적이 없습니다.

            </div>

        `;

        return;

    }


    const 획득수 =
        업적목록.filter(
            a => 업적획득여부(a.id)
        ).length;


    let html = `

        <div style="
            margin-bottom:20px;
            color:#aaa;
        ">

            ${획득수} / ${업적목록.length}
            업적 획득

        </div>

    `;


    for (
        const achievement
        of 업적목록
    ) {

        const 획득 =
            업적획득여부(
                achievement.id
            );


        html += `

            <div class="
                업적카드
                ${획득 ? "" : "미획득"}
            ">

                <div class="업적이름">

                    ${
                        획득
                            ? "🏆"
                            : "🔒"
                    }

                    ${achievement.이름}

                </div>


                <div class="업적설명">

                    ${achievement.설명}

                </div>


                <div class="업적정보">

                    ⭐ ${achievement.희귀도}

                    <br>

                    💰
                    ${Number(
                        achievement.보상.돌돌코인
                    ).toLocaleString()}
                    돌돌코인

                    <br>

                    ✨
                    ${Number(
                        achievement.보상.경험치
                    ).toLocaleString()}
                    EXP

                    ${
                        achievement.칭호
                            ? `
                                <br>

                                <span class="칭호태그">

                                    🏷️
                                    ${achievement.칭호}

                                </span>
                            `
                            : ""
                    }

                </div>

            </div>

        `;

    }


    패널내용.innerHTML =
        html;

}


// =====================================================
// 보유 칭호 가져오기
// =====================================================

function 보유칭호목록() {

    const 결과 = [];

    const 중복방지 = new Set();


    for (
        const achievement
        of 업적목록
    ) {

        if (
            !achievement.칭호
        ) {

            continue;

        }


        if (
            !업적획득여부(
                achievement.id
            )
        ) {

            continue;

        }


        const title =
            achievement.칭호;


        if (
            중복방지.has(title)
        ) {

            continue;

        }


        중복방지.add(
            title
        );


        결과.push({

            title: title,

            achievement:
                achievement

        });

    }


    return 결과;

}


// =====================================================
// 칭호 화면
// =====================================================

function 칭호화면표시() {

    패널제목.textContent =
        "🏷️ 칭호";


    칭호탭.classList.add(
        "active"
    );

    업적탭.classList.remove(
        "active"
    );


    const 칭호목록 =
        보유칭호목록();


    선택한칭호 =
        현재유저정보
            ?.equipped_title
            ?? null;


    if (
        칭호목록.length === 0
    ) {

        패널내용.innerHTML = `

            <div style="
                text-align:center;
                padding:50px 20px;
                color:#aaa;
            ">

                <div style="
                    font-size:50px;
                ">
                    🏷️
                </div>

                <br>

                아직 획득한 칭호가 없습니다.

                <br><br>

                칭호가 있는 업적을 획득하면
                이곳에서 장착할 수 있습니다.

            </div>

        `;

        return;

    }


    let html = `

        <div style="
            margin-bottom:20px;
            color:#aaa;
        ">

            획득한 칭호
            ${칭호목록.length}개

        </div>

    `;


    for (
        const item
        of 칭호목록
    ) {

        const 장착중 =
            선택한칭호 ===
            item.title;


        html += `

            <div class="칭호카드">

                <div class="칭호이름">

                    🏷️ ${item.title}

                </div>


                <div class="칭호상태">

                    업적:
                    ${item.achievement.이름}

                </div>


                <button

                    class="
                        칭호선택
                        ${장착중 ? "장착중" : ""}
                    "

                    data-title="${escapeHTML(
                        item.title
                    )}"

                >

                    ${
                        장착중
                            ? "✓ 현재 장착 중"
                            : "이 칭호 장착하기"
                    }

                </button>

            </div>

        `;

    }


    html += `

        <button
            id="칭호저장"
        >

            💾 칭호 저장

        </button>

    `;


    패널내용.innerHTML =
        html;


    // =================================================
    // 선택 버튼
    // =================================================

    document
        .querySelectorAll(".칭호선택")
        .forEach(

            button => {

                button.onclick =
                    () => {

                        선택한칭호 =
                            button.dataset.title;


                        칭호화면표시();

                    };

            }

        );


    // 저장
    const 저장 =
        document.getElementById(
            "칭호저장"
        );


    if (저장) {

        저장.onclick =
            칭호저장;

    }

}


// =====================================================
// HTML escape
// =====================================================

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// 칭호 저장
// =====================================================

async function 칭호저장() {

    if (
        !현재사용자
    ) {

        return;

    }


    // =================================================
    // null = 칭호 해제
    // =================================================

    const {

        error

    } = await supabase

        .from("users")

        .update({

            equipped_title:
                선택한칭호

        })

        .eq(
            "user_id",
            현재사용자.id
        );


    if (error) {

        console.error(
            "칭호 저장 오류:",
            error
        );


        팝업열기(`

            ❌ 칭호 저장 실패

            <br><br>

            ${error.message}

        `, 5000);

        return;

    }


    현재유저정보.equipped_title =
        선택한칭호;


    화면업데이트();


    팝업열기(`

        🏷️ <b>칭호 변경 완료!</b>

        <br><br>

        ${
            선택한칭호
                ? `현재 칭호: <b>${선택한칭호}</b>`
                : "칭호를 해제했습니다."
        }

    `, 3000);


    칭호화면표시();

}


// =====================================================
// 첫 로그인 업적
// =====================================================

async function 첫로그인업적확인() {

    const 첫로그인 =
        업적목록.find(

            achievement =>

                achievement.id ===
                "first_login"

        );


    if (!첫로그인) {

        console.warn(
            "achievements 테이블에서 first_login을 찾지 못했습니다."
        );

        return;

    }


    await 업적획득(

        } =
            await supabase.auth.signOut();

                error
            );

            return;

        }


        location.reload();

    };


// =====================================================
// 로그인 상태
// =====================================================

async function 시작() {

    console.log(
        "돌이 사이트 시작"
    );


    // =================================================
    // 업적 먼저 불러오기
    // =================================================

    업적목록 =
        await 업적불러오기();


    console.log(
        "Supabase 업적:",
        업적목록
    );


    // =================================================
    // 로그인 확인
    // =================================================

    const {

        data,
        error

    } =
        await supabase.auth.getSession();


    if (error) {

        console.error(
            "세션 확인 오류:",
            error
        );

    }


    const session =
        data?.session;


    // =================================================
    // 로그아웃 상태
    // =================================================

    if (!session) {

        로그인버튼.style.display =
            "block";


        회원가입버튼.style.display =
            "block";


        return;

    }


    // =================================================
    // 로그인 상태
    // =================================================

    현재사용자 =
        session.user;


    // 프로필 표시
    사진.style.display =
        "block";


    // =================================================
    // 사용자 정보
    // =================================================

    const 유저정보 =
        await 유저정보불러오기();


    if (!유저정보) {

        return;

    }


    화면업데이트();


    // =================================================
    // 업적
    // =================================================

    await 첫로그인업적확인();


    // 최신 정보 다시 가져오기
    await 유저정보불러오기();


    화면업데이트();


    console.log(
        "로그인 사용자:",
        현재사용자
    );

    console.log(
        "현재 유저 정보:",
        현재유저정보
    );

    console.log(
        "획득 업적:",
        획득업적
    );

}


// =====================================================
// Auth 상태 변화
// =====================================================

supabase.auth.onAuthStateChange(

    async (
        event,
        session
    ) => {

        console.log(
            "Auth:",
            event
        );


        if (
            event ===
            "SIGNED_IN"
        ) {

            location.reload();

        }


        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.reload();

        }

    }

);


// =====================================================
// 시작
// =====================================================

await 시작();

);

</script>
