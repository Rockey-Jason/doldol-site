// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(exp) {

    const 숫자 =
        Number(exp) || 0;

    let level = 1;

    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            숫자 >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }

    return level;

}

// =====================================================
// 로그인 상태
// =====================================================

async function 로그인상태처리() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            console.error(
                "세션 확인 오류:",
                error
            );

            비로그인화면();

            return;

        }


        if (!data.session) {

            비로그인화면();

            return;

        }


        현재사용자 =
            data.session.user;


        await 로그인화면();

    }

    catch (error) {

        console.error(
            "로그인 처리 오류:",
            error
        );

        비로그인화면();

    }

}

// =====================================================
// 로그인 화면
// =====================================================

async function 로그인화면() {

    const 로그인 =

// =====================================================
// 사용자 정보 불러오기
// =====================================================

async function 사용자정보불러오기() {

    if (!현재사용자) {

        return;

    }


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(`
                user_id,
                user_number,
                user_level,
                doldolcoin,
                exp,
                exp_level,
                profile_image,
                user_achievement
            `)

            .eq(
                "user_id",
                현재사용자.id
            )

            .maybeSingle();


    if (error) {

        console.error(
            "users 조회 오류:",
            error
        );

        return;

    }


    if (!data) {

        console.warn(
            "users에 현재 사용자가 없습니다."
        );

        return;

    }


    현재유저정보 =
        data;


    사용자정보표시();


    await 업적불러오기();


    첫로그인업적처리();

}


// =====================================================
// 사용자 정보 표시
// =====================================================

function 사용자정보표시() {

    if (!현재유저정보) {

        return;

    }


    const 사진 =
        el("돌이사진");

    if (
        사진 &&
        현재유저정보.profile_image
    ) {

        사진.src =
            현재유저정보.profile_image;

    }


    const 레벨 =
        el("레벨");

    if (레벨) {

        const 회원레벨 =
            Number(
                현재유저정보.user_level
            ) || 1;


        레벨.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;

    }


    const 코인 =
        el("돌돌코인수량");

    if (코인) {

        코인.textContent =
            `돌돌코인: ${
                Number(
                    현재유저정보.doldolcoin
                ) || 0
            }`;

    }


    const EXP =
        el("EXP정보");

    if (EXP) {

        const exp =
            Number(
                현재유저정보.exp
            ) || 0;

        const level =
            Number(
                현재유저정보.exp_level
            )
            ||
            경험치로레벨계산(exp);


        EXP.textContent =
            `EXP Lv.${level} · ${exp} EXP`;

    }


    const 칭호 =
        el("현재칭호");

    if (칭호) {

        칭호.textContent =
            현재유저정보.equipped_title
            ||
            "칭호 없음";

    }

}


// =====================================================
// 업적 불러오기
// =====================================================

async function 업적불러오기() {

    /*
       1순위:
       Supabase achievements 테이블

       2순위:
       users.user_achievement JSON

       이렇게 해서 기존 데이터와도 최대한 호환
    */


    const {
        data,
        error
    } =
        await supabase

            .from("achievements")

            .select("*")

            .order(
                "id"
            );


    if (!error && data) {

        업적목록 =
            data;

        console.log(
            "Supabase 업적 불러오기:",
            data
        );

        return;

    }


    if (error) {

        console.warn(
            "achievements 테이블 조회 실패:",
            error.message
        );

    }


    // -------------------------------------------------
    // 기존 user_achievement에서 복구
    // -------------------------------------------------

    let 저장업적 =
        현재유저정보?.user_achievement
        || {};


    if (
        typeof 저장업적 ===
        "string"
    ) {

        try {

            저장업적 =
                JSON.parse(
                    저장업적
                );

        }

        catch {

            저장업적 = {};

        }

    }


    업적목록 =
        Object.entries(
            저장업적
        ).map(
            ([id, value]) => ({

                id,

                name:
                    value.이름
                    || id,

                description:
                    value.설명
                    || "",

                rarity:
                    value.희귀도
                    || "Common",

                coin_reward:
                    value.보상?.돌돌코인
                    || 0,

                exp_reward:
                    value.보상?.경험치
                    || 0

            })
        );

}


// =====================================================
// 저장된 업적 가져오기
// =====================================================

function 획득업적가져오기() {

    let data =
        현재유저정보?.user_achievement
        || {};


    if (
        typeof data ===
        "string"
    ) {

        try {

            data =
                JSON.parse(data);

        }

        catch {

            data = {};

        }

    }


    return data || {};

}


// =====================================================
// 첫 로그인 업적
// =====================================================

async function 첫로그인업적처리() {

    const 업적 =
        업적목록.find(
            item =>
                item.id ===
                "first_login"
        );


    if (!업적) {

        return;

    }


    const 획득업적 =
        획득업적가져오기();


    if (
        획득업적.first_login
    ) {

        return;

    }


    /*
       업적 지급은 여기서 자동으로
       하지 않고 기존 업적 시스템이
       지급하도록 할 수도 있음.

       중복 지급 방지를 위해
       이미 존재할 경우 절대 다시 지급하지 않음.
    */

}

// 상세정보
// =====================================================

    const 창 =
        el("프로필정보");

    const 내용 =
        el("프로필내용");


    if (!창 || !내용) {

        return;

    }


    const exp =
        Number(
            현재유저정보?.exp
        ) || 0;


    const expLevel =
        Number(
            현재유저정보?.exp_level
        )
        ||
        경험치로레벨계산(exp);


    const userLevel =
        Number(
            현재유저정보?.user_level
        )
        || 1;


    내용.innerHTML = `

            회원등급:
            ${
                회원레벨이름[userLevel]
                || "일반"
            }

        <p>
            EXP 레벨:
            Lv.${expLevel}
        </p>

        <p>
            경험치:
            ${exp} EXP
        </p>

        <p>
            돌돌코인:
            ${
                현재유저정보?.doldolcoin
                ?? 0
            }
        </p>

        <p>
            현재 칭호:
            ${
                현재유저정보?.equipped_title
                || "없음"

            class="닫기버튼"

// =====================================================
// 업적 창

function 업적창열기() {

    프로필메뉴닫기();


    const 창 =
        el("프로필정보");

    const 내용 =
        el("프로필내용");


    if (!창 || !내용) {

        return;

    }


    const 획득업적 =
        획득업적가져오기();


    let html = `

        <h2>🏆 업적</h2>

        <p>
            획득한 업적:
            ${
                Object.keys(
                    획득업적
                ).length
            }
            /
            ${업적목록.length}
        </p>

    `;


    if (
        업적목록.length === 0
    ) {

        html += `

            <p>
                아직 업적 정보를
                불러오지 못했습니다.
            </p>

        `;

    }


    업적목록.forEach(
        업적 => {

            const id =
                업적.id;


            const 획득 =
                Boolean(
                    획득업적[id]
                );


            const 이름 =
                업적.name
                ||
                업적.이름
                ||
                id;


            const 설명 =
                업적.description
                ||
                업적.설명
                ||
                "";


            const 희귀도 =
                업적.rarity
                ||
                업적.희귀도
                ||
                "Common";


            html += `

                <div
                    class="
                        업적항목
                        ${
                            획득
                            ? ""
                            : "미획득"
                        }
                    "
                >

                    <div
                        class="업적이름"
                    >
                        ${
                            획득
                            ? "🏆"
                            : "🔒"
                        }

                    </div>

                    <div
                        class="업적설명"
                    >
                        ${설명}
                    </div>

                    <div
                        class="업적희귀도"
                    >
                        ⭐ ${희귀도}
                    </div>

        }

    html += `

        <br>

        <button
            class="닫기버튼"
            id="프로필닫기3"
        >
            닫기
        </button>

    `;


    내용.innerHTML =
        html;


    창.classList.add(
        "show"
    );


    const 닫기 =
        el("프로필닫기3");

    if (닫기) {

        닫기.onclick =
            프로필창닫기;

    }

}


// =====================================================
// 칭호 창
// =====================================================

function 칭호창열기() {

    프로필메뉴닫기();


    const 창 =
        el("프로필정보");

    const 내용 =
        el("프로필내용");


    if (!창 || !내용) {

        return;

    }


    const 획득업적 =
        획득업적가져오기();


    /*
       칭호를 가진 업적만 표시.

       Supabase achievements 테이블에
       title_name 또는 title 컬럼이 있으면 사용.
    */


    const 칭호들 =
        업적목록.filter(
            업적 => {

                const id =
                    업적.id;


                const 획득 =
                    Boolean(
                        획득업적[id]
                    );


                const 칭호 =
                    업적.title_name
                    ||
                    업적.title
                    ||
                    업적.칭호;


                return
                    획득 &&
                    칭호;

            }
        );


    let html = `

        <h2>🏅 칭호</h2>

        <p>
            현재 칭호:
            <b>
                ${
                    현재유저정보?.equipped_title
                    || "없음"
                }
            </b>
        </p>

        <div id="칭호목록">

    `;


    if (
        칭호들.length === 0
    ) {

        html += `

            <p>
                아직 획득한 칭호가 없습니다.
            </p>

        `;

    }


    칭호들.forEach(
        업적 => {

            const 칭호 =
                업적.title_name
                ||
                업적.title
                ||
                업적.칭호;


            const 장착중 =
                현재유저정보?.equipped_title
                === 칭호;


            html += `

                <div
                    class="
                        칭호항목
                        ${
                            장착중
                            ? "장착중"
                            : ""
                        }
                    "
                >

                    🏅
                    <b>
                        ${칭호}
                    </b>

                    ${
                        장착중
                        ? "<span> · 장착 중</span>"
                        : ""
                    }

                    <br>

                    <button
                        class="칭호버튼"
                        data-title="
                            ${칭호}
                        "
                    >
                        ${
                            장착중
                            ? "장착 중"
                            : "이 칭호 선택"
                        }
                    </button>

                </div>

            `;

        }
    );


    html += `

        </div>

        <br>

        <button
            class="닫기버튼"
            id="칭호저장버튼"
        >
            선택한 칭호 저장
        </button>

        <button
            class="닫기버튼"
            id="프로필닫기4"
        >
            닫기
        </button>

    `;


    내용.innerHTML =
        html;


    창.classList.add(
        "show"
    );


    // -------------------------------------------------
    // 선택한 칭호
    // -------------------------------------------------

    let 선택한칭호 =
        현재유저정보?.equipped_title
        || null;


    const 버튼들 =
        내용.querySelectorAll(
            ".칭호버튼"
        );


    버튼들.forEach(
        button => {

            button.onclick =
                () => {

                    선택한칭호 =
                        button.dataset.title
                        .trim();


                    버튼들.forEach(
                        b => {

                            b.style.background =
                                "#444";

                        }
                    );


                    button.style.background =
                        "#9b7b00";

                };

        }
    );


    // -------------------------------------------------
    // 저장
    // -------------------------------------------------

    const 저장 =
        el("칭호저장버튼");


    if (저장) {

        저장.onclick =
            async () => {

                if (
                    !선택한칭호
                ) {

                    alert(
                        "칭호를 선택해주세요."
                    );

                    return;

                }


                저장.disabled =
                    true;


                const 성공 =
                    await 칭호저장(
                        선택한칭호
                    );


                저장.disabled =
                    false;


                if (성공) {

                    alert(
                        `칭호가 "${선택한칭호}"로 적용되었습니다!`
                    );


                    칭호창열기();

                }

            };

    }


    const 닫기 =
        el("프로필닫기4");


    if (닫기) {

        닫기.onclick =
            프로필창닫기;

    }

}


// =====================================================
// 칭호 저장
// =====================================================

async function 칭호저장(칭호) {

    if (!현재사용자) {

        alert(
            "로그인이 필요합니다."
        );

        return false;

    }


    try {

        const {
            data,
            error
        } =
            await supabase

                .from("users")

                .update({

                    equipped_title:
                        칭호

                })

                .eq(
                    "user_id",
                    현재사용자.id
                )

                .select(
                    "equipped_title"
                )
                .single();


        if (error) {

            console.error(
                "칭호 저장 오류:",
                error
            );


            alert(
                "칭호 저장에 실패했습니다.\n\n" +
                error.message
            );


            return false;

        }


        현재유저정보.equipped_title =
            data.equipped_title;


        사용자정보표시();


        return true;

    }

    catch (error) {

        console.error(
            "칭호 저장 예외:",
            error
        );


        alert(
            "칭호 저장 중 오류가 발생했습니다."
        );


        return false;

    }

}

    try {

            error
        } =
            await supabase.auth.signOut();


        if (error) {

            console.error(
                "로그아웃 오류:",
                error
            );

            alert(
                "로그아웃에 실패했습니다."
            );

            return;

        }


        /*
           중요:
           여기서 reload를 사용하지 않는다.
        */

        현재사용자 =
            null;

        현재유저정보 =
            null;


        location.href =
            "index.html";

    }

    catch (error) {

        console.error(
            "로그아웃 예외:",
            error
        );

    }

}


// =====================================================
// 팝업
// =====================================================

function 팝업열기(
    내용,
    시간 = 3000
) {

    const popup =
        el("achievementPopup");


    if (!popup) {

        return;

    }


    if (팝업타이머) {

        clearTimeout(
            팝업타이머
        );

    }


    popup.innerHTML =
        내용;


    popup.classList.add(
        "show"
    );


    팝업타이머 =
        setTimeout(
            () => {

                popup.classList.remove(
                    "show"
                );

                팝업타이머 =
                    null;

            },
            시간
        );

}


// =====================================================
// EXP 획득
// =====================================================

async function 경험치획득(amount) {

    amount =
        Number(amount);


    if (
        !Number.isFinite(amount)
        ||
        amount <= 0
    ) {

        return {
            success: false
        };

    }


    if (!현재사용자) {

        return {
            success: false
        };

    }


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(
                "exp, exp_level"
            )

            .eq(
                "user_id",
                현재사용자.id
            )

            .single();


    if (error) {

        console.error(
            "EXP 조회 오류:",
            error
        );

        return {
            success: false
        };

    }


    const 기존EXP =
        Number(
            data.exp
        ) || 0;


    const 기존레벨 =
        Number(
            data.exp_level
        ) || 1;


    const 새로운EXP =
        기존EXP +
        amount;


    const 새로운레벨 =
        경험치로레벨계산(
            새로운EXP
        );


    const {
        error: updateError
    } =
        await supabase

            .from("users")

            .update({

                exp:
                    새로운EXP,

                exp_level:
                    새로운레벨

            })

            .eq(
                "user_id",
                현재사용자.id
            );


    if (updateError) {

        console.error(
            "EXP 저장 오류:",
            updateError
        );

        return {
            success: false
        };

    }


    현재유저정보.exp =
        새로운EXP;

    현재유저정보.exp_level =
        새로운레벨;


    사용자정보표시();


    if (
        새로운레벨 >
        기존레벨
    ) {

        팝업열기(
            `
                ✨ <b>EXP 레벨 업!</b>

                <br><br>

                Lv.${기존레벨}
                →
                Lv.${새로운레벨}

                <br><br>

                🎉 축하합니다!
            `,
            4000
        );

    }


    return {

        success: true,

        exp:
            새로운EXP,

        level:
            새로운레벨

    };

}
