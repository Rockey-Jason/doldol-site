// =====================================================
// EXP → EXP 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    let level = 1;

    for (let i = 11; i >= 1; i--) {

        if (exp >= EXP레벨필요경험치[i]) {

            level = i;

            break;

        }

    }

    return level;

}

// =====================================================
// EXP 획득
//
// ⭐ exp만 증가
// ⭐ exp_level만 계산해서 갱신
// ⭐ user_level은 절대 변경하지 않음
// =====================================================

async function 경험치획득(amount) {

    if (!amount || amount <= 0) {

        return {
            success: false
        };

    }


    const {
        data: { user }
    } = await supabase.auth.getUser();


    if (!user) {

        return {
            success: false
        };

    }


    const {
        data,
        error
    } = await supabase

        .from("users")

        .select("exp, exp_level")

        .eq("user_id", user.id)

        .single();


    if (error) {

        console.error(
            "EXP 조회 오류:",
            error
        );

        return {
            success: false
        };

    }


    const 현재경험치 =
        Number(data.exp ?? 0);


    const 기존EXP레벨 =
        Number(data.exp_level ?? 1);


    const 새로운경험치 =
        현재경험치 + Number(amount);


    const 새로운EXP레벨 =
        경험치로레벨계산(
            새로운경험치
        );


    // =================================================
    // ⭐ 중요
    //
    // 여기서는 exp와 exp_level만 수정
    //
    // user_level은 절대 수정하지 않음
    // =================================================

    const {
        error: updateError
    } = await supabase

        .from("users")

        .update({

            exp: 새로운경험치,

            exp_level: 새로운EXP레벨

        })

        .eq("user_id", user.id);


    if (updateError) {

        console.error(
            "EXP 저장 오류:",
            updateError
        );

        return {
            success: false
        };

    }


    console.log(
        `EXP +${amount}: ${현재경험치} → ${새로운경험치}`
    );


    // =================================================
    // EXP 레벨업
    // =================================================

    if (새로운EXP레벨 > 기존EXP레벨) {

        EXP레벨업알림(
            기존EXP레벨,
            새로운EXP레벨
        );

    }


    return {

        success: true,

        exp: 새로운경험치,

        level: 새로운EXP레벨,

        levelUp:
            새로운EXP레벨 > 기존EXP레벨

    };

}

// =====================================================
// 업적 획득
//
// 업적 보상
//
// ① 돌돌코인 → doldolcoin
// ② EXP → exp
// ③ exp_level → 자동 계산
//
// user_level은 건드리지 않음
// =====================================================

async function 업적획득(업적정보) {

    const {
        data: { user }
    } = await supabase.auth.getUser();


    if (!user) {

        return false;

    }


    const {
        data,
        error
    } = await supabase

        .from("users")

        .select(
            "user_achievement, doldolcoin, exp, exp_level"
        )

        .eq("user_id", user.id)

        .single();


    if (error) {

        console.error(
            "업적 조회 오류:",
            error
        );

        return false;

    }


    let achievements =
        data.user_achievement || {};


    // =================================================
    // 이미 달성한 업적이면 아무것도 하지 않음
    // =================================================

    if (achievements[업적정보.id]) {

        return false;

    }


    // =================================================
    // 업적 데이터 생성
    // =================================================

    achievements[업적정보.id] = {

        이름:
            업적정보.이름,

        설명:
            업적정보.설명,

        희귀도:
            업적정보.희귀도,

        보상:
            업적정보.보상,

        획득시간:
            new Date().toISOString()

    };


    // =================================================
    // 돌돌코인 지급
    //
    // user_level은 여기서 건드리지 않음
    // =================================================

    const 현재돌돌코인 =
        Number(data.doldolcoin ?? 0);


    const 새로운돌돌코인 =
        현재돌돌코인 +
        Number(업적정보.보상.돌돌코인);


    const {
        error: updateError
    } = await supabase

        .from("users")

        .update({

            user_achievement:
                achievements,

            doldolcoin:
                새로운돌돌코인

        })

        .eq("user_id", user.id);


    if (updateError) {

        console.error(
            "업적 저장 오류:",
            updateError
        );

        return false;

    }


    // =================================================
    // EXP 지급
    //
    // 별도의 시스템
    // =================================================

    await 경험치획득(
        업적정보.보상.경험치
    );


    // =================================================
    // 업적 알림
    // =================================================

    업적알림(
        업적정보
    );


    return true;

}

                            `${회원레벨이름[
                                data.user_level
                            ] || "일반"}`;

                    }


                    // =================================================
                    // 돌돌코인
                    // =================================================

                    if (돌돌코인수량) {

                        돌돌코인수량.textContent =

                            `현재 돌돌코인 수량: ` +
                            `${data.doldolcoin ?? 0}`;

                    }

                };

            }


            // =================================================
            // 로그아웃
            // =================================================

            if (로그아웃버튼) {

                로그아웃버튼.onclick =
                    async () => {

                        await supabase.auth.signOut();

                        location.href =
                            "index.html";

                    };

            }


            // =================================================
            // 돌돌코인 메뉴
            // =================================================

            if (돌돌코인버튼) {

                돌돌코인버튼.onclick = () => {

                    location.href =
                        "doldolcoinshop.html";

                };

            }


            // =================================================
            // 첫 로그인 업적
            // =================================================

            await 업적획득(
                업적.첫로그인
            );

        }

    }

}

</script>
