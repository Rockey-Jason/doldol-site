/* =====================================================
   기본
===================================================== */

* {

    box-sizing: border-box;

    user-select: none;

    -webkit-user-select: none;

    -webkit-user-drag: none;

}


input,
textarea {

    user-select: text;

    -webkit-user-select: text;

}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

}


body {

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(30,50,130,.18),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(40,20,120,.12),
            transparent 35%
        ),

        linear-gradient(
            to right,
            #000033,
            #000010
        );

    color: white;

    overflow-x: hidden;

}


/* =====================================================
   메인
===================================================== */

#사이트 {

    position: relative;

    width: 100%;

    min-height: 100vh;

    padding-bottom: 80px;

}


/* =====================================================
   이미지
===================================================== */

img {

    transition:
        transform .25s ease,
        filter .25s ease,
        box-shadow .25s ease;

}


img:hover {

    transform:
        scale(1.045);

    filter:
        brightness(1.08);

}


/* =====================================================
   상단 제목
===================================================== */

.사이트제목 {

    transition:
        text-shadow .25s ease,
        transform .25s ease;

}


.사이트제목:hover {

    text-shadow:
        0 0 15px rgba(255,255,255,.18);

    transform:
        translateX(3px);

}


/* =====================================================
   메인 메뉴 버튼
===================================================== */

.메인메뉴버튼 {

    transition:
        transform .22s ease,
        color .22s ease,
        text-shadow .22s ease;

}


.메인메뉴버튼:hover {

    transform:
        translateY(-3px);

    color:
        #ffffff;

    text-shadow:
        0 0 16px rgba(255,255,255,.22);

}


.메인메뉴버튼:active {

    transform:
        translateY(0)
        scale(.98);

}


/* =====================================================
   프로필 사진
===================================================== */

#돌이사진 {

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

}


#돌이사진:hover {

    transform:
        scale(1.08);

    border-color:
        #ffd700 !important;

    box-shadow:
        0 0 0 4px rgba(255,215,0,.08),
        0 8px 25px rgba(0,0,0,.35);

}


/* =====================================================
   프로필 메뉴
===================================================== */

#프로필메뉴 {

    position: fixed;

    top: 70px;

    right: 20px;

    width: 230px;

    background:
        linear-gradient(
            145deg,
            rgba(35,38,60,.98),
            rgba(18,20,38,.98)
        );

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:
        18px;

    padding:
        14px;

    box-shadow:
        0 20px 55px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    z-index:
        5000;

    display:
        none;

    animation:
        프로필메뉴등장 .18s ease;

}


#프로필메뉴.show {

    display:
        block;

}


@keyframes 프로필메뉴등장 {

    from {

        opacity: 0;

        transform:
            translateY(-8px)
            scale(.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   프로필 정보 영역
===================================================== */

#프로필상태 {

    display:
        none;

    margin-bottom:
        10px;

    padding:
        12px;

    border-radius:
        13px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.07);

}


#프로필상태.show {

    display:
        block;

}


.프로필상태제목 {

    color:
        #ffffff;

    font-family:
        "HancomMalrangmalrang";

    font-size:
        16px;

    font-weight:
        700;

    margin-bottom:
        8px;

}


.프로필상태항목 {

    font-family:
        "HancomMalrangmalrang";

    font-size:
        13px;

    color:
        rgba(255,255,255,.76);

    margin:
        4px 0;

    white-space:
        nowrap;

}


/* =====================================================
   프로필 메뉴 버튼
===================================================== */

.프로필메뉴버튼 {

    width:
        100%;

    padding:
        11px 12px;

    margin:
        3px 0;

    border:
        1px solid transparent;

    border-radius:
        11px;

    background:
        transparent;

    color:
        white;

    font-family:
        "HancomMalrangmalrang";

    font-size:
        17px;

    cursor:
        pointer;

    text-align:
        left;

    transition:
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;

}


.프로필메뉴버튼:hover {

    background:
        rgba(255,255,255,.09);

    border-color:
        rgba(255,255,255,.07);

    transform:
        translateX(2px);

}


.프로필메뉴버튼:active {

    transform:
        translateX(2px)
        scale(.98);

}


/* =====================================================
   로그아웃
===================================================== */

#로그아웃 {

    color:
        #ff8585;

}


#로그아웃:hover {

    background:
        rgba(255,90,90,.09);

}


/* =====================================================
   프로필 상태 표시
===================================================== */

.프로필상태표시 {

    display:
        none;

    position:
        fixed;

    top:
        70px;

    right:
        270px;

    z-index:
        4000;

    font-family:
        "HancomMalrangmalrang";

    color:
        white;

    text-align:
        right;

    pointer-events:
        none;

}


.프로필상태표시.show {

    display:
        block;

}


/* =====================================================
   상태 항목
===================================================== */

#레벨,
#돌돌코인수량,
#EXP정보,
#현재칭호 {

    position:
        static !important;

    display:
        block !important;

    background:
        none;

    border:
        none;

    margin:
        0 0 3px 0;

    padding:
        0;

    font-family:
        "HancomMalrangmalrang";

    white-space:
        nowrap;

}


#레벨 {

    font-size:
        14px;

    color:
        white;

}


#돌돌코인수량 {

    font-size:
        14px;

    color:
        #ffe48a;

}


#EXP정보 {

    font-size:
        14px;

    color:
        #a9d7ff;

}


#현재칭호 {

    font-size:
        14px;

    color:
        #ffd700;

}


/* =====================================================
   이미지 카드
===================================================== */

.메뉴이미지 {

    border-radius:
        16px;

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);

}


.메뉴이미지:hover {

    box-shadow:
        0 18px 45px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.12);

}
