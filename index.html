===================================================== */

    1: 0,

    3: 500,

    5: 5000,

    7: 20000,

    8: 30000,

    9: 40000,

};


/* =====================================================
   EXP → 레벨
===================================================== */

function 경험치로레벨계산(exp) {

    const 숫자EXP =
        Number(exp) || 0;

    let level = 1;

    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            숫자EXP >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }

    return level;

}

/* =====================================================
   로그인 상태
===================================================== */

async function 로그인상태확인() {

    const {
        data,
        error
    } =
        await supabase.auth.getSession();


    if (error) {

        console.error(
            "Supabase 세션 확인 오류:",
            error
        );

        로그인UI();

        return null;

    }


    return data.session;

}


/* =====================================================
   로그아웃 UI
===================================================== */

function 로그인UI() {

    if (로그인버튼) {

    if (회원가입버튼) {

}

    }


    if (돌돌코인버튼) {

        돌돌코인버튼.style.display =
            "block";

    }


    if (설정버튼) {

        설정버튼.style.display =
            "block";

    }


    if (레벨) {

        레벨.style.display =
            "block";

    }


    if (돌돌코인수량) {

        돌돌코인수량.style.display =
            "block";

    }


    if (EXP정보) {

        EXP정보.style.display =
            "block";

    }

}


/* =====================================================
   프로필 사진 클릭
===================================================== */

if (사진) {

    사진.addEventListener(
        "click",
        () => {

            const 현재상태 =
                메뉴?.style.display;

            if (
                현재상태 === "block"
            ) {

                프로필메뉴닫기();

            } else {

                프로필메뉴열기();

            }

        }
    );

}


/* =====================================================
   사용자 정보 조회
===================================================== */

async function 사용자정보불러오기(user) {

    if (!user?.id) {

        return null;

    }


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(`
                user_number,
                user_level,
                doldolcoin,
                exp,
                exp_level,
                profile_image
            `)

            .eq(
                "user_id",
                user.id
            )

            .maybeSingle();


    if (error) {

        console.error(
            "users 조회 오류:",
            error
        );

        return null;

    }


    if (!data) {

        console.warn(
            "users 테이블에서 사용자 정보를 찾을 수 없습니다."
        );

        return null;

    }


    return data;

}


/* =====================================================
   사용자 정보 표시
===================================================== */

function 사용자정보표시(정보) {

    if (!정보) {

        return;

    }


    /* ================================================
       프로필 사진
    ================================================ */

    if (사진) {

        if (
            정보.profile_image &&
            typeof 정보.profile_image ===
                "string"
        ) {

            사진.src =
                정보.profile_image;

        }


        사진.style.display =
            "block";

    }


    /* ================================================
       회원 레벨
    ================================================ */

    const 회원레벨 =
        Number(
            정보.user_level ?? 1
        );


    if (레벨) {

        레벨.textContent =
            `회원등급: ${
                회원레벨이름[회원레벨]
                || "일반"
            }`;

    }


    /* ================================================
       돌돌코인
    ================================================ */

    const 코인 =
        Number(
            정보.doldolcoin ?? 0
        );


    if (돌돌코인수량) {

        돌돌코인수량.textContent =
            `현재 돌돌코인 수량: ${코인}`;

    }


    /* ================================================
       EXP
    ================================================ */

    const 현재EXP =
        Number(
            정보.exp ?? 0
        );


    let EXP레벨 =
        Number(
            정보.exp_level ?? 0
        );


    /*
       DB의 exp_level이 없거나 이상한 경우
       현재 EXP를 기준으로 계산한다.
    */

    if (
        !Number.isFinite(EXP레벨) ||
        EXP레벨 < 1
    ) {

        EXP레벨 =
            경험치로레벨계산(
                현재EXP
            );

    }


    if (EXP정보) {

        EXP정보.textContent =
            `EXP Lv.${EXP레벨} · ${현재EXP} EXP`;

    }

}


/* =====================================================
   프로필 사진 기본 처리
===================================================== */

if (사진) {

    사진.addEventListener(
        "error",
        () => {

            사진.src =
                "https://i.postimg.cc/qB2wnCCq/1000004618-(2).png";

        }
    );

}


/* =====================================================
   설정 페이지
===================================================== */

if (설정버튼) {

    설정버튼.addEventListener(
        "click",
        () => {

            /*
               업적 / 칭호 / 상세정보는
               모두 settings.html에서 관리한다.

               메인 페이지에서는
               단순히 설정 페이지로 이동한다.
            */

            페이지이동(
                "settings.html"
            );

        }
    );

}


/* =====================================================
   돌돌코인 메뉴
===================================================== */

if (돌돌코인버튼) {

    돌돌코인버튼.addEventListener(
        "click",
        () => {

            페이지이동(
                "doldolcoinmart.html"
            );

        }
    );

}


/* =====================================================
   로그아웃
===================================================== */

if (로그아웃버튼) {

    로그아웃버튼.addEventListener(
        "click",
        async () => {

            로그아웃버튼.disabled =
                true;


            const {
                error
            } =
                await supabase.auth.signOut();


            if (error) {

                console.error(
                    "로그아웃 오류:",
                    error
                );

                로그아웃버튼.disabled =
                    false;

                return;

            }


            /*
               여기서 reload를 하지 않는다.
               로그아웃 성공 후 한 번만 index.html로 이동한다.
            */

            window.location.href =
                "index.html";

        }
    );

}


/* =====================================================
   초기 실행
===================================================== */

async function 메인페이지초기화() {

    try {

        const session =
            await 로그인상태확인();


        /* ============================================
           로그인하지 않은 경우
        ============================================ */

        if (!session) {

            로그인UI();

            return;

        }


        /* ============================================
           로그인한 경우
        ============================================ */

        로그인사용자UI();


        const {
            data: { user },
            error
        } =
            await supabase.auth.getUser();


        if (error) {

            console.error(
                "Auth 사용자 조회 오류:",
                error
            );

            로그인UI();

            return;

        }


        if (!user) {

            로그인UI();

            return;

        }


        /* ============================================
           users 정보
        ============================================ */

        const 정보 =
            await 사용자정보불러오기(
                user
            );


        if (!정보) {

            return;

        }


        사용자정보표시(
            정보
        );


        /*
           중요:

           여기서는 업적을 조회하거나
           업적 보상을 지급하지 않는다.

           업적 시스템은 settings.html에서
           관리한다.

           따라서 메인 페이지를 새로고침할 때
           첫 로그인 업적이 반복 지급되는 문제도
           발생하지 않는다.
        */

        console.log(
            "돌이 사이트 메인 페이지 정상 실행",
            {
                user_id: user.id,
                user_level: 정보.user_level,
                exp: 정보.exp,
                exp_level: 정보.exp_level,
                doldolcoin: 정보.doldolcoin
            }
        );

    } catch (error) {

        console.error(
            "메인 페이지 초기화 오류:",
            error
        );

    }

}


/* =====================================================
   Supabase 인증 상태 변화
=====================================================

   주의:
   여기서는 페이지를 새로고침하지 않는다.

   onAuthStateChange에서
   location.reload()를 사용하면
   인증 이벤트 → 새로고침 → 인증 이벤트...
   같은 문제가 발생할 수 있다.
===================================================== */

supabase.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "Auth 상태 변경:",
            event
        );


        /*
           INITIAL_SESSION은 초기화 과정에서
           이미 처리했으므로 여기서 다시
           전체 페이지를 새로고침하지 않는다.
        */

        if (
            event === "SIGNED_OUT"
        ) {

            로그인UI();

            프로필메뉴닫기();

            return;

        }


        if (
            event === "SIGNED_IN" &&
            session?.user
        ) {

            로그인사용자UI();


            const 정보 =
                await 사용자정보불러오기(
                    session.user
                );


            if (정보) {

                사용자정보표시(
                    정보
                );

            }

        }

    }
);


/* =====================================================
   시작
===================================================== */

await 메인페이지초기화();

</script>
