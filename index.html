// =====================================================
// EXP → 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp = Number(exp) || 0;

    let level = 1;

    for (let i = 11; i >= 1; i--) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }

    return level;

}

// =====================================================
// EXP 획득
// =====================================================

async function 경험치획득(amount) {

    amount =
        Number(amount);


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        return {
            success: false
        };

    }


    const {
        data: { user },
        error: authError
    } =
        await supabase.auth.getUser();


    if (
        authError ||
        !user
    ) {

        console.error(
            "EXP 사용자 확인 오류:",
            authError
        );

        return {
            success: false
        };

    }


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(
                "exp, exp_level"
            )

            .eq(
                "user_id",
                user.id
            )

            .single();


    if (error) {

        console.error(
            "EXP 조회 오류:",
            error
        );

        return {
            success: false
        };

    }


    const 현재경험치 =
        Number(
            data.exp ?? 0
        );


    const 기존EXP레벨 =
        Number(
            data.exp_level ?? 1
        );


    const 새로운경험치 =
        현재경험치 +
        amount;


    const 새로운EXP레벨 =
        경험치로레벨계산(
            새로운경험치
        );


    const {
        error: updateError
    } =
        await supabase

            .from("users")

            .update({

                exp:
                    새로운경험치,

                exp_level:
                    새로운EXP레벨

            })

            .eq(
                "user_id",
                user.id
            );


    if (updateError) {

        console.error(
            "EXP 저장 오류:",
            updateError
        );

        return {
            success: false
        };

    }


    console.log(
        `EXP +${amount}: ${현재경험치} → ${새로운경험치}`
    );


    if (
        새로운EXP레벨 >
        기존EXP레벨
    ) {

        EXP레벨업알림(
            기존EXP레벨,
            새로운EXP레벨
        );

    }


    return {

        success: true,

        exp:
            새로운경험치,

        level:
            새로운EXP레벨,

        levelUp:
            새로운EXP레벨 >
            기존EXP레벨

    };

}

// =====================================================
// 업적 획득
// =====================================================

async function 업적획득(
    업적정보
) {

    if (!업적정보) {

        return false;

    }


    const {
        data: { user },
        error: authError
    } =
        await supabase.auth.getUser();


    if (
        authError ||
        !user
    ) {

        return false;

    }


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(`
                user_achievement,
                doldolcoin,
                exp,
                exp_level
            `)

            .eq(
                "user_id",
                user.id
            )

            .single();


    if (error) {

        console.error(
            "업적 조회 오류:",
            error
        );

        return false;

    }


    let achievements =
        data.user_achievement || {};


    // 혹시 JSON 문자열로 저장되어 있는 경우
    if (
        typeof achievements ===
        "string"
    ) {

        try {

            achievements =
                JSON.parse(
                    achievements
                );

        } catch {

            achievements = {};

        }

    }


    // =================================================
    // 이미 획득한 업적
    // =================================================

    if (
        achievements[
            업적정보.id
        ]
    ) {

        return false;

    }


    // =================================================
    // 업적 데이터 생성
    // =================================================

    achievements[
        업적정보.id
    ] = {

        이름:
            업적정보.이름,

        설명:
            업적정보.설명,

        희귀도:
            업적정보.희귀도,

        보상:
            업적정보.보상,

        획득시간:
            new Date().toISOString()

    };


    // =================================================
    // 돌돌코인 계산
    // =================================================

    const 현재돌돌코인 =
        Number(
            data.doldolcoin ?? 0
        );


    const 보상코인 =
        Number(
            업적정보.보상.돌돌코인 ?? 0
        );


    const 새로운돌돌코인 =
        현재돌돌코인 +
        보상코인;


    // =================================================
    // 업적 + 돌돌코인 저장
    // =================================================

    const {
        error: updateError
    } =
        await supabase

            .from("users")

            .update({

                user_achievement:
                    achievements,

                doldolcoin:
                    새로운돌돌코인

            })

            .eq(
                "user_id",
                user.id
            );


    if (updateError) {

        console.error(
            "업적 저장 오류:",
            updateError
        );

        return false;

    }


    // =================================================
    // EXP 지급
    // =================================================

    const expResult =
        await 경험치획득(
            업적정보.보상.경험치
        );


    if (!expResult.success) {

        console.error(
            "업적 EXP 지급 실패"
        );

    }


    // =================================================
    // 업적 알림
    // =================================================

    업적알림(
        업적정보
    );


    return true;

}

                userError
            );

        } else {


            // =================================================
            // 프로필 사진
            // =================================================

            if (
                유저정보.profile_image &&
                사진
            ) {

                사진.src =
                    유저정보.profile_image;

            }


            if (사진) {

                사진.style.display =
                    "block";

            }


            // =================================================
            // 회원등급 표시
            // =================================================

            if (레벨버튼) {

                레벨버튼.textContent =
                    `회원등급: ${
                        회원레벨이름[
                            유저정보.user_level
                        ] || "일반"
                    }`;

            }


            // =================================================
            // 돌돌코인 표시
            // =================================================

            if (돌돌코인수량) {

                돌돌코인수량.textContent =
                    `현재 돌돌코인 수량: ${
                        유저정보.doldolcoin ?? 0
                    }`;

            }


            // =================================================
            // 프로필 메뉴 열기/닫기
            // =================================================

            let 상세설명 = false;


            if (사진) {

                사진.onclick =
                    async () => {

                        상세설명 =
                            !상세설명;


                        const display =
                            상세설명
                                ? "block"
                                : "none";


                        if (로그아웃버튼) {

                            로그아웃버튼.style.display =
                                display;

                        }


                        if (돌돌코인버튼) {

                            돌돌코인버튼.style.display =
                                display;

                        }


                        if (메뉴) {

                            메뉴.style.display =
                                display;

                        }


                        if (메뉴2) {

                            메뉴2.style.display =
                                display;

                        }


                        if (레벨버튼) {

                            레벨버튼.style.display =
                                display;

                        }


                        if (돌돌코인수량) {

                            돌돌코인수량.style.display =
                                display;

                        }


                        if (설정) {

                            설정.style.display =
                                display;

                        }


                        if (!상세설명) {

                            return;

                        }


                        // =================================================
                        // 최신 정보
                        //
                        // user_number가 아니라
                        // 현재 로그인한 user.id 사용
                        // =================================================

                        const {
                            data,
                            error
                        } =
                            await supabase

                                .from("users")

                                .select(`
                                    user_level,
                                    exp,
                                    exp_level,
                                    doldolcoin
                                `)

                                .eq(
                                    "user_id",
                                    user.id
                                )

                                .single();


                        if (error) {

                            console.error(
                                "프로필 정보 조회 오류:",
                                error
                            );

                            return;

                        }


                        // =================================================
                        // 최신 회원등급
                        // =================================================

                        if (레벨버튼) {

                            레벨버튼.textContent =
                                `회원등급: ${
                                    회원레벨이름[
                                        data.user_level
                                    ] || "일반"
                                }`;

                        }


                        // =================================================
                        // 최신 돌돌코인
                        // =================================================

                        if (돌돌코인수량) {

                            돌돌코인수량.textContent =
                                `현재 돌돌코인 수량: ${
                                    data.doldolcoin ?? 0
                                }`;

                        }

                    };

            }


            // =================================================
            // 로그아웃
            // =================================================

            if (로그아웃버튼) {

                로그아웃버튼.onclick =
                    async () => {

                        const {
                            error
                        } =
                            await supabase.auth.signOut();


                        if (error) {

                            console.error(
                                "로그아웃 오류:",
                                error
                            );

                            return;

                        }


                        location.href =
                            "index.html";

                    };

            }


            // =================================================
            // 돌돌코인 메뉴
            // =================================================

            if (돌돌코인버튼) {

                돌돌코인버튼.onclick =
                    돌돌코인상점으로이동;

            }


            // =================================================
            // 첫 로그인 업적
            // =================================================

            await 업적획득(
                업적.첫로그인
            );

        }

    }

}

);
