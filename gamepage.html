<!DOCTYPE html>
<html>
<head>
<title>돌이 사이트-돌이게임</title>

<style>
body {
  background: linear-gradient(to right, #000033, #000010);
  margin: 0;
}

#게임사진{
    transition:
        transform .35s ease,
        opacity .35s ease;

    opacity:1;
}

#게임사진{

width:260px;
transition:.25s;
border-radius:20px;

}

#게임이름{

color:white;
font-family:jua;
font-size:40px;
text-align:center;

}

#게임설명{

color:white;
font-family:jua;
font-size:22px;
text-align:center;

}

#장르{

color:#87cefa;
font-family:jua;
text-align:center;

}

#상태{

font-family:jua;
color:#7CFC00;
text-align:center;

}

#번호{

font-family:jua;
color:white;
font-size:25px;
text-align:center;

}

#점{

font-size:30px;
color:white;
text-align:center;

}

#시작{

padding:15px 40px;
font-size:25px;
font-family:jua;
border:none;
border-radius:15px;
cursor:pointer;

transition:.2s;

}

#시작:hover{

transform:scale(1.08);

}

#왼쪽,
#오른쪽{

font-size:40px;

width:70px;

height:70px;

border-radius:50%;

cursor:pointer;

}

#캐러셀{

    position:relative;

    width:900px;

    height:340px;

    margin:40px auto;

    overflow:hidden;

}

.캐러셀사진{

    position:absolute;

    width:240px;
    height:240px;

    object-fit:cover;

    border-radius:20px;

    transition:
        left .45s ease,
        top .45s ease,
        transform .45s ease,
        opacity .45s ease;

    user-select:none;

}

#왼쪽사진{

    left:70px;

    top:40px;

    transform:scale(.8);

    opacity:.45;

}

#가운데사진{

    left:330px;

    top:0;

    transform:scale(1);

    opacity:1;

    z-index:2;

}

#오른쪽사진{

    left:590px;

    top:40px;

    transform:scale(.8);

    opacity:.45;

}
</style>
</head>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<a href="https://rockey-jason.github.io/doldol-site/" style="text-decoration:none;">
<button style="
position:absolute;
top:0;
left:0;
background:none;
border:none;
color:#f5f5f5;
font-family:'Black Han Sans';
font-size:100px;
cursor:pointer;
">
돌이 사이트
</button>
</a>

<p style="
font-size:20px;
color:#f5f5f5;
font-family:jua;
margin-top:120px;
margin-left:20px;
">
돌이게임-돌이와 관련된 게임들을 이용해 놀수 있습니다!
</p>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">

<script type=module>
const 게임목록 = [
{
    이름:"돌이체스",
    장르:"전략",
    상태:"🟡 개발중",
    설명:"Stockfish AI와 대결하며 레이팅을 올리는 체스 게임입니다.",
    이미지:"https://i.postimg.cc/FsHqfPpX/rockeychess.png",
    링크:"https://rockey-jason.github.io/doldol-chess/"
},
{
    이름:"도로늄 공장",
    장르:"공장 시뮬레이션",
    상태:"🔴 출시 예정",
    설명:"광물을 채굴하고 자동 공장을 만들어 도로늄을 생산하는 게임입니다.",
    이미지:"https://i.postimg.cc/rp1XX0mS/1000005291.jpg",
    링크:"#"
},
{
    이름:"돌이 RPG",
    장르:"RPG",
    상태:"🔴 출시 예정",
    설명:"돌이와 함께 여러 지역을 탐험하는 RPG 게임입니다.",
    이미지:"https://i.postimg.cc/rp1XX0mS/1000005291.jpg",
    링크:"#"
}
];

const 캐러셀 = document.getElementById("캐러셀");

게임목록.forEach((게임, i)=>{

    const 카드 = document.createElement("img");

    카드.src = 게임.이미지;

    카드.className = "캐러셀사진";

    카드.dataset.index = i;

    캐러셀.appendChild(카드);

});

let 현재게임 = 0;

let 애니메이션중 = false;

function 화면갱신(){

    위치설정();

    const 게임 = 게임목록[현재게임];

    document.getElementById("게임이름").textContent =
        게임.이름;

    document.getElementById("게임설명").textContent =
        게임.설명;

    document.getElementById("장르").textContent =
        게임.장르;

    document.getElementById("상태").textContent =
        게임.상태;

    document.getElementById("번호").textContent =
        `${현재게임+1} / ${게임목록.length}`;

}

function 위치설정(){

    const 카드들 =
    document.querySelectorAll(".캐러셀사진");

    카드들.forEach((카드,i)=>{

        let 차이 =
        i-현재게임;

        if(차이<-1)
            차이+=게임목록.length;

        if(차이>1)
            차이-=게임목록.length;

        if(차이==-1){

            카드.style.left="70px";
            카드.style.top="40px";
            카드.style.transform="scale(.8)";
            카드.style.opacity=".45";
            카드.style.zIndex="1";

        }

        else if(차이==0){

            카드.style.left="330px";
            카드.style.top="0";
            카드.style.transform="scale(1)";
            카드.style.opacity="1";
            카드.style.zIndex="2";

        }

        else if(차이==1){

            카드.style.left="590px";
            카드.style.top="40px";
            카드.style.transform="scale(.8)";
            카드.style.opacity=".45";
            카드.style.zIndex="1";

        }

        else{

            카드.style.left="330px";
            카드.style.top="0";
            카드.style.opacity="0";
            카드.style.transform="scale(.6)";
            카드.style.zIndex="0";

        }

    });

}

function 슬라이드(방향){

    if(애니메이션중) return;

    애니메이션중 = true;

if(방향===1){

    왼쪽.style.left="-220px";

    가운데.style.left="70px";
    가운데.style.top="40px";
    가운데.style.transform="scale(.8)";

    오른쪽.style.left="330px";
    오른쪽.style.top="0";
    오른쪽.style.transform="scale(1)";

}else{

    오른쪽.style.left="900px";

    가운데.style.left="590px";
    가운데.style.top="40px";
    가운데.style.transform="scale(.8)";

    왼쪽.style.left="330px";
    왼쪽.style.top="0";
    왼쪽.style.transform="scale(1)";

}

setTimeout(()=>{

현재게임 += 방향;

if(현재게임<0)
현재게임=게임목록.length-1;

if(현재게임>=게임목록.length)
현재게임=0;

    위치설정();

    화면갱신();

    애니메이션중=false;

},450);

}


document.getElementById("시작").onclick=()=>{

location.href =
게임목록[현재게임].링크;

};

document.getElementById("왼쪽").onclick=()=>{

    슬라이드(-1);

};

document.getElementById("오른쪽").onclick=()=>{

    슬라이드(1);

};

document.getElementById("시작").onclick=()=>{

location.href=
게임목록[현재게임].링크;

};

화면갱신();

위치설정();



</script>

<div id="캐러셀"></div>

<p id="번호"></p>

<div id="점"></div>

<h1 id="게임이름"></h1>

<p id="장르"></p>

<p id="상태"></p>

<p id="게임설명"></p>

<button id="시작">
게임 시작
</button>

<button id="왼쪽">◀</button>

<button id="오른쪽">▶</button>
  
</body>
</html>
