<!DOCTYPE html>
<html>
<head>
<title>돌이 사이트-돌이게임</title>

<style>
body {
  background: linear-gradient(to right, #000033, #000010);
  margin: 0;
}

#게임사진{
    transition:
        transform .35s ease,
        opacity .35s ease;

    opacity:1;
}

#게임사진{

width:260px;
transition:.25s;
border-radius:20px;

}

#게임이름{

color:white;
font-family:jua;
font-size:40px;
text-align:center;

}

#게임설명{

color:white;
font-family:jua;
font-size:22px;
text-align:center;

}

#장르{

color:#87cefa;
font-family:jua;
text-align:center;

}

#상태{

font-family:jua;
color:#7CFC00;
text-align:center;

}

#번호{

font-family:jua;
color:white;
font-size:25px;
text-align:center;

}

#점{

font-size:30px;
color:white;
text-align:center;

}

#시작{

padding:15px 40px;
font-size:25px;
font-family:jua;
border:none;
border-radius:15px;
cursor:pointer;

transition:.2s;

}

#시작:hover{

transform:scale(1.08);

}

#왼쪽,
#오른쪽{

font-size:40px;

width:70px;

height:70px;

border-radius:50%;

cursor:pointer;

}
</style>
</head>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<a href="https://rockey-jason.github.io/doldol-site/" style="text-decoration:none;">
<button style="
position:absolute;
top:0;
left:0;
background:none;
border:none;
color:#f5f5f5;
font-family:'Black Han Sans';
font-size:100px;
cursor:pointer;
">
돌이 사이트
</button>
</a>

<p style="
font-size:20px;
color:#f5f5f5;
font-family:jua;
margin-top:120px;
margin-left:20px;
">
돌이게임-돌이와 관련된 게임들을 이용해 놀수 있습니다!
</p>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">

<script type=module>
const 게임목록 = [
{
    이름:"돌이체스",
    장르:"전략",
    상태:"🟡 개발중",
    설명:"Stockfish AI와 대결하며 레이팅을 올리는 체스 게임입니다.",
    이미지:"https://i.postimg.cc/FsHqfPpX/rockeychess.png",
    링크:"https://rockey-jason.github.io/doldol-chess/"
},
{
    이름:"도로늄 공장",
    장르:"공장 시뮬레이션",
    상태:"🔴 출시 예정",
    설명:"광물을 채굴하고 자동 공장을 만들어 도로늄을 생산하는 게임입니다.",
    이미지:"https://i.postimg.cc/rp1XX0mS/1000005291.jpg",
    링크:"#"
},
{
    이름:"돌이 RPG",
    장르:"RPG",
    상태:"🔴 출시 예정",
    설명:"돌이와 함께 여러 지역을 탐험하는 RPG 게임입니다.",
    이미지:"https://i.postimg.cc/rp1XX0mS/1000005291.jpg",
    링크:"#"
}
];

let 현재게임 = 0;

function 화면갱신(방향 = 1){

    const 게임 = 게임목록[현재게임];
    const 이미지 = document.getElementById("게임사진");

    // 먼저 현재 이미지를 밀어냄
    이미지.style.transform =
        `translateX(${-120 * 방향}px)`;

    이미지.style.opacity = 0;

    setTimeout(()=>{

        이미지.src = 게임.이미지;

        document.getElementById("게임이름").textContent =
            게임.이름;

        document.getElementById("게임설명").textContent =
            게임.설명;

        // 새 이미지를 반대쪽에서 시작
        이미지.style.transition = "none";

        이미지.style.transform =
            `translateX(${120 * 방향}px)`;

        requestAnimationFrame(()=>{

            이미지.style.transition =
                "transform .35s ease, opacity .35s ease";

            이미지.style.opacity = 1;
            이미지.style.transform = "translateX(0)";

        });

    },350);

    document.getElementById("왼쪽").disabled =
        현재게임===0;

    document.getElementById("오른쪽").disabled =
        현재게임===게임목록.length-1;
}

document.getElementById("시작").onclick=()=>{

location.href =
게임목록[현재게임].링크;

};

document.getElementById("왼쪽").onclick = ()=>{

    if(현재게임>0){
        현재게임--;
        화면갱신(-1);
    }

};

document.getElementById("오른쪽").onclick = ()=>{

    if(현재게임<게임목록.length-1){
        현재게임++;
        화면갱신(1);
    }

};

document.getElementById("시작").onclick=()=>{

location.href=
게임목록[현재게임].링크;

};

화면갱신();
      돌이게임.onclick = () => {
    location.href = "https://rockey-jason.github.io/doldol-chess/";
  };


</script>

<img id="게임사진"
src="https://i.postimg.cc/FsHqfPpX/rockeychess.png"
style="
position:fixed;
top:300px;
left:400px;
width:200px;
">

<p id="번호"></p>

<div id="점"></div>

<h1 id="게임이름"></h1>

<p id="장르"></p>

<p id="상태"></p>

<p id="게임설명"></p>

<button id="시작">
게임 시작
</button>

<button id="왼쪽">◀</button>

<button id="오른쪽">▶</button>
  
</body>
</html>
