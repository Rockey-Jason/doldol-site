  margin: 0;

  }

}

<body>

<button style="

">

</button>
</a>

<p style="
font-size:20px;
color:#f5f5f5;
font-family:jua;
margin-top:120px;
margin-left:20px;
  white-space: nowrap;
">
돌이신문 확인-돌이와 관련된 이야기를 읽어보세요!
</p>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://scttowfhygcpdirrekqm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"
);

window.addEventListener("DOMContentLoaded", async () => {

  // 로그인 확인
  const {
    data: { session }
  } = await supabase.auth.getSession();

  console.log("session:", session);

  if (!session) {
    alert("로그인이 필요합니다.");
    location.href = "login.html";
    return;
  }

  // 로그인 유저 (한 번만 가져옴)
  const {
    data: { user }
  } = await supabase.auth.getUser();

  console.log("user:", user);

  if (!user) {
    location.href = "login.html";
    return;
  }

  // 현재 신문 번호
  let 신문번호 = Number(localStorage.getItem("rockeynews"));

  if (!신문번호 || 신문번호 < 1) {
    신문번호 = 1;
    localStorage.setItem("rockeynews", "1");
  }

  // 사용자 정보
  const {
    data: userInfo,
    error: userError
  } = await supabase
    .from("users")
    .select("read_dori_news")
    .eq("user_id", user.id)
    .single();

  if (userError) {
    console.log(userError);
    alert("사용자 정보를 불러오지 못했습니다.");
    return;
  }

  // 마지막 신문 번호
  const {
    data: lastNews,
    error: lastError
  } = await supabase
    .from("rockey_news")
    .select("news_number")
    .order("news_number", { ascending: false })
    .limit(1)
    .single();

  if (lastError) {
    console.log(lastError);
    alert("신문 정보를 불러오지 못했습니다.");
    return;
  }

  const 마지막신문번호 = lastNews.news_number;

  // 읽을 수 있는 신문인지 확인
  if (신문번호 > userInfo.read_dori_news) {
    alert("아직 읽을 수 없는 돌이신문입니다.");
    location.href = "rockeynews.html";
    return;
  }

  // 신문 가져오기
const {
  data: news,
  error: newsError
} = await supabase
  .from("rockey_news")
  .select(`
    news_number,
    rockey_news,
    question,
    choice1,
    choice2,
    choice3,
    choice4,
    choice5,
    answer
  `)
  .eq("news_number", 신문번호)
  .single();

  if (newsError) {
    console.log(newsError);
    alert("신문을 불러오지 못했습니다.");
    return;
  }

  // 제목
  document.getElementById("제목").textContent =
    `제${신문번호}회 돌이신문`;

  // 내용
  const 내용 = document.getElementById("내용");
  내용.innerHTML = news.rockey_news.replace(/\n/g, "<br>");

if (news.question) {

  const 퀴즈 = document.getElementById("퀴즈");

  퀴즈.style.display = "block";

  document.getElementById("문제").textContent = news.question;

  document.getElementById("보기1").textContent = news.choice1;
  document.getElementById("보기2").textContent = news.choice2;
  document.getElementById("보기3").textContent = news.choice3;
  document.getElementById("보기4").textContent = news.choice4;
  document.getElementById("보기5").textContent = news.choice5;


  // 신문 내용 아래에 퀴즈 배치
  requestAnimationFrame(() => {

    const 내용 = document.getElementById("내용");

    const 퀴즈위치 =
      내용.offsetTop +
      내용.offsetHeight +
      50;


    퀴즈.style.position = "absolute";
    퀴즈.style.top = 퀴즈위치 + "px";
    퀴즈.style.left = "20px";
    퀴즈.style.width = "600px";

  });

}

// 퀴즈 제출 기능
const 제출버튼 = document.getElementById("제출");
const 결과 = document.getElementById("결과");


제출버튼.onclick = async () => {


  // 이미 푼 문제인지 확인
  const {
    data: 현재유저
  } = await supabase
    .from("users")
    .select("quiz_answered, quiz_news_number")
    .eq("user_id", user.id)
    .single();


  if (
    현재유저.quiz_answered === true &&
    현재유저.quiz_news_number === 신문번호
  ) {

    결과.textContent = "이미 이 돌이신문 문제를 풀었습니다.";
    return;

  }



  // 선택한 답 가져오기
  const 선택 = document.querySelector(
    'input[name="quiz"]:checked'
  );


  if (!선택) {

    결과.textContent = "답을 선택해주세요.";
    return;

  }



  const 선택한답 = Number(선택.value);


  let 정답여부 = false;


  if (선택한답 === news.answer) {

    정답여부 = true;

  }



  // users 업데이트

  const {
    error:updateError
  } = await supabase
    .from("users")
    .update({

      quiz_right: 정답여부,
      quiz_news_number: 신문번호,
      quiz_answered: true

    })
    .eq("user_id", user.id);



  if(updateError){

    console.log(updateError);
    결과.textContent="저장 실패";
    return;

    if(정답여부){

  결과.textContent = "정답이 제출 되었습니다! 다음 돌이신문 발행 시 결과가 발표됩니다!";

}else{

  결과.textContent = "정답이 제출 되었습니다! 다음 돌이신문 발행 시 결과가 발표됩니다!";

}

  }
};

  const 이전버튼 = document.getElementById("이전");
  const 다음버튼 = document.getElementById("다음");

  // 버튼 숨기기
  if (신문번호 <= 1) {
    이전버튼.style.display = "none";
  }

  if (
    신문번호 >= 마지막신문번호 ||
    신문번호 + 1 > userInfo.read_dori_news
  ) {
    다음버튼.style.display = "none";
  }

  // 버튼 위치를 내용 아래로 이동
  requestAnimationFrame(() => {
    const 퀴즈 = document.getElementById("퀴즈");

let 버튼위치;

if(퀴즈.style.display === "block"){
  버튼위치 = 퀴즈.offsetTop + 퀴즈.offsetHeight + 40;
}
else{
  버튼위치 = 내용.offsetTop + 내용.offsetHeight + 40;
}

    이전버튼.style.top = 버튼위치 + "px";
    다음버튼.style.top = 버튼위치 + "px";
  });

});

// 이전 신문
window.이전신문 = function () {
  let 번호 = Number(localStorage.getItem("rockeynews"));

  번호 = Math.max(1, 번호 - 1);

  localStorage.setItem("rockeynews", 번호);
  location.reload();
};

// 다음 신문
window.다음신문 = function () {
  let 번호 = Number(localStorage.getItem("rockeynews"));

  번호++;

  localStorage.setItem("rockeynews", 번호);
  location.reload();
};
</script>

<button id="제목"
style="
position:absolute;
top:200px;
font-family:jua;
background:none;
border:none;
color:#f5f5f5;

  white-space: nowrap;
">
">
</button>

onclick="다음신문()"

">

">

</button>
  
<div id="내용"
style="

white-space:pre-wrap;

">
</div>

<div id="퀴즈"
style="
padding:20px;

font-family:jua;
color:white;
">
  <h2 id="문제"></h2>

  <label><input type="radio" name="quiz" value="1"> <span id="보기1"></span></label><br><br>

  <label><input type="radio" name="quiz" value="2"> <span id="보기2"></span></label><br><br>

  <label><input type="radio" name="quiz" value="3"> <span id="보기3"></span></label><br><br>

  <label><input type="radio" name="quiz" value="4"> <span id="보기4"></span></label><br><br>

  <label><input type="radio" name="quiz" value="5"> <span id="보기5"></span></label><br><br>

  <button id="제출">제출</button>

  <p id="결과"></p>
</div>
</body>
