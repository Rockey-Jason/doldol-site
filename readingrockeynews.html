<script type="module">


import {

}

from

"https://esm.sh/@supabase/supabase-js@2";


/* =====================================================
   Supabase 설정
===================================================== */

const supabase =

    createClient(

        "https://scttowfhygcpdirrekqm.supabase.co",

        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6IkpXVCJ9"
    );


/*
   ⚠️ 중요

   위 anon key는 반드시 기존에 사용하던
   Supabase anon key로 교체하세요.

   아래에는 기존 코드의 키를 그대로 넣으면 됩니다.
*/


/* =====================================================
   상태
===================================================== */

let 현재사용자 =
    null;

let 현재유저정보 =
    null;

let 현재이벤트 =
    null;

let 신문번호 =
    1;

let 마지막신문번호 =
    1;

let 읽은신문번호들 =
    [];


/* =====================================================
   DOM
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   로딩 종료
===================================================== */

function 로딩종료() {

    const 로딩 =
        $("로딩");

    if (!로딩) {

        return;

    }

    setTimeout(() => {

        로딩.classList.add("완료");

    }, 250);

}


/* =====================================================
   로그인 확인
===================================================== */

async function 로그인확인() {

    const {

        data,
        error

    } =
        await supabase.auth.getSession();


    if (error) {

        console.error(
            "세션 확인 오류:",
            error
        );

        return false;

    }


    if (!data.session) {

        return false;

    }


    현재사용자 =
        data.session.user;


    return true;

}


/* =====================================================
   사용자 정보
===================================================== */

async function 사용자정보불러오기() {

    const {

        data,
        error

    } =
        await supabase

            .from("users")

            .select(`
                read_dori_news,
                read_dori_news_numbers,
                quiz_answers
            `)

            .eq(
                "user_id",
                현재사용자.id
            )

            .single();


    if (error) {

        console.error(
            "사용자 정보 오류:",
            error
        );

        alert(
            "사용자 정보를 불러오지 못했습니다."
        );

        return false;

    }


    현재유저정보 =
        data;


    읽은신문번호들 =
        Array.isArray(
            data.read_dori_news_numbers
        )

            ? data.read_dori_news_numbers
                .map(Number)
                .filter(Number.isInteger)

            : [];


    return true;

}


/* =====================================================
   신문 번호
===================================================== */

function 신문번호불러오기() {

    const 저장된번호 =

        Number(
            localStorage.getItem(
                "rockeynews"
            )
        );


    if (
        Number.isInteger(
            저장된번호
        )
        &&
        저장된번호 >= 1
    ) {

        신문번호 =
            저장된번호;

    }

    else {

        신문번호 =
            1;

        localStorage.setItem(
            "rockeynews",
            "1"
        );

    }

}


/* =====================================================
   마지막 신문
===================================================== */

async function 마지막신문불러오기() {

    const {

        data,
        error

    } =
        await supabase

            .from("rockey_news")

            .select("news_number")

            .order(
                "news_number",
                {
                    ascending:
                        false
                }
            )

            .limit(1)
            .single();


    if (error) {

        console.error(
            "마지막 신문 조회 오류:",
            error
        );

        return false;

    }


    마지막신문번호 =
        Number(
            data.news_number
        );


    return true;

}


/* =====================================================
   현재 신문 가져오기
===================================================== */

async function 신문불러오기() {

    const {

        data: news,
        error

    } =
        await supabase

            .from("rockey_news")

            .select(`
                news_number,
                rockey_news,
                question,
                question_type,
                choice1,
                choice2,
                choice3,
                choice4,
                choice5,
                answer
            `)

            .eq(
                "news_number",
                신문번호
            )

            .single();


    if (error) {

        console.error(
            "신문 조회 오류:",
            error
        );

        alert(
            "신문을 불러오지 못했습니다."
        );

        return false;

    }


    $("제목").textContent =
        `제${신문번호}회 돌이신문`;


    $("내용").innerHTML =

        String(
            news.rockey_news || ""
        )

            .replace(
                /\\n/g,
                "<br>"
            )

            .replace(
                /\/n/g,
                ""
            );


    퀴즈설정(news);

    return true;

}


/* =====================================================
   퀴즈 설정
===================================================== */

function 퀴즈설정(news) {

    const 퀴즈 =
        $("퀴즈");


    if (!news.question) {

        퀴즈.style.display =
            "none";

        return;

    }


    퀴즈.style.display =
        "block";


    $("문제").textContent =
        news.question;


    const 객관식 =
        $("객관식");

    const 주관식 =
        $("주관식");


    if (
        news.question_type ===
        "multiple"
    ) {

        객관식.style.display =
            "block";

        주관식.style.display =
            "none";


        $("보기1").textContent =
            news.choice1 || "";

        $("보기2").textContent =
            news.choice2 || "";

        $("보기3").textContent =
            news.choice3 || "";

        $("보기4").textContent =
            news.choice4 || "";

        $("보기5").textContent =
            news.choice5 || "";

    }

    else if (
        news.question_type ===
        "subjective"
    ) {

        객관식.style.display =
            "none";

        주관식.style.display =
            "block";

    }

    else {

        퀴즈.style.display =
            "none";

    }


    이전답불러오기(news);

}


/* =====================================================
   이전 답
===================================================== */

function 이전답불러오기(news) {

    const 답목록 =
        현재유저정보.quiz_answers || {};


    const 이전답 =
        답목록[신문번호];


    const 제출 =
        $("제출");


    const 내답 =
        $("내답");


    if (
        이전답 === undefined ||
        이전답 === null
    ) {

        제출.disabled =
            false;

        제출.textContent =
            "제출";

        return;

    }


    if (
        news.question_type ===
        "multiple"
    ) {

        const 선택 =
            document.querySelector(
                `input[name="quiz"][value="${이전답}"]`
            );


        if (선택) {

            선택.checked =
                true;

        }


        document

            .querySelectorAll(
                'input[name="quiz"]'
            )

            .forEach(
                radio => {

                    radio.disabled =
                        true;

                }
            );


        내답.textContent =
            `내가 제출한 답 : ${이전답}번`;

    }


    else if (
        news.question_type ===
        "subjective"
    ) {

        const 입력 =
            $("주관식답");


        입력.value =
            이전답;


        입력.disabled =
            true;


        내답.textContent =
            `내가 제출한 답 : ${이전답}`;

    }


    제출.textContent =
        "제출됨";

    제출.disabled =
        true;

}


/* =====================================================
   퀴즈 제출
===================================================== */

async function 퀴즈제출() {

    const 퀴즈 =
        $("퀴즈");


    if (
        퀴즈.style.display !==
        "block"
    ) {

        return;

    }


    let 선택한답;


    const 객관식 =
        $("객관식");


    if (
        객관식.style.display ===
        "block"
    ) {

        const 선택 =
            document.querySelector(
                'input[name="quiz"]:checked'
            );


        if (!선택) {

            $("결과").textContent =
                "답을 선택해주세요.";

            return;

        }


        선택한답 =
            Number(
                선택.value
            );

    }


    else {

        const 입력 =
            $("주관식답");


        선택한답 =
            입력.value.trim();


        if (!선택한답) {

            $("결과").textContent =
                "답을 입력해주세요.";

            return;

        }

    }


    제출버튼잠금(true);


    /* 현재 신문 다시 조회 */

    const {

        data: news,
        error: newsError

    } =
        await supabase

            .from("rockey_news")

            .select(`
                question_type,
                answer
            `)

            .eq(
                "news_number",
                신문번호
            )

            .single();


    if (newsError) {

        console.error(
            newsError
        );

        제출버튼잠금(false);

        $("결과").textContent =
            "신문 정보를 확인하지 못했습니다.";

        return;

    }


    let 정답여부 =
        false;


    if (
        news.question_type ===
        "multiple"
    ) {

        정답여부 =
            선택한답 ===
            Number(
                news.answer
            );

    }


    else {

        정답여부 =

            String(
                선택한답
            )
                .trim()
                .toLowerCase()

            ===

            String(
                news.answer
            )
                .trim()
                .toLowerCase();

    }


    /* 사용자 답 가져오기 */

    const {

        data: userData,
        error: userError

    } =
        await supabase

            .from("users")

            .select("quiz_answers")

            .eq(
                "user_id",
                현재사용자.id
            )

            .single();


    if (userError) {

        제출버튼잠금(false);

        $("결과").textContent =
            "사용자 정보를 불러오지 못했습니다.";

        return;

    }


    let 답목록 =
        userData.quiz_answers || {};


    답목록[신문번호] =
        선택한답;


    /* 저장 */

    const {

        error

    } =
        await supabase

            .from("users")

            .update({

                quiz_right:
                    정답여부,

                quiz_news_number:
                    신문번호,

                quiz_answered:
                    true,

                quiz_answers:
                    답목록

            })

            .eq(
                "user_id",
                현재사용자.id
            );


    if (error) {

        console.error(
            "퀴즈 저장 오류:",
            error
        );

        제출버튼잠금(false);

        $("결과").textContent =
            "저장에 실패했습니다.";

        return;

    }


    현재유저정보.quiz_answers =
        답목록;


    $("결과").textContent =
        정답여부
            ? "🎉 정답입니다!"
            : "😢 아쉽지만 오답입니다.";


    $("제출").textContent =
        "제출됨";


    $("내답").textContent =

        news.question_type ===
        "multiple"

            ? `내가 제출한 답 : ${선택한답}번`

            : `내가 제출한 답 : ${선택한답}`;


}


/* =====================================================
   제출 버튼 잠금
===================================================== */

function 제출버튼잠금(잠금) {

    $("제출").disabled =
        잠금;


    if (잠금) {

        $("제출").textContent =
            "저장 중...";

    }

}


/* =====================================================
   이벤트 확인
===================================================== */

async function 이벤트확인() {

    const 이벤트 =
        $("이벤트");


    현재이벤트 =
        null;


    if (
        신문번호 % 10 !==
        0
    ) {

        이벤트.style.display =
            "none";

        return;

    }


    const {

        data,
        error

    } =
        await supabase

            .from("rockey_news_events")

            .select("*")

            .eq(
                "news_number",
                신문번호
            )

            .eq(
                "enabled",
                true
            )

            .maybeSingle();


    if (error) {

        console.error(
            "이벤트 조회 오류:",
            error
        );

        이벤트.style.display =
            "none";

        return;

    }


    if (!data) {

        이벤트.style.display =
            "none";

        return;

    }


    현재이벤트 =
        data;


    이벤트.style.display =
        "block";


    $("이벤트제목").textContent =
        "🎉 " + data.event_name;


    $("이벤트설명").textContent =
        data.description || "";


    $("이벤트보상").textContent =
        Number(
            data.reward_coins || 0
        ).toLocaleString();


    await 이벤트참여상태확인();

}


/* =====================================================
   이벤트 참여 상태
===================================================== */

async function 이벤트참여상태확인() {

    if (!현재이벤트) {

        return;

    }


    const {

        data,
        error

    } =
        await supabase

            .from("event_participations")

            .select(
                "reward_claimed"
            )

            .eq(
                "user_id",
                현재사용자.id
            )

            .eq(
                "event_id",
                현재이벤트.id
            )

            .maybeSingle();


    if (error) {

        $("이벤트결과").textContent =
            "이벤트 참여 정보를 확인할 수 없습니다.";

        return;

    }


    if (
        data?.reward_claimed ===
        true
    ) {

        $("이벤트참여").disabled =
            true;

        $("이벤트참여").textContent =
            "보상 수령 완료";

        $("이벤트결과").textContent =
            "🎉 이미 보상을 받았습니다.";

    }

    else {

        $("이벤트참여").disabled =
            false;

        $("이벤트참여").textContent =
            "이벤트 참여하기";

        $("이벤트결과").textContent =
            "";

    }

}


/* =====================================================
   이벤트 참여
===================================================== */

async function 이벤트참여하기() {

    if (!현재이벤트) {

        return;

    }


    const 버튼 =
        $("이벤트참여");


    버튼.disabled =
        true;

    버튼.textContent =
        "보상 지급 중...";


    const {

        data,
        error

    } =
        await supabase.rpc(

            "claim_news_event",

            {

                p_event_id:
                    현재이벤트.id

            }

        );


    if (error) {

        console.error(
            "이벤트 보상 오류:",
            error
        );


        버튼.disabled =
            false;

        버튼.textContent =
            "이벤트 참여하기";


        $("이벤트결과").textContent =
            error.message ||
            "보상 지급에 실패했습니다.";

        return;

    }


    if (
        !data ||
        data.success !== true
    ) {

        버튼.disabled =
            false;

        버튼.textContent =
            "이벤트 참여하기";


        $("이벤트결과").textContent =
            "보상 지급에 실패했습니다.";

        return;

    }


    버튼.textContent =
        "보상 수령 완료";


    $("이벤트결과").textContent =

        `🎉 ${
            Number(
                data.reward_coins
            ).toLocaleString()
        } 돌돌코인을 받았습니다!`;

}


/* =====================================================
   읽음 여부
===================================================== */

function 현재신문읽음확인() {

    return 읽은신문번호들.includes(
        신문번호
    );

}


/* =====================================================
   읽음 버튼
===================================================== */

function 읽음버튼업데이트() {

    const 버튼 =
        $("읽음버튼");


    if (
        현재신문읽음확인()
    ) {

        버튼.textContent =
            "✅ 읽음";

        버튼.disabled =
            true;

        버튼.style.opacity =
            ".55";

    }

    else {

        버튼.textContent =
            "📖 돌이신문 읽음";

        버튼.disabled =
            false;

        버튼.style.opacity =
            "1";

    }

}


/* =====================================================
   읽음 저장
===================================================== */

async function 읽음저장() {

    if (
        현재신문읽음확인()
    ) {

        return;

    }


    const 버튼 =
        $("읽음버튼");


    버튼.disabled =
        true;

    버튼.textContent =
        "💾 저장 중...";


    const {

        data,
        error

    } =
        await supabase

            .from("users")

            .select(
                "read_dori_news_numbers"
            )

            .eq(
                "user_id",
                현재사용자.id
            )

            .single();


    if (error) {

        console.error(
            "읽음 정보 조회 오류:",
            error
        );


        읽음버튼업데이트();

        return;

    }


    let 목록 =
        Array.isArray(
            data.read_dori_news_numbers
        )

            ? data.read_dori_news_numbers
                .map(Number)
                .filter(Number.isInteger)

            : [];


    if (
        !목록.includes(
            신문번호
        )
    ) {

        목록.push(
            신문번호
        );

    }


    목록.sort(
        (a,b) =>
            a - b
    );


    const {

        error: 저장오류

    } =
        await supabase

            .from("users")

            .update({

                read_dori_news_numbers:
                    목록

            })

            .eq(
                "user_id",
                현재사용자.id
            );


    if (저장오류) {

        console.error(
            "읽음 저장 오류:",
            저장오류
        );


        alert(
            "돌이신문 읽음 저장에 실패했습니다."
        );


        읽음버튼업데이트();

        return;

    }


    읽은신문번호들 =
        목록;


    읽음버튼업데이트();

}


/* =====================================================
   이전 / 다음 버튼
===================================================== */

function 네비게이션설정() {

    const 이전 =
        $("이전");

    const 다음 =
        $("다음");


    이전.disabled =
        신문번호 <= 1;


    다음.disabled =

        신문번호 >=
        마지막신문번호

        ||

        신문번호 + 1 >
        Number(
            현재유저정보.read_dori_news
        );


    이전.onclick = () => {

        if (
            신문번호 <= 1
        ) {

            return;

        }


        신문번호--;


        localStorage.setItem(
            "rockeynews",
            String(
                신문번호
            )
        );


        location.reload();

    };


    다음.onclick = () => {

        if (
            다음.disabled
        ) {

            return;

        }


        신문번호++;


        localStorage.setItem(
            "rockeynews",
            String(
                신문번호
            )
        );


        location.reload();

    };

}


/* =====================================================
   버튼 이벤트
===================================================== */

function 이벤트설정() {

    $("제출").onclick =
        퀴즈제출;


    $("읽음버튼").onclick =
        읽음저장;


    $("이벤트참여").onclick =
        이벤트참여하기;

}


/* =====================================================
   초기화
===================================================== */

async function 초기화() {

    try {

        const 로그인됨 =
            await 로그인확인();


        if (!로그인됨) {

            alert(
                "로그인이 필요합니다."
            );

            location.href =
                "login.html";

            return;

        }


        const 정보불러오기 =
            await 사용자정보불러오기();


        if (!정보불러오기) {

            return;

        }


        신문번호불러오기();


        /*
           읽을 수 없는 신문 방지
        */

        if (
            신문번호 >
            Number(
                현재유저정보.read_dori_news
            )
        ) {

            alert(
                "아직 읽을 수 없는 돌이신문입니다."
            );


            신문번호 =
                Number(
                    현재유저정보.read_dori_news
                )
                || 1;


            localStorage.setItem(
                "rockeynews",
                String(
                    신문번호
                )
            );


            location.reload();

            return;

        }


        const 마지막신문성공 =
            await 마지막신문불러오기();


        if (!마지막신문성공) {

            return;

        }


        const 신문성공 =
            await 신문불러오기();


        if (!신문성공) {

            return;

        }


        await 이벤트확인();


        읽음버튼업데이트();


        네비게이션설정();


        이벤트설정();

    }

        );


        alert(

        );

    }

}
