<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>돌이신문 읽기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: "HancomMalrangmalrang";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: "HancomMalrangmalrang";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
}

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
}

input,
textarea {
    -webkit-user-select: text;
    user-select: text;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: #f5f5f5;
    background:
        radial-gradient(circle at 15% 10%, rgba(80, 80, 180, .18), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(40, 40, 130, .16), transparent 35%),
        linear-gradient(135deg, #000033, #000010);
    font-family: "HancomMalrangmalrang", sans-serif;
    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .55;
}

/* =====================================================
   상단
===================================================== */

#사이트로고 {
    display: block;
    width: fit-content;
    margin: 22px 20px 0;
    padding: 0;
    color: #fff;
    font-family: "Black Han Sans", sans-serif;
    font-size: clamp(42px, 8vw, 82px);
    line-height: 1;
    text-decoration: none;
    transition: .25s;
}

#사이트로고:hover {
    color: #b9b9ff;
    transform: translateX(4px);
}

#사이트설명 {
    margin: 20px auto 0;
    padding: 0 20px;
    max-width: 900px;
    color: #d9d9f5;
    font-size: clamp(17px, 2.5vw, 22px);
    font-weight: 700;
    line-height: 1.6;
}

/* =====================================================
   메인
===================================================== */

#페이지 {
    width: min(100% - 32px, 900px);
    margin: 30px auto 80px;
}

#신문헤더 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

#신문번호 {
    color: #a9a9ff;
    font-size: 18px;
    font-weight: 700;
}

#신문제목 {
    margin: 0;
    color: #fff;
    font-size: clamp(28px, 5vw, 48px);
    line-height: 1.25;
    font-weight: 700;
}

#신문날짜 {
    color: #aaaad0;
    font-size: 15px;
}

/* =====================================================
   기사
===================================================== */

.기사카드 {
    padding: clamp(22px, 4vw, 38px);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 26px;
    background:
        linear-gradient(145deg, rgba(35,35,90,.82), rgba(8,8,35,.86));
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
}

#내용 {
    color: #f1f1ff;
    font-size: clamp(17px, 2.5vw, 22px);
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* =====================================================
   버튼
===================================================== */

.버튼줄 {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.기본버튼 {
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px;
    padding: 13px 20px;
    color: white;
    background: rgba(255,255,255,.08);
    font-size: 17px;
    font-weight: 700;
    transition: .2s;
}

.기본버튼:hover {
    background: rgba(255,255,255,.16);
    transform: translateY(-2px);
}

.주요버튼 {
    border: none;
    border-radius: 15px;
    padding: 15px 25px;
    color: #11112c;
    background: linear-gradient(135deg, #d9d9ff, #8d8dff);
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 8px 25px rgba(120,120,255,.2);
    transition: .2s;
}

.주요버튼:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 30px rgba(120,120,255,.3);
}

/* =====================================================
   퀴즈
===================================================== */

#퀴즈 {
    display: none;
    margin-top: 25px;
    padding: clamp(22px, 4vw, 35px);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 26px;
    background:
        linear-gradient(145deg, rgba(35,35,90,.82), rgba(8,8,35,.86));
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

#퀴즈 h2 {
    margin: 0 0 25px;
    color: #fff;
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.5;
}

#객관식 {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.보기 {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    color: #f5f5f5;
    font-size: 17px;
    line-height: 1.5;
    cursor: pointer;
    transition: .2s;
}

.보기:hover {
    background: rgba(255,255,255,.12);
    transform: translateX(4px);
}

.보기 input {
    accent-color: #9292ff;
    transform: scale(1.2);
}

#주관식 {
    display: none;
}

#주관식답 {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    outline: none;
    color: white;
    background: rgba(0,0,0,.25);
    font-size: 17px;
}

#주관식답:focus {
    border-color: #8888ff;
}

#내답,
#결과 {
    margin: 15px 0 0;
    font-size: 17px;
    line-height: 1.6;
}

#결과.정답 {
    color: #71e6a3;
}

#결과.오답 {
    color: #ff8c9c;
}

/* =====================================================
   읽음 표시
===================================================== */

#읽음상태 {
    display: none;
    margin-top: 18px;
    color: #71e6a3;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
}

/* =====================================================
   로딩
===================================================== */

#로딩 {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,20,.86);
    backdrop-filter: blur(8px);
}

.로딩상자 {
    text-align: center;
    color: white;
}

.로딩원 {
    width: 45px;
    height: 45px;
    margin: 0 auto 15px;
    border: 4px solid rgba(255,255,255,.15);
    border-top-color: #a4a4ff;
    border-radius: 50%;
    animation: 회전 1s linear infinite;
}

@keyframes 회전 {
    to { transform: rotate(360deg); }
}

/* =====================================================
   보상 모달
===================================================== */

#보상배경 {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,20,.72);
    backdrop-filter: blur(12px);
}

#보상배경.show {
    display: flex;
}

#보상상자 {
    position: relative;
    width: min(100%, 430px);
    padding: 35px 25px 30px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 28px;
    background:
        radial-gradient(circle at 50% 0%, rgba(140,140,255,.18), transparent 55%),
        linear-gradient(145deg, #18184c, #080820);
    box-shadow: 0 25px 100px rgba(0,0,0,.6);
    text-align: center;
    overflow: hidden;
    animation: 보상등장 .45s cubic-bezier(.22,1,.36,1);
}

@keyframes 보상등장 {
    from {
        opacity: 0;
        transform: scale(.7) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

#보상닫기 {
    position: absolute;
    top: 12px;
    right: 16px;
    border: none;
    background: none;
    color: #aaa;
    font-size: 25px;
}

#보상아이콘 {
    position: relative;
    z-index: 2;
    font-size: 70px;
    filter: drop-shadow(0 0 20px rgba(255,215,70,.45));
    animation: 코인점프 1.2s ease-in-out infinite;
}

@keyframes 코인점프 {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
}

#보상제목 {
    margin: 15px 0 8px;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
}

#보상금액 {
    margin: 0;
    color: #ffe477;
    font-size: 40px;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(255,220,100,.35);
}

#보상설명 {
    margin: 10px 0 0;
    color: #bdbddc;
    font-size: 15px;
}

#보상잔액 {
    margin: 20px 0 0;
    color: #d9d9ff;
    font-size: 15px;
}

.코인 {
    position: absolute;
    top: 110%;
    left: 50%;
    z-index: 1;
    width: 25px;
    height: 25px;
    border: 3px solid #ffe477;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff2a8, #e8ad27);
    box-shadow: 0 0 15px rgba(255,215,70,.6);
    pointer-events: none;
    animation: 코인상승 2.5s ease-out forwards;
}

@keyframes 코인상승 {
    0% {
        opacity: 0;
        transform: translate(-50%, 0) rotate(0deg) scale(.5);
    }
    15% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate(
            calc(-50% + var(--x)),
            -420px
        ) rotate(720deg) scale(1.1);
    }
}

/* =====================================================
   반응형
===================================================== */

@media (max-width: 600px) {
    #페이지 {
        width: min(100% - 24px, 900px);
        margin-top: 22px;
    }

    #사이트설명 {
        margin-top: 15px;
        padding: 0 16px;
    }

    #신문헤더 {
        gap: 8px;
    }

    .기사카드,
    #퀴즈 {
        border-radius: 20px;
        padding: 20px;
    }

    .버튼줄 {
        flex-direction: column;
    }

    .버튼줄 button {
        width: 100%;
    }

    #보상금액 {
        font-size: 34px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<a
    id="사이트로고"

</a>

<p id="사이트설명">

</p>

<main id="페이지">

    <section id="신문헤더">
        <div>
            <div id="신문번호">돌이신문</div>

            <div id="신문날짜"></div>

    </section>

    <article class="기사카드">

                <input type="radio" name="quiz" value="3">

            </label>

            <label class="보기">
                <input type="radio" name="quiz" value="4">
                <span id="보기4"></span>
            </label>

            <label class="보기">
                <input type="radio" name="quiz" value="5">

        <p id="내답"></p>

</main>

<!-- 로딩 -->
<div id="로딩">
    <div class="로딩상자">
        <div class="로딩원"></div>
        <div>돌이신문을 불러오는 중...</div>
    </div>
</div>

<!-- 보상 모달 -->
<div id="보상배경">

    <div id="보상상자">

        <button
            id="보상닫기"

        >
            ×
        </button>

        <div id="보상아이콘">🪙</div>

        <h2 id="보상제목">보상 획득!</h2>

        <p id="보상금액">+1,000</p>

        <p id="보상설명">
            돌돌코인이 지급되었습니다!
        </p>

        <p id="보상잔액"></p>

    </div>

</div>

<script type="module">

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";

/* =====================================================
   Supabase
===================================================== */

const supabase = createClient(
    "https://scttowfhygcpdirrekqm.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmUiLCJyb2xlIjoiYW5vbiJ9"
);

/*
    위 키는 예시가 아니라 기존에 사용하던
    Supabase anon key를 그대로 넣어야 합니다.

    ⚠️ 주의:
    실제 anon key가 기존 코드와 다르면
    기존 코드의 키로 교체하세요.
*/

/* =====================================================
   DOM
===================================================== */

const 로딩 = document.getElementById("로딩");

const 신문번호 = document.getElementById("신문번호");
const 신문제목 = document.getElementById("신문제목");
const 신문날짜 = document.getElementById("신문날짜");
const 내용 = document.getElementById("내용");

const 이전버튼 = document.getElementById("이전");
const 다음버튼 = document.getElementById("다음");
const 읽음저장버튼 = document.getElementById("읽음저장버튼");
const 읽음상태 = document.getElementById("읽음상태");

const 퀴즈 = document.getElementById("퀴즈");
const 문제 = document.getElementById("문제");
const 객관식 = document.getElementById("객관식");
const 주관식 = document.getElementById("주관식");
const 주관식답 = document.getElementById("주관식답");
const 제출버튼 = document.getElementById("제출");
const 내답 = document.getElementById("내답");
const 결과 = document.getElementById("결과");

const 보상배경 = document.getElementById("보상배경");
const 보상닫기 = document.getElementById("보상닫기");
const 보상금액 = document.getElementById("보상금액");
const 보상설명 = document.getElementById("보상설명");
const 보상잔액 = document.getElementById("보상잔액");
const 보상상자 = document.getElementById("보상상자");

/* =====================================================
   상태
===================================================== */

let 현재신문번호 = 0;
let 현재신문 = null;
let 로그인사용자 = null;
let 현재보상애니메이션 = null;

/* =====================================================
   로그인 확인
===================================================== */

async function 로그인확인() {

    const {
        data: {
            session
        },
        error
    } = await supabase.auth.getSession();

    if (error) {
        throw error;
    }

    if (!session) {
        alert(
            "로그인을 하지 않아 이 기능을 사용할 수 없습니다. 먼저 로그인을 완료해주세요."
        );

        location.href = "https://rockey-jason.github.io/doldol-site/";
        return false;
    }

    로그인사용자 = session.user;

    return true;
}

/* =====================================================
   신문 번호
===================================================== */

function 신문번호가져오기() {

    const 저장된번호 = localStorage.getItem("rockeynews");

    const 번호 = Number(저장된번호);

    if (!Number.isInteger(번호) || 번호 <= 0) {
        return 1;
    }

    return 번호;
}

/* =====================================================
   신문 불러오기
===================================================== */

async function 신문불러오기(번호) {

    const {
        data,
        error
    } = await supabase
        .from("rockey_news")
        .select("*")
        .eq("news_number", 번호)
        .maybeSingle();

    if (error) {
        throw error;
    }

    if (!data) {
        throw new Error("신문을 찾을 수 없습니다.");
    }

    return data;
}

/* =====================================================
   읽은 신문 확인
===================================================== */

async function 읽은신문확인(번호) {

    if (!로그인사용자) {
        return false;
    }

    const {
        data,
        error
    } = await supabase
        .from("users")
        .select("read_dori_news_numbers")
        .eq("user_id", 로그인사용자.id)
        .maybeSingle();

    if (error) {
        console.warn("읽은 신문 확인 오류:", error);
        return false;
    }

    const 읽은목록 = Array.isArray(data?.read_dori_news_numbers)
        ? data.read_dori_news_numbers.map(Number)
        : [];

    return 읽은목록.includes(Number(번호));
}

/* =====================================================
   신문 표시
===================================================== */

async function 신문표시(신문) {

    현재신문 = 신문;
    현재신문번호 = Number(신문.news_number);

    신문번호.textContent =
        `제 ${현재신문번호}호`;

    신문제목.textContent =
        신문.title ||
        신문.news_title ||
        `돌이신문 ${현재신문번호}호`;

    신문날짜.textContent =
        신문.created_at
            ? new Date(신문.created_at).toLocaleDateString("ko-KR")
            : "";

    내용.textContent =
        신문.rockey_news || "";

    퀴즈.style.display =
        신문.question
            ? "block"
            : "none";

    퀴즈초기화();

    const 이미읽음 =
        await 읽은신문확인(현재신문번호);

    읽음저장버튼.disabled = 이미읽음;

    읽음저장버튼.textContent =
        이미읽음
            ? "✅ 읽음 처리됨"
            : "📖 읽음 저장";

    읽음상태.style.display =
        이미읽음
            ? "block"
            : "none";

    이전버튼.disabled =
        현재신문번호 <= 1;

    다음버튼.disabled =
        false;
}

/* =====================================================
   퀴즈 초기화
===================================================== */

function 퀴즈초기화() {

    내답.textContent = "";
    결과.textContent = "";
    결과.className = "";

    document
        .querySelectorAll('input[name="quiz"]')
        .forEach(input => {
            input.checked = false;
        });

    주관식답.value = "";

    if (!현재신문?.question) {
        return;
    }

    문제.textContent =
        현재신문.question;

    const 문제종류 =
        현재신문.question_type || "choice";

    if (
        문제종류 === "subjective" ||
        문제종류 === "short"
    ) {

        객관식.style.display = "none";
        주관식.style.display = "block";

    } else {

        객관식.style.display = "flex";
        주관식.style.display = "none";

        for (let i = 1; i <= 5; i++) {

            const 보기 =
                document.getElementById(`보기${i}`);

            const 값 =
                현재신문[`choice${i}`];

            보기.textContent =
                값 || "";

            보기.parentElement.style.display =
                값 ? "flex" : "none";
        }
    }
}

/* =====================================================
   읽음 저장 + 보상
===================================================== */

async function 읽음저장() {

    if (!로그인사용자) {
        alert("로그인이 필요합니다.");
        return;
    }

    if (!현재신문번호) {
        return;
    }

    읽음저장버튼.disabled = true;
    읽음저장버튼.textContent = "저장 중...";

    try {

        const {
            data,
            error
        } = await supabase.rpc(
            "claim_news_reward",
            {
                p_news_number: 현재신문번호,
                p_reward_type: "news_read"
            }
        );

        if (error) {
            throw error;
        }

        읽음저장버튼.textContent =
            "✅ 읽음 처리됨";

        읽음상태.style.display =
            "block";

        if (data?.success) {

            보상모달열기(
                data.amount,
                data.balance,
                "신문을 읽고 받은 보상입니다!"
            );

        } else {

            alert(
                data?.message ||
                "이미 지급받은 보상입니다."
            );
        }

    } catch (error) {

        console.error("신문 보상 오류:", error);

        alert(
            "읽음 저장 중 오류가 발생했습니다.\n" +
            error.message
        );

        읽음저장버튼.disabled = false;

        읽음저장버튼.textContent =
            "📖 읽음 저장";
    }
}

/* =====================================================
   퀴즈 정답 제출
===================================================== */

async function 퀴즈제출() {

    if (!현재신문) {
        return;
    }

    제출버튼.disabled = true;

    let 내답값 = "";

    const 문제종류 =
        현재신문.question_type || "choice";

    if (
        문제종류 === "subjective" ||
        문제종류 === "short"
    ) {

        내답값 =
            주관식답.value.trim();

    } else {

        const 선택 =
            document.querySelector(
                'input[name="quiz"]:checked'
            );

        if (!선택) {

            alert("답을 선택해주세요.");

            제출버튼.disabled = false;

            return;
        }

        내답값 = 선택.value;
    }

    내답.textContent =
        `내 답: ${내답값}`;

    const 정답 =
        String(현재신문.answer ?? "").trim();

    const 맞음 =
        내답값.toLowerCase() ===
        정답.toLowerCase();

    if (!맞음) {

        결과.textContent =
            "❌ 아쉽지만 오답입니다.";

        결과.className =
            "오답";

        제출버튼.disabled = false;

        return;
    }

    결과.textContent =
        "🎉 정답입니다!";

    결과.className =
        "정답";

    try {

        const {
            data,
            error
        } = await supabase.rpc(
            "claim_news_reward",
            {
                p_news_number: 현재신문번호,
                p_reward_type: "quiz_correct"
            }
        );

        if (error) {
            throw error;
        }

        if (data?.success) {

            보상모달열기(
                data.amount,
                data.balance,
                "퀴즈 정답 보상입니다!"
            );

        } else {

            alert(
                data?.message ||
                "이미 지급받은 보상입니다."
            );
        }

    } catch (error) {

        console.error("퀴즈 보상 오류:", error);

        alert(
            "퀴즈 보상 처리 중 오류가 발생했습니다.\n" +
            error.message
        );

    } finally {

        제출버튼.disabled = false;
    }
}

/* =====================================================
   보상 모달
===================================================== */

function 보상모달열기(금액, 잔액, 설명) {

    보상금액.textContent =
        `+${Number(금액).toLocaleString()} 돌돌코인`;

    보상설명.textContent =
        설명;

    보상잔액.textContent =
        `현재 잔액: ${Number(잔액).toLocaleString()} 돌돌코인`;

    보상배경.classList.add("show");

    코인애니메이션시작();
}

function 보상모달닫기() {

    보상배경.classList.remove("show");

    if (현재보상애니메이션) {
        clearInterval(현재보상애니메이션);
        현재보상애니메이션 = null;
    }

    보상상자
        .querySelectorAll(".코인")
        .forEach(코인 => 코인.remove());
}

function 코인애니메이션시작() {

    if (현재보상애니메이션) {
        clearInterval(현재보상애니메이션);
    }

    const 생성 = () => {

        const 코인 =
            document.createElement("span");

        코인.className = "코인";

        코인.style.setProperty(
            "--x",
            `${Math.random() * 320 - 160}px`
        );

        코인.style.left =
            `${Math.random() * 100}%`;

        코인.style.animationDelay =
            `${Math.random() * .5}s`;

        보상상자.appendChild(코인);

        setTimeout(() => {
            코인.remove();
        }, 3000);
    };

    for (let i = 0; i < 18; i++) {
        setTimeout(생성, i * 90);
    }

    현재보상애니메이션 =
        setInterval(생성, 280);
}

/* =====================================================
   이전 / 다음
===================================================== */

async function 이전신문() {

    if (현재신문번호 <= 1) {
        return;
    }

    localStorage.setItem(
        "rockeynews",
        String(현재신문번호 - 1)
    );

    location.reload();
}

async function 다음신문() {

    const 다음번호 =
        현재신문번호 + 1;

    const 다음신문데이터 =
        await 신문불러오기(다음번호);

    if (!다음신문데이터) {
        alert("다음 신문이 아직 발행되지 않았습니다.");
        return;
    }

    localStorage.setItem(
        "rockeynews",
        String(다음번호)
    );

    location.reload();
}

/* =====================================================
   이벤트
===================================================== */

읽음저장버튼.addEventListener(
    "click",
    읽음저장
);

제출버튼.addEventListener(
    "click",
    퀴즈제출
);

이전버튼.addEventListener(
    "click",
    이전신문
);

다음버튼.addEventListener(
    "click",
    다음신문
);

보상닫기.addEventListener(
    "click",
    보상모달닫기
);

보상배경.addEventListener(
    "click",
    event => {

        if (event.target === 보상배경) {
            보상모달닫기();
        }

    }
);

/* =====================================================
   시작
===================================================== */

async function 시작() {

    try {

        const 로그인됨 =
            await 로그인확인();

        if (!로그인됨) {
            return;
        }

        현재신문번호 =
            신문번호가져오기();

        const 신문 =
            await 신문불러오기(현재신문번호);

        await 신문표시(신문);

    } catch (error) {

        console.error("신문 로딩 오류:", error);

        alert(
            "신문을 불러오는 중 오류가 발생했습니다.\n" +
            error.message
        );

        내용.textContent =
            "신문을 불러오지 못했습니다.";

    } finally {

        로딩.style.display = "none";
    }
}

시작();

</script>
