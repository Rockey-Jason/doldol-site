<!DOCTYPE html>
<html>
<head>
<title>돌이 사이트-돌이신문</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<style>
body {
  background: linear-gradient(to right, #000033, #000010);
  margin: 0;
}

/* 컴퓨터 기본값 */
#내용{
  font-size:20px !important;
  
}

#제목{
  font-size:80px !important;
  left:250px !important;
}

/* 스마트폰 */
@media (max-width:1500px){

  #내용{
    font-size:25px !important;
  }

  #제목{
    font-size:50px !important;
    left:23px !important;
  }

}
  @media screen and (max-width:1500px){

}
</style>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<body>

<a href="https://rockey-jason.github.io/doldol-site/" style="text-decoration:none;">
<button style="
position:absolute;
top:0;
left:0;
background:none;
border:none;
color:#f5f5f5;
font-family:'Black Han Sans';
font-size:100px;
cursor:pointer;
  white-space: nowrap;
">
돌이 사이트
</button>
</a>

<p style="
font-size:20px;
color:#f5f5f5;
font-family:jua;
margin-top:120px;
margin-left:20px;
  white-space: nowrap;
">
돌이신문 확인-돌이와 관련된 이야기를 읽어보세요!
</p>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://scttowfhygcpdirrekqm.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTg0MjYsImV4cCI6MjA5NTc3NDQyNn0.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"
);

window.addEventListener("DOMContentLoaded", async () => {

  // 로그인 확인
  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (!session) {
    alert("로그인이 필요합니다.");
    return;
  }

  // 로그인 유저
  const {
    data: { user }
  } = await supabase.auth.getUser();

  if (!user) {
    return;
  }

  // 현재 신문 번호
  let 신문번호 = Number(localStorage.getItem("rockeynews"));

  if (!신문번호 || 신문번호 < 1) {
    신문번호 = 1;
    localStorage.setItem("rockeynews", "1");
  }

  // 사용자 정보
  const {
    data: userInfo,
    error: userError
  } = await supabase
    .from("users")
    .select("read_dori_news")
    .eq("user_id", user.id)
    .single();

  if (userError) {
    console.log(userError);
    alert("사용자 정보를 불러오지 못했습니다.");
    return;
  }

  // 마지막 신문 번호
  const {
    data: lastNews,
    error: lastError
  } = await supabase
    .from("rockey_news")
    .select("news_number")
    .order("news_number", { ascending: false })
    .limit(1)
    .single();

  if (lastError) {
    console.log(lastError);
    alert("신문 정보를 불러오지 못했습니다.");
    return;
  }

  const 마지막신문번호 = lastNews.news_number;

  // 읽을 수 있는지 확인
  if (신문번호 > userInfo.read_dori_news) {
    alert("아직 읽을 수 없는 돌이신문입니다.");
    location.href = "rockeynews.html";
    return;
  }

  // 신문 가져오기
  const {
    data: news,
    error: newsError
  } = await supabase
    .from("rockey_news")
    .select("news_number, rockey_news")
    .eq("news_number", 신문번호)
    .single();

  if (newsError) {
    console.log(newsError);
    alert("신문을 불러오지 못했습니다.");
    return;
  }

  // 제목
  document.getElementById("제목").textContent =
    `제${신문번호}회 돌이신문`;

  // 내용
  document.getElementById("내용").innerHTML =
    news.rockey_news.replace(/\n/g, "<br>");

  const 내용 = document.getElementById("내용");
  const 이전버튼 = document.getElementById("이전");
  const 다음버튼 = document.getElementById("다음");

  // 버튼 위치를 내용 아래로 이동
  requestAnimationFrame(() => {

    const 버튼위치 =
      내용.offsetTop +
      내용.offsetHeight +
      40;

    이전버튼.style.top = 버튼위치 + "px";
    다음버튼.style.top = 버튼위치 + "px";

    // 첫 번째 신문
    if (신문번호 <= 1) {
      이전버튼.style.display = "none";
    }

    // 마지막 신문 또는 아직 읽지 못한 다음 신문
    if (
      신문번호 >= 마지막신문번호 ||
      신문번호 + 1 > userInfo.read_dori_news
    ) {
      다음버튼.style.display = "none";
    }

  });

});

// 이전 신문
window.이전신문 = function () {

  let 번호 =
    Number(localStorage.getItem("rockeynews"));

  번호--;

  if (번호 < 1) 번호 = 1;

  localStorage.setItem("rockeynews", 번호);

  location.reload();

};

// 다음 신문
window.다음신문 = function () {

  let 번호 =
    Number(localStorage.getItem("rockeynews"));

  번호++;

  localStorage.setItem("rockeynews", 번호);

  location.reload();

};
</script>

<button id="제목"
style="
position:absolute;
top:200px;
font-family:jua;
background:none;
border:none;
color:#f5f5f5;
cursor:pointer;
  white-space: nowrap;
">
">
</button>

<button id="다음"
onclick="다음신문()"
style="
position:absolute;
top:200px;
font-family:jua;
background:none;
border:none;
color:#f5f5f5;
cursor:pointer;
  white-space: nowrap;
">
다음 돌이신문 확인 →
</button>

<button id="이전"
onclick="이전신문()"
style="
position:absolute;
top:200px;
font-family:jua;
background:none;
border:none;
color:#f5f5f5;
cursor:pointer;
  white-space: nowrap;
">
← 이전 돌이신문 확인
</button>
  
<div id="내용"
style="
position:absolute;
top:370px;
left:20px;

font-family:jua;
color:#f5f5f5;

white-space:pre-wrap;
overflow-wrap:anywhere;
word-break:break-word;
">
</div>
</body>
</html>
