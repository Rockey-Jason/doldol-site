<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>돌이 랜덤 박스</title>

<!-- =====================================================
     Google Fonts
===================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
      rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');

:root {
    --bg-main: #05051d;
    --bg-secondary: #0b0b32;
    --panel: rgba(20, 24, 58, 0.72);
    --panel-light: rgba(255, 255, 255, 0.065);
    --border: rgba(255, 255, 255, 0.12);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.62);
    --gold: #ffe38a;
    --gold-strong: #ffbd55;
    --purple: #7886ff;
    --purple-dark: #3946b4;
    --danger: #ff8d9b;
    --shadow: 0 25px 80px rgba(0, 0, 0, 0.42);
}

* {
    box-sizing: border-box;
    user-select: none;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text-main);
    font-family: "Jua", sans-serif;
    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(85, 100, 255, 0.2),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(157, 77, 255, 0.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(35, 62, 180, 0.16),
            transparent 35%
        ),
        linear-gradient(135deg, #05051d 0%, #080827 48%, #020210 100%);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.28;
    background-image:
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

button {
    font: inherit;
}

#사이트 {
    width: min(1240px, 100%);
    margin: 0 auto;
    padding: 34px 28px 70px;
    position: relative;
    z-index: 1;
}

/* 상단 */

.상단 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    animation: 위로등장 0.7s ease both;
}

.제목 {
    margin: 0;
    font-family: "Black Han Sans", sans-serif;
    font-size: clamp(34px, 5vw, 58px);
    letter-spacing: -2px;
    line-height: 1.1;
    background: linear-gradient(110deg, #ffffff, #bfc7ff 48%, #ffe38a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 8px 25px rgba(100, 110, 255, 0.18));
}

.제목::after {
    content: "  RANDOM BOX";
    display: block;
    margin-top: 8px;
    font-family: "Jua", sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.35);
    -webkit-text-fill-color: rgba(255,255,255,0.35);
}

.뒤로가기 {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 12px 18px;
    color: white;
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    white-space: nowrap;
}

.뒤로가기:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.11);
    border-color: rgba(150,160,255,0.42);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.뒤로가기:active {
    transform: scale(0.96);
}

/* 코인 영역 */

.코인상자 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
    padding: 22px 25px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    animation: 위로등장 0.75s 0.08s ease both;
}

.코인설명 {
    margin-bottom: 5px;
    color: var(--text-muted);
    font-size: 14px;
}

#코인 {
    display: inline-block;
    color: var(--gold);
    font-size: clamp(25px, 4vw, 34px);
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 0 0 22px rgba(255, 213, 100, 0.18);
    transition: transform 0.25s ease;
}

#코인.코인변경 {
    animation: 코인반짝 0.55s ease;
}

/* 메인 */

.메인 {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 25px;
}

.패널 {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 27px;
    background:
        linear-gradient(
            145deg,
            rgba(35, 40, 82, 0.74),
            rgba(9, 11, 35, 0.8)
        );
    backdrop-filter: blur(22px);
    box-shadow: var(--shadow);
}

.패널::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            125deg,
            rgba(255,255,255,0.08),
            transparent 30%
        );
    opacity: 0.7;
}

/* 랜덤 박스 패널 */

.랜덤박스영역 {
    min-height: 535px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 42px 25px;
    animation: 위로등장 0.8s 0.16s ease both;
}

.랜덤박스영역::after {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(90, 105, 255, 0.13);
    filter: blur(70px);
    pointer-events: none;
    animation: 오라호흡 4s ease-in-out infinite;
}

.랜덤박스 {
    position: relative;
    z-index: 1;
    width: min(270px, 72vw);
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(175, 185, 255, 0.35);
    border-radius: 38px;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,0.16),
            transparent 28%
        ),
        linear-gradient(145deg, #5969d4, #222b7b 55%, #111743);
    box-shadow:
        0 30px 70px rgba(0,0,0,0.48),
        inset 0 2px 0 rgba(255,255,255,0.2),
        inset 0 -18px 35px rgba(0,0,0,0.16),
        0 0 0 8px rgba(110,125,255,0.035);
    transform: translateY(0);
    transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.35s ease,
        filter 0.35s ease;
}

.랜덤박스::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    pointer-events: none;
}

.랜덤박스::after {
    content: "";
    position: absolute;
    top: 18px;
    left: 22px;
    width: 75px;
    height: 25px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    filter: blur(15px);
    transform: rotate(-25deg);
    pointer-events: none;
}

.랜덤박스:hover {
    transform: translateY(-9px) scale(1.025);
    filter: brightness(1.08);
    box-shadow:
        0 42px 90px rgba(0,0,0,0.56),
        0 0 45px rgba(103,120,255,0.18),
        inset 0 2px 0 rgba(255,255,255,0.22);
}

.상자아이콘 {
    position: relative;
    z-index: 1;
    font-size: clamp(72px, 10vw, 105px);
    line-height: 1;
    filter: drop-shadow(0 13px 12px rgba(0,0,0,0.25));
    animation: 아이콘호흡 3.5s ease-in-out infinite;
}

.상자텍스트 {
    position: relative;
    z-index: 1;
    margin-top: 18px;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 0 3px 12px rgba(0,0,0,0.25);
}

.가격 {
    position: relative;
    z-index: 1;
    margin-top: 13px;
    color: var(--gold);
    font-size: 20px;
    text-shadow: 0 0 18px rgba(255,220,120,0.18);
}

#뽑기버튼 {
    position: relative;
    z-index: 2;
    margin-top: 32px;
    min-width: 230px;
    border: 1px solid rgba(180,190,255,0.28);
    border-radius: 16px;
    padding: 16px 30px;
    color: white;
    background:
        linear-gradient(135deg, #6878ec, #3b49ae);
    box-shadow:
        0 15px 35px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.2);
    cursor: pointer;
    font-size: 22px;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
}

#뽑기버튼::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,0.2),
        transparent 80%
    );
    transform: translateX(-120%);
    transition: transform 0.65s ease;
    pointer-events: none;
}

#뽑기버튼:hover {
    transform: translateY(-4px) scale(1.025);
    filter: brightness(1.08);
    box-shadow:
        0 21px 45px rgba(0,0,0,0.43),
        0 0 28px rgba(100,120,255,0.15);
}

#뽑기버튼:hover::before {
    transform: translateX(120%);
}

#뽑기버튼:active {
    transform: translateY(1px) scale(0.97);
}

#뽑기버튼:disabled {
    opacity: 0.48;
    cursor: not-allowed;
    transform: none;
    filter: grayscale(0.25);
    box-shadow: none;
}

#결과 {
    position: relative;
    z-index: 2;
    min-height: 75px;
    margin-top: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1.7;
}

.결과강조 {
    display: inline-block;
    margin-top: 4px;
    color: var(--gold);
    font-size: 30px;
    text-shadow: 0 0 24px rgba(255,220,120,0.22);
    animation: 결과등장 0.65s cubic-bezier(.2,.8,.2,1) both;
}

/* 정보 패널 */

.메인 > .패널:nth-child(2) {
    padding: 30px;
    animation: 위로등장 0.8s 0.24s ease both;
}

.패널제목 {
    position: relative;
    z-index: 1;
    margin: 0 0 20px;
    font-size: 27px;
    letter-spacing: -0.7px;
}

.확률목록 {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.확률항목 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.065);
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.확률항목:hover {
    transform: translateX(5px);
    border-color: rgba(145,155,255,0.25);
    background: rgba(120,135,255,0.08);
}

.아이템이름 {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.아이템이름 span:first-child {
    font-size: 22px;
}

.아이템이름 span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.확률 {
    flex-shrink: 0;
    color: var(--gold);
    font-size: 15px;
}

.인벤토리 {
    position: relative;
    z-index: 1;
    margin-top: 32px;
    padding-top: 27px;
    border-top: 1px solid rgba(255,255,255,0.08);
}

.아이템그리드 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.인벤토리아이템 {
    min-height: 52px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.065);
    border-radius: 13px;
    background: rgba(255,255,255,0.045);
    font-size: 14px;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.인벤토리아이템:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.08);
}

.아이템수량 {
    float: right;
    color: var(--gold);
}

/* 기록 */

.기록 {
    margin-top: 25px;
    padding: 30px;
    animation: 위로등장 0.8s 0.32s ease both;
}

.기록목록 {
    position: relative;
    z-index: 1;
    max-height: 270px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-right: 3px;
}

.기록목록::-webkit-scrollbar {
    width: 6px;
}

.기록목록::-webkit-scrollbar-thumb {
    border-radius: 20px;
    background: rgba(150,160,255,0.28);
}

.기록항목 {
    padding: 13px 15px;
    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--text-muted);
    font-size: 14px;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.기록항목:hover {
    transform: translateX(4px);
    background: rgba(255,255,255,0.075);
}

.기록항목 strong {
    color: var(--gold);
}

/* 하단 버튼 */

.하단버튼 {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
}

#초기화버튼 {
    border: 1px solid rgba(255,130,145,0.22);
    border-radius: 11px;
    padding: 10px 15px;
    color: var(--danger);
    background: rgba(255,90,110,0.055);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

#초기화버튼:hover {
    transform: translateY(-2px);
    background: rgba(255,90,110,0.12);
}

/* 모달 */

#확률모달 {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(13px);
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}

#확률모달.show {
    opacity: 1;
    visibility: visible;
}

.모달 {
    width: min(510px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 24px;
    background:
        linear-gradient(
            145deg,
            rgba(39,43,76,0.98),
            rgba(13,15,39,0.98)
        );
    box-shadow: 0 35px 110px rgba(0,0,0,0.65);
    transform: translateY(25px) scale(0.94);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
}

#확률모달.show .모달 {
    transform: translateY(0) scale(1);
}

.모달 h2 {
    margin: 0 0 22px;
    font-size: 26px;
}

#모달닫기 {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 13px;
    color: white;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
    transition:
        background 0.25s ease,
        transform 0.25s ease;
}

#모달닫기:hover {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
}

/* 토스트 */

.토스트 {
    position: fixed;
    left: 50%;
    bottom: 25px;
    z-index: 10000;
    width: max-content;
    max-width: calc(100vw - 30px);
    padding: 14px 20px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    color: white;
    background: rgba(25,29,65,0.94);
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    transform: translate(-50%, 25px);
    opacity: 0;
    pointer-events: none;
    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

.토스트.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* 애니메이션 */

@keyframes 위로등장 {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes 오라호흡 {
    0%, 100% {
        transform: scale(0.9);
        opacity: 0.55;
    }
    50% {
        transform: scale(1.12);
        opacity: 0.9;
    }
}

@keyframes 아이콘호흡 {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-5px) rotate(-2deg);
    }
}

@keyframes 코인반짝 {
    0% {
        transform: scale(1);
    }
    45% {
        transform: scale(1.12);
        filter: brightness(1.35);
    }
    100% {
        transform: scale(1);
    }
}

@keyframes 결과등장 {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.8);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes 상자열기 {
    0% {
        transform: rotate(0deg) scale(1);
    }
    12% {
        transform: rotate(-7deg) scale(1.04);
    }
    24% {
        transform: rotate(7deg) scale(1.08);
    }
    36% {
        transform: rotate(-8deg) scale(1.12);
    }
    48% {
        transform: rotate(8deg) scale(1.1);
    }
    60% {
        transform: rotate(-5deg) scale(1.06);
    }
    72% {
        transform: rotate(4deg) scale(1.03);
    }
    100% {
        transform: rotate(0deg) scale(1);
    }
}

.상자흔들림 {
    animation: 상자열기 0.85s cubic-bezier(.2,.8,.2,1);
}

.보상성공 {
    animation: 보상성공 0.8s ease;
}

@keyframes 보상성공 {
    0% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 0 rgba(255,220,100,0);
    }
    45% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 70px rgba(255,220,100,0.7);
        filter: brightness(1.25);
    }
    100% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 0 rgba(255,220,100,0);
        filter: brightness(1);
    }
}

/* 모바일 */

@media (max-width: 850px) {
    #사이트 {
        padding: 24px 15px 55px;
    }

    .상단 {
        align-items: flex-start;
    }

    .메인 {
        grid-template-columns: 1fr;
    }

    .랜덤박스영역 {
        min-height: 510px;
    }
}

@media (max-width: 520px) {
    .상단 {
        flex-direction: column;
    }

    .뒤로가기 {
        width: 100%;
    }

    .코인상자 {
        align-items: flex-start;
        flex-direction: column;
    }

    .코인상자 .뒤로가기 {
        width: 100%;
    }

    .메인 > .패널:nth-child(2),
    .기록 {
        padding: 23px 18px;
    }

    .랜덤박스영역 {
        padding: 35px 15px;
    }

    .상자텍스트 {
        font-size: 22px;
    }

    .아이템그리드 {
        grid-template-columns: 1fr;
    }

    #뽑기버튼 {
        width: 100%;
        min-width: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

/* =====================================================

const 뽑기가격 = 1000;
const 기록저장키 = "돌이랜덤박스기록";

/* =====================================================

/* =====================================================
   안전한 HTML 출력
===================================================== */

function HTML문자열(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =====================================================
   아이콘 결정
===================================================== */

function 아이콘결정(보상) {
    const 코드 = String(보상?.item_code || "").toUpperCase();
    const 종류 = String(보상?.item_type || "").toLowerCase();

    if (종류 === "coin") return "🪙";
    if (종류 === "exp") return "✨";
    if (종류 === "background") return "🌌";
    if (종류 === "skin") return "🐶";
    if (종류 === "title") return "🏅";
    if (종류 === "cape") return "🧥";
    if (종류 === "clothes") return "👕";
    if (종류 === "effect") return "💫";
    if (종류 === "multiplier") return "📈";
    if (코드.includes("GLASSES")) return "🕶️";
    if (코드.includes("HAT")) return "🎩";

    return "🎁";
}

/* =====================================================
   로컬 기록
===================================================== */

function 기록불러오기() {

        if (!저장값) return [];

}

function 기록저장() {

            기록저장키,
            JSON.stringify(기록)
        );
} catch (error) {
    console.error("❌ 랜덤 박스 오류:", error);

    console.error("📦 RPC 오류 상세:", {
        name: error?.name,
        code: error?.code,
        message: error?.message,
        details: error?.details,
        hint: error?.hint
    });

    const 오류메시지 = 오류메시지추출(error);
}

/* =====================================================
   로컬 인벤토리
===================================================== */

function 인벤토리불러오기() {
    try {
        const 저장값 = localStorage.getItem(인벤토리저장키);
        if (!저장값) return {};

        const parsed = JSON.parse(저장값);
        return parsed && typeof parsed === "object"
            ? parsed
            : {};
    } catch (error) {
        console.error("인벤토리 불러오기 오류:", error);
        return {};
    }
}

function 인벤토리저장() {
    try {
        localStorage.setItem(
            인벤토리저장키,
            JSON.stringify(인벤토리)
        );
    } catch (error) {
        console.error("인벤토리 저장 오류:", error);
    }
}

/* =====================================================
   로그인 상태
===================================================== */

function 로그인실패(메시지) {
    현재사용자 = null;

    사용자정보 = {
        user_id: null,
        doldolcoin: 0,
        exp: 0
    };

    뽑기버튼.disabled = true;
    뽑기버튼.textContent = "🔒 로그인 필요";
    코인.textContent = "🪙 로그인 필요";

    결과.innerHTML = `
        <span style="color:#ff9999">
            ${HTML문자열(메시지)}
        </span>
    `;
}

async function 로그인확인() {
    try {
        const { data, error } = await supabase.auth.getSession();

        if (error) throw error;

        if (!data?.session?.user) {
            로그인실패("로그인이 필요합니다.");
            return false;
        }

        현재사용자 = data.session.user;
        return true;
    } catch (error) {
        console.error("로그인 확인 오류:", error);
        로그인실패("로그인 상태를 확인할 수 없습니다.");
        return false;
    }
}

/* =====================================================
   사용자 정보
   users.user_id가 TEXT이므로 Auth UUID를 문자열로 사용
===================================================== */

async function 사용자정보불러오기() {
    if (!현재사용자) return false;

    try {
        const authId = String(현재사용자.id);

        const { data, error } = await supabase
            .from("users")
            .select("user_id, doldolcoin, exp")
            .eq("user_id", authId)
            .maybeSingle();

        if (error) throw error;

        if (!data) {
            throw new Error("사용자 정보를 찾을 수 없습니다.");
        }

        사용자정보 = {

            exp: Number(data.exp) || 0
        };

        코인표시();

        if (사용자정보.doldolcoin < 뽑기가격) {

        뽑기버튼.textContent = "🎁 랜덤 박스 열기";

        결과.innerHTML = `
            <span style="color:#ff9999">
                사용자 정보를 불러오지 못했습니다.
            </span>
        `;

        return false;
    }
}

/* =====================================================
   코인 표시
===================================================== */

function 코인표시() {
    const 금액 = Number(사용자정보.doldolcoin) || 0;

    코인.textContent = `🪙 ${금액.toLocaleString("ko-KR")}`;

    코인.classList.remove("코인변경");
    void 코인.offsetWidth;
    코인.classList.add("코인변경");

    뽑기버튼.disabled =
        뽑는중 ||
        !현재사용자 ||
        금액 < 뽑기가격;
}

/* =====================================================
   Supabase 보상 목록
   현재 dori_box_items 구조:
   id / item_name / item_type / rarity / probability /
   reward_coins / reward_exp / item_code / created_at
===================================================== */

async function 보상목록불러오기() {
    try {
        const { data, error } = await supabase
            .from("dori_box_items")
            .select(`
                id,
                item_name,
                item_type,
                rarity,
                probability,
                reward_coins,
                reward_exp,
                item_code,
                created_at
            `)
            .gt("probability", 0)
            .order("id", { ascending: true });

        if (error) throw error;

        if (!Array.isArray(data) || data.length === 0) {
            throw new Error("사용 가능한 보상이 없습니다.");
        }

        보상목록 = data.map(보상 => ({
            ...보상,
            아이콘: 아이콘결정(보상),
            이름: 보상.item_name,
            확률: Number(보상.probability) || 0,
            reward_coins: Number(보상.reward_coins) || 0,
            reward_exp: Number(보상.reward_exp) || 0
        }));

        const 전체확률 = 보상목록.reduce(
            (합계, 보상) => 합계 + 보상.확률,
            0
        );

        console.log("🎲 불러온 보상 수:", 보상목록.length);
        console.log("🎲 전체 확률:", 전체확률.toFixed(4) + "%");

        if (Math.abs(전체확률 - 100) > 0.01) {
            console.warn(
                "⚠️ 보상 확률 총합이 100%가 아닙니다:",
                전체확률
            );
        }

        확률목록표시();
        인벤토리표시();
        return true;
    } catch (error) {
        console.error("보상 목록 불러오기 오류:", error);

        결과.innerHTML = `
            <span style="color:#ff9999">
                보상 목록을 불러오지 못했습니다.<br>
                <small>${HTML문자열(error?.message || "알 수 없는 오류")}</small>
            </span>
        `;

        뽑기버튼.disabled = true;
        return false;
    }
}

/* =====================================================
   확률 목록 표시
===================================================== */

function 확률목록표시() {
    확률목록.innerHTML = "";
    모달확률목록.innerHTML = "";

    보상목록.forEach(보상 => {
        const 항목 = document.createElement("div");
        항목.className = "확률항목";

        항목.innerHTML = `
            <div class="아이템이름">
                <span>${HTML문자열(보상.아이콘)}</span>
                <span>${HTML문자열(보상.이름)}</span>
            </div>
            <span class="확률">
                ${보상.확률.toFixed(4)}%
            </span>
        `;

        확률목록.appendChild(항목.cloneNode(true));
        모달확률목록.appendChild(항목);
    });
}

/* =====================================================
   인벤토리 표시
===================================================== */

function 인벤토리표시() {
    아이템그리드.innerHTML = "";

    const 획득아이템 = 보상목록.filter(보상 => {
        const 종류 = String(보상.item_type || "").toLowerCase();

        return 종류 !== "coin" &&
            종류 !== "exp" &&
            (인벤토리[보상.item_code] || 0) > 0;
    });

    if (획득아이템.length === 0) {
        아이템그리드.innerHTML = `
            <div class="인벤토리아이템">
                아직 획득한 아이템이 없습니다.
            </div>
        `;
        return;
    }

    획득아이템.forEach(보상 => {
        const 항목 = document.createElement("div");
        항목.className = "인벤토리아이템";

        const 코드 = 보상.item_code;
        const 수량 = 인벤토리[코드] || 0;

        항목.innerHTML = `
            ${HTML문자열(보상.아이콘)}
            ${HTML문자열(보상.이름)}
            <span class="아이템수량">×${수량}</span>
        `;

        아이템그리드.appendChild(항목);
    });
}

/* =====================================================
   기록 표시
===================================================== */

function 기록표시() {
    기록목록.innerHTML = "";

    if (기록.length === 0) {
        기록목록.innerHTML = `
            <div class="기록항목">
                이 기기에서 뽑은 기록이 없습니다.
            </div>
        `;
        return;
    }

    기록.slice().reverse().forEach(기록데이터 => {
        const 항목 = document.createElement("div");
        항목.className = "기록항목";

        항목.innerHTML = `
            ${HTML문자열(기록시간표시(기록데이터.time))}
            ·
            <strong>
                ${HTML문자열(기록데이터.reward)}
            </strong>
        `;

        기록목록.appendChild(항목);
    });
}

function 기록시간표시(time) {
    const date = new Date(time);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString("ko-KR");
}

/* =====================================================
   보상 결과 문구
===================================================== */

function 보상문구생성(data) {
    const 아이콘 = 아이콘결정(data);
    const 이름 = data.item_name || "알 수 없는 보상";
    const 보상코인 = Number(data.reward_coins) || 0;
    const 보상EXP = Number(data.reward_exp) || 0;
    const 내용 = [];

    if (보상코인 > 0) {
        내용.push(
            `+${보상코인.toLocaleString("ko-KR")} 돌돌코인`
        );
    }

    if (보상EXP > 0) {
        내용.push(
            `+${보상EXP.toLocaleString("ko-KR")} EXP`
        );
    }

    if (내용.length > 0) {
        return `${아이콘} ${이름} ${내용.join(" · ")}`;
    }

    return `${아이콘} ${이름}`;
}

/* =====================================================
   보상 인벤토리 반영
   아이템은 현재 사이트 구조상 localStorage에 보관
   coin / exp는 RPC가 서버에서 직접 지급하므로 중복 반영하지 않음
===================================================== */

function 인벤토리반영(data) {
    const 종류 = String(data?.item_type || "").toLowerCase();

    if (종류 === "coin" || 종류 === "exp") {
        return;
    }

    const 코드 = data?.item_code || data?.item_id;
    if (!코드) return;

    인벤토리[코드] = (인벤토리[코드] || 0) + 1;
    인벤토리저장();
}

/* =====================================================
   RPC 오류 메시지 정리
===================================================== */

function 오류메시지추출(error) {
    if (!error) return "알 수 없는 오류가 발생했습니다.";

    const message =
        error.message ||
        error.details ||
        error.hint ||
        "알 수 없는 오류가 발생했습니다.";

    return String(message);
}

/* =====================================================
   실제 뽑기
   확률 계산/코인 차감/EXP 지급은 RPC가 서버에서 처리
===================================================== */

async function 뽑기() {
    if (뽑는중) return;

    if (!현재사용자) {
        alert("로그인 후 이용해주세요.");
        return;
    }

    if (Number(사용자정보.doldolcoin) < 뽑기가격) {
        결과.innerHTML = `
            <span style="color:#ff8585">
                돌돌코인이 부족합니다.
            </span>
        `;
        return;
    }

    뽑는중 = true;
    뽑기버튼.disabled = true;
    뽑기버튼.textContent = "🎁 상자를 여는 중...";
    결과.textContent = "상자를 여는 중... 🎁";

    랜덤박스.classList.remove("상자흔들림", "보상성공");
    void 랜덤박스.offsetWidth;
    랜덤박스.classList.add("상자흔들림");

    try {
        const { data, error } = await supabase.rpc(
            "open_dori_box",
            {
                p_price: 뽑기가격
            }
        );

        if (error) throw error;

        if (!data || data.success !== true) {
            throw new Error("뽑기 결과가 올바르지 않습니다.");
        }

        await new Promise(resolve => setTimeout(resolve, 850));

        사용자정보.doldolcoin =
            Number(data.remaining_coins ?? 0);

        if (data.remaining_exp !== undefined) {
            사용자정보.exp = Number(data.remaining_exp) || 0;
        } else {
            사용자정보.exp += Number(data.reward_exp) || 0;
        }

        인벤토리반영(data);

        const 보상문구 = 보상문구생성(data);

        기록.push({
            time: new Date().toISOString(),
            reward: 보상문구
        });

        if (기록.length > 50) {
            기록 = 기록.slice(-50);
        }

        기록저장();

        랜덤박스.classList.add("보상성공");

        결과.innerHTML = `
            🎉 획득!
            <br>
            <span class="결과강조">
                ${HTML문자열(보상문구)}
            </span>
        `;

        코인표시();
        인벤토리표시();
        기록표시();

        console.log("🎁 랜덤 박스 당첨:", data);
    } catch (error) {
        console.error("❌ 랜덤 박스 오류:", error);

        const 오류메시지 = 오류메시지추출(error);

        if (오류메시지.includes("돌돌코인이 부족")) {
            await 사용자정보불러오기();

            결과.innerHTML = `
                <span style="color:#ff8585">
                    돌돌코인이 부족합니다.
                </span>
            `;
        } else if (오류메시지.includes("로그인이 필요")) {
            로그인실패("로그인이 필요합니다.");
        } else {
            결과.innerHTML = `
                <span style="color:#ff8585">
                    랜덤 박스 처리 중 오류가 발생했습니다.
                    <br>
                    <small>${HTML문자열(오류메시지)}</small>
                </span>
            `;
        }
    } finally {
        뽑는중 = false;
        뽑기버튼.textContent = "🎁 랜덤 박스 열기";
        코인표시();
    }
}

/* =====================================================
   모달
===================================================== */

확률보기.addEventListener("click", () => {
    확률모달.classList.add("show");
});

모달닫기.addEventListener("click", () => {
    확률모달.classList.remove("show");
});

확률모달.addEventListener("click", event => {
    if (event.target === 확률모달) {
        확률모달.classList.remove("show");
    }
});

/* =====================================================
   버튼 이벤트
===================================================== */

뽑기버튼.addEventListener("click", 뽑기);

초기화버튼.addEventListener("click", () => {
    const 확인 = confirm(
        "이 기기에 저장된 랜덤 박스 기록과 아이템을 초기화할까요?\n\nSupabase의 코인과 실제 계정 데이터는 삭제되지 않습니다."
    );

    if (!확인) return;

    기록 = [];
    인벤토리 = {};

    기록저장();
    인벤토리저장();

    결과.textContent =
        "랜덤 박스 기록과 아이템을 초기화했습니다.";

    기록표시();
    인벤토리표시();
});

뒤로가기.addEventListener("click", () => {
    location.href = "index.html";
});

/* =====================================================
   ESC
===================================================== */

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        확률모달.classList.remove("show");
    }
});

/* =====================================================
   Auth 상태 변화
===================================================== */

supabase.auth.onAuthStateChange((event, session) => {
    console.log("🔐 Auth 상태 변경:", event);

    if (session?.user) {
        현재사용자 = session.user;

        // Auth 콜백 안에서 무거운 DB 작업을 직접 기다리지 않음
        setTimeout(() => {
            사용자정보불러오기();
        }, 0);
    } else {
        로그인실패("로그인이 필요합니다.");
    }
});

/* =====================================================
   시작
===================================================== */

async function 시작() {
    기록 = 기록불러오기();
    인벤토리 = 인벤토리불러오기();

    기록표시();
    인벤토리표시();

    결과.textContent = "데이터를 불러오는 중입니다...";

    const 로그인됨 = await 로그인확인();
    if (!로그인됨) return;

    const 보상불러오기성공 = await 보상목록불러오기();
    if (!보상불러오기성공) return;

    const 사용자불러오기성공 = await 사용자정보불러오기();
    if (!사용자불러오기성공) return;

    인벤토리표시();
    기록표시();

    console.log("🎁 돌이 랜덤 박스 준비 완료");
}

시작();
</script>
