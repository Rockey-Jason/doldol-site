<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>돌이 랜덤 박스</title>

<!-- =====================================================
     Google Fonts
===================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
      rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');

:root {
    --bg-main: #05051d;
    --bg-secondary: #0b0b32;
    --panel: rgba(20, 24, 58, 0.72);
    --panel-light: rgba(255, 255, 255, 0.065);
    --border: rgba(255, 255, 255, 0.12);
    --text-main: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.62);
    --gold: #ffe38a;
    --gold-strong: #ffbd55;
    --purple: #7886ff;
    --purple-dark: #3946b4;
    --danger: #ff8d9b;
    --shadow: 0 25px 80px rgba(0, 0, 0, 0.42);
}

* {
    box-sizing: border-box;
    user-select: none;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text-main);
    font-family: "Jua", sans-serif;
    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(85, 100, 255, 0.2),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(157, 77, 255, 0.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(35, 62, 180, 0.16),
            transparent 35%
        ),
        linear-gradient(135deg, #05051d 0%, #080827 48%, #020210 100%);
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.28;
    background-image:
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

button {
    font: inherit;
}

#사이트 {
    width: min(1240px, 100%);
    margin: 0 auto;
    padding: 34px 28px 70px;
    position: relative;
    z-index: 1;
}

/* 상단 */

.상단 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    animation: 위로등장 0.7s ease both;
}

.제목 {
    margin: 0;
    font-family: "Black Han Sans", sans-serif;
    font-size: clamp(34px, 5vw, 58px);
    letter-spacing: -2px;
    line-height: 1.1;
    background: linear-gradient(110deg, #ffffff, #bfc7ff 48%, #ffe38a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 8px 25px rgba(100, 110, 255, 0.18));
}

.제목::after {
    content: "  RANDOM BOX";
    display: block;
    margin-top: 8px;
    font-family: "Jua", sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.35);
    -webkit-text-fill-color: rgba(255,255,255,0.35);
}

.뒤로가기 {
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 12px 18px;
    color: white;
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    white-space: nowrap;
}

.뒤로가기:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.11);
    border-color: rgba(150,160,255,0.42);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.뒤로가기:active {
    transform: scale(0.96);
}

/* 코인 영역 */

.코인상자 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 25px;
    padding: 22px 25px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    animation: 위로등장 0.75s 0.08s ease both;
}

.코인설명 {
    margin-bottom: 5px;
    color: var(--text-muted);
    font-size: 14px;
}

#코인 {
    display: inline-block;
    color: var(--gold);
    font-size: clamp(25px, 4vw, 34px);
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 0 0 22px rgba(255, 213, 100, 0.18);
    transition: transform 0.25s ease;
}

#코인.코인변경 {
    animation: 코인반짝 0.55s ease;
}

/* 메인 */

.메인 {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 25px;
}

.패널 {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 27px;
    background:
        linear-gradient(
            145deg,
            rgba(35, 40, 82, 0.74),
            rgba(9, 11, 35, 0.8)
        );
    backdrop-filter: blur(22px);
    box-shadow: var(--shadow);
}

.패널::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            125deg,
            rgba(255,255,255,0.08),
            transparent 30%
        );
    opacity: 0.7;
}

/* 랜덤 박스 패널 */

.랜덤박스영역 {
    min-height: 535px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 42px 25px;
    animation: 위로등장 0.8s 0.16s ease both;
}

.랜덤박스영역::after {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(90, 105, 255, 0.13);
    filter: blur(70px);
    pointer-events: none;
    animation: 오라호흡 4s ease-in-out infinite;
}

.랜덤박스 {
    position: relative;
    z-index: 1;
    width: min(270px, 72vw);
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(175, 185, 255, 0.35);
    border-radius: 38px;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,0.16),
            transparent 28%
        ),
        linear-gradient(145deg, #5969d4, #222b7b 55%, #111743);
    box-shadow:
        0 30px 70px rgba(0,0,0,0.48),
        inset 0 2px 0 rgba(255,255,255,0.2),
        inset 0 -18px 35px rgba(0,0,0,0.16),
        0 0 0 8px rgba(110,125,255,0.035);
    transform: translateY(0);
    transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.35s ease,
        filter 0.35s ease;
}

.랜덤박스::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 30px;
    pointer-events: none;
}

.랜덤박스::after {
    content: "";
    position: absolute;
    top: 18px;
    left: 22px;
    width: 75px;
    height: 25px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    filter: blur(15px);
    transform: rotate(-25deg);
    pointer-events: none;
}

.랜덤박스:hover {
    transform: translateY(-9px) scale(1.025);
    filter: brightness(1.08);
    box-shadow:
        0 42px 90px rgba(0,0,0,0.56),
        0 0 45px rgba(103,120,255,0.18),
        inset 0 2px 0 rgba(255,255,255,0.22);
}

.상자아이콘 {
    position: relative;
    z-index: 1;
    font-size: clamp(72px, 10vw, 105px);
    line-height: 1;
    filter: drop-shadow(0 13px 12px rgba(0,0,0,0.25));
    animation: 아이콘호흡 3.5s ease-in-out infinite;
}

.상자텍스트 {
    position: relative;
    z-index: 1;
    margin-top: 18px;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 0 3px 12px rgba(0,0,0,0.25);
}

.가격 {
    position: relative;
    z-index: 1;
    margin-top: 13px;
    color: var(--gold);
    font-size: 20px;
    text-shadow: 0 0 18px rgba(255,220,120,0.18);
}

#뽑기버튼 {
    position: relative;
    z-index: 2;
    margin-top: 32px;
    min-width: 230px;
    border: 1px solid rgba(180,190,255,0.28);
    border-radius: 16px;
    padding: 16px 30px;
    color: white;
    background:
        linear-gradient(135deg, #6878ec, #3b49ae);
    box-shadow:
        0 15px 35px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.2);
    cursor: pointer;
    font-size: 22px;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
}

#뽑기버튼::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255,255,255,0.2),
        transparent 80%
    );
    transform: translateX(-120%);
    transition: transform 0.65s ease;
    pointer-events: none;
}

#뽑기버튼:hover {
    transform: translateY(-4px) scale(1.025);
    filter: brightness(1.08);
    box-shadow:
        0 21px 45px rgba(0,0,0,0.43),
        0 0 28px rgba(100,120,255,0.15);
}

#뽑기버튼:hover::before {
    transform: translateX(120%);
}

#뽑기버튼:active {
    transform: translateY(1px) scale(0.97);
}

#뽑기버튼:disabled {
    opacity: 0.48;
    cursor: not-allowed;
    transform: none;
    filter: grayscale(0.25);
    box-shadow: none;
}

#결과 {
    position: relative;
    z-index: 2;
    min-height: 75px;
    margin-top: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1.7;
}

.결과강조 {
    display: inline-block;
    margin-top: 4px;
    color: var(--gold);
    font-size: 30px;
    text-shadow: 0 0 24px rgba(255,220,120,0.22);
    animation: 결과등장 0.65s cubic-bezier(.2,.8,.2,1) both;
}

/* 정보 패널 */

.메인 > .패널:nth-child(2) {
    padding: 30px;
    animation: 위로등장 0.8s 0.24s ease both;
}

.패널제목 {
    position: relative;
    z-index: 1;
    margin: 0 0 20px;
    font-size: 27px;
    letter-spacing: -0.7px;
}

.확률목록 {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.확률항목 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.065);
    border-radius: 14px;
    background: rgba(255,255,255,0.045);
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.확률항목:hover {
    transform: translateX(5px);
    border-color: rgba(145,155,255,0.25);
    background: rgba(120,135,255,0.08);
}

.아이템이름 {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.아이템이름 span:first-child {
    font-size: 22px;
}

.아이템이름 span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.확률 {
    flex-shrink: 0;
    color: var(--gold);
    font-size: 15px;
}

.인벤토리 {
    position: relative;
    z-index: 1;
    margin-top: 32px;
    padding-top: 27px;
    border-top: 1px solid rgba(255,255,255,0.08);
}

.아이템그리드 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.인벤토리아이템 {
    min-height: 52px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.065);
    border-radius: 13px;
    background: rgba(255,255,255,0.045);
    font-size: 14px;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.인벤토리아이템:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.08);
}

.아이템수량 {
    float: right;
    color: var(--gold);
}

/* 기록 */

.기록 {
    margin-top: 25px;
    padding: 30px;
    animation: 위로등장 0.8s 0.32s ease both;
}

.기록목록 {
    position: relative;
    z-index: 1;
    max-height: 270px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-right: 3px;
}

.기록목록::-webkit-scrollbar {
    width: 6px;
}

.기록목록::-webkit-scrollbar-thumb {
    border-radius: 20px;
    background: rgba(150,160,255,0.28);
}

.기록항목 {
    padding: 13px 15px;
    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--text-muted);
    font-size: 14px;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.기록항목:hover {
    transform: translateX(4px);
    background: rgba(255,255,255,0.075);
}

.기록항목 strong {
    color: var(--gold);
}

/* 하단 버튼 */

.하단버튼 {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
}

#초기화버튼 {
    border: 1px solid rgba(255,130,145,0.22);
    border-radius: 11px;
    padding: 10px 15px;
    color: var(--danger);
    background: rgba(255,90,110,0.055);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

#초기화버튼:hover {
    transform: translateY(-2px);
    background: rgba(255,90,110,0.12);
}

/* 모달 */

#확률모달 {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(13px);
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}

#확률모달.show {
    opacity: 1;
    visibility: visible;
}

.모달 {
    width: min(510px, 100%);
    max-height: 85vh;
    overflow-y: auto;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 24px;
    background:
        linear-gradient(
            145deg,
            rgba(39,43,76,0.98),
            rgba(13,15,39,0.98)
        );
    box-shadow: 0 35px 110px rgba(0,0,0,0.65);
    transform: translateY(25px) scale(0.94);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
}

#확률모달.show .모달 {
    transform: translateY(0) scale(1);
}

.모달 h2 {
    margin: 0 0 22px;
    font-size: 26px;
}

#모달닫기 {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 13px;
    color: white;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
    transition:
        background 0.25s ease,
        transform 0.25s ease;
}

#모달닫기:hover {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
}

/* 토스트 */

.토스트 {
    position: fixed;
    left: 50%;
    bottom: 25px;
    z-index: 10000;
    width: max-content;
    max-width: calc(100vw - 30px);
    padding: 14px 20px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px;
    color: white;
    background: rgba(25,29,65,0.94);
    backdrop-filter: blur(18px);
    box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    transform: translate(-50%, 25px);
    opacity: 0;
    pointer-events: none;
    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

.토스트.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* 애니메이션 */

@keyframes 위로등장 {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes 오라호흡 {
    0%, 100% {
        transform: scale(0.9);
        opacity: 0.55;
    }
    50% {
        transform: scale(1.12);
        opacity: 0.9;
    }
}

@keyframes 아이콘호흡 {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-5px) rotate(-2deg);
    }
}

@keyframes 코인반짝 {
    0% {
        transform: scale(1);
    }
    45% {
        transform: scale(1.12);
        filter: brightness(1.35);
    }
    100% {
        transform: scale(1);
    }
}

@keyframes 결과등장 {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.8);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes 상자열기 {
    0% {
        transform: rotate(0deg) scale(1);
    }
    12% {
        transform: rotate(-7deg) scale(1.04);
    }
    24% {
        transform: rotate(7deg) scale(1.08);
    }
    36% {
        transform: rotate(-8deg) scale(1.12);
    }
    48% {
        transform: rotate(8deg) scale(1.1);
    }
    60% {
        transform: rotate(-5deg) scale(1.06);
    }
    72% {
        transform: rotate(4deg) scale(1.03);
    }
    100% {
        transform: rotate(0deg) scale(1);
    }
}

.상자흔들림 {
    animation: 상자열기 0.85s cubic-bezier(.2,.8,.2,1);
}

.보상성공 {
    animation: 보상성공 0.8s ease;
}

@keyframes 보상성공 {
    0% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 0 rgba(255,220,100,0);
    }
    45% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 70px rgba(255,220,100,0.7);
        filter: brightness(1.25);
    }
    100% {
        box-shadow:
            0 30px 70px rgba(0,0,0,0.48),
            0 0 0 rgba(255,220,100,0);
        filter: brightness(1);
    }
}

/* 모바일 */

@media (max-width: 850px) {
    #사이트 {
        padding: 24px 15px 55px;
    }

    .상단 {
        align-items: flex-start;
    }

    .메인 {
        grid-template-columns: 1fr;
    }

    .랜덤박스영역 {
        min-height: 510px;
    }
}

@media (max-width: 520px) {
    .상단 {
        flex-direction: column;
    }

    .뒤로가기 {
        width: 100%;
    }

    .코인상자 {
        align-items: flex-start;
        flex-direction: column;
    }

    .코인상자 .뒤로가기 {
        width: 100%;
    }

    .메인 > .패널:nth-child(2),
    .기록 {
        padding: 23px 18px;
    }

    .랜덤박스영역 {
        padding: 35px 15px;
    }

    .상자텍스트 {
        font-size: 22px;
    }

    .아이템그리드 {
        grid-template-columns: 1fr;
    }

    #뽑기버튼 {
        width: 100%;
        min-width: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}

}


/* =====================================================
   돌돌코인 차감
===================================================== */

async function 돌돌코인차감() {

    if (!현재사용자) {

        alert(
            "로그인 후 이용해주세요."
        );

        return {

            성공: false

        };

    }


    try {

        /*
           auth.uid()를 사용하는 RPC.

           클라이언트에서 user_id를 보내지 않는다.
        */

        const {
            data,
            error
        } =
            await supabase.rpc(
                "use_doldolcoin",
                {
                    p_amount:
                        뽑기가격
                }
            );


        if (error) {

            console.error(
                "돌돌코인 차감 RPC 오류:",
                error
            );


            if (
                error.message &&
                error.message.includes(
                    "돌돌코인이 부족합니다"
                )
            ) {

                await 사용자정보불러오기();


                return {

                    성공: false,

                    부족: true

                };

            }


            throw error;

        }


        /*
           RPC에서 반환된 값은
           차감 후 남은 돌돌코인.
        */

        사용자정보.doldolcoin =
            Number(data) || 0;


        코인표시();


        console.log(
            "🪙 코인 차감 완료:",
            사용자정보.doldolcoin
        );


        return {

            성공: true,

            남은코인:
                사용자정보.doldolcoin

        };

    }

    catch (error) {

        console.error(
            "돌돌코인 차감 오류:",
            error
        );


        return {

            성공: false,

            오류: error

        };

    }

}

    아이템그리드.innerHTML =

    if (

        아이템그리드.innerHTML = `

                );


            항목.className =

            );

        }

/* =====================================================
   랜덤 보상
===================================================== */

function 보상뽑기() {

    const 랜덤 =
        Math.random() * 100;


    let 누적확률 = 0;


    for (
        const 보상 of 보상목록
    ) {

        누적확률 +=
            보상.확률;


        if (
            랜덤 < 누적확률
        ) {

            return 보상;

        }

    }


    return 보상목록[
        보상목록.length - 1
    ];

}


/* =====================================================
   코인 보상 지급
===================================================== */

async function 코인보상지급(금액) {

    /*
       코인 보상은 현재
       별도의 RPC를 사용하지 않고

       users.doldolcoin 값을 업데이트한다.

       ⚠️ 보안상 최종적으로는
       보상 지급도 서버측 RPC 하나로
       묶는 것을 추천한다.
    */

    if (!현재사용자) {

        throw new Error(
            "로그인이 필요합니다."
        );

    }


    const 현재코인 =
        Number(
            사용자정보.doldolcoin
        ) || 0;


    const 새로운코인 =
        현재코인 + 금액;


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .update({

                doldolcoin:
                    새로운코인

            })

            .eq(
                "user_id",
                현재사용자.id
            )

            .select(
                "doldolcoin"
            )
            
            .maybeSingle();


    if (error) {

        throw error;

    }


    if (!data) {

        throw new Error(
            "코인 보상 저장에 실패했습니다."
        );

    }


    사용자정보.doldolcoin =
        Number(
            data.doldolcoin
        ) || 0;


    코인표시();


    return true;

}


/* =====================================================
   아이템 보상 지급
===================================================== */

function 아이템보상지급(보상) {

    if (
        !인벤토리[보상.id]
    ) {

        인벤토리[보상.id] =
            0;

    }


    인벤토리[보상.id] +=
        1;


    인벤토리저장();

}


/* =====================================================
   인벤토리 저장
===================================================== */

function 인벤토리저장() {

    try {

        localStorage.setItem(
            "돌이랜덤박스인벤토리",
            JSON.stringify(
                인벤토리
            )
        );

    }

    catch (error) {

        console.error(
            "인벤토리 저장 오류:",
            error
        );

    }

}


/* =====================================================
   인벤토리 불러오기
===================================================== */

function 인벤토리불러오기() {

    try {

        const 저장값 =
            localStorage.getItem(
                "돌이랜덤박스인벤토리"
            );


        if (!저장값) {

            return {};

        }


        const data =
            JSON.parse(
                저장값
            );


        return data || {};

    }

    catch (error) {

        console.error(
            "인벤토리 불러오기 오류:",
            error
        );


        return {};

    }

}


/* =====================================================
   기록 표시
===================================================== */

function 기록표시() {

    기록목록.innerHTML =
        "";


    if (
        기록.length === 0
    ) {

        기록목록.innerHTML = `

            <div class="기록항목">
                아직 뽑기 기록이 없습니다.
            </div>

        `;

        return;

    }


    기록
        .slice()
        .reverse()
        .forEach(
            기록데이터 => {

                const 항목 =
                    document.createElement(
                        "div"
                    );


                항목.className =
                    "기록항목";


                항목.innerHTML = `

                    ${기록시간표시(
                        기록데이터.time
                    )}

                    ·

                    <strong>
                        ${기록데이터.reward}
                    </strong>

                `;


                기록목록.appendChild(
                    항목
                );

            }
        );

}


/* =====================================================
   시간 표시
===================================================== */

function 기록시간표시(time) {

    const date =
        new Date(time);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "ko-KR"
    );

}


/* =====================================================
   뽑기
===================================================== */

async function 뽑기() {

    if (뽑는중) {

        return;

    }


    if (!현재사용자) {

        alert(
            "로그인 후 이용해주세요."
        );

        return;

    }


    const 현재코인 =
        Number(
            사용자정보.doldolcoin
        ) || 0;


    if (
        현재코인 <
        뽑기가격
    ) {

        결과.innerHTML = `

            <span style="color:#ff8585">
                돌돌코인이 부족합니다.
            </span>

        `;

        return;

    }


    뽑는중 = true;


    뽑기버튼.disabled =
        true;


    뽑기버튼.textContent =
        "🪙 코인 확인 중...";


    try {

        /* =================================================
           1. Supabase에서 코인 차감
        ================================================= */

        const 차감결과 =
            await 돌돌코인차감();


        if (
            !차감결과.성공
        ) {

            if (
                차감결과.부족
            ) {

                결과.innerHTML = `

                    <span style="color:#ff8585">
                        돌돌코인이 부족합니다.
                    </span>

                `;

            }

            else {

                결과.innerHTML = `

                    <span style="color:#ff8585">
                        코인 차감 중 오류가 발생했습니다.
                    </span>

                `;

            }


            return;

        }


        /* =================================================
           2. 상자 애니메이션
        ================================================= */

        뽑기버튼.textContent =
            "🎁 상자를 여는 중...";


        결과.innerHTML = `
            상자를 여는 중... 🎁
        `;


        랜덤박스.classList.remove(
            "상자흔들림"
        );


        void 랜덤박스.offsetWidth;


        랜덤박스.classList.add(
            "상자흔들림"
        );


        /* =================================================
           3. 랜덤 보상 결정
        ================================================= */

        const 보상 =
            보상뽑기();


        console.log(
            "🎁 당첨 보상:",
            보상
        );


        /* =================================================
           4. 애니메이션 대기
        ================================================= */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    850
                )
        );


        /* =================================================
           5. 보상 지급
        ================================================= */

        if (
            보상.종류 === "coin"
        ) {

            await 코인보상지급(
                보상.값
            );

        }

        else {

            아이템보상지급(
                보상
            );

        }


        /* =================================================
           6. 기록
        ================================================= */

        const 보상문구 =
            `${보상.아이콘} ${보상.이름}`;


        기록.push({

            time:
                new Date().toISOString(),

            reward:
                보상문구

        });


        if (
            기록.length > 50
        ) {

            기록 =
                기록.slice(-50);

        }


        기록저장();


        /* =================================================
           7. 결과 표시
        ================================================= */

        결과.innerHTML = `

            🎉 획득!

            <br>

            <span class="결과강조">
                ${보상문구}
            </span>

        `;


        인벤토리표시();

        기록표시();

        코인표시();


    }

    catch (error) {

        console.error(
            "❌ 랜덤 박스 오류:",
            error
        );


        /*
           여기서 매우 중요한 점:

           이미 코인이 차감된 뒤
           보상 지급에서 오류가 발생하면
           사용자에게 알려준다.

           실제 운영 버전에서는
           차감 + 보상 지급을
           하나의 Supabase RPC로 묶는 것을
           가장 추천한다.
        */

        결과.innerHTML = `

            <span style="color:#ff8585">
                랜덤 박스 처리 중 오류가 발생했습니다.
            </span>

        `;

        alert(
            "랜덤 박스를 처리하는 중 오류가 발생했습니다.\n콘솔(F12)에서 오류를 확인해주세요."
        );

    }

    finally {

        뽑는중 = false;


        뽑기버튼.textContent =
            "🎁 랜덤 박스 열기";


        코인표시();

    }

}


/* =====================================================
   확률 모달
===================================================== */

확률보기.addEventListener(
    "click",
    () => {

        확률모달.classList.add(
            "show"
        );

    }
);


모달닫기.addEventListener(
    "click",
    () => {

        확률모달.classList.remove(
            "show"
        );

    }
);


확률모달.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            확률모달
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   뽑기 버튼
===================================================== */

뽑기버튼.addEventListener(
    "click",
    뽑기
);


/* =====================================================
   기록 초기화
===================================================== */

초기화버튼.addEventListener(
    "click",
    () => {

        const 확인 =
            confirm(
                "이 기기에 저장된 랜덤 박스 기록과 아이템을 초기화할까요?\n\n⚠️ Supabase의 돌돌코인은 초기화되지 않습니다."
            );


        if (!확인) {

            return;

        }


        기록 = [];

        인벤토리 = {};


        기록저장();

        인벤토리저장();


        결과.innerHTML =
            "랜덤 박스 기록과 아이템을 초기화했습니다.";


        인벤토리표시();

        기록표시();

    }
);


/* =====================================================
   뒤로가기
===================================================== */

뒤로가기.addEventListener(
    "click",
    () => {

        location.href =
            "index.html";

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   인증 상태 변화 감지
===================================================== */

supabase.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "🔐 Auth 상태 변경:",
            event
        );


        if (
            session &&
            session.user
        ) {

            현재사용자 =
                session.user;


            await 사용자정보불러오기();

        }

        else {

            로그인실패(
                "로그인이 필요합니다."
            );

        }

    }
);


/* =====================================================
   시작
===================================================== */

async function 시작() {

    console.log(
        "🎁 돌이 랜덤 박스 시작"
    );


    /* 확률 표시 */

    확률목록표시();


    /* 인벤토리 */

    인벤토리 =
        인벤토리불러오기();


    인벤토리표시();


    /* 기록 */

    기록표시();


    /* 로그인 확인 */

    const 로그인됨 =
        await 로그인확인();


    if (!로그인됨) {

        return;

    }


    /* Supabase users 정보 */

    await 사용자정보불러오기();


    console.log(
        "🎁 돌이 랜덤 박스 준비 완료"
    );

}


시작();

</script>
