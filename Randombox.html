/* =====================================================
   기록 불러오기
===================================================== */

function 기록불러오기() {

    try {

        const 저장된값 =
            localStorage.getItem(
                기록저장키
            );


        if (!저장된값) {

            return [];

        }


        const parsed =
            JSON.parse(
                저장된값
            );


        if (
            !Array.isArray(parsed)
        ) {

            return [];

        }


        return parsed;

    }

    catch (error) {

        console.error(
            "기록 불러오기 오류:",
            error
        );

        return [];

    }

}

    try {

        localStorage.setItem(
            기록저장키,
            JSON.stringify(기록)
        );

    }

    catch (error) {

        console.error(

}

async function 로그인확인() {

    try {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {

            throw error;

        }


        if (
            !data ||
            !data.session
        ) {

            로그인실패(
                "로그인이 필요합니다."
            );

            return false;

        }


        현재사용자 =
            data.session.user;


        console.log(
            "🐶 로그인 사용자:",
            현재사용자.id
        );


        return true;

    }

    catch (error) {

        console.error(
            "로그인 확인 오류:",
            error
        );


        로그인실패(
            "로그인 상태를 확인할 수 없습니다."
        );


        return false;

    }

        </span>

    `;


    코인.textContent =
        "🪙 로그인 필요";

}


/* =====================================================
   users 테이블에서 코인 불러오기
===================================================== */

async function 사용자정보불러오기() {

    if (!현재사용자) {

        return false;

    }


    try {

        const {
            data,
            error
        } =
            await supabase

                .from("users")

                .select(
                    "user_id, doldolcoin"
                )

                .eq(
                    "user_id",
                    현재사용자.id
                )

                .maybeSingle();


        if (error) {

            throw error;

        }


        if (!data) {

            throw new Error(
                "users 테이블에서 현재 사용자를 찾을 수 없습니다."
            );

        }


        사용자정보 = {

            user_id:
                data.user_id,

            doldolcoin:
                Number(
                    data.doldolcoin
                ) || 0

        };


        코인표시();


        뽑기버튼.disabled =
            사용자정보.doldolcoin <
            뽑기가격;


        뽑기버튼.textContent =
            "🎁 랜덤 박스 열기";


        if (
            사용자정보.doldolcoin <
            뽑기가격
        ) {

            결과.innerHTML = `

                <span style="color:#ff9999">
                    돌돌코인이 부족합니다.
                </span>

            `;

        }

        else {

            결과.innerHTML =
                "랜덤 박스를 열어보세요!";

        }


        return true;

    }

    catch (error) {

        console.error(
            "users 정보 불러오기 오류:",
            error
        );


        뽑기버튼.disabled =
            true;


        뽑기버튼.textContent =
            "⚠️ 정보 불러오기 실패";


        코인.textContent =
            "🪙 불러오기 실패";


        결과.innerHTML = `

            <span style="color:#ff9999">
                사용자 정보를 불러오지 못했습니다.
            </span>

        `;


        return false;

    }

}


/* =====================================================
   코인 표시
===================================================== */

function 코인표시() {

    const 현재코인 =
        Number(
            사용자정보.doldolcoin
        ) || 0;


    코인.textContent =
        `🪙 ${현재코인.toLocaleString("ko-KR")}`;


    뽑기버튼.disabled =
        뽑는중 ||
        현재코인 <
        뽑기가격;

}


/* =====================================================
   돌돌코인 차감
===================================================== */

async function 돌돌코인차감() {

    if (!현재사용자) {

        alert(
            "로그인 후 이용해주세요."
        );

        return {

            성공: false

        };

    }


    try {

        /*
           auth.uid()를 사용하는 RPC.

           클라이언트에서 user_id를 보내지 않는다.
        */

        const {
            data,
            error
        } =
            await supabase.rpc(
                "use_doldolcoin",
                {
                    p_amount:
                        뽑기가격
                }
            );


        if (error) {

            console.error(
                "돌돌코인 차감 RPC 오류:",
                error
            );


            if (
                error.message &&
                error.message.includes(
                    "돌돌코인이 부족합니다"
                )
            ) {

                await 사용자정보불러오기();


                return {

                    성공: false,

                    부족: true

                };

            }


            throw error;

        }


        /*
           RPC에서 반환된 값은
           차감 후 남은 돌돌코인.
        */

        사용자정보.doldolcoin =
            Number(data) || 0;


        코인표시();


        console.log(
            "🪙 코인 차감 완료:",
            사용자정보.doldolcoin
        );


        return {

            성공: true,

            남은코인:
                사용자정보.doldolcoin

        };

    }

    catch (error) {

        console.error(
            "돌돌코인 차감 오류:",
            error
        );


        return {

            성공: false,

            오류: error

        };

    }

}


/* =====================================================
   보상 확률 목록
===================================================== */

function 확률목록표시() {

    확률목록.innerHTML =
        "";

    모달확률목록.innerHTML =
        "";


    보상목록.forEach(
        보상 => {

            const 항목 =
                document.createElement(
                    "div"
                );


            항목.className =
                "확률항목";


            항목.innerHTML = `

                <div class="아이템이름">

                    <span>
                        ${보상.아이콘}
                    </span>

                    <span>
                        ${보상.이름}
                    </span>

                </div>

                <span class="확률">
                    ${보상.확률}%
                </span>

            `;


            확률목록.appendChild(
                항목.cloneNode(true)
            );


            모달확률목록.appendChild(
                항목
            );

        }
    );

}


/* =====================================================
   인벤토리 표시
===================================================== */

function 인벤토리표시() {

    아이템그리드.innerHTML =
        "";


    const 획득아이템 =
        보상목록.filter(
            보상 =>
                보상.종류 !== "coin"
                &&
                (인벤토리[보상.id] || 0) > 0
        );


    if (
        획득아이템.length === 0
    ) {

        아이템그리드.innerHTML = `

            <div class="인벤토리아이템">
                아직 획득한 아이템이 없습니다.
            </div>

        `;

        return;

    }


    획득아이템.forEach(
        보상 => {

            const 항목 =
                document.createElement(
                    "div"
                );


            항목.className =
                "인벤토리아이템";


            const 수량 =
                인벤토리[보상.id]
                || 0;


            항목.innerHTML = `

                ${보상.아이콘}
                ${보상.이름}

                <span class="아이템수량">
                    ×${수량}
                </span>

            `;


            아이템그리드.appendChild(
                항목
            );

        }
    );

}


/* =====================================================
   랜덤 보상
===================================================== */

function 보상뽑기() {

    const 랜덤 =
        Math.random() * 100;


    let 누적확률 = 0;


    for (
        const 보상 of 보상목록
    ) {

        누적확률 +=
            보상.확률;


        if (
            랜덤 < 누적확률
        ) {

            return 보상;

        }

    }


    return 보상목록[
        보상목록.length - 1
    ];

}


/* =====================================================
   코인 보상 지급
===================================================== */

async function 코인보상지급(금액) {

    /*
       코인 보상은 현재
       별도의 RPC를 사용하지 않고

       users.doldolcoin 값을 업데이트한다.

       ⚠️ 보안상 최종적으로는
       보상 지급도 서버측 RPC 하나로
       묶는 것을 추천한다.
    */

    if (!현재사용자) {

        throw new Error(
            "로그인이 필요합니다."
        );

    }


    const 현재코인 =
        Number(
            사용자정보.doldolcoin
        ) || 0;


    const 새로운코인 =
        현재코인 + 금액;


    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .update({

                doldolcoin:
                    새로운코인

            })

            .eq(
                "user_id",
                현재사용자.id
            )

            .select(
                "doldolcoin"
            )
            
            .maybeSingle();


    if (error) {

        throw error;

    }


    if (!data) {

        throw new Error(
            "코인 보상 저장에 실패했습니다."
        );

    }


    사용자정보.doldolcoin =
        Number(
            data.doldolcoin
        ) || 0;


    코인표시();


    return true;

}


/* =====================================================
   아이템 보상 지급
===================================================== */

function 아이템보상지급(보상) {

    if (
        !인벤토리[보상.id]
    ) {

        인벤토리[보상.id] =
            0;

    }


    인벤토리[보상.id] +=
        1;


    인벤토리저장();

}


/* =====================================================
   인벤토리 저장
===================================================== */

function 인벤토리저장() {

    try {

        localStorage.setItem(
            "돌이랜덤박스인벤토리",
            JSON.stringify(
                인벤토리
            )
        );

    }

    catch (error) {

        console.error(
            "인벤토리 저장 오류:",
            error
        );

    }

}


/* =====================================================
   인벤토리 불러오기
===================================================== */

function 인벤토리불러오기() {

    try {

        const 저장값 =
            localStorage.getItem(
                "돌이랜덤박스인벤토리"
            );


        if (!저장값) {

            return {};

        }


        const data =
            JSON.parse(
                저장값
            );


        return data || {};

    }

    catch (error) {

        console.error(
            "인벤토리 불러오기 오류:",
            error
        );


        return {};

    }

}


/* =====================================================
   기록 표시
===================================================== */

function 기록표시() {

    기록목록.innerHTML =
        "";


    if (
        기록.length === 0
    ) {

        기록목록.innerHTML = `

            <div class="기록항목">
                아직 뽑기 기록이 없습니다.
            </div>

        `;

        return;

    }


    기록
        .slice()
        .reverse()
        .forEach(
            기록데이터 => {

                const 항목 =
                    document.createElement(
                        "div"
                    );


                항목.className =
                    "기록항목";


                항목.innerHTML = `

                    ${기록시간표시(
                        기록데이터.time
                    )}

                    ·

                    <strong>
                        ${기록데이터.reward}
                    </strong>

                `;


                기록목록.appendChild(
                    항목
                );

            }
        );

}


/* =====================================================
   시간 표시
===================================================== */

function 기록시간표시(time) {

    const date =
        new Date(time);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "ko-KR"
    );

}


/* =====================================================
   뽑기
===================================================== */

async function 뽑기() {

    if (뽑는중) {

        return;

    }


    if (!현재사용자) {

        alert(
            "로그인 후 이용해주세요."
        );

        return;

    }


    const 현재코인 =
        Number(
            사용자정보.doldolcoin
        ) || 0;


    if (
        현재코인 <
        뽑기가격
    ) {

        결과.innerHTML = `

            <span style="color:#ff8585">
                돌돌코인이 부족합니다.
            </span>

        `;

        return;

    }


    뽑는중 = true;


    뽑기버튼.disabled =
        true;


    뽑기버튼.textContent =
        "🪙 코인 확인 중...";


    try {

        /* =================================================
           1. Supabase에서 코인 차감
        ================================================= */

        const 차감결과 =
            await 돌돌코인차감();


        if (
            !차감결과.성공
        ) {

            if (
                차감결과.부족
            ) {

                결과.innerHTML = `

                    <span style="color:#ff8585">
                        돌돌코인이 부족합니다.
                    </span>

                `;

            }

            else {

                결과.innerHTML = `

                    <span style="color:#ff8585">
                        코인 차감 중 오류가 발생했습니다.
                    </span>

                `;

            }


            return;

        }


        /* =================================================
           2. 상자 애니메이션
        ================================================= */

        뽑기버튼.textContent =
            "🎁 상자를 여는 중...";


        결과.innerHTML = `
            상자를 여는 중... 🎁
        `;


        랜덤박스.classList.remove(
            "상자흔들림"
        );


        void 랜덤박스.offsetWidth;


        랜덤박스.classList.add(
            "상자흔들림"
        );


        /* =================================================
           3. 랜덤 보상 결정
        ================================================= */

        const 보상 =
            보상뽑기();


        console.log(
            "🎁 당첨 보상:",
            보상
        );


        /* =================================================
           4. 애니메이션 대기
        ================================================= */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    850
                )
        );


        /* =================================================
           5. 보상 지급
        ================================================= */

        if (
            보상.종류 === "coin"
        ) {

            await 코인보상지급(
                보상.값
            );

        }

        else {

            아이템보상지급(
                보상
            );

        }


        /* =================================================
           6. 기록
        ================================================= */

        const 보상문구 =
            `${보상.아이콘} ${보상.이름}`;


        기록.push({

            time:
                new Date().toISOString(),

            reward:
                보상문구

        });


        if (
            기록.length > 50
        ) {

            기록 =
                기록.slice(-50);

        }


        기록저장();


        /* =================================================
           7. 결과 표시
        ================================================= */

        결과.innerHTML = `

            🎉 획득!

            <br>

            <span class="결과강조">
                ${보상문구}
            </span>

        `;


        인벤토리표시();

        기록표시();

        코인표시();


    }

    catch (error) {

        console.error(
            "❌ 랜덤 박스 오류:",
            error
        );


        /*
           여기서 매우 중요한 점:

           이미 코인이 차감된 뒤
           보상 지급에서 오류가 발생하면
           사용자에게 알려준다.

           실제 운영 버전에서는
           차감 + 보상 지급을
           하나의 Supabase RPC로 묶는 것을
           가장 추천한다.
        */

        결과.innerHTML = `

            <span style="color:#ff8585">
                랜덤 박스 처리 중 오류가 발생했습니다.
            </span>

        `;

        alert(
            "랜덤 박스를 처리하는 중 오류가 발생했습니다.\n콘솔(F12)에서 오류를 확인해주세요."
        );

    }

    finally {

        뽑는중 = false;


        뽑기버튼.textContent =
            "🎁 랜덤 박스 열기";


        코인표시();

    }

}


/* =====================================================
   확률 모달
===================================================== */

확률보기.addEventListener(
    "click",
    () => {

        확률모달.classList.add(
            "show"
        );

    }
);


모달닫기.addEventListener(
    "click",
    () => {

        확률모달.classList.remove(
            "show"
        );

    }
);


확률모달.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            확률모달
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   뽑기 버튼
===================================================== */

뽑기버튼.addEventListener(
    "click",
    뽑기
);


/* =====================================================
   기록 초기화
===================================================== */

초기화버튼.addEventListener(
    "click",
    () => {

        const 확인 =
            confirm(
                "이 기기에 저장된 랜덤 박스 기록과 아이템을 초기화할까요?\n\n⚠️ Supabase의 돌돌코인은 초기화되지 않습니다."
            );


        if (!확인) {

            return;

        }


        기록 = [];

        인벤토리 = {};


        기록저장();

        인벤토리저장();


        결과.innerHTML =
            "랜덤 박스 기록과 아이템을 초기화했습니다.";


        인벤토리표시();

        기록표시();

    }
);


/* =====================================================
   뒤로가기
===================================================== */

뒤로가기.addEventListener(
    "click",
    () => {

        location.href =
            "index.html";

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   인증 상태 변화 감지
===================================================== */

supabase.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        console.log(
            "🔐 Auth 상태 변경:",
            event
        );


        if (
            session &&
            session.user
        ) {

            현재사용자 =
                session.user;


            await 사용자정보불러오기();

        }

        else {

            로그인실패(
                "로그인이 필요합니다."
            );

        }

    }
);


/* =====================================================
   시작
===================================================== */

async function 시작() {

    console.log(
        "🎁 돌이 랜덤 박스 시작"
    );


    /* 확률 표시 */

    확률목록표시();


    /* 인벤토리 */

    인벤토리 =
        인벤토리불러오기();


    인벤토리표시();


    /* 기록 */

    기록표시();


    /* 로그인 확인 */

    const 로그인됨 =
        await 로그인확인();


    if (!로그인됨) {

        return;

    }


    /* Supabase users 정보 */

    await 사용자정보불러오기();


    console.log(
        "🎁 돌이 랜덤 박스 준비 완료"
    );

}


시작();

</script>
