<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>돌이 랜덤 박스</title>


<!-- =====================================================
     Google Fonts
===================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   기본
===================================================== */

* {

    box-sizing: border-box;

    user-select: none;

}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

}


body {

    color: white;

    font-family:
        "Jua",
        sans-serif;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(70,90,180,.18),
            transparent 32%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(80,40,150,.15),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #000033,
            #000010
        );

    overflow-x: hidden;

}


/* =====================================================
   전체
===================================================== */

#사이트 {

    min-height: 100vh;

    padding:
        35px 40px 80px;

}


/* =====================================================
   상단
===================================================== */

.상단 {

    display: flex;

    align-items: center;

    justify-content: space-between;

    max-width: 1200px;

    margin:
        0 auto 35px;

}


.제목 {

    margin: 0;

    font-family:
        "Black Han Sans",
        sans-serif;

    font-size: 55px;

    letter-spacing: -2px;

}


.뒤로가기 {

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color: white;

    border-radius: 12px;

    padding:
        10px 18px;

    font-family:
        "Jua",
        sans-serif;

    font-size: 17px;

    cursor: pointer;

    transition:
        .2s ease;

}


.뒤로가기:hover {

    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-2px);

}


/* =====================================================
   코인 표시
===================================================== */

.코인상자 {

    max-width: 1200px;

    margin:
        0 auto 25px;

    padding:
        18px 24px;

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 18px;

    background:
        rgba(255,255,255,.045);

    box-shadow:
        0 15px 45px rgba(0,0,0,.25);

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.코인설명 {

    color:
        rgba(255,255,255,.65);

    font-size: 15px;

}


#코인 {

    color:
        #ffe48a;

    font-size: 28px;

    font-weight: bold;

}


/* =====================================================
   메인 박스
===================================================== */

.메인 {

    max-width: 1200px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 25px;

}


.패널 {

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(35,38,65,.65),
            rgba(10,12,30,.72)
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    padding: 30px;

}


/* =====================================================
   랜덤 박스
===================================================== */

.랜덤박스영역 {

    min-height: 460px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.랜덤박스 {

    width: 240px;
    height: 240px;

    border-radius: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:

        linear-gradient(
            145deg,
            #3d4a96,
            #18205d
        );

    border:
        3px solid rgba(255,255,255,.18);

    box-shadow:

        0 25px 60px rgba(0,0,0,.45),

        inset 0 2px 0
        rgba(255,255,255,.16);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

}


.랜덤박스:hover {

    transform:
        translateY(-8px)
        scale(1.02);

    box-shadow:

        0 35px 80px rgba(0,0,0,.55),

        0 0 35px
        rgba(100,120,255,.12);

}


.상자아이콘 {

    font-size: 90px;

    line-height: 1;

}


.상자텍스트 {

    margin-top: 15px;

    font-size: 24px;

    font-weight: bold;

}


.가격 {

    margin-top: 18px;

    color:
        #ffe48a;

    font-size: 20px;

}


/* =====================================================
   뽑기 버튼
===================================================== */

#뽑기버튼 {

    margin-top: 25px;

    border: none;

    border-radius: 16px;

    padding:
        15px 45px;

    font-family:
        "Jua",
        sans-serif;

    font-size: 23px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #5968d8,
            #3747a4
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.35);

    cursor: pointer;

    transition:
        .2s ease;

}


#뽑기버튼:hover {

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 17px 38px rgba(0,0,0,.45);

}


#뽑기버튼:active {

    transform:
        scale(.97);

}


#뽑기버튼:disabled {

    opacity: .45;

    cursor:
        not-allowed;

    transform:
        none;

}


/* =====================================================
   결과
===================================================== */

#결과 {

    min-height: 70px;

    margin-top: 22px;

    text-align: center;

    font-size: 20px;

}


.결과강조 {

    font-size: 28px;

    font-weight: bold;

    color:
        #ffe48a;

}


/* =====================================================
   흔들림
===================================================== */

@keyframes 상자흔들림 {

    0% {
        transform: rotate(0deg) scale(1);
    }

    15% {
        transform: rotate(-8deg) scale(1.05);
    }

    30% {
        transform: rotate(8deg) scale(1.08);
    }

    45% {
        transform: rotate(-8deg) scale(1.1);
    }

    60% {
        transform: rotate(8deg) scale(1.08);
    }

    75% {
        transform: rotate(-4deg) scale(1.04);
    }

    100% {
        transform: rotate(0deg) scale(1);
    }

}


.상자흔들림 {

    animation:
        상자흔들림 .8s ease;

}


/* =====================================================
   오른쪽
===================================================== */

.패널제목 {

    margin-top: 0;

    font-size: 27px;

}


/* =====================================================
   확률 목록
===================================================== */

.확률목록 {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.확률항목 {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        13px 15px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.06);

}


.아이템이름 {

    display: flex;

    gap: 10px;

    align-items: center;

}


.확률 {

    color:
        rgba(255,255,255,.7);

}


/* =====================================================
   인벤토리
===================================================== */

.인벤토리 {

    margin-top: 25px;

}


.아이템그리드 {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

}


.인벤토리아이템 {

    padding: 13px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.06);

}


.아이템수량 {

    float: right;

    color:
        #ffe48a;

}


/* =====================================================
   기록
===================================================== */

.기록 {

    max-width: 1200px;

    margin:
        25px auto 0;

}


.기록목록 {

    max-height: 250px;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.기록항목 {

    padding:
        11px 14px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.75);

    font-size: 14px;

}


.기록항목 strong {

    color: #ffe48a;

}


/* =====================================================
   하단 버튼
===================================================== */

.하단버튼 {

    max-width: 1200px;

    margin:
        20px auto 0;

    display: flex;

    justify-content: flex-end;

}


#초기화버튼 {

    border:
        1px solid rgba(255,100,100,.25);

    background:
        rgba(255,80,80,.06);

    color:
        #ff9999;

    border-radius: 10px;

    padding:
        9px 15px;

    font-family:
        "Jua",
        sans-serif;

    cursor: pointer;

}


#초기화버튼:hover {

    background:
        rgba(255,80,80,.12);

}


/* =====================================================
   모달
===================================================== */

#확률모달 {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(8px);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

}


#확률모달.show {

    display: flex;

}


.모달 {

    width:
        min(500px, 90vw);

    padding: 30px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #25283d,
            #121427
        );

    border:
        1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

}


.모달 h2 {

    margin-top: 0;

}


#모달닫기 {

    width: 100%;

    margin-top: 20px;

    padding: 12px;

    border: none;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-family:
        "Jua",
        sans-serif;

    font-size: 17px;

    cursor: pointer;

}


/* =====================================================
   반응형
===================================================== */

@media (max-width: 850px) {

    #사이트 {

        padding:
            20px 15px 50px;

    }


    .상단 {

        align-items: flex-start;

        gap: 15px;

    }


    .제목 {

        font-size: 38px;

    }


    .메인 {

        grid-template-columns:
            1fr;

    }


    .랜덤박스영역 {

        min-height: 400px;

    }

}


@media (max-width: 500px) {

    .코인상자 {

        flex-direction: column;

        align-items: flex-start;

        gap: 8px;

    }


    .아이템그리드 {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<div id="사이트">


<!-- =====================================================
     상단
===================================================== -->

<header class="상단">

    <h1 class="제목">
        🎁 돌이 랜덤 박스
    </h1>


    <button
        class="뒤로가기"
        id="뒤로가기"
    >

        ← 돌이 사이트

    </button>

</header>


<!-- =====================================================
     코인
===================================================== -->

<div class="코인상자">

    <div>

        <div class="코인설명">
            현재 보유한 돌돌코인
        </div>

        <div id="코인">
            🪙 10,000
        </div>

    </div>


    <button
        class="뒤로가기"
        id="확률보기"
    >

        🎲 확률 보기

    </button>

</div>


<!-- =====================================================
     메인
===================================================== -->

<div class="메인">


    <!-- 랜덤 박스 -->

    <section class="패널 랜덤박스영역">


        <div
            class="랜덤박스"
            id="랜덤박스"
        >

            <div class="상자아이콘">
                🎁
            </div>

            <div class="상자텍스트">
                돌이 랜덤 박스
            </div>

            <div class="가격">
                🪙 1,000
            </div>

        </div>


        <button
            id="뽑기버튼"
        >

            🎁 랜덤 박스 열기

        </button>


        <div id="결과">

            랜덤 박스를 열어보세요!

        </div>


    </section>


    <!-- 정보 -->

    <section class="패널">


        <h2 class="패널제목">
            🎲 보상 확률
        </h2>


        <div
            class="확률목록"
            id="확률목록"
        ></div>


        <div class="인벤토리">

            <h2 class="패널제목">
                🎒 내 아이템
            </h2>


            <div
                class="아이템그리드"
                id="아이템그리드"
            ></div>

        </div>


    </section>


</div>


<!-- =====================================================
     기록
===================================================== -->

<section class="패널 기록">


    <h2 class="패널제목">
        📜 최근 뽑기 기록
    </h2>


    <div
        class="기록목록"
        id="기록목록"
    >

        <div class="기록항목">
            아직 뽑기 기록이 없습니다.
        </div>

    </div>


</section>


<!-- =====================================================
     초기화
===================================================== -->

<div class="하단버튼">

    <button id="초기화버튼">
        데이터 초기화
    </button>

</div>


</div>


<!-- =====================================================
     확률 모달
===================================================== -->

<div id="확률모달">

    <div class="모달">

        <h2>
            🎲 돌이 랜덤 박스 확률
        </h2>


        <div
            class="확률목록"
            id="모달확률목록"
        ></div>


        <button id="모달닫기">
            닫기
        </button>

    </div>

</div>


<script>

/* =====================================================
   설정
===================================================== */

const 뽑기가격 = 1000;


/* =====================================================
   보상
===================================================== */

const 보상목록 = [

    {
        id: "coins500",
        이름: "500 돌돌코인",
        아이콘: "🪙",
        확률: 35,
        종류: "coin",
        값: 500
    },

    {
        id: "coins1000",
        이름: "1,000 돌돌코인",
        아이콘: "🪙",
        확률: 25,
        종류: "coin",
        값: 1000
    },

    {
        id: "rockeyHat",
        이름: "돌이 모자",
        아이콘: "🎩",
        확률: 15,
        종류: "item"
    },

    {
        id: "rockeyGlasses",
        이름: "돌이 안경",
        아이콘: "🕶️",
        확률: 10,
        종류: "item"
    },

    {
        id: "specialTitle",
        이름: "특별 칭호",
        아이콘: "🏅",
        확률: 7,
        종류: "title"
    },

    {
        id: "rareBackground",
        이름: "희귀 배경",
        아이콘: "🌌",
        확률: 5,
        종류: "background"
    },

    {
        id: "legendarySkin",
        이름: "전설 돌이 스킨",
        아이콘: "🐶",
        확률: 3,
        종류: "skin"
    }

];


/* =====================================================
   localStorage 키
===================================================== */

const 저장키 =
    "돌이랜덤박스데이터";


/* =====================================================
   기본 데이터
===================================================== */

const 기본데이터 = {

    coins: 10000,

    inventory: {},

    history: []

};


/* =====================================================
   데이터 불러오기
===================================================== */

function 데이터불러오기() {

    try {

        const 저장된값 =
            localStorage.getItem(저장키);


        if (!저장된값) {

            return {
                ...기본데이터,
                inventory: {},
                history: []
            };

        }


        const data =
            JSON.parse(저장된값);


        return {

            coins:
                Number(data.coins)
                || 0,

            inventory:
                data.inventory
                || {},

            history:
                Array.isArray(data.history)
                ? data.history
                : []

        };

    }

    catch (error) {

        console.error(
            "랜덤 박스 데이터 불러오기 오류:",
            error
        );


        return {
            ...기본데이터,
            inventory: {},
            history: []
        };

    }

}


/* =====================================================
   현재 데이터
===================================================== */

let 데이터 =
    데이터불러오기();


/* =====================================================
   저장
===================================================== */

function 데이터저장() {

    localStorage.setItem(
        저장키,
        JSON.stringify(데이터)
    );

}


/* =====================================================
   DOM
===================================================== */

const 코인 =
    document.getElementById("코인");

const 뽑기버튼 =
    document.getElementById("뽑기버튼");

const 랜덤박스 =
    document.getElementById("랜덤박스");

const 결과 =
    document.getElementById("결과");

const 확률목록 =
    document.getElementById("확률목록");

const 아이템그리드 =
    document.getElementById("아이템그리드");

const 기록목록 =
    document.getElementById("기록목록");

const 확률보기 =
    document.getElementById("확률보기");

const 확률모달 =
    document.getElementById("확률모달");

const 모달확률목록 =
    document.getElementById("모달확률목록");

const 모달닫기 =
    document.getElementById("모달닫기");

const 초기화버튼 =
    document.getElementById("초기화버튼");

const 뒤로가기 =
    document.getElementById("뒤로가기");


/* =====================================================
   코인 표시
===================================================== */

function 코인표시() {

    코인.textContent =
        `🪙 ${데이터.coins.toLocaleString("ko-KR")}`;

    뽑기버튼.disabled =
        데이터.coins < 뽑기가격;

}


/* =====================================================
   확률 목록 생성
===================================================== */

function 확률목록표시() {

    확률목록.innerHTML = "";

    모달확률목록.innerHTML = "";


    보상목록.forEach(
        보상 => {

            const 항목 =
                document.createElement("div");

            항목.className =
                "확률항목";


            항목.innerHTML = `

                <div class="아이템이름">

                    <span>
                        ${보상.아이콘}
                    </span>

                    <span>
                        ${보상.이름}
                    </span>

                </div>

                <span class="확률">
                    ${보상.확률}%
                </span>

            `;


            확률목록.appendChild(
                항목.cloneNode(true)
            );


            모달확률목록.appendChild(
                항목
            );

        }
    );

}


/* =====================================================
   인벤토리
===================================================== */

function 인벤토리표시() {

    아이템그리드.innerHTML = "";


    const 획득아이템 =
        보상목록.filter(
            보상 =>
                보상.종류 !== "coin"
                &&
                (데이터.inventory[보상.id] || 0) > 0
        );


    if (획득아이템.length === 0) {

        아이템그리드.innerHTML = `

            <div class="인벤토리아이템">
                아직 획득한 아이템이 없습니다.
            </div>

        `;

        return;

    }


    획득아이템.forEach(
        보상 => {

            const 항목 =
                document.createElement("div");


            항목.className =
                "인벤토리아이템";


            const 수량 =
                데이터.inventory[보상.id]
                || 0;


            항목.innerHTML = `

                ${보상.아이콘}
                ${보상.이름}

                <span class="아이템수량">
                    ×${수량}
                </span>

            `;


            아이템그리드.appendChild(
                항목
            );

        }
    );

}


/* =====================================================
   기록 표시
===================================================== */

function 기록표시() {

    기록목록.innerHTML = "";


    if (데이터.history.length === 0) {

        기록목록.innerHTML = `

            <div class="기록항목">
                아직 뽑기 기록이 없습니다.
            </div>

        `;

        return;

    }


    데이터.history
        .slice()
        .reverse()
        .forEach(
            기록 => {

                const 항목 =
                    document.createElement("div");


                항목.className =
                    "기록항목";


                항목.innerHTML = `

                    ${기록시간표시(
                        기록.time
                    )}

                    ·

                    <strong>
                        ${기록.reward}
                    </strong>

                `;


                기록목록.appendChild(
                    항목
                );

            }
        );

}


/* =====================================================
   시간
===================================================== */

function 기록시간표시(time) {

    const date =
        new Date(time);


    return date.toLocaleString(
        "ko-KR"
    );

}


/* =====================================================
   랜덤 보상
===================================================== */

function 보상뽑기() {

    const 랜덤 =
        Math.random() * 100;


    let 누적확률 = 0;


    for (
        const 보상 of 보상목록
    ) {

        누적확률 +=
            보상.확률;


        if (
            랜덤 < 누적확률
        ) {

            return 보상;

        }

    }


    return 보상목록[
        보상목록.length - 1
    ];

}


/* =====================================================
   보상 지급
===================================================== */

function 보상지급(보상) {

    if (
        보상.종류 === "coin"
    ) {

        데이터.coins +=
            보상.값;

    }

    else {

        if (
            !데이터.inventory[
                보상.id
            ]
        ) {

            데이터.inventory[
                보상.id
            ] = 0;

        }


        데이터.inventory[
            보상.id
        ] += 1;

    }

}


/* =====================================================
   뽑기
===================================================== */

function 뽑기() {

    if (
        데이터.coins <
        뽑기가격
    ) {

        결과.innerHTML = `

            <span style="color:#ff8585">
                돌돌코인이 부족합니다.
            </span>

        `;

        return;

    }


    뽑기버튼.disabled =
        true;


    데이터.coins -=
        뽑기가격;


    결과.innerHTML = `
        상자를 여는 중... 🎁
    `;


    랜덤박스.classList.remove(
        "상자흔들림"
    );


    void 랜덤박스.offsetWidth;


    랜덤박스.classList.add(
        "상자흔들림"
    );


    const 보상 =
        보상뽑기();


    setTimeout(
        () => {

            보상지급(
                보상
            );


            const 보상문구 =
                `${보상.아이콘} ${보상.이름}`;


            데이터.history.push({

                time:
                    new Date().toISOString(),

                reward:
                    보상문구

            });


            if (
                데이터.history.length > 50
            ) {

                데이터.history =
                    데이터.history.slice(-50);

            }


            데이터저장();


            결과.innerHTML = `

                🎉 획득!

                <br>

                <span class="결과강조">
                    ${보상문구}
                </span>

            `;


            코인표시();

            인벤토리표시();

            기록표시();


            뽑기버튼.disabled =
                데이터.coins < 뽑기가격;

        },
        850
    );

}


/* =====================================================
   확률 모달
===================================================== */

확률보기.addEventListener(
    "click",
    () => {

        확률모달.classList.add(
            "show"
        );

    }
);


모달닫기.addEventListener(
    "click",
    () => {

        확률모달.classList.remove(
            "show"
        );

    }
);


확률모달.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            확률모달
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   뽑기 버튼
===================================================== */

뽑기버튼.addEventListener(
    "click",
    뽑기
);


/* =====================================================
   초기화
===================================================== */

초기화버튼.addEventListener(
    "click",
    () => {

        const 확인 =
            confirm(
                "랜덤 박스 데이터를 모두 초기화할까요?\n\n코인은 10,000으로 돌아갑니다."
            );


        if (!확인) {

            return;

        }


        데이터 = {

            coins: 10000,

            inventory: {},

            history: []

        };


        데이터저장();


        결과.innerHTML =
            "데이터가 초기화되었습니다.";


        코인표시();

        인벤토리표시();

        기록표시();

    }
);


/* =====================================================
   뒤로가기
===================================================== */

뒤로가기.addEventListener(
    "click",
    () => {

        location.href =
            "index.html";

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            확률모달.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   시작
===================================================== */

확률목록표시();

코인표시();

인벤토리표시();

기록표시();


console.log(
    "🎁 돌이 랜덤 박스 준비 완료"
);

</script>
