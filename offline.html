<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000033">
<meta name="robots" content="noindex,nofollow">
<title>오프라인 | 돌이사이트</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#00001b;color:#eef3ff}
*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(46,83,143,.25),transparent 55%),linear-gradient(145deg,#000033,#000010)}
main{width:min(100%,440px);padding:34px 28px;border:1px solid rgba(226,198,119,.25);border-radius:24px;background:linear-gradient(145deg,rgba(16,34,59,.94),rgba(5,13,29,.96));box-shadow:0 24px 70px #0008;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(226,198,119,.5);border-radius:20px;color:#e6cd8b;font-size:28px}
h1{margin:0 0 12px;font-size:23px;font-weight:500}p{margin:0;color:#aebbd0;font-size:14px;line-height:1.8}
button{margin-top:25px;min-height:46px;padding:0 22px;border:1px solid rgba(226,198,119,.5);border-radius:13px;background:rgba(179,145,70,.16);color:#f1dfac;font:inherit;cursor:pointer}
</style>
</head>
<body><main><div class="mark" aria-hidden="true">D</div><h1>현재 오프라인 상태예요</h1><p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>연결이 복구되면 돌이사이트를 정상적으로 이용할 수 있어요.</p><button type="button" onclick="location.reload()">다시 연결하기</button></main></body>
</html>
