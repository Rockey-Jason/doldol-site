name: ROCKEY 30-minute free quality checks

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rockey-30m-maintenance.yml"
      - "rockey-client/**"
      - "rockey-server/**"
      - "dori-life.html"
      - "scripts/validate-dori-life.mjs"
      - "scripts/site-quality-check.mjs"

concurrency:
  group: rockey-30-minute-free-checks
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Rockey-Jason/doldol-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ROCKEY client dependencies
        working-directory: rockey-client
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build and type-check ROCKEY client
        working-directory: rockey-client
        run: npm run build

      - name: Install ROCKEY server dependencies
        working-directory: rockey-server
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build server and run non-combat network QA
        working-directory: rockey-server
        run: |
          npm run build
          node --import tsx --test src/qa-simulation.test.ts

      - name: Validate Dori Life animation choreography and site files
        run: |
          node scripts/validate-dori-life.mjs
          node scripts/site-quality-check.mjs

      - name: Remove generated build output and installed dependencies
        if: always()
        shell: bash
        run: |
          git restore --worktree --staged -- rockey/ 2>/dev/null || true
          git clean -fd -- rockey/ rockey-client/node_modules rockey-server/node_modules rockey-server/dist >/dev/null 2>&1 || true
