name: Deploy ROCKEY to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'rockey-client/**'
      - 'rockey/**'
      - '.github/workflows/deploy-rockey-pages.yml'
      - 'docs/rockey/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rockey-client/package.json
      - name: Install client
        working-directory: rockey-client
        run: npm install
      - name: Build ROCKEY
        working-directory: rockey-client
        run: npm run build
      - name: Assemble Dori Site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='rockey-client/node_modules' --exclude='rockey-server/node_modules' --exclude='_site' ./ _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
