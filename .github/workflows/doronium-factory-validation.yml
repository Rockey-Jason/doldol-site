name: Doronium Factory validation

concurrency:
  group: doronium-factory-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "doronium-factory/**"
      - ".github/workflows/doronium-factory-validation.yml"
  pull_request:
    paths:
      - "doronium-factory/**"
      - ".github/workflows/doronium-factory-validation.yml"
jobs:
  validate-web-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse game JavaScript
        run: |
          node --check doronium-factory/factory.js
          node --check doronium-factory/simulation-core.js
          node --check doronium-factory/simulation-core.test.mjs
          node --check doronium-factory/game-data-validation.js
          node --check doronium-factory/game-data-validation.test.mjs
          node --test doronium-factory/simulation-core.test.mjs doronium-factory/game-data-validation.test.mjs
          node --check doronium-factory/world3d.js
          node --check doronium-factory/terrain-system.js
          node --check doronium-factory/e2e/factory-smoke.mjs
      - name: Check required game files and runtime contracts
        run: |
          test -s doronium-factory/index.html
          test -s doronium-factory/factory.css
          test -s doronium-factory/factory.js
          test -s doronium-factory/simulation-core.js
          test -s doronium-factory/simulation-core.test.mjs
          test -s doronium-factory/game-data-validation.js
          test -s doronium-factory/game-data-validation.test.mjs
          test -s doronium-factory/world3d.js
          test -s doronium-factory/terrain-system.js
          grep -q 'WORLD_W = 192' doronium-factory/terrain-system.js
          grep -q 'WORLD_H = 160' doronium-factory/terrain-system.js
          grep -q 'function terrainHeightAt' doronium-factory/terrain-system.js
          grep -q 'function makeMineDeposits' doronium-factory/terrain-system.js
          grep -q 'beltAdaptive' doronium-factory/factory.js
          grep -q 'function harvestMineDeposit' doronium-factory/factory.js
          grep -q 'function enterMine' doronium-factory/factory.js
          grep -q 'function notifyNewMission' doronium-factory/factory.js
          grep -q 'story-start-button' doronium-factory/index.html
          grep -q 'id="mission-alert"' doronium-factory/index.html
          grep -q 'data-land-tool="flatten"' doronium-factory/index.html
          grep -q 'id="game-menu-toggle"' doronium-factory/index.html
          grep -q 'WebGLRenderer' doronium-factory/world3d.js
          grep -q 'createWorld3D' doronium-factory/factory.js
          grep -q 'STEP = 0.1' doronium-factory/factory.js
          grep -q 'dori_cloud_storage' doronium-factory/factory.js
          grep -q 'doronium_factory_infinite_industry_v1' doronium-factory/factory.js
          grep -q 'function tickMachine' doronium-factory/factory.js
          grep -q 'runCanonicalTick(context' doronium-factory/factory.js
          grep -q 'addItemStack(S,id,qty,meta)' doronium-factory/factory.js
          grep -q 'TICK_STAGE_ORDER' doronium-factory/simulation-core.js
          grep -q 'calculateOutputQuality' doronium-factory/simulation-core.js
          grep -q 'function tickBelts' doronium-factory/factory.js
          grep -q 'function startFusion' doronium-factory/factory.js
          grep -q 'function recipeHasSyntheticInput' doronium-factory/factory.js
          grep -q 'function updatePlayerMotion' doronium-factory/factory.js
          grep -q 'frameRenderAccumulator-=1000/60' doronium-factory/factory.js
          grep -q 'function createNodeBatches' doronium-factory/world3d.js
          grep -q 'nodeBatchDrawCalls' doronium-factory/world3d.js
          grep -q 'function adaptPerformanceFrame' doronium-factory/world3d.js
          grep -q 'sceneRevision' doronium-factory/factory.js
          grep -q 'adaptPerformanceFrame' doronium-factory/world3d.js
          grep -q 'terrainChunks' doronium-factory/world3d.js
          grep -q 'terrainChunkCount' doronium-factory/world3d.js
          grep -q 'visibilityRevision' doronium-factory/factory.js
          grep -q 'nodeGroupsByKey' doronium-factory/world3d.js
          grep -q 'syncBeltItemVisual' doronium-factory/world3d.js
          grep -q 'syncOutputVisual' doronium-factory/world3d.js
          grep -q 'function performAdventureAction' doronium-factory/factory.js
          grep -q 'function updateSurvival' doronium-factory/factory.js
          grep -q 'function consumeFood' doronium-factory/factory.js
          grep -q 'function drinkWater' doronium-factory/factory.js
          grep -q 'data-view-mode="first"' doronium-factory/index.html
          grep -q 'id="adventure-crosshair"' doronium-factory/index.html
          grep -q 'function updateGameCamera' doronium-factory/world3d.js
          grep -q 'function pickTarget' doronium-factory/world3d.js
          grep -q 'const gameCamera = new THREE.PerspectiveCamera' doronium-factory/world3d.js
          grep -q 'function crystalGeometry' doronium-factory/world3d.js
          grep -q 'DORONIUM_CRYSTAL_MODEL_SHAPES' doronium-factory/world3d.js
          grep -q 'anim.itemGroup' doronium-factory/world3d.js
          ! grep -q 'service_role' doronium-factory/factory.js

  browser-regression:
    needs: validate-web-game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: doronium-factory/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local site server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/doronium-site.log 2>&1 &
          echo $! >/tmp/doronium-site.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/doronium-factory/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/doronium-site.log
          exit 1
      - name: Run WebGL, interaction and virtual one-hour regression
        working-directory: doronium-factory/e2e
        env:
          DORONIUM_BASE_URL: http://127.0.0.1:8765/doronium-factory/
          ARTIFACT_DIR: ../../test-artifacts
        run: npm test
      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doronium-factory-browser-regression
          path: test-artifacts/
          if-no-files-found: ignore
