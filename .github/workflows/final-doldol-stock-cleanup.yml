name: Final Doldol Stock UI cleanup
on:
  push:
    paths:
      - '.github/workflows/final-doldol-stock-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy trading UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("doldolstock.html")
          s=p.read_text(encoding="utf-8")

          # Remove short-selling buttons, styles and panels.
          s=re.sub(r'\s*<button\s+class="trade-btn short-btn"[\s\S]*?</button>\s*','\n',s)
          s=re.sub(r'\.short-btn\{[^}]*\}\.short-btn:hover\{[^}]*\}\.short-card\{[^}]*\}\.short-card:last-child\{[^}]*\}\.short-pnl\{[^}]*\}\.short-close\{[^}]*\}','',s)
          s=re.sub(r'<div class="economy-panel advanced-only"><h3>📉 공매도 포지션</h3>[\s\S]*?</div></div>','',s)

          # Remove the order-book block from the modal.
          s=re.sub(r'\s*<div class="orderbook-panel" id="orderBookPanel">[\s\S]*?</div>\s*(?=<label class="form-label trade-order-type-wrap")','\n',s,count=1)
          s=re.sub(r'\s*<label class="form-label trade-order-type-wrap" for="orderTypeSelect">[\s\S]*?</select>\s*<div id="limitPriceWrap">[\s\S]*?</div>','\n',s,count=1)

          # Remove order-book CSS block.
          s=re.sub(r'/\* =====================================================\s*즉시 체결 시장 UI\s*===================================================== \*/[\s\S]*?(?=/\* =====================================================)', '', s, count=1)
          s=re.sub(r'/\* =====================================================\s*주문장 UI\s*===================================================== \*/[\s\S]*?(?=/\* =====================================================)', '', s, count=1)
          s=re.sub(r'\.mode-easy \.orderbook-panel\{[^}]*\}|\.mode-normal \.orderbook-panel\{[^}]*\}|\.mode-easy \.trade-order-type-wrap\{[^}]*\}\.mode-easy #orderTypeSelect\{[^}]*\}|\.mode-normal \.trade-order-type-wrap\{[^}]*\}','',s)

          # Remove legacy order-book function and calls.
          s=re.sub(r'\n\s*async function loadOrderBook\(stockId\)\s*\{[\s\S]*?\n\}\s*\n\s*/\* =========================================================\s*\n\s*주문 입력 이벤트', '\n/* =========================================================\n   주문 입력 이벤트', s, count=1)
          s=re.sub(r'\n\s*loadOrderBook\([^;]+;','',s)

          # Remove old order-type listeners and limit-price listeners.
          s=re.sub(r'\n\s*const orderTypeSelect = \$\("#orderTypeSelect"\);[\s\S]*?\n\s*const quantityInput = \$\("#quantityInput"\);','\nconst quantityInput = $("#quantityInput");',s,count=1)

          # Remove short-position browser function and all short-position reads.
          s=re.sub(r'\nfunction openShort\(stockId\)[\s\S]*?\n\}\s*\n\s*function closeShortPosition\(positionId\)[\s\S]*?\n\}\s*\n\s*/\* =========================================================\s*\n\s*16\. 종목 찾기','\n/* =========================================================\n   16. 종목 찾기',s,count=1)
          s=re.sub(r'\n\s*if\(state\.user\)\{const shorts=await sb\.from\("dori_stock_short_positions"\)[\s\S]*?else state\.shortPositions=\[\];','\nstate.shortPositions=[];',s)

          # Remove old hide/show code referring to deleted controls.
          s=re.sub(r'\$\("#orderBookPanel"\)\.style\.display="none";\$\("#orderTypeSelect"\)\.parentElement\.style\.display="none";\$\("#limitPriceWrap"\)\.style\.display="none";','',s)

          # Clean user-facing terminology.
          for a,b in [('공매도','고급 거래'),('订单','거래'),('주문장','즉시 체결 시장'),('지정가 주문','즉시 체결'),('시장가 주문','즉시 체결'),('지정가','즉시 체결'),('시장가','즉시 체결')]:
              s=s.replace(a,b)

          # Only Buy/Sell actions.
          s=s.replace('grid-template-columns: repeat(3,minmax(0,1fr));','grid-template-columns: repeat(2,minmax(0,1fr));')

          # Remove dangling references in strings.
          s=s.replace('loadOrderBook','')
          s=s.replace('orderBookPanel','')
          s=s.replace('orderTypeSelect','')
          s=s.replace('limitPriceWrap','')
          s=s.replace('limitPriceInput','')

          p.write_text(s,encoding="utf-8")
          PY
      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("doldolstock.html").read_text(encoding="utf-8")
          bad=["short-btn","공매도","orderbook-panel","orderTypeSelect","limitPriceInput","지정가 주문","시장가 주문","openShort(","closeShortPosition(","dori_stock_short_positions"]
          found=[x for x in bad if x in s]
          if found:
              raise SystemExit("legacy references remain: "+", ".join(found))
          print("Doldol stock UI cleanup verification passed")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doldolstock.html
          git diff --cached --quiet || git commit -m "돌돌증권 레거시 거래 UI 완전 제거"
          git push
