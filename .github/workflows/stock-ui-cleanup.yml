name: Stock UI cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean stock UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("doldolstock.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'\s*<button\s+class="trade-btn short-btn"[\s\S]*?</button>\s*','\n',s)
          s=re.sub(r'\.short-btn\{[^}]*\}\.short-btn:hover\{[^}]*\}\.short-card\{[^}]*\}\.short-card:last-child\{[^}]*\}\.short-pnl\{[^}]*\}\.short-close\{[^}]*\}','',s)
          s=re.sub(r'<div class="economy-panel advanced-only"><h3>📉 공매도 포지션</h3>[\s\S]*?</div></div>','',s)
          s=re.sub(r'<div class="orderbook-panel" id="orderBookPanel">[\s\S]*?</div>\s*<label[^>]*trade-order-type-wrap[\s\S]*?<div id="limitPriceWrap">[\s\S]*?</div>','',s,count=1)
          s=re.sub(r'<label[^>]*trade-order-type-wrap[\s\S]*?</label>\s*<select[^>]*id="orderTypeSelect"[\s\S]*?</select>','',s,count=1)
          s=re.sub(r'<div id="limitPriceWrap">[\s\S]*?</div>','',s,count=1)
          s=s.replace('공매도','고급 거래').replace('주문장','즉시 체결 시장').replace('지정가','즉시 체결').replace('시장가','즉시 체결')
          s=s.replace('grid-template-columns: repeat(3,minmax(0,1fr));','grid-template-columns: repeat(2,minmax(0,1fr));')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doldolstock.html
          git diff --cached --quiet || git commit -m "돌돌증권 거래 화면 정리"
          git push
