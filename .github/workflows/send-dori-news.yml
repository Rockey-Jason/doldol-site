name: Send Dori News Email

on:
  schedule:
    # 15분마다 확인합니다. 실제 발송 여부는 사용자의 현지 시간
    # 20:00 ~ 다음날 08:00 및 회원 등급별 발송 주기가 결정합니다.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "테스트 이메일 주소 (입력하면 이 주소 하나로만 테스트 발송)"
        required: false
        type: string

jobs:
  run-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node send-news.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_EMAIL: ${{ inputs.test_email }}
