name: Send Dori News Email

on:
  schedule:
    # 15분마다 확인하되, 실제 발송은 각 사용자의 현지 시각 20:00 이후에만 진행합니다.
    # 정각 실행을 포함해 20:00에 발송을 시작하고, 실패 시 같은 저녁의 다음 점검에서 재시도할 수 있습니다.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "테스트 이메일 주소 (입력하면 이 주소 하나로만 테스트 발송)"
        required: false
        type: string

# Prevent scheduled/manual runs from sending to the same users concurrently.
concurrency:
  group: send-dori-news-email
  cancel-in-progress: false

jobs:
  run-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node send-news.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_EMAIL: ${{ inputs.test_email }}
