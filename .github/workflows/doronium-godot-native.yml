name: Doronium Factory — Godot Native Builds

concurrency:
  group: doronium-godot-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/doronum-factory-godot4]
    paths:
      - "DoronumFactoryGodot/**"
      - ".github/workflows/doronium-godot-native.yml"
  pull_request:
    paths:
      - "DoronumFactoryGodot/**"
      - ".github/workflows/doronium-godot-native.yml"
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    defaults:
      run:
        working-directory: DoronumFactoryGodot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          else
            cp -a /tmp/godot-templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          fi

      - name: Import and parse project
        run: godot --headless --editor --path . --quit

      - name: Launch the actual 3D main scene headlessly
        run: godot --headless --path . --quit-after 10

      - name: Run gameplay and endgame smoke tests
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Export Windows native game
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/DoronumFactory.exe

      - name: Export Linux native game
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/DoronumFactory.x86_64

      - name: Configure Android Java SDK and debug signing
        run: |
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK_ROOT" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            for candidate in /opt/android-sdk /usr/local/lib/android/sdk /usr/lib/android-sdk /root/Android/Sdk; do
              if [ -d "$candidate" ]; then ANDROID_SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$ANDROID_SDK_ROOT" ] || [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK directory not found in the Godot CI image."
            exit 1
          fi
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          {
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "Configured Android SDK: $ANDROID_SDK_ROOT"
          echo "Configured Java SDK: $JAVA_HOME"

      - name: Export Android arm64 game
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/DoronumFactory.apk

      - name: Package Godot source project
        run: |
          cd ..
          zip -qr DoronumFactoryGodot-Project.zip DoronumFactoryGodot             -x "DoronumFactoryGodot/.godot/*"             -x "DoronumFactoryGodot/build/*"

      - name: Upload native builds and source project
        uses: actions/upload-artifact@v4
        with:
          name: DoroniumFactory-Godot4-Native-Builds
          path: |
            DoronumFactoryGodot/build/windows/DoronumFactory.exe
            DoronumFactoryGodot/build/linux/DoronumFactory.x86_64
            DoronumFactoryGodot/build/android/DoronumFactory.apk
            DoronumFactoryGodot-Project.zip
          if-no-files-found: error
          retention-days: 30
