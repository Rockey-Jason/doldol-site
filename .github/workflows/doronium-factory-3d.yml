name: Doronium Factory 3D validation
on:
  push:
    paths:
      - "DoronumFactory3D/**"
      - ".github/workflows/doronium-factory-3d.yml"
  pull_request:
    paths:
      - "DoronumFactory3D/**"
      - ".github/workflows/doronium-factory-3d.yml"
  workflow_dispatch:
jobs:
  data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical game data
        run: python DoronumFactory3D/tools/validate_data.py

  godot-headless:
    runs-on: ubuntu-latest
    needs: data-contract
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 stable
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import project and parse all scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path DoronumFactory3D --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Parse failed" /tmp/godot-import.log; then
            exit 1
          fi
      - name: Run 3D game startup smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path DoronumFactory3D --quit-after 90 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid get index|Node not found" /tmp/godot-run.log; then
            exit 1
          fi
