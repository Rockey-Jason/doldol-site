name: Build Doldol Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-doldol-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - name: Build debug AAB
        run: gradle --no-daemon :app:bundleDebug
        working-directory: android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doldolsite-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
