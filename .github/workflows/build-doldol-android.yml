name: Build Doldol Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-doldol-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: env.HAS_SIGNING_KEY == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DOLDOL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/doldol-upload-keystore.jks
          test -s android/doldol-upload-keystore.jks

      - name: Generate Digital Asset Links
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DOLDOL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLDOL_KEY_ALIAS }}
        run: |
          mkdir -p .well-known
          SHA256=$(keytool -list -v             -keystore android/doldol-upload-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" |
            awk -F': ' '/SHA256:/{print $2; exit}')
          test -n "$SHA256"

          cat > .well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.rockey.doldolsite",
              "sha256_cert_fingerprints": ["$SHA256"]
            }
          }]
          EOF

          cat .well-known/assetlinks.json

      - name: Commit updated Digital Asset Links
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "assetlinks.json is already up to date."
          else
            git commit -m "chore: update Android Digital Asset Links"
            git push
          fi

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - name: Build debug AAB
        run: gradle --no-daemon :app:bundleDebug
        working-directory: android

      - name: Build release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          DOLDOL_KEYSTORE_FILE: doldol-upload-keystore.jks
          DOLDOL_KEYSTORE_PASSWORD: ${{ secrets.DOLDOL_KEYSTORE_PASSWORD }}
          DOLDOL_KEY_ALIAS: ${{ secrets.DOLDOL_KEY_ALIAS }}
          DOLDOL_KEY_PASSWORD: ${{ secrets.DOLDOL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android

      - name: Build release AAB
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          DOLDOL_KEYSTORE_FILE: doldol-upload-keystore.jks
          DOLDOL_KEYSTORE_PASSWORD: ${{ secrets.DOLDOL_KEYSTORE_PASSWORD }}
          DOLDOL_KEY_ALIAS: ${{ secrets.DOLDOL_KEY_ALIAS }}
          DOLDOL_KEY_PASSWORD: ${{ secrets.DOLDOL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
        working-directory: android

      - name: Verify release signing certificate
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DOLDOL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLDOL_KEY_ALIAS }}
        run: |
          keytool -list -v             -keystore android/doldol-upload-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS" |
            grep -E "Alias name:|SHA256:"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doldolsite-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean signing key
        if: always()
        run: rm -f android/doldol-upload-keystore.jks
