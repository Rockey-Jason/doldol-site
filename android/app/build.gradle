plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rockey.doldolsite'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rockey.doldolsite'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Debug APKs are signed automatically and can be installed directly.
        }
        release {
            minifyEnabled false
        }
    }
}
