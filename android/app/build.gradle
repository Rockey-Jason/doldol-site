plugins {
    id 'com.android.application'
}

def releaseKeystore = file(System.getenv("DOLDOL_KEYSTORE_FILE") ?: "doldol-upload-keystore.jks")

android {
    namespace 'com.rockey.doldolsite'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.rockey.doldolsite'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv("DOLDOL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DOLDOL_KEY_ALIAS")
                keyPassword System.getenv("DOLDOL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.2.0'
}
