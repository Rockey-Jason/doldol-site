// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Number(exp ?? 0);


    if (
        !Number.isFinite(exp) ||
        exp < 0
    ) {

        exp = 0;

    }


    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// EXP 정보
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Number(exp ?? 0);


    if (
        !Number.isFinite(exp) ||
        exp < 0
    ) {

        exp = 0;

    }


    const level =
        경험치로레벨계산(exp);


    if (level >= 11) {

        return {

            level: 11,

            currentExp: exp,

            requiredExp: exp,

            progress: 100,

            remaining: 0

        };

    }


    const 현재레벨필요EXP =
        EXP레벨필요경험치[level];


    const 다음레벨필요EXP =
        EXP레벨필요경험치[level + 1];


    const 현재구간EXP =
        exp -
        현재레벨필요EXP;


    const 구간필요EXP =
        다음레벨필요EXP -
        현재레벨필요EXP;


    let progress = 0;


    if (
        구간필요EXP > 0
    ) {

        progress =
            (
                현재구간EXP /
                구간필요EXP
            ) *
            100;

    }


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    const remaining =
        Math.max(
            0,
            다음레벨필요EXP -
            exp
        );


    return {

        level,

        currentExp:
            현재구간EXP,

        requiredExp:
            구간필요EXP,

        progress,

        remaining

    };

}


// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(exp);


    if (EXP레벨요소) {

        EXP레벨요소.textContent =

    }


    if (현재EXP요소) {

        현재EXP요소.textContent =
            `${정보.currentExp} EXP`;

    }


    if (필요EXP요소) {

        필요EXP요소.textContent =
            `${정보.requiredExp} EXP`;

    }


    if (EXP진행바) {

        EXP진행바.style.width =
            `${정보.progress}%`;

    }


    if (다음레벨텍스트) {

        if (
            정보.remaining <= 0
        ) {

            다음레벨텍스트.textContent =
                "✨ 최고 레벨!";

        }

        else {

            다음레벨텍스트.textContent =
                `다음 레벨까지 ${정보.remaining} EXP`;

        }

    }

}

                <div
                    class="achievement-description"
                >

                    ${업적.설명}

                </div>


                <div
                    class="achievement-description"
                >

                    희귀도:
                    ${업적.희귀도}

                </div>


                <div
                    class="achievement-reward"
                >

                    🎁 보상:

                    ${업적.보상.경험치}
                    EXP

                    /

                    ${업적.보상.돌돌코인}
                    돌돌코인

                </div>


                ${
                    획득

                    ?

                    `

                    <div
                        class="achievement-status"
                    >

                        ✅ 획득 완료

                    </div>


                    <div
                        class="achievement-time"
                    >

                        🕐 획득시간:

                        ${획득정보.획득시간
                            ? new Date(
                                획득정보.획득시간
                            ).toLocaleString(
                                "ko-KR"
                            )
                            : "-"
                        }

                    </div>

                    `

                    :

                    `

                    <div
                        class="achievement-status"
                    >

                        🔒 아직 획득하지 않음

                    </div>

                    `

                }

            </div>

        `;

    }


    if (!html) {

        html = `

            <div
                style="
                    text-align:center;
                    padding:30px;
                    opacity:0.7;
                "
            >

                업적이 없습니다.

            </div>

        `;

    }


    상태내용요소.innerHTML =
        html;

}

    const exp =
        Number(

// 상태 화면

function 상태화면업데이트() {

// =====================================================
// 탭 변경
// =====================================================

window.상태탭변경 = function(탭) {

    현재상태탭 =
        탭;


    if (업적버튼) {

        업적버튼.classList.toggle(

        );

};


// =====================================================
// 사용자 화면
// =====================================================

function 사용자화면업데이트(유저정보) {

    현재유저정보 =
        유저정보;


    // =================================================
    // 프로필
    // =================================================

    if (
        사진요소 &&
        유저정보.profile_image
    ) {

        사진요소.src =
            유저정보.profile_image;

    }


    // =================================================
    // 이름
    // =================================================

    if (이름요소) {

        이름요소.textContent =

            (
                유저정보.name
                ??
                "이름 없음"
            )
            +
            "님 환영합니다";

    }


    // =================================================
    // 아이디
    // =================================================

    if (현재아이디요소) {

        현재아이디요소.textContent =

            "현재 아이디 : " +

            (
                유저정보.login_id
                ??
                "없음"
            );

    }


    // =================================================
    // 회원 등급
    //
    // user_level
    // =================================================

    const userLevel =
        Number(
            유저정보.user_level ?? 1
        );


    if (레벨요소) {

        레벨요소.textContent =

            "현재 회원 등급 : " +

            (
                회원레벨이름[userLevel]
                ??
                "일반"
            );

    }


    // =================================================
    // 돌돌코인
    // =================================================

    if (돌돌코인수량요소) {

        const coin =
            Number(
                유저정보.doldolcoin ?? 0
            );


        돌돌코인수량요소.textContent =

            "현재 돌돌코인 : " +

            coin.toLocaleString();

    }


    // =================================================
    // EXP
    // =================================================

    const exp =
        Number(
            유저정보.exp ?? 0
        );


    const 계산된EXP레벨 =
        경험치로레벨계산(exp);


    const DBEXP레벨 =
        Number(
            유저정보.exp_level ?? 1
        );


    if (
        계산된EXP레벨 !==
        DBEXP레벨
    ) {

        console.warn(

            "exp_level 값이 실제 EXP와 다릅니다.",

            {
                exp,

                DBEXP레벨,

                계산된EXP레벨
            }

        );

    }


    EXP화면업데이트(
        exp
    );


    // =================================================
    // 상태 화면
    // =================================================

    상태화면업데이트();

}


// =====================================================
// 사용자 정보 가져오기
// =====================================================

async function 사용자정보가져오기(user) {

    if (!user) {

        throw new Error(
            "로그인된 사용자가 없습니다."
        );

    }


    const {

        data: 유저정보,

        error

    } = await supabase

        .from("users")

        .select(`

            user_number,

            user_id,

            login_id,

            user_level,

            exp,

            exp_level,

            doldolcoin,

            profile_image,

            name,

            user_achievement

        `)

        .eq(
            "user_id",
            user.id
        )

        .single();


    if (error) {

        throw error;

    }


    if (!유저정보) {

        throw new Error(

            "users 테이블에서 사용자 정보를 찾을 수 없습니다."

        );

    }


    return 유저정보;

}


// =====================================================
// exp_level DB 보정
// =====================================================

async function EXP레벨DB보정(

    user,

    exp,

    기존EXP레벨

) {

    const 계산된EXP레벨 =
        경험치로레벨계산(exp);


    const DBEXP레벨 =
        Number(
            기존EXP레벨 ?? 1
        );


    if (
        계산된EXP레벨 ===
        DBEXP레벨
    ) {

        return true;

    }


    console.log(

        "EXP 레벨 자동 보정:",

        DBEXP레벨,

        "→",

        계산된EXP레벨

    );


    const {
        error
    } = await supabase

        .from("users")

        .update({

            exp_level:
                계산된EXP레벨

        })

        .eq(
            "user_id",
            user.id
        );


    if (error) {

        console.error(

            "exp_level 자동 보정 오류:",

            error

        );

        return false;

    }


    return true;

}


// =====================================================
// 프로필 업로드
// =====================================================

async function 프로필업로드처리() {

    try {

        if (!업로드요소) {

            return;

        }


        const file =
            업로드요소.files?.[0];


        if (!file) {

            alert(
                "사진을 선택하세요."
            );

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            업로드요소.value =
                "";

            return;

        }


        const 최대크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대크기
        ) {

            alert(

                "프로필 사진은 10MB 이하만 업로드할 수 있습니다."

            );

            업로드요소.value =
                "";

            return;

        }


        const {

            data: {
                user
            },

            error: authError

        } =
            await supabase.auth.getUser();


        if (authError) {

            console.error(
                authError
            );

            alert(
                "로그인 정보를 확인할 수 없습니다."
            );

            return;

        }


        if (!user) {

            alert(
                "로그인이 필요합니다."
            );

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const 허용확장자 = [

            "jpg",

            "jpeg",

            "png",

            "gif",

            "webp"

        ];


        if (
            !허용확장자.includes(
                ext
            )
        ) {

            alert(

                "JPG, PNG, GIF, WEBP 이미지만 사용할 수 있습니다."

            );

            업로드요소.value =
                "";

            return;

        }


        const fileName =
            `${user.id}.${ext}`;


        const {
            error: uploadError

        } =
            await supabase.storage

                .from(
                    "profile-images"
                )

                .upload(

                    fileName,

                    file,

                    {

                        upsert:true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }

                );


        if (uploadError) {

            console.error(
                uploadError
            );

            alert(

                "프로필 사진 업로드에 실패했습니다.\n\n" +

                uploadError.message

            );

            return;

        }


        const {

            data

        } =
            supabase.storage

                .from(
                    "profile-images"
                )

                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data?.publicUrl;


        if (!imageUrl) {

            throw new Error(

                "프로필 이미지 URL을 가져오지 못했습니다."

            );

        }


        const {

            error: updateError

        } =
            await supabase

                .from("users")

                .update({

                    profile_image:
                        imageUrl

                })

                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            console.error(
                updateError
            );

            alert(

                "프로필 사진은 업로드되었지만 사용자 정보 저장에 실패했습니다.\n\n" +

                updateError.message

            );

            return;

        }


        if (사진요소) {

            사진요소.src =
                imageUrl +
                "?t=" +
                Date.now();

        }


        alert(
            "프로필 사진이 변경되었습니다! 🐶"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );


        alert(

            "프로필 사진 변경 중 오류가 발생했습니다.\n\n" +

            (
                error?.message ??
                "알 수 없는 오류"
            )

        );

    }

}


// =====================================================
// HTML에서 호출 가능하게 등록
// =====================================================

window.프로필업로드 =
    프로필업로드처리;


// =====================================================
// 페이지 초기화
// =====================================================

async function 페이지초기화() {

    try {

        console.log(
            "돌이 사이트 설정 페이지 시작"
        );


        // =================================================
        // 세션
        // =================================================

        const {

            data: {
                session
            },

            error: sessionError

        } =
            await supabase.auth.getSession();


        if (sessionError) {

            console.error(
                sessionError
            );

            alert(

                "로그인 상태를 확인하는 중 오류가 발생했습니다.\n\n" +

                sessionError.message

            );

            return;

        }


        if (!session) {

            로그인페이지로이동();

            return;

        }


        // =================================================
        // 사용자
        // =================================================

        const {

            data: {
                user
            },

            error: userError

        } =
            await supabase.auth.getUser();


        if (userError) {

            console.error(
                userError
            );

            alert(

                "로그인 사용자 정보를 확인하지 못했습니다.\n\n" +

                userError.message

            );

            return;

        }


        if (!user) {

            로그인페이지로이동();

            return;

        }


        console.log(
            "로그인 사용자:",
            user.id
        );


        // =================================================
        // users 조회
        // =================================================

        let 유저정보;


        try {

            유저정보 =
                await 사용자정보가져오기(
                    user
                );

        }

        catch (error) {

            console.error(

                "users 테이블 조회 오류:",

                error

            );


            const 메시지 =
                error?.message ??
                "";


            if (

                메시지
                    .toLowerCase()
                    .includes(
                        "row-level security"
                    )

            ) {

                alert(

                    "사용자 정보를 읽을 권한이 없습니다.\n\n" +

                    "Supabase users 테이블 RLS 정책을 확인하세요."

                );

            }

            else if (

                error?.code ===
                "PGRST116"

            ) {

                alert(

                    "users 테이블에서 현재 사용자의 정보를 찾을 수 없습니다."

                );

            }

            else {

                alert(

                    "사용자 정보를 불러오지 못했습니다.\n\n" +

                    메시지

                );

            }


            return;

        }


        // =================================================
        // EXP 정리
        // =================================================

        const exp =
            Number(
                유저정보.exp ?? 0
            );


        const DBEXP레벨 =
            Number(
                유저정보.exp_level ?? 1
            );


        // =================================================
        // EXP 레벨 보정
        // =================================================

        await EXP레벨DB보정(

            user,

            exp,

            DBEXP레벨

        );


        // =================================================
        // 화면
        // =================================================

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(

            "설정 페이지 초기화 오류:",

            error

        );


        alert(

            "페이지를 불러오는 중 오류가 발생했습니다.\n\n" +

            (
                error?.message ??
                "알 수 없는 오류"
            )

        );

    }

}
