// =====================================================
// EXP → 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Number(exp ?? 0);

    if (
        !Number.isFinite(exp) ||
        exp < 0
    ) {

        exp = 0;

    }


    let level = 1;


    for (
        let i = 11;
        i >= 1;
        i--
    ) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// EXP 진행도 계산
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Number(exp ?? 0);


    if (
        !Number.isFinite(exp) ||
        exp < 0
    ) {

        exp = 0;

    }


    const level =
        경험치로레벨계산(exp);


    // =================================================
    // 최고 레벨
    // =================================================

    if (level >= 11) {

        return {

            level: 11,

            currentExp: exp,

            requiredExp: exp,

            progress: 100,

            remaining: 0

        };

    }


    // =================================================
    // 현재 레벨 시작 EXP
    // =================================================

    const 현재레벨필요EXP =
        EXP레벨필요경험치[level];


    // =================================================
    // 다음 레벨 필요 EXP
    // =================================================

    const 다음레벨필요EXP =
        EXP레벨필요경험치[level + 1];


    // =================================================
    // 현재 레벨 구간에서 획득한 EXP
    // =================================================

    const 현재구간EXP =
        exp -
        현재레벨필요EXP;


    // =================================================
    // 다음 레벨까지 필요한 구간 EXP
    // =================================================

    const 구간필요EXP =
        다음레벨필요EXP -
        현재레벨필요EXP;


    // =================================================
    // 진행률
    // =================================================

    let progress = 0;


    if (구간필요EXP > 0) {

        progress =
            (
                현재구간EXP /
                구간필요EXP
            ) * 100;

    }


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    // =================================================
    // 다음 레벨까지 남은 EXP
    // =================================================

    const remaining =
        Math.max(
            0,
            다음레벨필요EXP -
            exp
        );


    return {

        level,

        currentExp:
            현재구간EXP,

        requiredExp:
            구간필요EXP,

        progress,

        remaining

    };

}


// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =

    // =================================================

            EXP레벨요소.textContent =
                `Lv.${계산된EXP레벨}`;

        }

    }

// =====================================================
// 사용자 정보 조회
// =====================================================

async function 사용자정보가져오기(user) {

    if (!user) {

        throw new Error(
            "로그인된 사용자가 없습니다."
        );

    }


    const {

        data: 유저정보,

        error

    } = await supabase

        .from("users")

        .select(`

            user_number,
            user_id,
            login_id,
            user_level,
            exp,
            exp_level,
            doldolcoin,
            profile_image,
            name

        `)

        .eq(
            "user_id",
            user.id
        )

        .single();


    if (error) {

        throw error;

    }


    if (!유저정보) {

        throw new Error(
            "users 테이블에서 사용자 정보를 찾을 수 없습니다."
        );

    }


    return 유저정보;

}


// =====================================================
// exp_level DB 자동 보정
// =====================================================

async function EXP레벨DB보정(user, exp, 기존EXP레벨) {

    const 계산된EXP레벨 =
        경험치로레벨계산(exp);


    const DBEXP레벨 =
        Number(
            기존EXP레벨 ?? 1
        );


    if (
        계산된EXP레벨 ===
        DBEXP레벨
    ) {

        return true;

    }


    console.log(
        "EXP 레벨 자동 보정:",
        DBEXP레벨,
        "→",
        계산된EXP레벨
    );


    const {

        error

    } = await supabase

        .from("users")

        .update({

            exp_level:
                계산된EXP레벨

        })

        .eq(
            "user_id",
            user.id
        );


    if (error) {

        console.error(
            "exp_level 자동 보정 오류:",
            error
        );

        return false;

    }


    return true;

}


// =====================================================
// 프로필 사진 업로드
// =====================================================

async function 프로필업로드처리() {

    try {


        // =================================================
        // 파일 확인
        // =================================================

        if (!업로드요소) {

            console.error(
                "profileUpload 요소를 찾을 수 없습니다."
            );

            return;

        }


        const file =
            업로드요소.files?.[0];


        if (!file) {

            alert(
                "사진을 선택하세요."
            );

            return;

        }


        // =================================================
        // 파일 형식 검사
        // =================================================

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        // =================================================
        // 파일 크기 검사
        //
        // 10MB 제한
        // =================================================

        const 최대크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대크기
        ) {

            alert(
                "프로필 사진은 10MB 이하만 업로드할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        // =================================================
        // 로그인 사용자 확인
        // =================================================

        const {

            data: { user },

            error: authError

        } =
            await supabase.auth.getUser();


        if (authError) {

            console.error(
                "프로필 업로드 인증 오류:",
                authError
            );


            if (
                authError.message
                    ?.toLowerCase()
                    .includes("invalid api key")
            ) {

                alert(
                    "Supabase API Key가 올바르지 않습니다."
                );

            }
            else {

                alert(
                    "로그인 정보를 확인할 수 없습니다."
                );

            }

            return;

        }


        if (!user) {

            alert(
                "로그인이 필요합니다."
            );

            return;

        }


        // =================================================
        // 확장자
        // =================================================

        let ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        // =================================================
        // 허용 확장자
        // =================================================

        const 허용확장자 = [

            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp"

        ];


        if (
            !허용확장자.includes(ext)
        ) {

            alert(
                "JPG, PNG, GIF, WEBP 이미지만 사용할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        // =================================================
        // 파일명
        //
        // ⭐ user.id 사용
        // =================================================

        const fileName =
            `${user.id}.${ext}`;


        console.log(
            "프로필 업로드 시작:",
            fileName
        );


        // =================================================
        // Storage 업로드
        // =================================================

        const {

            error: uploadError

        } =
            await supabase.storage

                .from(
                    "profile-images"
                )

                .upload(

                    fileName,

                    file,

                    {

                        upsert: true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }

                );


        if (uploadError) {

            console.error(
                "프로필 Storage 업로드 오류:",
                uploadError
            );


            alert(
                "프로필 사진 업로드에 실패했습니다.\n\n" +
                uploadError.message
            );

            return;

        }


        // =================================================
        // 공개 URL
        // =================================================

        const {

            data

        } =
            supabase.storage

                .from(
                    "profile-images"
                )

                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data?.publicUrl;


        if (!imageUrl) {

            throw new Error(
                "프로필 이미지 URL을 가져오지 못했습니다."
            );

        }


        console.log(
            "프로필 이미지 URL:",
            imageUrl
        );


        // =================================================
        // users 테이블 업데이트
        //
        // ⭐ user_id 기준
        // ⭐ ID가 다른 구조는 그대로 유지
        // =================================================

        const {

            error: updateError

        } =
            await supabase

                .from("users")

                .update({

                    profile_image:
                        imageUrl

                })

                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            console.error(
                "프로필 DB 저장 오류:",
                updateError
            );


            alert(
                "프로필 사진은 업로드되었지만 " +
                "사용자 정보 저장에 실패했습니다.\n\n" +
                updateError.message
            );

            return;

        }


        // =================================================
        // 화면 즉시 변경
        // =================================================

        if (사진요소) {

            사진요소.src =
                imageUrl +
                "?t=" +
                Date.now();

        }


        alert(
            "프로필 사진이 변경되었습니다! 🐶"
        );


        // 파일 선택 초기화
        업로드요소.value = "";


    }
    catch (error) {

        console.error(
            "프로필 업로드 처리 중 예상하지 못한 오류:",
            error
        );


        alert(
            "프로필 사진 변경 중 오류가 발생했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// HTML onchange에서 호출할 수 있도록 등록

window.프로필업로드 =
    프로필업로드처리;


// =====================================================
// 페이지 초기화
// =====================================================

async function 페이지초기화() {

    try {


        console.log(
            "돌이 사이트 설정 페이지 시작"
        );


        // =================================================
        // Supabase 세션 확인
        // =================================================

        const {

            data: { session },

            error: sessionError

        } =
            await supabase.auth.getSession();


        if (sessionError) {

            console.error(
                "Supabase 세션 확인 오류:",
                sessionError
            );


            const 메시지 =
                sessionError.message ??
                "";


            if (
                메시지
                    .toLowerCase()
                    .includes("invalid api key")
            ) {

                alert(
                    "Supabase API Key가 잘못되었습니다.\n\n" +
                    "SUPABASE_ANON_KEY를 확인하세요."
                );

            }
            else {

                alert(
                    "로그인 상태를 확인하는 중 오류가 발생했습니다.\n\n" +
                    메시지
                );

            }


            return;

        }


        // =================================================
        // 로그인하지 않은 경우
        // =================================================

        if (!session) {

            로그인페이지로이동();

            return;

        }


        // =================================================
        // 현재 사용자 확인
        // =================================================

        const {

            data: { user },

            error: userError

        } =
            await supabase.auth.getUser();


        if (userError) {

            console.error(
                "로그인 사용자 확인 오류:",
                userError
            );


            const 메시지 =
                userError.message ??
                "";


            if (
                메시지
                    .toLowerCase()
                    .includes("invalid api key")
            ) {

                alert(
                    "Supabase API Key가 올바르지 않습니다."
                );

            }
            else {

                alert(
                    "로그인 사용자 정보를 확인하지 못했습니다.\n\n" +
                    메시지
                );

            }


            return;

        }


        if (!user) {

            로그인페이지로이동();

            return;

        }


        console.log(
            "로그인 사용자:",
            user.id
        );


        // =================================================
        // users 테이블 정보 조회
        // =================================================

        let 유저정보;


        try {

            유저정보 =
                await 사용자정보가져오기(
                    user
                );

        }
        catch (error) {

            오류메시지(
                "users 테이블 조회 오류:",
                error
            );


            const 메시지 =
                error?.message ??
                "";


            // RLS 가능성
            if (
                메시지
                    .toLowerCase()
                    .includes("row-level security")
            ) {

                alert(
                    "사용자 정보를 읽을 권한이 없습니다.\n\n" +
                    "Supabase의 users 테이블 RLS 정책을 확인하세요."
                );

            }

            // 사용자 없음
            else if (
                메시지
                    .toLowerCase()
                    .includes("0 rows")
                ||
                error?.code === "PGRST116"
            ) {

                alert(
                    "users 테이블에서 현재 사용자의 정보를 찾을 수 없습니다."
                );

            }

            else {

                alert(
                    "사용자 정보를 불러오지 못했습니다.\n\n" +
                    메시지
                );

            }


            return;

        }


        console.log(
            "현재 사용자 정보:",
            유저정보
        );


        // =================================================
        // EXP 값 정리
        // =================================================

        const exp =
            Number(
                유저정보.exp ?? 0
            );


        const DBEXP레벨 =
            Number(
                유저정보.exp_level ?? 1
            );


        // =================================================
        // EXP 레벨 자동 보정
        // =================================================

        await EXP레벨DB보정(

            user,

            exp,

            DBEXP레벨

        );


        // =================================================
        // 화면 업데이트
        // =================================================

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "돌이 사이트 설정 페이지 정상 실행"
        );


    }
    catch (error) {

        console.error(
            "설정 페이지 초기화 중 예상하지 못한 오류:",
            error
        );


        alert(
            "페이지를 불러오는 중 오류가 발생했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// DOMContentLoaded
// =====================================================

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        페이지초기화
    );

}
else {

    페이지초기화();

}


// =====================================================
// Supabase 인증 상태 변경 감시
// =====================================================

supabase.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "Auth 상태 변경:",
            event
        );


        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }
);

</script>
