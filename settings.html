<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>돌이 사이트 · 설정</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<link
    href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
    rel="stylesheet"
>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');

@font-face {
    font-family: 'HancomMalrangmalrang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2')
         format('woff2');
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: 'HancomMalrangmalrang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2')
         format('woff2');
    font-weight: 700;
    font-display: swap;
}

:root {
    --bg-main: #05051c;
    --bg-secondary: #0b0b2d;
    --card: rgba(255, 255, 255, 0.075);
    --card-hover: rgba(255, 255, 255, 0.12);
    --border: rgba(255, 255, 255, 0.13);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --blue: #69c9ff;
    --purple: #927dff;
    --pink: #e59aff;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: 'HancomMalrangmalrang', sans-serif;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(82, 89, 255, 0.2),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(190, 93, 255, 0.14),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #05051c 0%,
            #09092b 45%,
            #02020e 100%
        );
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(255, 255, 255, 0.018) 50%,
            transparent 100%
        );
    z-index: -1;
}

/* 상단 헤더 */

.site-header {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 26px 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.site-logo {
    color: white;
    text-decoration: none;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(30px, 5vw, 54px);
    letter-spacing: -2px;
    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

.site-logo:hover {
    transform: translateY(-3px);
    opacity: 0.85;
}

.header-description {
    color: var(--muted);
    font-size: 15px;
    text-align: right;
}

/* 전체 레이아웃 */

.page-container {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 25px 0 80px;
}

.page-heading {
    margin-bottom: 28px;
    animation: fadeUp 0.7s ease both;
}

.page-heading h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: -1.5px;
}

.page-heading p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
}

/* 프로필 + EXP */

.top-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: 20px;
    margin-bottom: 22px;
}

.glass-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.glass-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.4),
        transparent
    );
}

/* 프로필 카드 */

.profile-card {
    padding: 30px;
    display: flex;
    align-items: center;
    gap: 26px;
    min-height: 285px;
    animation: fadeUp 0.7s 0.1s ease both;
}

.profile-image-wrapper {
    position: relative;
    flex: 0 0 auto;
}

.profile-image-wrapper::after {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(143, 126, 255, 0.55);
    border-radius: 50%;
    animation: pulseRing 3s ease-in-out infinite;
}

.profile-image-wrapper.has-profile-frame::before {
    content: "";
    position: absolute;
    inset: -16px;
    z-index: 2;
    border-radius: 50%;
    background-image: var(--profile-frame-art, none);
    background-position: center;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    filter: drop-shadow(0 0 9px var(--profile-frame-color, rgba(143,126,255,.4)));
    pointer-events: none;
}
.profile-image-wrapper.has-profile-frame::after {
    inset: -13px;
    border-color: var(--profile-frame-color, rgba(143,126,255,.55));
    box-shadow: 0 0 18px var(--profile-frame-color, rgba(143,126,255,.35));
}
.profile-image-wrapper.has-profile-frame #돌이사진 {
    border-color: #fff !important;
    box-shadow: 0 0 0 2px rgba(5,5,28,.9);
}


#돌이사진 {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: clamp(125px, 16vw, 190px) !important;
    height: clamp(125px, 16vw, 190px) !important;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.8) !important;
    border-radius: 50%;
    cursor: pointer;
    display: block;
    transition:
        transform 0.4s ease,
        filter 0.4s ease;
    z-index: 1;
}

#돌이사진:hover {
    transform: scale(1.06) rotate(2deg);
    filter: brightness(1.1);
}

.profile-info {
    min-width: 0;
    flex: 1;
}

#이름 {
    position: static !important;
    display: block;
    max-width: 100%;
    padding: 0 !important;
    margin: 0 0 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: white !important;
    background: none !important;
    border: none !important;
    font-family: 'HancomMalrangmalrang', sans-serif !important;
    font-size: clamp(25px, 4vw, 43px) !important;
    font-weight: 700;
    text-align: left;
    cursor: default !important;
}

.profile-level,
.profile-coin,
.profile-id {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#레벨,
#돌돌코인수량 {
    position: static !important;
    padding: 0 !important;
    color: var(--muted) !important;
    background: none !important;
    border: none !important;
    font-family: inherit !important;
    font-size: 15px !important;
    font-weight: 400 !important;
    text-align: left;
}

#현재아이디 {
    position: static !important;
    margin-top: 8px;
    color: var(--muted) !important;
    font-size: 15px !important;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.profile-button,
.info-button {
    position: static !important;
    width: 100% !important;
    height: 46px !important;
    margin-top: 20px;
    border: 1px solid var(--border) !important;
    border-radius: 14px !important;
    color: white !important;
    background: rgba(255, 255, 255, 0.08) !important;
    font-family: inherit !important;
    font-size: 15px !important;
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.profile-button:hover,
.info-button:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.15) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
}

.profile-button:active,
.info-button:active,
.title-change-button:active,
.title-save-button:active,
.title-cancel-button:active,
.status-tab-button:active {
    transform: scale(0.97);
}

/* EXP 카드 */

.exp-box {
    position: static !important;
    width: auto !important;
    max-width: none !important;
    min-height: 285px;
    padding: 30px !important;
    border: none !important;
    border-radius: 0 !important;
    background: transparent !important;
    animation: fadeUp 0.7s 0.2s ease both;
}

.exp-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 24px;
    font-size: 21px;
    font-weight: 500;
}

#user-level {
    padding: 7px 13px;
    border: 1px solid rgba(146, 125, 255, 0.35);
    border-radius: 999px;
    background: rgba(146, 125, 255, 0.14);
    color: #d7d0ff;
    font-size: 14px;
}

.exp-progress {
    width: 100%;
    height: 15px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
}

#exp-progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--pink)
    );
    box-shadow: 0 0 18px rgba(125, 145, 255, 0.55);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.exp-text {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
}

#next-level-text {
    margin-top: 28px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.045);
    color: var(--muted);
    text-align: center;
    font-size: 14px;
}

/* 상태 카드 */

.status-box {
    position: static !important;
    width: 100% !important;
    max-width: none !important;
    padding: 25px !important;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    animation: fadeUp 0.7s 0.3s ease both;
}

.status-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 24px;
}

.status-tab-button {
    min-height: 48px;
    border: 1px solid transparent;
    border-radius: 14px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition:
        color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
}

.status-tab-button:hover {
    color: white;
    background: rgba(255, 255, 255, 0.12);
}

.status-tab-button.active {
    color: #080822;
    background: linear-gradient(
        135deg,
        #ffffff,
        #d8d4ff
    );
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 22px rgba(160, 150, 255, 0.2);
}

.status-content {
    min-height: 170px;
    animation: contentFade 0.35s ease;
}

.status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 16px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 16px;
}

.status-item:last-child {
    border-bottom: none;
}

.status-value {
    color: white;
    font-weight: 500;
    text-align: right;
    overflow-wrap: anywhere;
}

.empty {
    padding: 45px 20px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
}

/* 설정 페이지 업적 분야 탐색 */

/* 업적 */

.achievement-item {
    margin-bottom: 12px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.045);
    transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;
    animation: fadeUp 0.45s ease both;
}

.achievement-item:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.085);
    border-color: rgba(255, 255, 255, 0.18);
}

.achievement-name {
    font-size: 19px;
    font-weight: 500;
}

.achievement-description {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
}

.achievement-reward {
    margin-top: 12px;
    color: #d7d0ff;
    font-size: 14px;
}

.achievement-status {
    margin-top: 12px;
    color: #8de5b0;
    font-size: 14px;
}

.achievement-time {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
}

.achievement-title {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 999px;
    background: rgba(255, 215, 0, 0.1);
    color: #ffe680;
    font-size: 13px;
}

/* 칭호 */

.title-current {
    padding: 25px;
    margin-bottom: 15px;
    border: 1px solid rgba(146, 125, 255, 0.2);
    border-radius: 20px;
    background:
        linear-gradient(
            135deg,
            rgba(146, 125, 255, 0.16),
            rgba(255, 255, 255, 0.04)
        );
    text-align: center;
}

.title-current-label {
    color: var(--muted);
    font-size: 14px;
}

.title-current-name {
    margin-top: 10px;
    color: white;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 500;
}

/* 업적 등급별 칭호 효과: Common < Rare < Epic < Legendary < Myth < Doronum */
.title-current-name,
.title-item-name,
.achievement-title {
    --title-color:#d4deee;
    --title-glow:rgba(190,205,230,.12);
    transition:color .35s ease,text-shadow .35s ease,filter .35s ease,box-shadow .35s ease;
}
.title-current-name.title-rarity-common,.title-rarity-common .title-item-name{color:#f4f7ff}
.title-current-name.title-rarity-rare,.title-rarity-rare .title-item-name{color:#8fd0ff;text-shadow:0 0 10px rgba(65,165,255,.28)}
.title-current-name.title-rarity-epic,.title-rarity-epic .title-item-name{color:#d8a6ff;text-shadow:0 0 12px rgba(175,90,255,.35)}
.title-current-name.title-rarity-legendary,.title-rarity-legendary .title-item-name{color:#ffd66b;text-shadow:0 0 10px rgba(255,190,45,.5),0 0 24px rgba(255,170,25,.24);animation:titleGoldGlow 2.8s ease-in-out infinite}
.title-current-name.title-rarity-myth,.title-rarity-myth .title-item-name{color:#ff5e83;text-shadow:0 0 12px rgba(255,35,90,.62),0 0 28px rgba(255,35,90,.25);animation:titleMythGlow 2.2s ease-in-out infinite}
.title-current-name.title-rarity-doronum,.title-rarity-doronum .title-item-name{color:#69f7ff;text-shadow:0 0 12px rgba(28,232,255,.72),0 0 28px rgba(45,130,255,.38),0 0 48px rgba(45,220,255,.2);animation:titleDoronumGlow 1.8s ease-in-out infinite}
.title-item.title-rarity-legendary{border-color:rgba(255,205,80,.42);background:linear-gradient(120deg,rgba(130,85,8,.17),rgba(255,255,255,.035))}
.title-item.title-rarity-myth{border-color:rgba(255,65,105,.5);background:linear-gradient(120deg,rgba(135,5,38,.2),rgba(255,255,255,.025))}
.title-item.title-rarity-doronum{border-color:rgba(75,235,255,.62);background:linear-gradient(120deg,rgba(0,105,145,.24),rgba(70,105,255,.07));box-shadow:0 0 24px rgba(35,210,255,.12),inset 0 0 18px rgba(40,220,255,.06)}
.achievement-title.title-rarity-legendary{color:#ffe08a;border-color:rgba(255,195,45,.5);background:rgba(180,120,10,.15);text-shadow:0 0 10px rgba(255,180,30,.35)}
.achievement-title.title-rarity-myth{color:#ff7898;border-color:rgba(255,50,90,.55);background:rgba(160,10,45,.18);text-shadow:0 0 12px rgba(255,35,90,.42)}
.achievement-title.title-rarity-doronum{color:#8afaff;border-color:rgba(60,235,255,.65);background:rgba(0,125,160,.2);text-shadow:0 0 12px rgba(30,225,255,.55)}
@keyframes titleGoldGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
@keyframes titleMythGlow{0%,100%{filter:brightness(1);text-shadow:0 0 10px rgba(255,35,90,.45)}50%{filter:brightness(1.2);text-shadow:0 0 18px rgba(255,35,90,.75),0 0 34px rgba(255,35,90,.28)}}
@keyframes titleDoronumGlow{0%,100%{filter:brightness(1);transform:translateY(0)}50%{filter:brightness(1.22);transform:translateY(-1px)}}

/* 상위 등급 칭호: 불꽃처럼 일렁이는 글씨 효과 */
.title-rarity-epic .title-item-name,
.title-current-name.title-rarity-epic{animation:titleEpicShimmer 2.4s ease-in-out infinite}
.title-rarity-legendary .title-item-name,
.title-current-name.title-rarity-legendary{animation:titleGoldFlicker 2.2s ease-in-out infinite}
.title-rarity-myth .title-item-name,
.title-current-name.title-rarity-myth{animation:titleMythFlare 1.65s ease-in-out infinite}
.title-rarity-doronum .title-item-name,
.title-current-name.title-rarity-doronum{animation:titleDoronumFlare 1.5s ease-in-out infinite}
@keyframes titleEpicShimmer{
  0%,100%{filter:brightness(1);text-shadow:0 0 9px rgba(175,90,255,.28)}
  35%{filter:brightness(1.12);text-shadow:0 0 13px rgba(175,90,255,.5),0 -2px 8px rgba(220,170,255,.22)}
  52%{filter:brightness(1.04);text-shadow:0 0 8px rgba(175,90,255,.3)}
  72%{filter:brightness(1.16);text-shadow:0 0 16px rgba(190,100,255,.58),0 2px 10px rgba(130,55,255,.24)}
}
@keyframes titleGoldFlicker{
  0%,100%{filter:brightness(1);text-shadow:0 0 10px rgba(255,190,45,.42),0 0 22px rgba(255,170,25,.18)}
  18%{filter:brightness(1.17);text-shadow:0 -2px 11px rgba(255,238,150,.72),0 2px 16px rgba(255,150,20,.48),0 0 28px rgba(255,180,30,.3)}
  31%{filter:brightness(.98);text-shadow:0 0 8px rgba(255,190,45,.36)}
  47%{filter:brightness(1.22);text-shadow:0 -3px 14px rgba(255,245,175,.8),0 3px 18px rgba(255,135,10,.55),0 0 32px rgba(255,180,30,.34)}
  63%{filter:brightness(1.04);text-shadow:0 0 12px rgba(255,190,45,.48)}
  78%{filter:brightness(1.19);text-shadow:0 -2px 12px rgba(255,235,130,.72),0 3px 20px rgba(255,145,15,.48)}
}
@keyframes titleMythFlare{
  0%,100%{filter:brightness(1);text-shadow:0 0 10px rgba(255,35,90,.48),0 0 22px rgba(255,20,65,.2)}
  16%{filter:brightness(1.2);text-shadow:0 -3px 13px rgba(255,155,175,.78),0 3px 18px rgba(255,15,65,.68),0 0 32px rgba(255,25,75,.36)}
  29%{filter:brightness(1.02);text-shadow:0 0 9px rgba(255,35,90,.44)}
  51%{filter:brightness(1.25);text-shadow:0 -2px 16px rgba(255,180,190,.88),0 4px 21px rgba(255,5,55,.76),0 0 38px rgba(255,25,75,.42)}
  69%{filter:brightness(1.06);text-shadow:0 0 12px rgba(255,35,90,.54)}
  84%{filter:brightness(1.22);text-shadow:0 -2px 13px rgba(255,145,165,.8),0 3px 20px rgba(255,10,60,.65)}
}
@keyframes titleDoronumFlare{
  0%,100%{filter:brightness(1);text-shadow:0 0 12px rgba(28,232,255,.64),0 0 27px rgba(45,130,255,.32),0 0 42px rgba(45,220,255,.16)}
  22%{filter:brightness(1.2);text-shadow:0 -2px 14px rgba(210,255,255,.95),0 3px 18px rgba(20,220,255,.76),0 0 35px rgba(45,130,255,.5)}
  38%{filter:brightness(1.05);text-shadow:0 0 11px rgba(28,232,255,.58),0 0 22px rgba(45,130,255,.28)}
  57%{filter:brightness(1.28);text-shadow:0 -3px 17px rgba(225,255,255,1),0 4px 23px rgba(20,210,255,.86),0 0 42px rgba(45,130,255,.55)}
  74%{filter:brightness(1.08);text-shadow:0 0 13px rgba(28,232,255,.68),0 0 26px rgba(45,130,255,.32)}
  88%{filter:brightness(1.23);text-shadow:0 -2px 14px rgba(195,255,255,.92),0 3px 20px rgba(20,220,255,.78),0 0 38px rgba(45,130,255,.45)}
}
@media(prefers-reduced-motion:reduce){
 .title-rarity-epic .title-item-name,.title-current-name.title-rarity-epic,
 .title-rarity-legendary .title-item-name,.title-current-name.title-rarity-legendary,
 .title-rarity-myth .title-item-name,.title-current-name.title-rarity-myth,
 .title-rarity-doronum .title-item-name,.title-current-name.title-rarity-doronum{animation:none!important}
}

@media(prefers-reduced-motion:reduce){.title-current-name.title-rarity-legendary,.title-rarity-legendary .title-item-name,.title-current-name.title-rarity-myth,.title-rarity-myth .title-item-name,.title-current-name.title-rarity-doronum,.title-rarity-doronum .title-item-name{animation:none!important}}


.title-list {
    display: none;
    margin-top: 15px;
}

.title-list.open {
    display: block;
    animation: fadeUp 0.35s ease;
}

.title-item {
    padding: 17px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.045);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.title-item:hover {
    transform: translateX(4px);
    background: rgba(255, 255, 255, 0.1);
}

.title-item.selected {
    border-color: var(--purple);
    background: rgba(146, 125, 255, 0.16);
    box-shadow: 0 0 22px rgba(146, 125, 255, 0.1);
}

.title-item-name {
    font-size: 18px;
    font-weight: 500;
}

.title-item-achievement {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
}

.title-change-button,
.title-save-button,
.title-cancel-button {
    width: 100%;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition:
        transform 0.25s ease,
        filter 0.25s ease,
        background 0.25s ease;
}

.title-change-button {
    height: 48px;
    color: #080822;
    background: white;
}

.title-save-button {
    height: 48px;
    margin-top: 12px;
    color: white;
    background: linear-gradient(
        100deg,
        var(--blue),
        var(--purple)
    );
}

.title-cancel-button {
    height: 43px;
    margin-top: 9px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.08);
}

.title-change-button:hover,
.title-save-button:hover,
.title-cancel-button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}



/* 꼭 필요한 업적 이름만 살짝 가볍게 조정 */
.achievement-name {
    font-weight: 500;
}
.achievement-item {
    position: relative;
    border-left: 3px solid rgba(255,255,255,.22);
}
.achievement-item.is-completed {
    border-color: rgba(75, 222, 151, .72);
    border-left-color: #4bde97;
    background: linear-gradient(110deg, rgba(40, 190, 122, .14), rgba(255,255,255,.035) 72%);
    box-shadow: inset 0 0 0 1px rgba(75,222,151,.08);
}
.achievement-item.is-locked {
    border-left-color: rgba(170,180,205,.55);
    background: linear-gradient(110deg, rgba(130,145,175,.075), rgba(255,255,255,.025) 72%);
}
.achievement-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
}
.achievement-item.is-completed .achievement-status {
    color: #8df5bd;
    border-color: rgba(75,222,151,.42);
    background: rgba(35,180,112,.15);
}
.achievement-item.is-locked .achievement-status {
    color: #c2c9d8;
    border-color: rgba(170,180,205,.22);
    background: rgba(120,135,165,.10);
}
.achievement-item.is-completed .achievement-name::after {
    content: "획득";
    display: inline-block;
    margin-left: 8px;
    padding: 3px 8px;
    border-radius: 999px;
    color: #082417;
    background: #8df5bd;
    font-size: 11px;
    font-weight: 500;
    vertical-align: middle;
}
@media (prefers-reduced-motion: reduce) {
    .achievement-item, .achievement-item:hover {
        animation: none;
        transition: none;
        transform: none;
    }
}

/* =====================================================
   내 아이템 / 돌이 꾸미기
===================================================== */

.status-tabs {
    grid-template-columns: repeat(5, minmax(0, 1fr));
}

.inventory-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.inventory-summary {
    color: var(--muted);
    font-size: 14px;
}

.inventory-summary strong {
    color: #fff;
}

.inventory-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.inventory-filter button {
    min-height: 36px;
    padding: 0 13px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(255,255,255,.045);
    font-family: inherit;
    cursor: pointer;
    transition: .25s ease;
}

.inventory-filter button:hover {
    color: #fff;
    background: rgba(255,255,255,.1);
    transform: translateY(-2px);
}

.inventory-filter button.active {
    color: #080822;
    background: linear-gradient(135deg,#fff,#d8d4ff);
    border-color: rgba(255,255,255,.45);
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 13px;
}

.inventory-card {
    position: relative;
    min-height: 185px;
    padding: 17px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.085);
    border-radius: 20px;
    background:
        radial-gradient(circle at 80% 10%, rgba(146,125,255,.13), transparent 42%),
        rgba(255,255,255,.045);
    cursor: pointer;
    animation: itemReveal .45s cubic-bezier(.22,1,.36,1) both;
    transition: transform .3s ease, border-color .3s ease, background .3s ease, box-shadow .3s ease;
}

.inventory-card:nth-child(2n) { animation-delay: .035s; }
.inventory-card:nth-child(3n) { animation-delay: .07s; }
.inventory-card:nth-child(4n) { animation-delay: .105s; }

.inventory-card:hover {
    transform: translateY(-5px);
    border-color: rgba(255,255,255,.2);
    background:
        radial-gradient(circle at 80% 10%, rgba(146,125,255,.2), transparent 42%),
        rgba(255,255,255,.075);
    box-shadow: 0 18px 38px rgba(0,0,0,.22);
}

.inventory-card.custom-item:hover {
    box-shadow: 0 18px 45px rgba(105,201,255,.1);
}

.inventory-icon {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 17px;
    background: rgba(255,255,255,.06);
    font-size: 28px;
    box-shadow: inset 0 1px rgba(255,255,255,.12);
}

.inventory-type {
    color: var(--blue);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .4px;
}

.inventory-name {
    margin-top: 4px;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.35;
}

.inventory-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
}

.inventory-quantity {
    color: #fff;
    font-weight: 500;
}

.rarity-badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 0 8px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px;
    background: rgba(255,255,255,.05);
}

.inventory-card.selected {
    border-color: rgba(105,201,255,.7);
    background:
        radial-gradient(circle at 80% 10%, rgba(105,201,255,.18), transparent 45%),
        rgba(105,201,255,.08);
    box-shadow: 0 0 0 1px rgba(105,201,255,.12), 0 16px 40px rgba(0,0,0,.2);
}

.inventory-card.equipped::after {
    content: "장착 중";
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 5px 8px;
    border-radius: 999px;
    color: #06121d;
    background: #9fe7ff;
    font-size: 11px;
    font-weight: 500;
}

.inventory-code {
    margin-top: 7px;
    color: rgba(255,255,255,.35);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    word-break: break-all;
}

.customization-layout {
    display: grid;
    grid-template-columns: minmax(250px,.8fr) minmax(0,1.2fr);
    gap: 18px;
    align-items: start;
}

.custom-preview {
    position: sticky;
    top: 18px;
    min-height: 430px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 26px 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    background:
        radial-gradient(circle at 50% 38%, rgba(105,201,255,.13), transparent 35%),
        linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
}

.custom-preview::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(146,125,255,.18), transparent 68%);
    filter: blur(8px);
    animation: previewGlow 4s ease-in-out infinite;
}

.inventory-action-row{display:flex;gap:8px;margin-top:13px}
.inventory-action-button{width:100%;min-height:38px;padding:8px 12px;border:1px solid rgba(126,210,255,.32);border-radius:11px;color:#e9f8ff;background:linear-gradient(135deg,rgba(76,145,210,.24),rgba(88,89,190,.22));font:inherit;font-size:13px;cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.inventory-action-button:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(135deg,rgba(76,145,210,.38),rgba(88,89,190,.34));border-color:rgba(126,210,255,.58)}
.inventory-action-button:disabled{opacity:.65;cursor:default}
.inventory-action-button.multiplier-action{border-color:rgba(255,211,119,.35);color:#ffe8b0;background:linear-gradient(135deg,rgba(168,119,43,.24),rgba(115,83,38,.2))}
.inventory-action-status{margin:0 0 16px;padding:11px 14px;border:1px solid rgba(130,164,255,.18);border-radius:12px;color:#cbd9fa;background:rgba(98,117,210,.08);font-size:13px;line-height:1.55}
.inventory-buff-status{margin:0 0 14px;padding:12px 14px;border:1px solid rgba(255,205,115,.24);border-radius:12px;color:#ffe6ad;background:linear-gradient(120deg,rgba(177,124,42,.12),rgba(95,70,34,.08));font-size:13px;line-height:1.5}
.preview-cape{left:12px;top:auto;bottom:58px;transform:none;padding:5px 8px}
.preview-dori[class*="preview-skin_"] img{filter:saturate(1.2) contrast(1.04)}

.preview-dori[class*="preview-effect_"]{box-shadow:0 24px 55px rgba(0,0,0,.32),0 0 0 4px rgba(145,155,255,.22),0 0 38px rgba(131,144,255,.4)}
.preview-stage[class*="preview-bg-background_"]{border:1px solid rgba(255,255,255,.12);border-radius:20px}
.preview-stage.preview-bg-background_doronium{background:radial-gradient(circle,rgba(78,213,255,.3),rgba(10,31,73,.2) 65%,transparent 100%)}
.preview-stage.preview-bg-background_dori{background:radial-gradient(circle,rgba(255,220,151,.25),rgba(60,49,91,.18) 65%,transparent 100%)}
.preview-stage.preview-bg-background_legendary,.preview-stage.preview-bg-background_mythic{background:radial-gradient(circle,rgba(182,137,255,.3),rgba(57,41,105,.18) 65%,transparent 100%)}
.preview-stage.preview-bg-background_rare,.preview-stage.preview-bg-background_super_rare{background:radial-gradient(circle,rgba(98,177,255,.25),rgba(28,61,111,.16) 65%,transparent 100%)}

.preview-stage {
    position: relative;
    width: 220px;
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.preview-dori {
    position: relative;
    width: 190px;
    height: 190px;
    overflow: hidden;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.88);
    box-shadow: 0 24px 55px rgba(0,0,0,.32), 0 0 35px rgba(105,201,255,.1);

    transition: transform .45s cubic-bezier(.22,1,.36,1), filter .45s ease;

.preview-dori:hover {
    transform: translateY(-5px) scale(1.025);
}

    width: 100%;
    height: 100%;

.preview-layer {

.preview-hat { top: 16px; }
.preview-glasses { top: 92px; }
.preview-clothes { bottom: 15px; }

.preview-empty {

.preview-title {

async function 업적페이지별기록조회(queryFactory) {
    const rows = [];
    let offset = 0;
    try {
        while (true) {
            const { data, error } = await queryFactory().range(offset, offset + 999);
            if (error) return { data: rows, error };
            const page = Array.isArray(data) ? data : [];
            rows.push(...page);
            if (page.length < 1000) return { data: rows, error: null };
            offset += 1000;
        }
    } catch (error) { return { data: rows, error }; }
}

async function 업적진행활동가져오기(userId, force = false) {
    const id = String(userId || "");
    if (!id) return;
    if (!force && 업적진행활동.userId === id && Date.now() - 업적진행활동.updatedAt < 15000) return;

    const [chess, box, stocks] = await Promise.all([
        업적페이지별기록조회(() => supabase.from("chess_games")
            .select("bot_id,result,mode,summary").eq("user_id", id).order("created_at", { ascending: true })),
        (async () => {
            try {
                const { count, error } = await supabase.from("dori_box_history")
                    .select("id", { count: "exact", head: true }).eq("user_id", id);
                return { count: Number(count || 0), error };
            } catch (error) { return { count: 0, error }; }
        })(),
        업적페이지별기록조회(() => supabase.from("dori_stock_trades")
            .select("stock_id,trade_type,quantity").eq("user_id", id).eq("trade_type", "BUY")
            .order("id", { ascending: true }))
    ]);

    업적진행활동 = {
        userId: id, updatedAt: Date.now(),
        chessGames: chess.data || [], boxCount: Number(box.count || 0),
        stockBuys: (stocks.data || []).filter(row => String(row.trade_type || "").toUpperCase() === "BUY"),
        chessReady: !chess.error, boxReady: !box.error, stockReady: !stocks.error
    };
    if (chess.error) console.warn("업적 진행도: 체스 기록 조회 실패", chess.error);
    if (box.error) console.warn("업적 진행도: 랜덤 박스 기록 조회 실패", box.error);
    if (stocks.error) console.warn("업적 진행도: 주식 매수 기록 조회 실패", stocks.error);
}

function 업적진행도값계산(achievementId, unlocked, user) {
    const id = String(achievementId || "").toLowerCase();
    const u = user || {}, activity = 업적진행활동;
    let current = 0, target = 1, label = "조건 달성", known = true;
    const games = activity.chessGames || [];
    const isPlayerWin = game => {
        const summary = game.summary && typeof game.summary === "object" ? game.summary : {};
        const result = String(game.result || summary.result || "").trim().toLowerCase();
        const white = String(summary.white || "").trim().toLowerCase();
        const black = String(summary.black || "").trim().toLowerCase();
        const playerNames = ["player", "user", "you", "human", "플레이어", "사용자"];
        const isPlayerName = name => playerNames.some(candidate => name === candidate || name.includes(candidate));
        const whiteIsPlayer = isPlayerName(white);
        const blackIsPlayer = isPlayerName(black);

        // Rockey Chess always makes the human White, but preserve compatibility with
        // archived records that explicitly identify the human as Black.
        if (whiteIsPlayer) return ["1-0", "white_win", "win", "won", "victory", "승리", "승"].includes(result);
        if (blackIsPlayer) return ["0-1", "black_win"].includes(result);
        return ["1-0", "white_win", "win", "won", "victory", "승리", "승"].includes(result);
    };
    const wins = games.filter(isPlayerWin);
    const botWins = botId => wins.filter(game => String(game.bot_id || "").toLowerCase() === botId).length;
    const sharesBought = stockId => (activity.stockBuys || [])
        .filter(trade => Number(trade.stock_id) === stockId)
        .reduce((sum, trade) => sum + Math.max(0, Number(trade.quantity || 0)), 0);

    let newsNumbers = [];
    const rawNewsNumbers = u.read_dori_news_numbers;
    if (Array.isArray(rawNewsNumbers)) {
        newsNumbers = rawNewsNumbers.map(Number).filter(Number.isFinite);
    } else if (typeof rawNewsNumbers === "string" && rawNewsNumbers.trim()) {
        try {
            const parsed = JSON.parse(rawNewsNumbers);
            if (Array.isArray(parsed)) newsNumbers = parsed.map(Number).filter(Number.isFinite);
            else if (parsed && typeof parsed === "object") newsNumbers = Object.keys(parsed).filter(key => parsed[key]).map(Number).filter(Number.isFinite);
        } catch (_) {}
    } else if (rawNewsNumbers && typeof rawNewsNumbers === "object") {
        newsNumbers = Object.keys(rawNewsNumbers).filter(key => rawNewsNumbers[key]).map(Number).filter(Number.isFinite);
    }
    const hasReadHistory = Array.isArray(rawNewsNumbers) ||
        (typeof rawNewsNumbers === "string" && rawNewsNumbers.trim() !== "") ||
        (rawNewsNumbers && typeof rawNewsNumbers === "object");
    const fallbackNewsNumber = Math.max(0, Number(u.read_dori_news || 0));
    const hasReadNews = hasReadHistory ? newsNumbers.length > 0 : fallbackNewsNumber > 0;
    const readIssue = issue => hasReadHistory ? newsNumbers.includes(issue) : fallbackNewsNumber >= issue;

    if (["rich", "very_rich", "super_rich"].includes(id)) {
        current = Math.max(0, Number(u.doldolcoin || 0));
        target = id === "rich" ? 100000000 : id === "very_rich" ? 1000000000000 : 10000000000000000;
        label = "현재 보유 돌돌코인";
    } else if (id === "read_news") {
        current = hasReadNews ? 1 : 0; label = "돌이신문 읽기 여부";
    } else if (id === "read_1_news") {
        current = readIssue(1) ? 1 : 0; label = "제 1회 돌이신문 읽기";
    } else if (id === "read_10_news") {
        current = readIssue(10) ? 1 : 0; label = "제 10회 돌이신문 읽기";
    } else if (id === "rockey_7777777") {
        current = Math.max(0, Number(u.special_title_draws || 0)); target = 7; label = "특별 칭호 뽑기 횟수";
    } else if (["first_box", "tenth_box", "hundred_box", "thousand_box"].includes(id)) {
        if (!activity.boxReady) known = false;
        current = Number(activity.boxCount || 0);
        target = id === "first_box" ? 1 : id === "tenth_box" ? 10 : id === "hundred_box" ? 100 : 1000;
        label = "실제 랜덤 박스 뽑기 횟수";
    } else if (["first_chess", "chess_10_win", "chess_100_win", "chess_win_army", "chess_win_brilliant", "chess_win_doronum", "chess_win_fur", "chess_win_rockey", "chess_win_sleeping", "chess_win_talc"].includes(id)) {
        if (!activity.chessReady) known = false;
        if (id === "first_chess") { current = games.length; target = 1; label = "실제 체스 경기 수"; }
        else if (id === "chess_10_win") { current = wins.length; target = 10; label = "실제 체스 승리 수"; }
        else if (id === "chess_100_win") { current = wins.length; target = 100; label = "실제 체스 승리 수"; }
        else {
            const bots = { chess_win_army: "army", chess_win_brilliant: "brilliant", chess_win_doronum: "doronum", chess_win_fur: "fur", chess_win_rockey: "rockey", chess_win_sleeping: "sleep", chess_win_talc: "talc" };
            current = botWins(bots[id]); label = "해당 체스 상대를 이긴 횟수";
        }
    } else if (["first_stock", "first_bandoche", "first_food", "first_rockeycloth", "first_rockeypaper"].includes(id)) {
        if (!activity.stockReady) known = false;
        const stockIds = { first_bandoche: 2, first_food: 5, first_rockeycloth: 6, first_rockeypaper: 1 };
        current = id === "first_stock"
            ? (activity.stockBuys || []).reduce((sum, trade) => sum + Math.max(0, Number(trade.quantity || 0)), 0)
            : sharesBought(stockIds[id]);
        target = 1;
        label = id === "first_stock" ? "실제 매수 주식 수" :
            id === "first_bandoche" ? "돌이 반도체 매수 주식 수" :
            id === "first_food" ? "로키 푸드 매수 주식 수" :
            id === "first_rockeycloth" ? "돌이 의류 매수 주식 수" : "로키 페이퍼 매수 주식 수";
    } else if (id === "quiz_correct") {
        current = u.quiz_right === true ? 1 : 0; label = "저장된 퀴즈 정답 상태";
    } else if (id === "first_login") {
        current = u.user_id ? 1 : 0; label = "로그인 기록";
    } else {
        known = false;
    }

    if (unlocked) { current = target; known = true; }
    current = Math.max(0, Math.min(Number(current) || 0, target));
    const percent = known && target > 0 ? Math.round(current / target * 100) : 0;
    return {
        current, target, percent, label, known,
        note: known
            ? (current >= target ? "조건 달성 기준을 충족했습니다." : "목표까지 " + Math.max(0, target - current).toLocaleString() + " 남음")
            : "Supabase 기록을 가져오지 못했습니다. 새로고침 후 다시 확인해 주세요."
    };
}

function 숫자정리(value, 기본값 = 0) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 기본값;

}


// =====================================================
// HTML escape
// =====================================================

function HTML이스케이프(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

// =====================================================
// EXP 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    let level = 1;

    const levels =
        Object.keys(
            EXP레벨필요경험치
        )
        .map(Number)
        .sort(
            (a,b) => b-a
        );

    for (
        const 레벨 of levels
    ) {

        if (
            exp >=
            EXP레벨필요경험치[레벨]
        ) {

            level = 레벨;

            break;

        }

    }

    return level;

}


// =====================================================
// EXP 정보
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    const level =
        경험치로레벨계산(
            exp
        );

    const maxLevel =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );

    if (
        level >= maxLevel
    ) {

        return {

            level: maxLevel,

            currentExp:
                exp -
                EXP레벨필요경험치[maxLevel],

            requiredExp: 0,

            progress: 100,

            remaining: 0,

            maxLevel: true

        };

    }

    const currentStart =
        EXP레벨필요경험치[level];

    const nextStart =
        EXP레벨필요경험치[
            level + 1
        ];

    const currentExp =
        Math.max(
            0,
            exp - currentStart
        );

    const requiredExp =
        nextStart -
        currentStart;

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                currentExp /
                requiredExp *
                100
            )
        );

    return {

        level,

        currentExp,

        requiredExp,

        progress,

        remaining:
            Math.max(
                0,
                nextStart - exp
            ),

        maxLevel: false

    };

}


// =====================================================
// EXP 화면
// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(
            exp
        );

    EXP레벨요소.textContent =
        `Lv.${정보.level}`;

    현재EXP요소.textContent =
        `${정보.currentExp.toLocaleString()} EXP`;

    필요EXP요소.textContent =
        정보.maxLevel
            ? "MAX"
            : `${정보.requiredExp.toLocaleString()} EXP`;

    EXP진행바.style.width =
        `${정보.progress}%`;

    다음레벨텍스트.textContent =
        정보.maxLevel
            ? "✨ 최고 레벨!"
            : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

}

function 업적데이터정리(data) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }

    return data;

}


function 업적획득여부(
    업적ID,
    획득업적
) {

    if (
        !획득업적 ||
        typeof 획득업적 !== "object"
    ) {

        return false;

    }

    return Boolean(
        획득업적[
            업적ID
        ]
    );

}

            }
            획득부분 = '<div class="achievement-status">✅ 획득 완료</div><div class="achievement-time">🕐 획득시간: ' +

        } else {
            획득부분 = '<div class="achievement-status">🔒 아직 획득하지 않음</div>';
        }

        const 칭호부분 = 획득 && 업적.title
            ? '<div class="achievement-title">🏷️ 칭호: ' + HTML이스케이프(업적.title) + '</div>'
            : "";

        html += '<div class="achievement-item ' + (획득 ? "is-completed" : "is-locked") + '"><div class="achievement-name">' +
            (획득 ? HTML이스케이프(아이콘) : "🔒") + ' ' + HTML이스케이프(이름) +
            '</div><div class="achievement-description">' + HTML이스케이프(설명) +
            '</div><div class="achievement-description">⭐ 희귀도: ' + HTML이스케이프(희귀도) +
            '</div><div class="achievement-reward">🎁 보상: ' + 경험치.toLocaleString() + ' EXP / ' +
            코인.toLocaleString() + ' 돌돌코인</div>' + 칭호부분 + 업적진행도HTML(업적, 획득) + 획득부분 + '</div>';
    }

    html += '</div>';
    상태내용요소.innerHTML = html;
    const backButton = 상태내용요소.querySelector("[data-settings-achievement-back]");

}

function 획득한칭호목록() {

    const 획득업적 =
        업적데이터정리(
            현재유저정보?.user_achievement
        );

    const 결과 = [];

    for (
        const 업적 of 업적목록
    ) {

        if (
            !업적.title
        ) {

            continue;

        }

        if (
            !업적획득여부(
                업적.id,
                획득업적
            )
        ) {

            continue;

        }

        결과.push({

            achievementId:
                업적.id,

            achievementName:
                업적.name ??
                "업적",

            title:
                업적.title,

            rarity:
                String(업적.rarity ?? 업적.grade ?? "Common")

        });

    }

    const 특별칭호횟수 = Number(현재유저정보?.special_title_draws || 0);

    if (특별칭호횟수 > 0) {
        const n = Math.min(Math.max(Math.floor(특별칭호횟수), 1), 1000000);

        결과.push({
            achievementId: "special_title_rockey",
            achievementName: "특별 칭호",
            title: "7".repeat(n) + "ROCKEY" + "7".repeat(n)
        });
    }

    return 결과;

}

// =====================================================
// 칭호 저장
// =====================================================

async function 칭호저장() {

    if (!현재유저정보) {

        return;

    }

    const 사용가능칭호 =
        획득한칭호목록();

    const 허용 =
        사용가능칭호.some(
            item =>
                item.title ===
                선택된칭호
        );


    if (
        선택된칭호 !== null &&
        !허용
    ) {

        alert(
            "획득하지 않은 칭호입니다."
        );

        return;

    }


    const {
        data: {
            user
        },
        error: authError
    } =
        await supabase.auth.getUser();


    if (
        authError ||
        !user
    ) {

        로그인페이지로이동();

        return;

    }


    const 저장값 =
        선택된칭호 ??
        null;


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                equipped_title:
                    저장값

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "칭호 저장 오류:",
            error
        );

        alert(
            "칭호 저장에 실패했습니다.\n\n" +
            error.message
        );

        return;

    }


    현재유저정보.equipped_title =
        저장값;

    칭호변경중 = false;


    alert(
        저장값
            ? `🏷️ "${저장값}" 칭호가 장착되었습니다!`
            : "🏷️ 칭호를 해제했습니다!"
    );


    칭호화면표시();

}

function 상태탭변경(탭) {

    const 허용탭 = [
        "업적",
        "상세설명",
        "세부설정",
        "칭호",
        "내아이템",
        "꾸미기",
        "세부설정"
    ];

    if (!허용탭.includes(탭)) {
        return;
    }

    현재상태탭 = 탭;

    업적버튼.classList.toggle("active", 탭 === "업적");
    상세설명버튼.classList.toggle("active", 탭 === "상세설명");
    세부설정버튼.classList.toggle("active", 탭 === "세부설정");
    칭호버튼.classList.toggle("active", 탭 === "칭호");
    내아이템버튼.classList.toggle("active", 탭 === "내아이템");
    꾸미기버튼.classList.toggle("active", 탭 === "꾸미기");
    세부설정버튼.classList.toggle("active", 탭 === "세부설정");

    상태화면업데이트();
}


// =====================================================
// 상태 업데이트
// =====================================================

function 상태화면업데이트() {

    if (현재상태탭 === "업적") {
        업적화면표시();
        return;
    }

    if (현재상태탭 === "상세설명") {
        상세설명화면표시();
        return;
    }

    if (현재상태탭 === "세부설정") {
        const template = document.getElementById("site-preferences-template");
        if (template) {
            상태내용요소.replaceChildren(template.content.cloneNode(true));
            window.initDoriSettingsPreferences?.();
            사이트배경설정화면표시();
            프레임설정화면표시();
        }
        return;
    }

    if (현재상태탭 === "칭호") {
        칭호화면표시();
        return;
    }

    if (현재상태탭 === "내아이템") {
        내아이템화면표시();
        return;
    }

    if (현재상태탭 === "꾸미기") {
        꾸미기화면표시();
        return;
    }

    if (현재상태탭 === "세부설정") {
        상태내용요소.innerHTML = "";
        세부설정요소.hidden = false;
        상태내용요소.appendChild(세부설정요소);
    }
}


// =====================================================
// 아이템 카테고리 판별
// =====================================================

function 아이템꾸미기카테고리(item) {
    const code = String(item?.item_code ?? "").toUpperCase();
    const name = String(item?.item_name ?? "");
    const type = String(item?.item_type ?? "").toLowerCase();

    if (code.startsWith("HAT_") || name.includes("모자")) return "hat";
    if (code.startsWith("GLASSES_") || name.includes("안경")) return "glasses";
    if (code.startsWith("CAPE_") || name.includes("망토") || type === "cape") return "cape";
    if (code.startsWith("CLOTHES_") || name.includes("옷") || type === "clothes") return "clothes";
    if (code.startsWith("SKIN_") || name.includes("스킨") || type === "skin") return "skin";
    if (code.startsWith("EFFECT_") || name.includes("효과") || type === "effect") return "effect";

    return null;
}


function 프로필프레임아이템인가(item) {
    const code = String(item?.item_code || "").toUpperCase();
    const name = String(item?.item_name || "");
    const type = String(item?.item_type || "").toLowerCase();
    return code.includes("FRAME") || name.includes("프레임") || name.includes("테두리") ||
        type.includes("frame") || type === "profile_frame";
}

function 꾸미기이미지경로(item) {
    const code = String(item?.item_code || "").toUpperCase();
    if (프로필프레임아이템인가(item)) return 프레임이미지경로(item);
    if (!/^[A-Z0-9_-]{2,80}$/.test(code)) return "assets/dori-items/FRAME_GENERIC.svg";
    return "assets/dori-items/" + code + ".svg";
}

function 프레임이미지경로(frame) {
    return getDoriProfileFrameAsset(frame);
}

function 돌이오버레이색상(item) {
    const key = (String(item?.item_code || "") + " " + String(item?.item_name || "")).toUpperCase();
    if (/DORON|DORONIUM|CYAN|AQUA|ICE|BLUE/.test(key)) return "#62dff4";
    if (/GOLD|ROYAL|CROWN|SUN|황금|왕관/.test(key)) return "#f0bd55";
    if (/FIRE|FLAME|RED|불꽃|화염/.test(key)) return "#ed786c";
    if (/FOREST|LEAF|NATURE|GREEN|숲|잎/.test(key)) return "#83c58e";
    if (/GALAXY|SPACE|STAR|PURPLE|은하|별/.test(key)) return "#aa91ef";
    if (/PINK|HEART|LOVE|분홍|핑크/.test(key)) return "#e58dbd";
    let hash = 0;
    for (const char of key) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
    return ["#74b8ee","#e2a36f","#9b91e9","#78bca2","#dc8a91","#d1b45d"][hash % 6];
}

function 프레임출처판별(frame, fallback = "기타") {
    const source = String(frame?.source || "").toLowerCase();
    const key = String(frame?.item_code || "").toLowerCase();
    const name = String(frame?.item_name || "").toLowerCase();
    if (source.includes("lounge") || source.includes("vip") || source.includes("라운지") || key.includes("lounge") || key.includes("vip") || name.includes("라운지")) return "라운지";
    if (source.includes("event") || source.includes("이벤트") || key.includes("event") || name.includes("이벤트")) return "이벤트";
    if (source.includes("season") || source.includes("시즌") || key.includes("season")) return "시즌 보상";
    if (source.includes("pass") || source.includes("패스") || key.includes("2026-") || key.includes("2026_")) return "돌이 패스";
    return fallback;
}

async function 프레임목록가져오기(user) {
    const gathered = [];
    const addFrame = (frame) => {
        if (!frame || !frame.item_code) return;
        const code = String(frame.item_code);
        if (!/^[A-Za-z0-9_-]{2,100}$/.test(code)) return;
        const normalized = {
            item_code: code,
            item_name: frame.item_name || frame.display_name || code,
            rarity: frame.rarity || "일반",
            item_type: "frame",
            quantity: Math.max(1, Number(frame.quantity || 1)),
            source: frame.source || 프레임출처판별(frame),
            season_key: frame.season_key || null,
            tier: frame.tier ?? null,
            icon: frame.icon || "🖼️"
        };
        const existing = gathered.find(item => item.item_code === normalized.item_code);
        if (existing) {
            if (existing.source === "기타" && normalized.source !== "기타") existing.source = normalized.source;
            existing.quantity = Math.max(existing.quantity, normalized.quantity);
            return;
        }
        gathered.push(normalized);
    };

    // Random Box and the legacy general inventory.
    보유아이템목록.filter(item =>
        String(item.item_type || "").toLowerCase().includes("frame") ||
        String(item.item_code || "").toUpperCase().startsWith("FRAME_") ||
        String(item.item_name || "").includes("프레임")
    ).forEach(item => addFrame({ ...item, source: "랜덤 박스" }));

    const jobs = await Promise.allSettled([
        supabase.from("dori_pass_cosmetics")
            .select("season_key,tier,cosmetic_key,kind,display_name,rarity,icon,is_equipped,claimed_at")
            .eq("user_id", user.id).eq("kind", "profile_frame"),
        supabase.from("user_items")
            .select("item_code,item_name,item_type,rarity,quantity")
            .eq("user_id", user.id).gt("quantity", 0),
        supabase.from("rockey_season_reward_claims")
            .select("item_code,claimed_at")
            .eq("auth_user_id", user.id),
        supabase.from("dori_site_customization")
            .select("equipped_frame").eq("user_id", user.id).maybeSingle(),
        supabase.from("user_inventory")
            .select("item_id,purchased_at").eq("user_id", user.id)
    ]);

    const passResult = jobs[0].status === "fulfilled" ? jobs[0].value : null;
    if (passResult && !passResult.error) {
        (passResult.data || []).filter(row => Boolean(row.claimed_at || row.is_equipped))
            .forEach(row => addFrame({
                item_code: row.cosmetic_key,
                item_name: row.display_name,
                rarity: row.rarity,
                source: "돌이 패스",
                season_key: row.season_key,
                tier: row.tier,
                icon: row.icon
            }));
    } else if (passResult?.error) {
        console.warn("돌이 패스 프레임 조회:", passResult.error.message);
    }

    const userItems = jobs[1].status === "fulfilled" ? jobs[1].value : null;
    if (userItems && !userItems.error) {
        (userItems.data || []).filter(row =>
            String(row.item_type || "").toLowerCase().includes("frame") ||
            String(row.item_code || "").toUpperCase().includes("FRAME") ||
            String(row.item_name || "").includes("프레임")
        ).forEach(row => addFrame({
            ...row,
            source: 프레임출처판별({item_code:row.item_code,item_name:row.item_name,item_type:row.item_type},
                /lounge|vip|라운지/i.test(String(row.item_type)+" "+String(row.item_code)) ? "라운지" :
                /event|이벤트/i.test(String(row.item_type)+" "+String(row.item_code)) ? "이벤트" : "기타")
        }));
    } else if (userItems?.error) {
        console.warn("공용 아이템 프레임 조회:", userItems.error.message);
    }

    const seasonResult = jobs[2].status === "fulfilled" ? jobs[2].value : null;
    if (seasonResult && !seasonResult.error) {
        (seasonResult.data || []).filter(row => /frame|프레임/i.test(String(row.item_code || "")))
            .forEach(row => addFrame({ item_code:row.item_code, item_name:String(row.item_code).replace(/[_-]/g," "), source:"시즌 보상", rarity:"희귀" }));
    } else if (seasonResult?.error) {
        console.warn("시즌 보상 프레임 조회:", seasonResult.error.message);
    }

    const legacyInventory = jobs[4].status === "fulfilled" ? jobs[4].value : null;
    if (legacyInventory && !legacyInventory.error) {
        (legacyInventory.data || []).filter(row => /frame|프레임/i.test(String(row.item_id || "")))
            .forEach(row => {
                const key = String(row.item_id || "");
                const fallback = /lounge|vip|라운지/i.test(key) ? "라운지" : /event|이벤트/i.test(key) ? "이벤트" : "기타";
                addFrame({
                    item_code: key,
                    item_name: key.replace(/[_-]/g, " "),
                    source: 프레임출처판별({item_code:key}, fallback),
                    rarity: "일반"
                });
            });
    } else if (legacyInventory?.error) {
        console.warn("기존 상점 프레임 조회:", legacyInventory.error.message);
    }

    const current = jobs[3].status === "fulfilled" ? jobs[3].value?.data?.equipped_frame : null;
    let currentFrame = current;
    if (typeof currentFrame === "string") {
        try { currentFrame = JSON.parse(currentFrame); }
        catch (_) { currentFrame = currentFrame.trim() ? { item_code: currentFrame.trim() } : null; }
    }
    if (typeof currentFrame === "string" && currentFrame.trim()) currentFrame = { item_code: currentFrame.trim() };
    if (currentFrame && typeof currentFrame === "object") {
        addFrame({ ...currentFrame, source: currentFrame.source || "기존 장착 프레임" });
    }

    획득프레임목록 = gathered.sort((a,b) =>
        String(a.source).localeCompare(String(b.source), "ko") ||
        String(a.item_name).localeCompare(String(b.item_name), "ko")
    );
}

function 아이템사이트배경인가(item) {
    const code = String(item?.item_code ?? "").toUpperCase();
    const name = String(item?.item_name ?? "");
    const type = String(item?.item_type ?? "").toLowerCase();
    return code.startsWith("BACKGROUND_") || name.includes("배경") || type === "background";
}


function 아이템아이콘(item) {
    const category = 아이템꾸미기카테고리(item);

    if (아이템사이트배경인가(item) || 프로필프레임아이템인가(item)) return "🖼️";
    if (category && 꾸미기카테고리정보[category]) {
        return 꾸미기카테고리정보[category].emoji;
    }

    const type = String(item?.item_type ?? "").toLowerCase();
    if (type === "coin" || String(item?.item_code ?? "").toUpperCase().startsWith("COIN_")) return "🪙";
    if (type === "multiplier" || String(item?.item_code ?? "").toUpperCase().includes("MULTIPLIER")) return "✖️";

    return "🎁";
}


function 아이템용도(item) {
    const category = 아이템꾸미기카테고리(item);
    if (아이템사이트배경인가(item)) return "돌이사이트 전체 배경";
    if (프로필프레임아이템인가(item)) return "프로필 사진 테두리";
    if (category) return `꾸미기 · ${꾸미기카테고리정보[category].label}`;

    const type = String(item?.item_type ?? "").toLowerCase();
    if (type === "coin" || String(item?.item_code ?? "").toUpperCase().startsWith("COIN_")) return "일반 사이트 · 코인";
    if (type === "multiplier" || String(item?.item_code ?? "").toUpperCase().includes("MULTIPLIER")) return "일반 사이트 · 배율";
    return type ? `일반 사이트 · ${type}` : "일반 사이트";
}


function 장착아이템인가(item) {
    if (프로필프레임아이템인가(item)) return 장착프로필프레임?.item_code === item.item_code;
    const category = 아이템꾸미기카테고리(item);
    return Boolean(
        category &&
        꾸미기상태[category] &&
        꾸미기상태[category].item_code === item.item_code
    );
}

function 꾸미기저장키(userId) {
    return `dori-site-customization-${userId}`;
}


function 꾸미기상태정규화(data) {
    const result = {
        hat: null, glasses: null, clothes: null, cape: null,
        background: null, skin: null, effect: null
    };

    for (const category of Object.keys(result)) {
        let value = data?.[category];
        // TEXT 컬럼은 코드 문자열, 프레임은 JSONB 객체일 수 있습니다.
        if (typeof value === "string" && value.trim().startsWith("{")) {
            try { value = JSON.parse(value); } catch (_) {}
        }
        const code = value && typeof value === "object" ? value.item_code : value;
        if (!code) continue;

        const owned = 보유아이템목록.find(item =>
            item.item_code === String(code) &&
            (category === "background" ? 아이템사이트배경인가(item) : 아이템꾸미기카테고리(item) === category) &&
            숫자정리(item.quantity) > 0
        );
        if (!owned) continue;

        result[category] = {
            item_code: String(code),
            item_name: (value && typeof value === "object" ? value.item_name : null) || owned.item_name || String(code),
            rarity: (value && typeof value === "object" ? value.rarity : null) || owned.rarity || "일반"
        };
    }
    return result;
}


function 프로필프레임정규화(value) {
    if (typeof value === "string" && value.trim().startsWith("{")) {
        try { value = JSON.parse(value); } catch (_) {}
    }
    const code = value && typeof value === "object" ? value.item_code : value;
    if (!code) return null;
    const owned = 획득프레임목록.find(item => item.item_code === String(code));
    if (!owned) return null;
    return {
        ...owned,
        ...(value && typeof value === "object" ? value : {}),
        item_code: String(code),
        item_name: (value && typeof value === "object" ? value.item_name : null) || owned.item_name,
        rarity: (value && typeof value === "object" ? value.rarity : null) || owned.rarity || "일반"
    };
}

function 프로필프레임적용() {
    const wrapper = 사진요소?.closest(".profile-image-wrapper");
    if (!wrapper) return;
    applyDoriProfileFrame(wrapper, 장착프로필프레임, Number(현재유저정보?.user_level ?? 1));
    if (장착프로필프레임?.rarity) wrapper.dataset.profileFrameRarity = String(장착프로필프레임.rarity);
    else delete wrapper.dataset.profileFrameRarity;
}

async function 꾸미기정보가져오기(user) {
    let dbLoaded = false;

    try {
        const { data, error } =
            await supabase
                .from(꾸미기저장테이블)
                .select(`
                    user_id,
                    equipped_hat,
                    equipped_glasses,
                    equipped_clothes,
                    equipped_cape,
                    equipped_background,
                    equipped_skin,
                    equipped_effect,
                    equipped_frame
                `)
                .eq("user_id", user.id)
                .maybeSingle();

        if (!error && data) {
            꾸미기상태 = 꾸미기상태정규화({
                hat: data.equipped_hat,
                glasses: data.equipped_glasses,
                clothes: data.equipped_clothes,
                cape: data.equipped_cape,
                background: data.equipped_background,
                skin: data.equipped_skin,
                effect: data.equipped_effect
            });
            장착프로필프레임 = 프로필프레임정규화(data.equipped_frame);
            dbLoaded = true;
        }
    }
    catch (error) {
        console.warn("돌이 꾸미기 DB 조회를 건너뜁니다:", error);
    }

    if (!dbLoaded) {
        try {
            const raw = localStorage.getItem(꾸미기저장키(user.id));
            if (raw) {
                const saved = JSON.parse(raw);
                꾸미기상태 = 꾸미기상태정규화(saved);
                장착프로필프레임 = 프로필프레임정규화(saved?.frame);
            }
        }
        catch (error) {
            console.warn("브라우저 꾸미기 저장값을 읽지 못했습니다:", error);
        }
    }

    보유아이템으로꾸미기상태검증();
}


function 보유아이템으로꾸미기상태검증() {
    for (const category of Object.keys(꾸미기상태)) {
        const selected = 꾸미기상태[category];
        if (!selected) continue;

        const owned = 보유아이템목록.some(
            item =>
                (category === "background" ? 아이템사이트배경인가(item) : 아이템꾸미기카테고리(item) === category) &&
                item.item_code === selected.item_code &&
                숫자정리(item.quantity) > 0
        );

        if (!owned) {
            꾸미기상태[category] = null;
        }
    }
}


async function 꾸미기저장() {
    if (!현재유저정보) return;

    const userId = 현재유저정보.user_id;
    const payload = {
        user_id: userId,
        equipped_hat: 꾸미기상태.hat?.item_code ?? null,
        equipped_glasses: 꾸미기상태.glasses?.item_code ?? null,
        equipped_clothes: 꾸미기상태.clothes?.item_code ?? null,
        equipped_cape: 꾸미기상태.cape?.item_code ?? null,
        equipped_background: 꾸미기상태.background?.item_code ?? null,
        equipped_skin: 꾸미기상태.skin?.item_code ?? null,
        equipped_effect: 꾸미기상태.effect?.item_code ?? null,
    };

    let savedToDb = false;

    try {
        const { error } =
            await supabase
                .from(꾸미기저장테이블)
                .upsert(payload, { onConflict: "user_id" });

        if (!error) {
            savedToDb = true;
        }
        else {
            console.warn("돌이 꾸미기 DB 저장 실패:", error);
        }
    }
    catch (error) {
        console.warn("돌이 꾸미기 DB 저장을 건너뜁니다:", error);
    }

    if (savedToDb) {
        try {
            const { data: frameResult, error: frameError } = await supabase.rpc("dori_set_profile_frame", {
                p_frame: 장착프로필프레임
            });
            if (frameError) throw frameError;
            if (!frameResult?.ok) throw new Error(frameResult?.message || "프레임 상태를 하나로 저장하지 못했습니다.");
        } catch (error) {
            savedToDb = false;
            console.error("통합 프로필 프레임 저장 오류:", error);
        }
    }

    localStorage.setItem(
        꾸미기저장키(userId),
        JSON.stringify({ ...꾸미기상태, frame: 장착프로필프레임 })
    );

    return savedToDb;
}


function 꾸미기상태초기화() {
    const 현재사이트배경 = 꾸미기상태.background;
    꾸미기상태 = {
        hat: null,
        glasses: null,
        clothes: null,
        cape: null,
        background: 현재사이트배경,
        skin: null,
        effect: null
    };
}



function 사이트배경설정화면표시() {
    const root = document.getElementById("dori-site-background-options");
    const current = document.getElementById("site-background-current");
    if (!root) return;
    const names = {
        BACKGROUND_RARE:"희귀 배경", BACKGROUND_SUPER_RARE:"슈퍼 희귀 배경",
        BACKGROUND_MYTHIC:"신화 배경", BACKGROUND_LEGENDARY:"전설 배경",
        BACKGROUND_DORI:"돌이 배경", BACKGROUND_DORONIUM:"도로늄 배경"
    };
    const selected = 꾸미기상태.background?.item_code || "";
    if (current) current.textContent = selected ? (꾸미기상태.background.item_name || names[selected] || "배경 적용 중") : "기본 배경 사용 중";
    const owned = 보유아이템목록.filter(item => 아이템사이트배경인가(item) && 숫자정리(item.quantity) > 0)
        .sort((a,b) => {
            const rank = {"일반":1,"고급":2,"희귀":3,"영웅":4,"전설":5,"신화":6};
            return (rank[b.rarity] || 0) - (rank[a.rarity] || 0);
        });
    const cards = owned.map(item => {
        const code = String(item.item_code || "").toUpperCase();
        if (!/^[A-Z0-9_]+$/.test(code) || !names[code]) return "";
        const active = selected === code;
        return '<button type="button" class="site-background-card" data-site-background-code="' + code + '" aria-pressed="' + String(active) + '">' +
            '<span class="site-background-preview" data-background="' + code + '" aria-hidden="true"></span>' +
            '<span class="site-background-card-copy"><strong>' + HTML이스케이프(item.item_name || names[code]) +
            '</strong><small>' + HTML이스케이프(item.rarity || "일반") + ' · ×' + 숫자정리(item.quantity).toLocaleString() + '</small></span></button>';
    }).filter(Boolean).join("");
    const empty = '<div class="site-background-empty">아직 보유한 랜덤 박스 배경이 없습니다.<br>랜덤 박스에서 배경을 획득하면 이곳에서 설정할 수 있습니다.</div>';
    const defaultCard = '<button type="button" class="site-background-default" data-site-background-default>↺ 기본 돌이사이트 배경으로 되돌리기</button>';
    root.innerHTML = (cards || empty) + defaultCard;

    const applyChoice = async code => {
        const previous = 꾸미기상태.background ? {...꾸미기상태.background} : null;
        if (code) {
            const item = owned.find(value => value.item_code === code);
            if (!item) return;
            꾸미기상태.background = {item_code:item.item_code,item_name:item.item_name || names[code],rarity:item.rarity || "일반"};
        } else {
            꾸미기상태.background = null;
        }
        root.querySelectorAll("button").forEach(button => button.disabled = true);
        if (current) current.textContent = "배경 저장 중...";
        try {
            const saved = await 꾸미기저장();
            if (!saved) throw new Error("배경을 계정에 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
            window.applyDoriSiteBackground?.(code || "");
            사이트배경설정화면표시();
            const status = document.getElementById("site-pref-status");
            if (status) status.textContent = code ? "✓ " + names[code] + "을(를) 돌이사이트 전체 배경으로 적용했습니다." : "기본 돌이사이트 배경으로 되돌렸습니다.";
        } catch(error) {
            꾸미기상태.background = previous;
            console.error("사이트 배경 저장 오류:", error);
            사이트배경설정화면표시();
            if (current) current.textContent = error?.message || "배경 저장에 실패했습니다.";
        }
    };
    root.querySelectorAll("[data-site-background-code]").forEach(button => button.addEventListener("click", () => applyChoice(button.dataset.siteBackgroundCode)));
    root.querySelector("[data-site-background-default]")?.addEventListener("click", () => applyChoice(""));
}



function 프레임설정화면표시() {
    const root = document.getElementById("dori-frame-options");
    const filterRoot = document.getElementById("dori-frame-filters");
    const current = document.getElementById("dori-frame-current");
    if (!root || !filterRoot) return;
    const selected = 장착프로필프레임?.item_code || "";
    const vipTier = getDoriVipProfileTier(현재유저정보?.user_level ?? 1);
    const vipLabel = vipTier === "royal" ? "ROYAL VIP" : vipTier === "elite" ? "ELITE VIP" : vipTier === "basic" ? "VIP" : "";
    if (current) current.textContent = selected
        ? (장착프로필프레임.item_name || "프로필 프레임 적용 중")
        : vipTier ? vipLabel + " 기본 프레임 적용 중" : "기본 프로필 테두리 사용 중";

    const filters = ["전체","이벤트","라운지","돌이 패스","시즌 보상","랜덤 박스","기타"];
    filterRoot.innerHTML = filters.map(value =>
        '<button type="button" data-frame-source="' + value + '" class="' + (프레임출처필터 === value ? "active" : "") + '" aria-pressed="' + String(프레임출처필터 === value) + '">' + value + '</button>'
    ).join("");

    const visible = 획득프레임목록.filter(frame =>
        프레임출처필터 === "전체" || frame.source === 프레임출처필터
    );
    const cards = visible.map(frame => {
        const active = frame.item_code === selected;
        const image = 프레임이미지경로(frame);
        return '<button type="button" class="dori-frame-card ' + (active ? "is-active" : "") + '" data-frame-code="' + HTML이스케이프(frame.item_code) + '" aria-pressed="' + String(active) + '">' +
            '<span class="dori-frame-art"><img src="' + image + '" alt="" loading="lazy"></span>' +
            '<span class="dori-frame-copy"><strong>' + HTML이스케이프(frame.item_name) + '</strong><small>' + HTML이스케이프(frame.source) + ' · ' + HTML이스케이프(frame.rarity) + '</small>' +
            (frame.season_key ? '<small>' + HTML이스케이프(frame.season_key) + (frame.tier ? ' · ' + Number(frame.tier) + '단계' : '') + '</small>' : '') +
            (active ? '<em>✓ 프로필 사진에 적용 중</em>' : '') + '</span></button>';
    }).join("");

    root.innerHTML = (cards || '<div class="site-background-empty">' +
        (획득프레임목록.length ? '이 출처에서 획득한 프레임이 없습니다.' : '아직 확인 가능한 프레임이 없습니다. 프레임 보상은 획득 기록이 계정에 저장된 경우 이곳에 표시됩니다.') +
        '</div>') +
        '<button type="button" class="site-background-default" data-frame-default>↺ 기본 프로필 테두리 사용</button>';

    filterRoot.querySelectorAll("[data-frame-source]").forEach(button => button.addEventListener("click", () => {
        프레임출처필터 = button.dataset.frameSource || "전체";
        프레임설정화면표시();
    }));

    root.querySelectorAll("[data-frame-code]").forEach(button => button.addEventListener("click", async () => {
        const frame = 획득프레임목록.find(value => value.item_code === button.dataset.frameCode);
        if (!frame || button.disabled) return;
        const previous = 장착프로필프레임 ? { ...장착프로필프레임 } : null;
        장착프로필프레임 = {
            item_code: frame.item_code,
            item_name: frame.item_name,
            rarity: frame.rarity,
            source: frame.source,
            season_key: frame.season_key,
            tier: frame.tier
        };
        프로필프레임적용();
        root.querySelectorAll("button").forEach(node => node.disabled = true);
        if (current) current.textContent = "프레임 저장 중...";
        try {
            const saved = await 꾸미기저장();
            if (!saved) throw new Error("프레임을 계정에 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
            프레임설정화면표시();
            const status = document.getElementById("site-pref-status");
            if (status) status.textContent = "✓ " + frame.item_name + " 프레임을 프로필 사진 테두리에 적용했습니다.";
        } catch (error) {
            장착프로필프레임 = previous;
            프로필프레임적용();
            console.error("프레임 적용 오류:", error);
            프레임설정화면표시();
            if (current) current.textContent = error?.message || "프레임 저장에 실패했습니다.";
        }
    }));

    root.querySelector("[data-frame-default]")?.addEventListener("click", async () => {
        const previous = 장착프로필프레임 ? { ...장착프로필프레임 } : null;
        장착프로필프레임 = null;
        프로필프레임적용();
        try {
            const saved = await 꾸미기저장();
            if (!saved) throw new Error("기본 프레임 설정을 저장하지 못했습니다.");
            프레임설정화면표시();
            const status = document.getElementById("site-pref-status");
            if (status) status.textContent = "✓ 프로필 사진의 기본 테두리로 변경했습니다.";
        } catch (error) {
            장착프로필프레임 = previous;
            프로필프레임적용();
            프레임설정화면표시();
            if (current) current.textContent = error?.message || "기본 프레임 변경에 실패했습니다.";
        }
    });
}
