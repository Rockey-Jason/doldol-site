<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdHRvd2ZoeWdjcGRpcnJla3FtIiwiaWF0IjoxNzgwMTk4NDI2LCJleHAiOjIwOTU3NzQ0MjZ9.XwdQhJ4Ku_C61yXz0k65AztMF9Rfe7Qzn3Av7iWRBqY"
);


// =====================================================
// 회원 레벨 이름
// ⭐ 돌돌코인으로 구매하는 회원 등급
// =====================================================

const 회원레벨이름 = {

    1:"일반",
    2:"프리미엄",
    3:"돌프리미엄",
    4:"돌돌프리미엄",
    5:"돌돌돌프리미엄",
    6:"돌돌돌돌프리미엄",
    7:"돌돌돌돌돌프리미엄",
    8:"유사돌이",
    9:"돌이",
    10:"관리자"

};


// =====================================================
// EXP 레벨 필요 EXP
// ⭐ 꾸미기용 레벨
// =====================================================

const EXP레벨필요경험치 = {

    1:0,
    2:100,
    3:500,
    4:1000,
    5:5000,
    6:10000,
    7:20000,
    8:30000,
    9:40000,
    10:50000,
    11:100000

};


// =====================================================
// EXP로 레벨 계산
// =====================================================

function 경험치로레벨계산(exp){

    let level = 1;

    for(let i = 11; i >= 1; i--){

        if(exp >= EXP레벨필요경험치[i]){

            level = i;

            break;

        }

    }

    return level;

}


// =====================================================
// EXP 진행도 계산
// =====================================================

function 경험치정보계산(exp){

    const level =
        경험치로레벨계산(exp);


    // 최고 레벨
    if(level >= 11){

        return {

            level:11,

            currentExp:exp,

            requiredExp:exp,

            progress:100,

            remaining:0

        };

    }


    const 현재레벨필요EXP =
        EXP레벨필요경험치[level];


    const 다음레벨필요EXP =
        EXP레벨필요경험치[level + 1];


    const 현재구간EXP =
        exp - 현재레벨필요EXP;


    const 구간필요EXP =
        다음레벨필요EXP -
        현재레벨필요EXP;


    const progress =
        Math.max(
            0,
            Math.min(
                100,
                (현재구간EXP / 구간필요EXP) * 100
            )
        );


    const remaining =
        다음레벨필요EXP - exp;


    return {

        level,

        currentExp:현재구간EXP,

        requiredExp:구간필요EXP,

        progress,

        remaining

    };

}


// =====================================================
// 페이지 로드
// =====================================================

window.addEventListener(
    "DOMContentLoaded",
    async () => {


    // =================================================
    // 로그인 확인
    // =================================================

    const {

        data:{user}

    } = await supabase.auth.getUser();


    if(!user){

        alert(
            "로그인이 필요합니다."
        );

        location.href =
            "login.html";

        return;

    }


    // =================================================
    // 사용자 정보
    // =================================================

    const {

        data:유저정보,

        error

    } = await supabase

        .from("users")

        .select(`

            user_number,
            user_id,
            login_id,
            user_level,
            exp,
            exp_level,
            doldolcoin,
            profile_image,
            name

        `)

        .eq(
            "user_id",
            user.id
        )

        .single();


    if(error){

        console.error(
            "사용자 정보 조회 오류:",
            error
        );

        alert(
            "사용자 정보를 불러오지 못했습니다."
        );

        return;

    }


    // =================================================
    // 프로필 사진
    // =================================================

    if(
        유저정보.profile_image
    ){

        document.getElementById(
            "돌이사진"
        ).src =
            유저정보.profile_image;

    }


    // =================================================
    // 이름
    // =================================================

    document.getElementById(
        "이름"
    ).textContent =

        (
            유저정보.name ??
            "이름 없음"
        )
        +
        "님 환영합니다";


    // =================================================
    // 아이디
    // =================================================

    document.getElementById(
        "현재아이디"
    ).textContent =

        "현재 아이디 : " +

        (
            유저정보.login_id ??
            "없음"
        );


    // =================================================
    // ⭐ 회원 등급
    // 돌돌코인으로 구매하는 시스템
    // =================================================

    document.getElementById(
        "레벨"
    ).textContent =

        "현재 회원 등급 : " +

        (
            회원레벨이름[
                유저정보.user_level
            ]
            ??
            "일반"
        );


    // =================================================
    // 돌돌코인
    // =================================================

    document.getElementById(
        "돌돌코인수량"
    ).textContent =

        "현재 돌돌코인 : " +

        (
            유저정보.doldolcoin ??
            0
        );


    // =================================================
    // ⭐ EXP 레벨 표시
    // =================================================

    const exp =
        유저정보.exp ?? 0;


    const 계산된EXP레벨 =
        경험치로레벨계산(exp);


    // DB에 잘못된 값이 있더라도
    // 실제 EXP를 기준으로 계산
    if(
        계산된EXP레벨 !==
        (유저정보.exp_level ?? 1)
    ){

        await supabase

            .from("users")

            .update({

                exp_level:
                    계산된EXP레벨

            })

            .eq(
                "user_id",
                user.id
            );

    }


    const expInfo =
        경험치정보계산(exp);


    // =================================================
    // EXP UI
    // =================================================

    document.getElementById(
        "user-level"
    ).textContent =

        `Lv.${expInfo.level}`;


    document.getElementById(
        "current-exp"
    ).textContent =

        `${expInfo.currentExp} EXP`;


    document.getElementById(
        "required-exp"
    ).textContent =

        `${expInfo.requiredExp} EXP`;


    document.getElementById(
        "exp-progress-bar"
    ).style.width =

        `${expInfo.progress}%`;


    if(
        expInfo.remaining <= 0
    ){

        document.getElementById(
            "next-level-text"
        ).textContent =

            "✨ 최고 레벨!";

    }
    else{

        document.getElementById(
            "next-level-text"
        ).textContent =

            `다음 레벨까지 ` +
            `${expInfo.remaining} EXP`;

    }

});


// =====================================================
// 프로필 사진 업로드
// =====================================================

window.프로필업로드 = async function(){


    const file =
        document.getElementById(
            "profileUpload"
        ).files[0];


    if(!file){

        alert(
            "사진을 선택하세요."
        );

        return;

    }


    // =================================================
    // 로그인 사용자
    // =================================================

    const {

        data:{user}

    } = await supabase.auth.getUser();


    if(!user){

        alert(
            "로그인이 필요합니다."
        );

        return;

    }


    // =================================================
    // 확장자
    // =================================================

    const ext =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        `${user.id}.${ext}`;


    // =================================================
    // Storage 업로드
    // =================================================

    const {

        error:uploadError

    } = await supabase.storage

        .from("profile-images")

        .upload(

            fileName,

            file,

            {

                upsert:true,

                contentType:file.type

            }

        );


    if(uploadError){

        console.error(
            "프로필 업로드 오류:",
            uploadError
        );

        alert(
            uploadError.message
        );

        return;

    }


    // =================================================
    // 공개 URL
    // =================================================

    const {

        data

    } = supabase.storage

        .from("profile-images")

        .getPublicUrl(
            fileName
        );


    const imageUrl =
        data.publicUrl;


    // =================================================
    // users 업데이트
    // =================================================

    const {

        error:updateError

    } = await supabase

        .from("users")

        .update({

            profile_image:
                imageUrl

        })

        .eq(
            "user_id",
            user.id
        );


    if(updateError){

        console.error(
            "프로필 DB 저장 오류:",
            updateError
        );

        alert(
            updateError.message
        );

        return;

    }


    // =================================================
    // 화면 즉시 변경
    // =================================================

    document.getElementById(
        "돌이사진"
    ).src =

        imageUrl +
        "?t=" +
        Date.now();


    alert(
        "프로필 사진이 변경되었습니다."
    );

};

</script>
