// =====================================================
// 숫자

function 숫자정리(value, 기본값 = 0) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 기본값;

}


// =====================================================
// HTML escape
// =====================================================

function HTML이스케이프(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

// =====================================================
// EXP 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    let level = 1;

    const levels =
        Object.keys(
            EXP레벨필요경험치
        )
        .map(Number)
        .sort(
            (a,b) => b-a
        );

    for (
        const 레벨 of levels
    ) {

        if (
            exp >=
            EXP레벨필요경험치[레벨]
        ) {

            level = 레벨;

            break;

        }

    }

    return level;

}


// =====================================================
// EXP 정보
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    const level =
        경험치로레벨계산(
            exp
        );

    const maxLevel =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );

    if (
        level >= maxLevel
    ) {

        return {

            level: maxLevel,

            currentExp:
                exp -
                EXP레벨필요경험치[maxLevel],

            requiredExp: 0,

            progress: 100,

            remaining: 0,

            maxLevel: true

        };

    }

    const currentStart =
        EXP레벨필요경험치[level];

    const nextStart =
        EXP레벨필요경험치[
            level + 1
        ];

    const currentExp =
        Math.max(
            0,
            exp - currentStart
        );

    const requiredExp =
        nextStart -
        currentStart;

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                currentExp /
                requiredExp *
                100
            )
        );

    return {

        level,

        currentExp,

        requiredExp,

        progress,

        remaining:
            Math.max(
                0,
                nextStart - exp
            ),

        maxLevel: false

    };

}


// =====================================================
// EXP 화면
// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(
            exp
        );

    EXP레벨요소.textContent =

    현재EXP요소.textContent =

    필요EXP요소.textContent =
        정보.maxLevel
            ? "MAX"

    EXP진행바.style.width =
        `${정보.progress}%`;

    다음레벨텍스트.textContent =
        정보.maxLevel
            ? "✨ 최고 레벨!"
            : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

}


// =====================================================
// 업적 데이터
// =====================================================

function 업적데이터정리(data) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }

    return data;

}


function 업적획득여부(
    업적ID,
    획득업적
) {

    if (
        !획득업적 ||
        typeof 획득업적 !== "object"
    ) {

        return false;

    }

    return Boolean(
        획득업적[
            업적ID
        ]
    );

}


// =====================================================
// 업적 가져오기
// =====================================================

async function 업적정보가져오기() {

    const {
        data,
        error
    } =
        await supabase
            .from("achievements")
            .select(`
                id,
                name,
                description,
                rarity,
                reward_exp,
                reward_doldolcoin,
                icon,
                enabled,
                title,
                created_at
            `)
            .eq(
                "enabled",
                true
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );

    if (error) {

        throw error;

    }

    업적목록 =
        Array.isArray(data)
            ? data.filter(
                item =>
                    item &&
                    item.id
            )
            : [];

}

    const 획득업적 =

function 획득한칭호목록() {

    const 획득업적 =
        업적데이터정리(
            현재유저정보?.user_achievement
        );

    const 결과 = [];

    for (
        const 업적 of 업적목록
    ) {

        if (
            !업적.title
        ) {

            continue;

        }

        if (
            !업적획득여부(
                업적.id,
                획득업적
            )
        ) {

            continue;

        }

        결과.push({

            achievementId:
                업적.id,

            achievementName:
                업적.name ??
                "업적",

            title:
                업적.title

        });

    }

    return 결과;

}

            }
        );


    document
        .getElementById(
            "칭호저장버튼"
        )
        .addEventListener(
            "click",
            칭호저장
        );

}


// =====================================================
// 칭호 저장
// =====================================================

async function 칭호저장() {

    if (!현재유저정보) {

        return;

    }

    const 사용가능칭호 =
        획득한칭호목록();

    const 허용 =
        사용가능칭호.some(
            item =>
                item.title ===
                선택된칭호
        );


    if (
        선택된칭호 !== null &&
        !허용
    ) {

        alert(
            "획득하지 않은 칭호입니다."
        );

        return;

    }


    const {
        data: {
            user
        },
        error: authError
    } =
        await supabase.auth.getUser();


    if (
        authError ||
        !user
    ) {

        로그인페이지로이동();

        return;

    }


    const 저장값 =
        선택된칭호 ??
        null;


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                equipped_title:
                    저장값

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "칭호 저장 오류:",
            error
        );

        alert(
            "칭호 저장에 실패했습니다.\n\n" +
            error.message
        );

        return;

    }


    현재유저정보.equipped_title =
        저장값;

    칭호변경중 = false;


    alert(
        저장값
            ? `🏷️ "${저장값}" 칭호가 장착되었습니다!`
            : "🏷️ 칭호를 해제했습니다!"
    );


    칭호화면표시();

}


// =====================================================
// 탭 변경
// =====================================================

function 상태탭변경(탭) {

    if (
        ![
            "업적",
            "상세설명",
            "칭호"
        ].includes(탭)
    ) {

        return;

    }


    현재상태탭 =
        탭;


    업적버튼.classList.toggle(
        "active",
        탭 === "업적"
    );

    상세설명버튼.classList.toggle(
        "active",
        탭 === "상세설명"
    );

    칭호버튼.classList.toggle(
        "active",
        탭 === "칭호"
    );


    상태화면업데이트();

}


// =====================================================
// 상태 업데이트
// =====================================================

function 상태화면업데이트() {

    if (
        현재상태탭 === "업적"
    ) {

        업적화면표시();

    }


    if (

    ) {

    }

}

// EXP DB 보정
// =====================================================

async function EXP레벨DB보정(
    user,
    exp,
    기존레벨
) {

    const 계산된 =
        경험치로레벨계산(
            exp
        );

    const 기존 =
        숫자정리(
            기존레벨,
            1
        );


    if (
        계산된 === 기존
    ) {

        return;

    }


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                exp_level:
                    계산된

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "EXP 레벨 보정 오류:",
            error
        );

        return;

    }

}


// =====================================================
// 프로필 업로드
// =====================================================

async function 프로필업로드처리() {

    try {

        const file =
            업로드요소.files?.[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "프로필 사진은 10MB 이하만 가능합니다."
            );

            업로드요소.value = "";

            return;

        }


        const {
            data: {
                user
            },
            error
        } =
            await supabase.auth.getUser();


        if (
            error ||
            !user
        ) {

            로그인페이지로이동();

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const allowed = [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp"
        ];


        if (
            !allowed.includes(ext)
        ) {

            alert(
                "JPG, PNG, GIF, WEBP만 사용할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        const fileName =
            `${user.id}.${ext}`;


        const {
            error: uploadError
        } =
            await supabase.storage
                .from(
                    "profile-images"
                )
                .upload(
                    fileName,
                    file,
                    {

                        upsert: true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }
                );


        if (uploadError) {

            throw uploadError;

        }


        const {
            data
        } =
            supabase.storage
                .from(
                    "profile-images"
                )
                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data.publicUrl;


        const {
            error: updateError
        } =
            await supabase
                .from("users")
                .update({

                    profile_image:
                        imageUrl

                })
                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            throw updateError;

        }


        사진요소.src =
            imageUrl +
            "?t=" +
            Date.now();


        현재유저정보.profile_image =
            imageUrl;


        alert(
            "🐶 프로필 사진이 변경되었습니다!"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );

        alert(
            "프로필 사진 변경에 실패했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}

        } =

        ) {

        // 사용자 정보

        const 유저정보 =

        // EXP 레벨 보정

        );
