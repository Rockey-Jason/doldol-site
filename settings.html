function 내아이템화면표시() {
    const activeMultiplier = Number(현재유저정보?.doldolcoin_multiplier ?? 1);
    const multiplierExpiry = 현재유저정보?.doldolcoin_multiplier_expires_at
        ? new Date(현재유저정보.doldolcoin_multiplier_expires_at)
        : null;
    const multiplierActive = activeMultiplier > 1 && multiplierExpiry && multiplierExpiry.getTime() > Date.now();
    const multiplierStatus = multiplierActive
        ? "⚡ 현재 코인 보상 " + activeMultiplier.toLocaleString("ko-KR") + "배 · " +
          multiplierExpiry.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) + "까지"
        : "현재 활성화된 코인 배율이 없습니다.";
    const customCount = 보유아이템목록.filter(item => 아이템꾸미기카테고리(item)).length;

    const filtered = 보유아이템목록.filter(item => {
        if (아이템필터 === "전체") return true;
        if (아이템필터 === "꾸미기") return Boolean(아이템꾸미기카테고리(item));
        if (아이템필터 === "배경") return 아이템사이트배경인가(item);
        if (아이템필터 === "frame") return 프로필프레임아이템인가(item);
        return 아이템꾸미기카테고리(item) === 아이템필터;
    });

    const filterButtons = [
        ["전체", "전체"],
        ["꾸미기", "꾸미기"],
        ["hat", "모자"],
        ["glasses", "안경"],
        ["clothes", "옷"],
        ["cape", "망토"],
        ["배경", "배경"],
        ["skin", "스킨"],
        ["frame", "프로필 프레임"],
        ["effect", "효과"]
    ];

    const filterHTML = filterButtons.map(([value, label]) => `
        <button class="${아이템필터 === value ? "active" : ""}" data-inventory-filter="${HTML이스케이프(value)}">${HTML이스케이프(label)}</button>
    `).join("");

    const cards = filtered.length
        ? filtered.map(item => {
            const category = 아이템꾸미기카테고리(item);
            const equipped = 장착아이템인가(item);
            const multiplier = String(item.item_type || "").toLowerCase() === "multiplier";
            let action = "";
            if (아이템사이트배경인가(item)) {
                action = '<button type="button" class="inventory-action-button" data-inventory-background="' +
                    HTML이스케이프(item.item_code) + '">🖼️ 사이트 배경 설정</button>';
            } else if (프로필프레임아이템인가(item)) {
                action = '<button type="button" class="inventory-action-button" data-inventory-frame' +
                    (equipped ? ' disabled' : '') + '>' +
                    (equipped ? '✓ 프로필 적용 중' : '🖼️ 통합 프레임 보관함 열기') + '</button>';
            } else if (category) {
                action = '<button type="button" class="inventory-action-button" data-inventory-equip="' +
                    HTML이스케이프(item.item_code) + '"' + (equipped ? " disabled" : "") + '>' +
                    (equipped ? "✓ 장착 중" : "🎨 장착하기") + '</button>';
            } else if (multiplier) {
                action = '<button type="button" class="inventory-action-button multiplier-action" data-inventory-multiplier="' +
                    HTML이스케이프(item.item_code) + '">⚡ 1시간 사용</button>';
            }
            return '<article class="inventory-card ' + (category ? "custom-item" : "") + " " +
                (equipped ? "equipped" : "") + '" data-item-code="' + HTML이스케이프(item.item_code) + '">' +
                '<div class="inventory-icon"><img src="' + 꾸미기이미지경로(item) + '" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>' + 아이템아이콘(item) + '</span></div>' +
                '<div class="inventory-type">' + HTML이스케이프(아이템용도(item)) + '</div>' +
                '<div class="inventory-name">' + HTML이스케이프(item.item_name ?? "이름 없는 아이템") + '</div>' +
                '<div class="inventory-meta"><span class="rarity-badge">' +
                HTML이스케이프(item.rarity ?? "일반") + '</span><span class="inventory-quantity">×' +
                숫자정리(item.quantity).toLocaleString() + '</span></div>' +
                '<div class="inventory-code">' + HTML이스케이프(item.item_code ?? "-") + '</div>' +
                (action ? '<div class="inventory-action-row">' + action + '</div>' : "") +
                '</article>';
        }).join("")
        : '<div class="empty" style="grid-column:1/-1;">🎁 아직 보유한 아이템이 없습니다.<br>랜덤박스에서 새로운 아이템을 획득해보세요!</div>';

    상태내용요소.innerHTML = `
        <div class="inventory-notice">
            <strong>🎒 내 아이템 보관함</strong><br>
            모자·안경·옷·망토·스킨·효과는 돌이 꾸미기에, 프로필 프레임은 프로필 사진 테두리에, 배경은 돌이사이트 전체 화면에 적용합니다.
            배율 아이템은 사용하면 1시간 동안 코인 보상에 적용되며, 코인·경험치는 즉시 지급됩니다.
        </div>
        <div class="inventory-buff-status" aria-live="polite">${HTML이스케이프(multiplierStatus)}</div>
        <div class="inventory-action-status" id="inventoryActionStatus" aria-live="polite">아이템을 선택해 바로 사용하거나 장착하세요.</div>
        <div class="inventory-toolbar">
            <div class="inventory-summary">
                전체 <strong>${보유아이템목록.length}</strong>종 · 꾸미기 <strong>${customCount}</strong>종
            </div>
            <div class="inventory-filter">${filterHTML}</div>
        </div>
        <div class="inventory-grid">${cards}</div>
    `;

    상태내용요소.querySelectorAll("[data-inventory-filter]").forEach(button => {
        button.addEventListener("click", () => {
            아이템필터 = button.dataset.inventoryFilter;
            내아이템화면표시();
        });
    });

    상태내용요소.querySelectorAll("[data-inventory-equip]").forEach(button => {
        button.addEventListener("click", async event => {
            event.stopPropagation();
            const item = 보유아이템목록.find(value => value.item_code === button.dataset.inventoryEquip);
            if (!item) return;
            const previous = JSON.parse(JSON.stringify(꾸미기상태));
            꾸미기아이템선택(item);
            button.disabled = true;
            try {
                const saved = await 꾸미기저장();
                if (!saved) {
                    꾸미기상태 = previous;
                    throw new Error("장착 정보를 계정에 저장하지 못했습니다. 다시 시도해 주세요.");
                }
                alert("🎉 " + item.item_name + " 장착 완료!");
                내아이템화면표시();
            } catch (error) {
                console.error("랜덤 박스 아이템 장착 오류:", error);
                alert(error?.message || "아이템 장착 중 오류가 발생했습니다.");
                내아이템화면표시();
            }
        });
    });

    상태내용요소.querySelectorAll("[data-inventory-background]").forEach(button => {
        button.addEventListener("click", () => {
            상태탭변경("세부설정");
            requestAnimationFrame(() => document.getElementById("site-background-title")?.scrollIntoView({behavior:"smooth",block:"start"}));
        });
    });

    상태내용요소.querySelectorAll("[data-inventory-frame]").forEach(button => {
        button.addEventListener("click", () => {
            상태탭변경("세부설정");
            requestAnimationFrame(() => document.getElementById("dori-frame-title")?.scrollIntoView({behavior:"smooth",block:"start"}));
        });
    });

    상태내용요소.querySelectorAll("[data-inventory-multiplier]").forEach(button => {
        button.addEventListener("click", async event => {
            event.stopPropagation();
            const item = 보유아이템목록.find(value => value.item_code === button.dataset.inventoryMultiplier);
            if (!item || button.disabled) return;
            button.disabled = true;
            const status = document.getElementById("inventoryActionStatus");
            if (status) status.textContent = item.item_name + " 사용 중...";
            try {
                const { data, error } = await supabase.rpc("activate_dori_box_multiplier", {
                    p_item_code: item.item_code
                });
                if (error) throw error;
                if (!data?.success) throw new Error("배율 아이템을 사용하지 못했습니다.");
                현재유저정보.doldolcoin_multiplier = Number(data.multiplier);
                현재유저정보.doldolcoin_multiplier_expires_at = data.expires_at;
                await 인벤토리가져오기({ id: 현재유저정보.user_id });
                내아이템화면표시();
                const expires = new Date(data.expires_at);
                const expiryLabel = Number.isNaN(expires.getTime())
                    ? "시간 정보 없음"
                    : expires.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
                const message = "⚡ " + Number(data.multiplier).toLocaleString("ko-KR") +
                    "배 코인 보상 활성화 · " + expiryLabel + "까지";
                const newStatus = document.getElementById("inventoryActionStatus");
                if (newStatus) newStatus.textContent = message;
                alert(message);
            } catch (error) {
                console.error("배율 아이템 사용 오류:", error);
                const currentStatus = document.getElementById("inventoryActionStatus");
                if (currentStatus) currentStatus.textContent = error?.message || "배율 아이템 사용에 실패했습니다.";
                alert(error?.message || "배율 아이템 사용에 실패했습니다.");
                await 인벤토리가져오기({ id: 현재유저정보.user_id });
                내아이템화면표시();
            }
        });
    });

    상태내용요소.querySelectorAll(".inventory-card.custom-item").forEach(card => {
        card.addEventListener("click", () => {
            const item = 보유아이템목록.find(
                value => value.item_code === card.dataset.itemCode
            );
            if (!item) return;
            상태탭변경("꾸미기");
            setTimeout(() => 꾸미기아이템선택(item), 20);
        });
    });
}

function 꾸미기상태복사() {
    const copied = {};
    for (const key of Object.keys(꾸미기상태)) {
        copied[key] = 꾸미기상태[key] ? { ...꾸미기상태[key] } : null;
    }
    return copied;
}

function 꾸미기이전상태저장() {
    꾸미기이전상태 = 꾸미기상태복사();
}


function 꾸미기화면표시() {

    const categories = Object.keys(꾸미기카테고리정보);
    const rarityRank = { "일반":1, "고급":2, "희귀":3, "영웅":4, "전설":5, "신화":6, "초월":7, "도로늄":8 };
    const rankOf = value => rarityRank[String(value || "일반")] || 0;
    const search = String(꾸미기검색어 || "").trim().toLocaleLowerCase("ko-KR");
    const equippedCount = categories.filter(category => Boolean(꾸미기상태[category])).length;
    const customItems = 보유아이템목록.filter(item => 아이템꾸미기카테고리(item));
    const filterButtons = ["전체", "장착 중", "미장착"].map(filter =>
        '<button type="button" data-custom-filter="' + filter + '" class="' + (꾸미기표시필터 === filter ? "active" : "") + '" aria-pressed="' + String(꾸미기표시필터 === filter) + '">' + filter + '</button>'
    ).join("");

    const categoryHTML = categories.map(category => {
        const info = 꾸미기카테고리정보[category];
        const allItems = 보유아이템목록.filter(item => 아이템꾸미기카테고리(item) === category && 숫자정리(item.quantity) > 0);
        const selectedCode = 꾸미기상태[category]?.item_code ?? "";
        const items = allItems.filter(item => {
            const isEquipped = selectedCode === item.item_code;
            if (꾸미기표시필터 === "장착 중" && !isEquipped) return false;
            if (꾸미기표시필터 === "미장착" && isEquipped) return false;
            if (search) {
                const haystack = [item.item_name, item.item_code, item.rarity, info.label].join(" ").toLocaleLowerCase("ko-KR");
                if (!haystack.includes(search)) return false;
            }
            return true;
        }).sort((a,b) => rankOf(b.rarity) - rankOf(a.rarity) || String(a.item_name || "").localeCompare(String(b.item_name || ""), "ko"));

        if (!items.length && (search || 꾸미기표시필터 !== "전체")) return "";

        const itemsHTML = items.length
            ? items.map(item => {
                const selected = selectedCode === item.item_code;
                const rarity = String(item.rarity || "일반");
                return '<button type="button" class="custom-item-button ' + (selected ? "selected" : "") + '" data-custom-code="' + HTML이스케이프(item.item_code) + '" data-custom-category="' + category + '" aria-pressed="' + String(selected) + '" title="' + HTML이스케이프(item.item_name || item.item_code) + '">' +
                    '<span class="custom-item-emoji dori-item-thumb"><img class="dori-item-thumb-base" src="assets/dori-life/dori-official.webp" alt="" loading="lazy"><img class="dori-item-thumb-overlay" src="' + 돌이꾸미기오버레이경로(item, category) + '" alt="" loading="lazy"></span>' +
                    '<span class="custom-item-name">' + HTML이스케이프(item.item_name || "이름 없는 아이템") + '</span>' +
                    '<span class="custom-item-qty"><span class="custom-item-rarity" data-rarity="' + HTML이스케이프(rarity) + '">' + HTML이스케이프(rarity) + '</span><span>×' + 숫자정리(item.quantity).toLocaleString() + '</span></span>' +
                    (selected ? '<span class="custom-item-equipped">✓ 현재 장착 중 · 다시 누르면 해제</span>' : '') +
                    '</button>';
            }).join("")
            : '<div class="custom-category-empty">이 카테고리에는 아직 보유한 아이템이 없습니다.</div>';

        return '<section class="custom-category" data-custom-section="' + category + '">' +
            '<div class="custom-category-head"><div><div class="custom-category-title">' + info.emoji + ' ' + info.label + '</div><div class="custom-category-count">보유 ' + allItems.length + '종 · 표시 ' + items.length + '종</div></div>' +
            '<div class="custom-category-tools"><button type="button" class="custom-category-clear" data-clear-category="' + category + '" ' + (꾸미기상태[category] ? "" : "disabled") + '>이 슬롯 해제</button></div></div>' +
            '<div class="custom-item-row">' + itemsHTML + '</div></section>';
    }).join("");

    const slots = [
        ["hat","🎩 모자"], ["glasses","👓 안경"], ["clothes","👕 옷"], ["cape","🦸 망토"],
        ["skin","🐶 스킨"], ["effect","✨ 효과"]

    const 스킨코드 = String(꾸미기상태.skin?.item_code || "");
    const layer = (category, className) => {
        const item = 꾸미기상태[category];

            '<div class="custom-studio-actions"><button type="button" class="custom-studio-action primary" id="꾸미기랜덤버튼">🎲 랜덤 코디</button><button type="button" class="custom-studio-action" id="꾸미기되돌리기" ' + (꾸미기이전상태 ? "" : "disabled") + '>↶ 실행 취소</button></div></div>' +
        '</div>' +
        '<div class="customization-layout">' +
            '<div class="custom-preview">' +
                '<div class="custom-studio-intro"><div><div class="custom-studio-kicker">DORI CHARACTER STUDIO</div><div class="preview-title">🐶 진짜 돌이 꾸미기</div></div><span class="custom-studio-equipped-count">' + equippedCount + ' / 6 장착</span></div>' +
                '<div class="preview-stage dori-character-stage">' +
                    (꾸미기상태.cape ? '<img class="dori-real-layer dori-cape-layer" src="' + 돌이꾸미기오버레이경로(꾸미기상태.cape, "cape") + '" alt="" draggable="false">' : '') +
                    '<img class="dori-real-base ' + (스킨코드 ? "skin-" + 스킨코드 : "") + '" src="assets/dori-life/dori-official.webp" alt="웰시코기 봉제인형 돌이 캐릭터" draggable="false">' +
                    layer("clothes","dori-clothes-layer") +
                    layer("hat","dori-hat-layer") +
                    layer("glasses","dori-glasses-layer") +
                    (꾸미기상태.effect ? '<img class="dori-real-layer dori-effect-layer" src="' + 돌이꾸미기오버레이경로(꾸미기상태.effect, "effect") + '" alt="" draggable="false">' : '') +
                '</div>' +
                '<div class="preview-subtitle">프로필 사진이 아닌 돌이 캐릭터에 아이템을 직접 겹쳐 입히는 미리보기입니다. 선택한 코디는 저장 후 계정에 적용됩니다.</div>' +
                '<div class="custom-preview-slots">' + slots + '</div>' +
                '<div class="custom-actions" style="width:100%;max-width:320px;">' +
                    '<button class="custom-save" id="꾸미기저장버튼">💾 코디 저장</button>' +
                    '<button class="custom-reset" id="꾸미기초기화버튼">↺ 기본 모습</button>' +
                '</div>' +
                '<div class="custom-status" id="꾸미기상태문구" aria-live="polite">돌이 캐릭터 자체에 꾸미기 아이템이 적용됩니다. 사이트 배경은 별도로 유지됩니다.</div>' +
            '</div>' +
            '<div class="custom-controls">' +
                (categoryHTML || '<div class="custom-studio-empty">검색 조건에 맞는 아이템이 없습니다.<br>검색어를 지우거나 필터를 바꿔보세요.</div>') +
            '</div>' +
        '</div>';

    const searchInput = document.getElementById("꾸미기검색");
    searchInput?.addEventListener("input", event => {
        const cursor = event.target.selectionStart;
        꾸미기검색어 = event.target.value;
        꾸미기화면표시();
        const nextInput = document.getElementById("꾸미기검색");
        if (nextInput) {
            nextInput.focus();
            try { nextInput.setSelectionRange(cursor, cursor); } catch (_) {}
        }

    상태내용요소.querySelectorAll("[data-custom-filter]").forEach(button => {
        button.addEventListener("click", () => {

    상태내용요소.querySelectorAll("[data-custom-code]").forEach(button => {

        button.addEventListener("click", () => {

            if (!Object.prototype.hasOwnProperty.call(꾸미기상태, category) || !꾸미기상태[category]) return;
            꾸미기이전상태저장();
            꾸미기상태[category] = null;
            꾸미기화면표시();
            const status = document.getElementById("꾸미기상태문구");

    document.getElementById("꾸미기랜덤버튼")?.addEventListener("click", () => {

        categories.forEach(category => {
            const pool = category === "frame" ? 획득프레임목록 : 보유아이템목록.filter(item => 아이템꾸미기카테고리(item) === category && 숫자정리(item.quantity) > 0);

            const chosen = pool[Math.floor(Math.random() * pool.length)];

        if (!꾸미기이전상태) return;

            restored[key] = 꾸미기이전상태[key] ? { ...꾸미기이전상태[key] } : null;

        꾸미기상태 = restored;
        꾸미기이전상태 = null;
        꾸미기화면표시();
        const status = document.getElementById("꾸미기상태문구");
        if (status) status.textContent = "↶ 직전 코디 변경을 되돌렸습니다. 저장하면 계정에 반영됩니다.";
    });

    document.getElementById("꾸미기저장버튼")?.addEventListener("click", async () => {
        const button = document.getElementById("꾸미기저장버튼");
        const status = document.getElementById("꾸미기상태문구");
        if (button) button.disabled = true;
        if (status) status.textContent = "코디를 계정에 저장하고 있습니다...";
        try {
            const savedToDb = await 꾸미기저장();
            if (status) status.textContent = savedToDb
                ? "✓ 코디 저장 완료! 다른 기기에서도 같은 돌이 꾸미기를 사용할 수 있습니다."
                : "✓ 이 브라우저에 임시 저장했습니다. 계정 동기화는 연결 상태를 확인해 주세요.";
            꾸미기이전상태 = null;
        } catch (error) {

        } finally {
            if (button) button.disabled = false;
        }
    });

    document.getElementById("꾸미기초기화버튼")?.addEventListener("click", () => {
        꾸미기이전상태저장();
        꾸미기상태초기화();

    });
}


function 꾸미기아이템선택(item) {
    const category = 아이템꾸미기카테고리(item);
    if (!category || !꾸미기상태[category] && 숫자정리(item.quantity) <= 0) return;

    꾸미기이전상태저장();
    if (꾸미기상태[category]?.item_code === item.item_code) {
        꾸미기상태[category] = null;
    } else {
        꾸미기상태[category] = {
            item_code: item.item_code,
            item_name: item.item_name ?? item.item_code,
            rarity: item.rarity ?? "일반"
        };
    }
    꾸미기화면표시();
    const status = document.getElementById("꾸미기상태문구");
    if (status) status.textContent = 꾸미기상태[category]
        ? "✓ " + (item.item_name || item.item_code) + " 선택 완료 · 저장 전 미리보기"
        : "✓ " + (item.item_name || item.item_code) + " 장착을 해제했습니다.";
}

async function EXP레벨DB보정(
    user,
    exp,
    기존레벨
) {

    const 계산된 =
        경험치로레벨계산(
            exp
        );

    const 기존 =
        숫자정리(
            기존레벨,
            1
        );


    if (
        계산된 === 기존
    ) {

        return;

    }


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                exp_level:
                    계산된

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "EXP 레벨 보정 오류:",
            error
        );

        return;

    }

}

        const {
            error: uploadError
        } =
            await supabase.storage
                .from(
                    "profile-images"
                )
                .upload(
                    fileName,
                    file,
                    {

                        upsert: true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }
                );


        if (uploadError) {

            throw uploadError;

        }


        const {
            data
        } =
            supabase.storage
                .from(
                    "profile-images"
                )
                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data.publicUrl;


        const {
            error: updateError
        } =
            await supabase
                .from("users")
                .update({

                    profile_image:
                        imageUrl

                })
                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            throw updateError;

        }


        사진요소.src =
            imageUrl +
            "?t=" +
            Date.now();


        현재유저정보.profile_image =
            imageUrl;


        alert(
            "🐶 프로필 사진이 변경되었습니다!"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );

        alert(
            "프로필 사진 변경에 실패했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}

// =====================================================
// 페이지 초기화
// =====================================================

async function 페이지초기화() {

    try {

        const {
            data: {
                session
            },
            error
        } =
            await supabase.auth.getSession();


        if (
            error
        ) {

            throw error;

        }


        if (!session) {

            로그인페이지로이동();

            return;

        }


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabase.auth.getUser();


        if (
            userError ||
            !user
        ) {

            로그인페이지로이동();

            return;

        }


        // 사용자 정보

        const 유저정보 =
            await 사용자정보가져오기(
                user
            );

        현재유저정보 = 유저정보;
        await 업적진행활동가져오기(user.id);

        // 돌이사이트 랜덤박스 인벤토리
        try {
            await 인벤토리가져오기(user);
        }
        catch (error) {
            console.error("랜덤박스 인벤토리 조회 오류:", error);
            보유아이템목록 = [];
        }

        // 이벤트·라운지·패스 등에서 획득한 프레임을 통합 수집
        await 프레임목록가져오기(user);

        // 돌이사이트 전용 꾸미기 저장값
        await 꾸미기정보가져오기(user);


        // 업적

        try {

            await 업적정보가져오기();

        }

        catch (error) {

            console.error(
                "업적 조회 오류:",
                error
            );

            업적목록 = [];

        }


        // EXP 레벨 보정

        await EXP레벨DB보정(
            user,
            숫자정리(
                유저정보.exp
            ),
            유저정보.exp_level
        );


        유저정보.exp_level =
            경험치로레벨계산(
                숫자정리(
                    유저정보.exp
                )
            );


        // 화면

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "🐶 돌이사이트 설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(
            "페이지 초기화 오류:",
            error
        );

        alert(
            "페이지를 불러오지 못했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// 시작

if (
