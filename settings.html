<script type="module">

// =============================
// 페이지 로드
// =============================

window.addEventListener("DOMContentLoaded", async () => {

  const 레벨이름 = {

    1: "일반",
    2: "프리미엄",
    3: "돌프리미엄",
    4: "돌돌프리미엄",
    5: "돌돌돌프리미엄",
    6: "돌돌돌돌프리미엄",
    7: "돌돌돌돌돌프리미엄",
    8: "유사돌이",
    9: "돌이",
    10: "관리자"

  };


  // =========================
  // 로그인 사용자 확인
  // =========================

  const {
    data: { user }
  } = await supabase.auth.getUser();


  if (!user) {

    alert("로그인이 필요합니다.");

    location.href = "login.html";

    return;

  }


  // =========================
  // users 정보 가져오기
  // =========================

  const {
    data: 유저정보,
    error
  } = await supabase

    .from("users")

    .select(`
      user_number,
      user_id,
      login_id,
      user_level,
      doldolcoin,
      profile_image,
      name
    `)

    .eq("user_id", user.id)

    .single();


  if (error) {

    console.error(error);

    return;

  }


  // =========================
  // 프로필 사진
  // =========================

  if (유저정보.profile_image) {

    document.getElementById("돌이사진").src =
      유저정보.profile_image;

  }


  // =========================
  // 이름
  // =========================

  document.getElementById("이름").textContent =

    (유저정보.name ?? "이름 없음") +
    "님 환영합니다";


  // =========================
  // 현재 아이디
  // =========================

  document.getElementById("현재아이디").textContent =

    "현재 아이디 : " +
    (유저정보.login_id ?? "없음");


  // =========================
  // 레벨
  // =========================

  document.getElementById("레벨").textContent =

    "현재 레벨 : " +
    (레벨이름[유저정보.user_level] || "일반");


  // =========================
  // 돌돌코인
  // =========================

  document.getElementById("돌돌코인수량").textContent =

    "현재 돌돌코인 : " +
    (유저정보.doldolcoin ?? 0);

});


// =============================
// 프로필 사진 변경
// =============================

window.프로필업로드 = async function () {


  const file =
    document.getElementById("profileUpload").files[0];


  if (!file) {

    alert("사진을 선택하세요.");

    return;

  }


  // =========================
  // 로그인 사용자 확인
  // =========================

  const {
    data: { user }
  } = await supabase.auth.getUser();


  if (!user) {

    alert("로그인이 필요합니다.");

    return;

  }


  // =========================
  // 파일 확장자
  // =========================

  const ext =
    file.name.split(".").pop();


  const fileName =
    `${user.id}.${ext}`;


  // =========================
  // Storage 업로드
  // =========================

  const {
    error: uploadError
  } = await supabase.storage

    .from("profile-images")

    .upload(
      fileName,
      file,
      {
        upsert: true
      }
    );


  if (uploadError) {

    alert(uploadError.message);

    console.error(uploadError);

    return;

  }


  // =========================
  // 공개 URL 가져오기
  // =========================

  const {
    data
  } = supabase.storage

    .from("profile-images")

    .getPublicUrl(fileName);


  const imageUrl =
    data.publicUrl;


  // =========================
  // users 테이블 업데이트
  // =========================

  const {
    error: updateError
  } = await supabase

    .from("users")

    .update({

      profile_image: imageUrl

    })

    .eq("user_id", user.id);


  if (updateError) {

    alert(updateError.message);

    console.error(updateError);

    return;

  }


  // =========================
  // 화면 즉시 변경
  // =========================

  document.getElementById("돌이사진").src =

    imageUrl + "?t=" + Date.now();


  alert("프로필 사진이 변경되었습니다.");

};

  import { getMyExp } from "./exp.js";

async function loadExp() {
    const expInfo = await getMyExp();

    if (!expInfo) {
        return;
    }

    document.getElementById("user-level").textContent =
        `Lv.${expInfo.level}`;

    document.getElementById("current-exp").textContent =
        `${expInfo.currentExp} EXP`;

    document.getElementById("required-exp").textContent =
        `${expInfo.requiredExp} EXP`;

    document.getElementById("exp-progress-bar").style.width =
        `${expInfo.progress}%`;

    const remaining =
        expInfo.requiredExp - expInfo.currentExp;

    if (remaining <= 0) {
        document.getElementById("next-level-text").textContent =
            "레벨업!";
    } else {
        document.getElementById("next-level-text").textContent =
            `다음 레벨까지 ${remaining} EXP`;
    }
}

loadExp();

</script>
