// =====================================================
// 회원 레벨 이름

const 회원레벨이름 = {

// =====================================================
// EXP 레벨 필요 경험치
//
// exp
// ↓
// exp_level
//
// user_level과 완전히 독립
// =====================================================

const EXP레벨필요경험치 = {

    1: 0,
    2: 100,
    3: 500,
    4: 1000,
    5: 5000,
    6: 10000,
    7: 20000,
    8: 30000,
    9: 40000,
    10: 50000,
    11: 100000

};


// =====================================================
// 안전한 숫자 변환
// =====================================================

function 숫자변환(value, 기본값 = 0) {

    const number = Number(value);

    if (!Number.isFinite(number)) {

        return 기본값;

    }

    return number;

}


// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(exp) {

    exp = 숫자변환(exp, 0);

    let level = 1;


    for (let i = 11; i >= 1; i--) {

        if (
            exp >=
            EXP레벨필요경험치[i]
        ) {

            level = i;

            break;

        }

    }


    return level;

}


// =====================================================
// EXP 진행도 계산
// =====================================================

function 경험치정보계산(exp) {

    exp = 숫자변환(exp, 0);


    const level =
        경험치로레벨계산(exp);


    // =================================================
    // 최고 레벨
    // =================================================

    if (level >= 11) {

        return {

            level: 11,

            currentExp: exp,

            requiredExp: exp,

            progress: 100,

            remaining: 0

        };

    }


    // =================================================
    // 현재 레벨 필요 EXP
    // =================================================

    const 현재레벨필요EXP =
        EXP레벨필요경험치[level];


    // =================================================
    // 다음 레벨 필요 EXP
    // =================================================

    const 다음레벨필요EXP =
        EXP레벨필요경험치[level + 1];


    // =================================================
    // 현재 레벨에서 얻은 EXP
    // =================================================

    const 현재구간EXP =
        Math.max(
            0,
            exp - 현재레벨필요EXP
        );


    // =================================================
    // 현재 레벨 구간의 총 필요 EXP
    // =================================================

    const 구간필요EXP =
        다음레벨필요EXP -
        현재레벨필요EXP;


    // =================================================
    // 진행도
    // =================================================

    let progress = 0;


    if (구간필요EXP > 0) {

        progress =
            (
                현재구간EXP /
                구간필요EXP
            ) * 100;

    }


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    // =================================================
    // 다음 레벨까지 남은 EXP
    // =================================================

    const remaining =
        Math.max(
            0,
            다음레벨필요EXP - exp
        );


    return {

        level,

        currentExp:
            현재구간EXP,

        requiredExp:
            구간필요EXP,

        progress,

        remaining

    };

}


// =====================================================
// 오류 메시지 표시
// =====================================================

function 오류알림(메시지) {

    console.error(
        "[돌이 사이트 오류]",
        메시지
    );


    alert(
        메시지
    );

}


// =====================================================
// Supabase 오류 분석
// =====================================================

function Supabase오류처리(error, 기본메시지) {

    if (!error) {

        return;

    }


    console.error(
        "Supabase 오류:",
        error
    );


    // =================================================
    // 401 / Invalid API key
    // =================================================

    if (

        error.status === 401 ||

        error.message?.includes(
            "Invalid API key"
        )

    ) {

        오류알림(
            "Supabase API 키가 유효하지 않습니다.\n\n" +

            "Supabase 프로젝트의 현재 공개용 API 키를 확인해주세요."
        );

        return;

    }


    // =================================================
    // JWT 관련
    // =================================================

    if (

        error.message?.includes(
            "JWT"
        ) ||

        error.message?.includes(
            "token"
        )

    ) {

        오류알림(
            "로그인 세션이 만료되었거나 올바르지 않습니다.\n\n" +

            "다시 로그인해주세요."
        );

        return;

    }


    // =================================================
    // 기본 오류
    // =================================================

    오류알림(

        기본메시지 +

        "\n\n오류: " +

        (
            error.message ??
            "알 수 없는 오류"
        )

    );

}


// =====================================================

async function 로그인사용자가져오기() {

            );

            return null;

        }


        if (!data?.user) {

        }


        return data.user;

    }

    catch (error) {

        console.error(
            "로그인 사용자 확인 예외:",

        );


        오류알림(
            "로그인 정보를 확인하는 중 문제가 발생했습니다."

}

        console.log(

        // =================================================

        const exp =

        const 계산된EXP레벨 =

            );


        // =================================================

        // =================================================

            숫자변환(

            계산된EXP레벨 !==
            DBEXP레벨
        ) {

                `EXP 레벨 수정: ${DBEXP레벨} → ${계산된EXP레벨}`
            );


            try {

                const {

                    error

                } = await supabase

                    .from("users")

                    .update({

                        exp_level:
                            계산된EXP레벨

                    })

                    .eq(
                        "user_id",
                        user.id
                    );


                if (error) {

                    console.error(
                        "EXP 레벨 저장 오류:",
                        error
                    );

                }

            }

            catch (error) {

                console.error(
                    "EXP 레벨 업데이트 예외:",
                    error
                );

            }

        }


        // =================================================
        // EXP 진행도
        // =================================================

        const expInfo =
            경험치정보계산(
                exp
            );


        console.log(
            "EXP 정보:",
            expInfo
        );


        // =================================================

        // =================================================

        // =================================================

        if (다음레벨) {

        }

window.프로필업로드 = async function() {


    try {


        // =================================================
        // 파일
        // =================================================

        const input =
            document.getElementById(

            );

            input.files?.[0];

            );

            return;

        }


        // =================================================
        // 파일 종류 확인

            );

            return;

        }


        // =================================================
        // 파일 크기 제한
        // 10MB
        // =================================================

        const 최대파일크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대파일크기
        ) {

                "프로필 사진은 10MB 이하만 업로드할 수 있습니다."
            );

                .split(".")
                .pop()
                .toLowerCase();

            "jpeg",
            "png",
            "gif",

        // 파일명
        //
        // user.id 기반
        // =================================================

        const fileName =
            `${user.id}.${ext}`;


        console.log(
            "프로필 업로드 파일:",
            fileName
        );


        // =================================================
        // Storage 업로드
        // =================================================

        const {

            error: uploadError

        } = await supabase.storage

            .from(
                "profile-images"
            )

            .upload(

                fileName,

                file,

                {

                    upsert: true,

                    contentType:
                        file.type,

                    cacheControl:
                        "3600"

                }

            );


        // =================================================
        // 업로드 오류
        // =================================================

        if (uploadError) {

            console.error(
                "프로필 Storage 업로드 오류:",
                uploadError
            );


            if (
                uploadError.statusCode === 401 ||
                uploadError.message?.includes(
                    "JWT"
                )
            ) {

                alert(
                    "로그인 세션이 만료되었습니다.\n\n다시 로그인해주세요."
                );

            }

            else {

                alert(

                    "프로필 사진 업로드에 실패했습니다.\n\n" +

                    uploadError.message

                );

            }


            return;

        }


        // =================================================
        // 공개 URL
        // =================================================

        const {

            data: publicUrlData

        } = supabase.storage

            .from(
                "profile-images"
            )

            .getPublicUrl(
                fileName
            );


        const imageUrl =
            publicUrlData?.publicUrl;


        if (!imageUrl) {

            alert(
                "프로필 사진 URL을 가져오지 못했습니다."
            );

            return;

        }


        console.log(
            "프로필 이미지 URL:",
            imageUrl
        );


        // =================================================
        // users 테이블 업데이트
        // =================================================

        const {

            error: updateError

        } = await supabase

            .from("users")

            .update({

                profile_image:
                    imageUrl

            })

            .eq(
                "user_id",
                user.id
            );


        // =================================================
        // DB 저장 오류
        // =================================================

        if (updateError) {

            console.error(
                "프로필 DB 저장 오류:",
                updateError
            );


            Supabase오류처리(

                updateError,

                "프로필 사진 정보를 저장하지 못했습니다."

            );

            return;

        }


        // =================================================
        // 화면 즉시 변경
        // =================================================

        const 사진 =
            document.getElementById(
                "돌이사진"
            );


        if (사진) {

            사진.src =

                imageUrl +

                "?t=" +

                Date.now();

        }


        // =================================================
        // 완료
        // =================================================

        alert(
            "프로필 사진이 변경되었습니다! 🐶"
        );


        // 파일 input 초기화
        input.value = "";


    }

    catch (error) {

        console.error(
            "프로필 업로드 전체 오류:",
            error
        );


        // =================================================
        // Invalid API key
        // =================================================

        if (

            error.status === 401 ||

            error.message?.includes(
                "Invalid API key"
            )

        ) {

            alert(

                "Supabase API 키가 유효하지 않습니다.\n\n" +

                "Supabase 프로젝트의 현재 공개용 API 키를 확인해주세요."

            );

            return;

        }


        // =================================================
        // 기타 오류
        // =================================================

        alert(

            "프로필 사진 처리 중 오류가 발생했습니다.\n\n" +

            (
                error.message ??
                "알 수 없는 오류"
            )

        );

    }

};

</script>
