let 현재상태탭 =

// =====================================================

const 이름요소 =

const 업적버튼 =

// =====================================================
// 숫자 안전 처리
// =====================================================

function 숫자정리(
    value,
    기본값 = 0
) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 기본값;

}


// =====================================================
// HTML 안전 처리
// =====================================================

function HTML이스케이프(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// =====================================================
// 로그인
// =====================================================

function 로그인페이지로이동() {

    alert(
        "로그인이 필요합니다."
    );

    location.href =
        "login.html";

}


// =====================================================
// EXP → 레벨
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    let level = 1;

    const 레벨목록 =
        Object.keys(
            EXP레벨필요경험치
        )
        .map(Number)
        .sort(
            (a, b) => b - a
        );

    for (
        const 레벨
        of 레벨목록
    ) {

        if (
            exp >=
            EXP레벨필요경험치[레벨]
        ) {

            level =
                레벨;

            break;

        }

    }

    return level;

}


// =====================================================
// EXP 정보
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    const level =
        경험치로레벨계산(
            exp
        );

    const 최고레벨 =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );

    if (
        level >=
        최고레벨
    ) {

        return {

            level:
                최고레벨,

            totalExp:
                exp,

            currentExp:
                exp -
                EXP레벨필요경험치[
                    최고레벨
                ],

            requiredExp:
                0,

            progress:
                100,

            remaining:
                0,

            maxLevel:
                true

        };

    }

    const 현재필요 =
        EXP레벨필요경험치[
            level
        ];

    const 다음필요 =
        EXP레벨필요경험치[
            level + 1
        ];

    const currentExp =
        Math.max(
            0,
            exp - 현재필요
        );

    const requiredExp =
        다음필요 -
        현재필요;

    const progress =
        Math.max(
            0,
            Math.min(
                100,
                (
                    currentExp /
                    requiredExp
                ) * 100
            )
        );

    const remaining =
        Math.max(
            0,
            다음필요 - exp
        );

    return {

        level,

        totalExp:
            exp,

        currentExp,

        requiredExp,

        progress,

        remaining,

        maxLevel:
            false

    };

}


// =====================================================
// EXP 화면
// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(
            exp
        );

    EXP레벨요소.textContent =
        `Lv.${정보.level}`;

    현재EXP요소.textContent =
        `${정보.currentExp.toLocaleString()} EXP`;

    필요EXP요소.textContent =
        정보.maxLevel
            ? "MAX"
            : `${정보.requiredExp.toLocaleString()} EXP`;

    EXP진행바.style.width =
        `${정보.progress}%`;

    다음레벨텍스트.textContent =
        정보.maxLevel
            ? "✨ 최고 레벨!"
            : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

}


// =====================================================
// user_achievement 안전 처리
// =====================================================

function 업적데이터정리(data) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }

    return data;

}


// =====================================================
// 업적 획득 여부
// =====================================================

function 업적획득여부(
    업적ID,
    획득업적
) {

    if (
        !획득업적 ||
        typeof 획득업적 !== "object"
    ) {

        return false;

    }

    return Boolean(
        획득업적[
            업적ID
        ]
    );

}

// ⭐ Supabase 업적 가져오기
// =====================================================

async function 업적정보가져오기() {

    const {
        data,
        error
    } =
        await supabase

            .from("achievements")

            .select(`
                id,
                name,
                description,
                rarity,
                reward_exp,
                reward_doldolcoin,
                icon,
                enabled,
                title,
                created_at
            `)

            .eq(
                "enabled",
                true
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "achievements 조회 오류:",
            error
        );

        throw error;

    }


    업적목록 =
        Array.isArray(data)
            ? data.filter(
                업적 =>
                    업적 &&
                    업적.id
            )
            : [];


    console.log(
        "🏆 업적 목록:",
        업적목록
    );


    return 업적목록;

}


// =====================================================
// ⭐ 획득한 칭호 가져오기
//
// 중요:
// title이 NULL / 빈 문자열이면
// 칭호가 없는 업적이다.
// =====================================================

function 획득한칭호가져오기() {

    const 획득업적 =
        업적데이터정리(
            현재유저정보?.user_achievement
        );

    return 업적목록.filter(
        업적 => {

            if (
                !업적 ||
                !업적.id
            ) {

                return false;

            }

            const title =
                typeof 업적.title === "string"
                    ? 업적.title.trim()
                    : "";

            return (
                title !== "" &&
                업적획득여부(
                    업적.id,
                    획득업적
                )
            );

        }
    );

}


// =====================================================
// ⭐ 현재 칭호 화면
// =====================================================

function 현재칭호화면업데이트() {

    if (!현재칭호요소) {
        return;
    }

    const 칭호업적 =
        획득한칭호가져오기();

    if (
        칭호업적.length === 0
    ) {

        현재칭호요소.textContent =
            "🏷️ 칭호 없음";

        return;

    }

    const 칭호문자열 =
        칭호업적
            .map(
                업적 =>
                    업적.title
            )
            .join(" · ");

    현재칭호요소.textContent =
        `🏷️ ${칭호문자열}`;

}


// =====================================================
// ⭐ 업적 화면
// =====================================================

function 업적화면표시() {

    if (!상태내용요소) {
        return;
    }


    const 획득업적 =
        업적데이터정리(
            현재유저정보?.user_achievement
        );


    if (
        업적목록.length === 0
    ) {

        상태내용요소.innerHTML = `

            <div class="achievement-empty">

                🏆 등록된 업적이 없습니다.

            </div>

        `;

        return;

    }


    let html = "";


    for (
        const 업적
        of 업적목록
    ) {

        if (
            !업적 ||
            !업적.id
        ) {

            continue;

        }


        const 획득 =
            업적획득여부(
                업적.id,
                획득업적
            );


        const 아이콘 =
            업적.icon ||
            "🏆";


        const 이름 =
            업적.name ||
            "이름 없는 업적";


        const 설명 =
            업적.description ||
            "설명이 없습니다.";


        const 희귀도 =
            업적.rarity ||
            "Common";


        const 경험치 =
            숫자정리(
                업적.reward_exp,
                0
            );


        const 돌돌코인 =
            숫자정리(
                업적.reward_doldolcoin,
                0
            );


        /*
         * ⭐ 핵심
         *
         * title이 있는 업적만
         * 칭호를 보여준다.
         *
         * title이 NULL이면
         * 아무것도 표시하지 않는다.
         */

        const 칭호 =
            typeof 업적.title === "string"
                ? 업적.title.trim()
                : "";


        let 획득부분 = "";


        if (획득) {

            let 시간 = "-";


            const 획득정보 =
                획득업적[
                    업적.id
                ];


            if (
                획득정보 &&
                typeof 획득정보 === "object"
            ) {

                const 획득시간 =
                    획득정보.획득시간 ??
                    획득정보.acquired_at ??
                    획득정보.obtained_at;


                if (획득시간) {

                    const 날짜 =
                        new Date(
                            획득시간
                        );


                    if (
                        !Number.isNaN(
                            날짜.getTime()
                        )
                    ) {

                        시간 =
                            날짜.toLocaleString(
                                "ko-KR"
                            );

                    }

                }

            }


            획득부분 = `

                <div class="achievement-status">

                    ✅ 획득 완료

                </div>

                <div class="achievement-time">

                    🕐 획득시간:
                    ${HTML이스케이프(시간)}

                </div>

            `;


            /*
             * ⭐ 칭호가 존재하는
             * 특정 업적에만 표시
             */

            if (칭호) {

                획득부분 += `

                    <div class="achievement-title">

                        🏷️ 칭호:
                        ${HTML이스케이프(칭호)}

                    </div>

                `;

            }

        }
        else {

            획득부분 = `

                <div class="achievement-status">

                    🔒 아직 획득하지 않음

                </div>

            `;

        }


        html += `

            <div class="achievement-item">

                <div class="achievement-name">

                    ${
                        획득
                            ? HTML이스케이프(아이콘)
                            : "🔒"
                    }

                    ${HTML이스케이프(이름)}

                </div>


                <div class="achievement-description">

                    ${HTML이스케이프(설명)}

                </div>


                <div class="achievement-description">

                    ⭐ 희귀도:
                    ${HTML이스케이프(희귀도)}

                </div>


                <div class="achievement-reward">

                    🎁 보상:

                    ${경험치.toLocaleString()}
                    EXP

                    /

                    ${돌돌코인.toLocaleString()}
                    돌돌코인

                </div>


                ${획득부분}

            </div>

        `;

    }


    if (!html) {

        html = `

            <div class="achievement-empty">

                🏆 표시할 업적이 없습니다.

            </div>

        `;

    }


    상태내용요소.innerHTML =
        html;

}


// =====================================================
// 상세 설명
// =====================================================

function 상세설명화면표시() {

    if (!상태내용요소) {
        return;
    }


    const 유저 =
        현재유저정보;


    if (!유저) {

        상태내용요소.innerHTML = `

            <div class="achievement-loading">

                🐶 사용자 정보를 불러오는 중입니다...

            </div>

        `;

        return;

    }


    const exp =
        숫자정리(
            유저.exp,
            0
        );


    const expLevel =
        경험치로레벨계산(
            exp
        );


    const userLevel =
        숫자정리(
            유저.user_level,
            1
        );


    const 회원등급 =
        회원레벨이름[
            userLevel
        ] ||
        "일반";


    const coin =
        숫자정리(
            유저.doldolcoin,
            0
        );


    const 획득업적 =
        업적데이터정리(
            유저.user_achievement
        );


    const 획득업적수 =
        업적목록.filter(
            업적 =>
                업적획득여부(
                    업적.id,
                    획득업적
                )
        ).length;


    const 전체업적수 =
        업적목록.length;


    const 칭호업적 =
        획득한칭호가져오기();


    let 칭호HTML =
        "🏷️ 없음";


    if (
        칭호업적.length > 0
    ) {

        칭호HTML = `

            <div class="title-list">

                ${
                    칭호업적
                        .map(
                            업적 => `
                                <span class="title-badge">

                                    🏷️
                                    ${HTML이스케이프(
                                        업적.title
                                    )}

                                </span>
                            `
                        )
                        .join("")
                }

            </div>

        `;

    }


    상태내용요소.innerHTML = `

        <div class="status-item">

            <span>
                🐶 EXP 레벨
            </span>

            <span class="status-value">

                Lv.${expLevel}

            </span>

        </div>


        <div class="status-item">

            <span>
                ⭐ 총 EXP
            </span>

            <span class="status-value">

                ${exp.toLocaleString()} EXP

            </span>

        </div>


        <div class="status-item">

            <span>
                👑 회원 등급
            </span>

            <span class="status-value">

                ${HTML이스케이프(
                    회원등급
                )}

            </span>

        </div>


        <div class="status-item">

            <span>
                🪙 돌돌코인
            </span>

            <span class="status-value">

                ${coin.toLocaleString()}

            </span>

        </div>


        <div class="status-item">

            <span>
                🏆 획득 업적
            </span>

            <span class="status-value">

                ${획득업적수}
                /
                ${전체업적수}

            </span>

        </div>


        <div class="status-item">

            <span>
                🏷️ 획득 칭호
            </span>

            <span class="status-value">

                ${칭호HTML}

            </span>

        </div>


        <div class="status-item">

            <span>
                🆔 사용자 번호
            </span>

            <span class="status-value">

                ${HTML이스케이프(
                    유저.user_number ?? "-"
                )}

            </span>

        </div>


        <div class="status-item">

            <span>
                📧 로그인 아이디
            </span>

            <span class="status-value">

                ${HTML이스케이프(
                    유저.login_id ?? "-"
                )}

            </span>

        </div>

    `;

}


// =====================================================
// 상태 화면 업데이트
// =====================================================

function 상태화면업데이트() {

    if (
        현재상태탭 ===
        "업적"
    ) {

        업적화면표시();

    }
    else {

        상세설명화면표시();

    }

}


// =====================================================
// 탭 변경
// =====================================================

function 상태탭변경(탭) {

    if (
        탭 !== "업적" &&
        탭 !== "상세설명"
    ) {

        return;

    }


    현재상태탭 =
        탭;


    업적버튼.classList.toggle(
        "active",
        탭 === "업적"
    );


    상세설명버튼.classList.toggle(
        "active",
        탭 === "상세설명"
    );


    상태화면업데이트();

}


업적버튼.addEventListener(
    "click",
    () =>
        상태탭변경("업적")
);


상세설명버튼.addEventListener(
    "click",
    () =>
        상태탭변경("상세설명")
);

    // -------------------------------------------------

    // -------------------------------------------------

    이름요소.textContent =

    // -------------------------------------------------
    // 로그인 아이디
    // -------------------------------------------------

    현재아이디요소.textContent =
        "현재 아이디 : " +
        (
            유저정보.login_id ??
            "없음"
        );


    // -------------------------------------------------
    // 회원 레벨
    // -------------------------------------------------

    const userLevel =
        숫자정리(
            유저정보.user_level,
            1
        );


    레벨요소.textContent =
        "현재 회원 등급 : " +
        (
            회원레벨이름[
                userLevel
            ] ??
            "일반"
        );


    // -------------------------------------------------
    // 돌돌코인
    // -------------------------------------------------

    const coin =
        숫자정리(
            유저정보.doldolcoin,
            0
        );


    돌돌코인수량요소.textContent =
        "현재 돌돌코인 : " +
        coin.toLocaleString();


    // -------------------------------------------------
    // EXP
    // -------------------------------------------------

    const exp =
        숫자정리(
            유저정보.exp,
            0
        );


    const 계산된EXP레벨 =
        경험치로레벨계산(
            exp
        );


    EXP화면업데이트(
        exp
    );


    // -------------------------------------------------
    // 칭호
    // -------------------------------------------------

    현재칭호화면업데이트();


    // -------------------------------------------------
    // 상태
    // -------------------------------------------------

    상태화면업데이트();

}


// =====================================================
// 사용자 정보 가져오기
// =====================================================

async function 사용자정보가져오기(
    user
) {

    const {
        data,
        error
    } =
        await supabase

            .from("users")

            .select(`
                user_number,
                user_id,
                login_id,
                user_level,
                exp,
                exp_level,
                doldolcoin,
                profile_image,
                name,
                user_achievement
            `)

            .eq(
                "user_id",
                user.id
            )

            .single();


    if (error) {

        throw error;

    }


    if (!data) {

        throw new Error(
            "사용자 정보를 찾을 수 없습니다."
        );

    }


    return data;

}


// =====================================================
// EXP 레벨 DB 보정
// =====================================================

async function EXP레벨DB보정(
    user,
    exp,
    기존EXP레벨
) {

    const 계산된레벨 =
        경험치로레벨계산(
            exp
        );


    const DB레벨 =
        숫자정리(
            기존EXP레벨,
            1
        );


    if (
        계산된레벨 ===
        DB레벨
    ) {

        return;

    }


    console.log(
        "EXP 레벨 보정:",
        DB레벨,
        "→",
        계산된레벨
    );


    const {
        error
    } =
        await supabase

            .from("users")

            .update({

                exp_level:
                    계산된레벨

            })

            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "EXP 레벨 보정 오류:",
            error
        );

    }

}


// =====================================================
// 프로필 업로드
// =====================================================

async function 프로필업로드처리() {

    try {

        const file =
            업로드요소.files?.[0];


        if (!file) {

            alert(
                "사진을 선택하세요."
            );

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            업로드요소.value =
                "";

            return;

        }


        const 최대크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대크기
        ) {

            alert(
                "프로필 사진은 10MB 이하만 사용할 수 있습니다."
            );

            업로드요소.value =
                "";

            return;

        }


        const {
            data,
            error
        } =
            await supabase.auth.getUser();


        if (error) {

            throw error;

        }


        const user =
            data?.user;


        if (!user) {

            로그인페이지로이동();

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const 허용확장자 = [

            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp"

        ];


        if (
            !허용확장자.includes(
                ext
            )
        ) {

            alert(
                "JPG, PNG, GIF, WEBP 이미지만 사용할 수 있습니다."
            );

            업로드요소.value =
                "";

            return;

        }


        /*
         * user.id를 파일명으로 사용해서
         * 사용자마다 자신의 프로필 사진을
         * 하나씩 관리한다.
         */

        const fileName =
            `${user.id}.${ext}`;


        const {
            error: uploadError
        } =
            await supabase.storage

                .from(
                    "profile-images"
                )

                .upload(

                    fileName,

                    file,

                    {

                        upsert:
                            true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }

                );


        if (uploadError) {

            throw uploadError;

        }


        const {
            data: publicData
        } =
            supabase.storage

                .from(
                    "profile-images"
                )

                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            publicData?.publicUrl;


        if (!imageUrl) {

            throw new Error(
                "프로필 이미지 URL을 가져오지 못했습니다."
            );

        }


        const {
            error: updateError
        } =
            await supabase

                .from("users")

                .update({

                    profile_image:
                        imageUrl

                })

                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            throw updateError;

        }


        /*
         * 브라우저 캐시 방지
         */

        const 새이미지주소 =
            imageUrl +
            "?t=" +
            Date.now();


        사진요소.src =
            새이미지주소;


        if (현재유저정보) {

            현재유저정보.profile_image =
                imageUrl;

        }


        업로드요소.value =
            "";


        alert(
            "프로필 사진이 변경되었습니다! 🐶"
        );

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );


        alert(

            "프로필 사진 변경 중 오류가 발생했습니다.\n\n" +

            (
                error?.message ??
                "알 수 없는 오류"
            )

        );

    }

}

// 페이지 초기화
// =====================================================

async function 페이지초기화() {

    try {

        console.log(
            "🐶 돌이 사이트 설정 페이지 시작"
        );


        // -------------------------------------------------
        // 로그인 세션
        // -------------------------------------------------

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (sessionError) {

            throw sessionError;

        }


        if (
            !sessionData.session
        ) {

            로그인페이지로이동();

            return;

        }


        // -------------------------------------------------
        // Auth 사용자
        // -------------------------------------------------

        const {
            data: userData,
            error: userError
        } =
            await supabase.auth.getUser();


        if (userError) {

            throw userError;

        }


        const user =
            userData?.user;


        if (!user) {

            로그인페이지로이동();

            return;

        }


        console.log(
            "로그인 사용자:",
            user.id
        );


        // -------------------------------------------------
        // users
        // -------------------------------------------------

        const 유저정보 =
            await 사용자정보가져오기(
                user
            );


        // -------------------------------------------------
        // achievements
        // -------------------------------------------------

        try {

            await 업적정보가져오기();

        }

        catch (error) {

            console.error(
                "업적 조회 오류:",
                error
            );


            상태내용요소.innerHTML = `

                <div class="achievement-empty">

                    ⚠️ 업적 정보를 불러오지 못했습니다.

                    <br><br>

                    ${HTML이스케이프(
                        error?.message ??
                        "알 수 없는 오류"
                    )}

                </div>

            `;

        }


        // -------------------------------------------------
        // EXP DB 보정
        // -------------------------------------------------

        const exp =
            숫자정리(
                유저정보.exp,
                0
            );


        await EXP레벨DB보정(

            user,

            exp,

            유저정보.exp_level

        );


        유저정보.exp_level =
            경험치로레벨계산(
                exp
            );


        // -------------------------------------------------
        // 화면 표시
        // -------------------------------------------------

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "✅ 설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(
            "설정 페이지 오류:",
            error
        );


        상태내용요소.innerHTML = `

            <div class="achievement-empty">

                ❌ 페이지를 불러오지 못했습니다.

                <br><br>

                ${HTML이스케이프(
                    error?.message ??
                    "알 수 없는 오류"
                )}

            </div>

        `;

    }

}


// =====================================================
// Auth 상태 감시
// =====================================================

supabase.auth.onAuthStateChange(

    (
        event,
        session
    ) => {

        console.log(
            "Auth 상태 변경:",
            event
        );


        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }

);


// =====================================================
// 시작
// =====================================================

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        페이지초기화
    );

}
else {

    페이지초기화();

}

</script>

</body>

</html>
