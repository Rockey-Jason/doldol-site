<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>돌이 사이트-설정</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
>

<link
    href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap"
    rel="stylesheet"
>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');

@font-face {
    font-family: 'HancomMalrangmalrang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Regular.woff2')
         format('woff2');
    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: 'HancomMalrangmalrang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/HancomMalangMalang-Bold.woff2')
         format('woff2');
    font-weight: 700;
    font-display: swap;
}

:root {
    --bg-main: #05051c;
    --bg-secondary: #0b0b2d;
    --card: rgba(255, 255, 255, 0.075);
    --card-hover: rgba(255, 255, 255, 0.12);
    --border: rgba(255, 255, 255, 0.13);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --blue: #69c9ff;
    --purple: #927dff;
    --pink: #e59aff;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: 'HancomMalrangmalrang', sans-serif;
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(82, 89, 255, 0.2),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(190, 93, 255, 0.14),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #05051c 0%,
            #09092b 45%,
            #02020e 100%
        );
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(255, 255, 255, 0.018) 50%,
            transparent 100%
        );
    z-index: -1;
}

/* 상단 헤더 */

.site-header {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 26px 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.site-logo {
    color: white;
    text-decoration: none;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(30px, 5vw, 54px);
    letter-spacing: -2px;
    transition:
        transform 0.3s ease,
        opacity 0.3s ease;
}

.site-logo:hover {
    transform: translateY(-3px);
    opacity: 0.85;
}

.header-description {
    color: var(--muted);
    font-size: 15px;
    text-align: right;
}

/* 전체 레이아웃 */

.page-container {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    padding: 25px 0 80px;
}

.page-heading {
    margin-bottom: 28px;
    animation: fadeUp 0.7s ease both;
}

.page-heading h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: -1.5px;
}

.page-heading p {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
}

/* 프로필 + EXP */

.top-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    gap: 20px;
    margin-bottom: 22px;
}

.glass-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

.glass-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.4),
        transparent
    );
}

/* 프로필 카드 */

.profile-card {
    padding: 30px;
    display: flex;
    align-items: center;
    gap: 26px;
    min-height: 285px;
    animation: fadeUp 0.7s 0.1s ease both;
}

.profile-image-wrapper {
    position: relative;
    flex: 0 0 auto;
}

.profile-image-wrapper::after {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(143, 126, 255, 0.55);
    border-radius: 50%;
    animation: pulseRing 3s ease-in-out infinite;
}

#돌이사진 {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: clamp(125px, 16vw, 190px) !important;
    height: clamp(125px, 16vw, 190px) !important;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.8) !important;
    border-radius: 50%;
    cursor: pointer;
    display: block;
    transition:
        transform 0.4s ease,
        filter 0.4s ease;
    z-index: 1;
}

#돌이사진:hover {
    transform: scale(1.06) rotate(2deg);
    filter: brightness(1.1);
}

.profile-info {
    min-width: 0;
    flex: 1;
}

#이름 {
    position: static !important;
    display: block;
    max-width: 100%;
    padding: 0 !important;
    margin: 0 0 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: white !important;
    background: none !important;
    border: none !important;
    font-family: 'HancomMalrangmalrang', sans-serif !important;
    font-size: clamp(25px, 4vw, 43px) !important;
    font-weight: 700;
    text-align: left;
    cursor: default !important;
}

.profile-level,
.profile-coin,
.profile-id {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#레벨,
#돌돌코인수량 {
    position: static !important;
    padding: 0 !important;
    color: var(--muted) !important;
    background: none !important;
    border: none !important;
    font-family: inherit !important;
    font-size: 15px !important;
    font-weight: 400 !important;
    text-align: left;
}

#현재아이디 {
    position: static !important;
    margin-top: 8px;
    color: var(--muted) !important;
    font-size: 15px !important;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.profile-button,
.info-button {
    position: static !important;
    width: 100% !important;
    height: 46px !important;
    margin-top: 20px;
    border: 1px solid var(--border) !important;
    border-radius: 14px !important;
    color: white !important;
    background: rgba(255, 255, 255, 0.08) !important;
    font-family: inherit !important;
    font-size: 15px !important;
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.profile-button:hover,
.info-button:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.15) !important;
    border-color: rgba(255, 255, 255, 0.3) !important;
}

.profile-button:active,
.info-button:active,
.title-change-button:active,
.title-save-button:active,
.title-cancel-button:active,
.status-tab-button:active {
    transform: scale(0.97);
}

/* EXP 카드 */

.exp-box {
    position: static !important;
    width: auto !important;
    max-width: none !important;
    min-height: 285px;
    padding: 30px !important;
    border: none !important;
    border-radius: 0 !important;
    background: transparent !important;
    animation: fadeUp 0.7s 0.2s ease both;
}

.exp-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 24px;
    font-size: 21px;
    font-weight: 700;
}

#user-level {
    padding: 7px 13px;
    border: 1px solid rgba(146, 125, 255, 0.35);
    border-radius: 999px;
    background: rgba(146, 125, 255, 0.14);
    color: #d7d0ff;
    font-size: 14px;
}

.exp-progress {
    width: 100%;
    height: 15px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
}

#exp-progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--pink)
    );
    box-shadow: 0 0 18px rgba(125, 145, 255, 0.55);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.exp-text {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
}

#next-level-text {
    margin-top: 28px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.045);
    color: var(--muted);
    text-align: center;
    font-size: 14px;
}

/* 상태 카드 */

.status-box {
    position: static !important;
    width: 100% !important;
    max-width: none !important;
    padding: 25px !important;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    animation: fadeUp 0.7s 0.3s ease both;
}

.status-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 24px;
}

.status-tab-button {
    min-height: 48px;
    border: 1px solid transparent;
    border-radius: 14px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition:
        color 0.25s ease,
        background 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
}

.status-tab-button:hover {
    color: white;
    background: rgba(255, 255, 255, 0.12);
}

.status-tab-button.active {
    color: #080822;
    background: linear-gradient(
        135deg,
        #ffffff,
        #d8d4ff
    );
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 22px rgba(160, 150, 255, 0.2);
}

.status-content {
    min-height: 170px;
    animation: contentFade 0.35s ease;
}

.status-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 16px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--muted);
    font-size: 16px;
}

.status-item:last-child {
    border-bottom: none;
}

.status-value {
    color: white;
    font-weight: 700;
    text-align: right;
    overflow-wrap: anywhere;
}

.empty {
    padding: 45px 20px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
}

/* 업적 */

.achievement-item {
    margin-bottom: 12px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.045);
    transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;
    animation: fadeUp 0.45s ease both;
}

.achievement-item:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.085);
    border-color: rgba(255, 255, 255, 0.18);
}

.achievement-name {
    font-size: 19px;
    font-weight: 700;
}

.achievement-description {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
}

.achievement-reward {
    margin-top: 12px;
    color: #d7d0ff;
    font-size: 14px;
}

.achievement-status {
    margin-top: 12px;
    color: #8de5b0;
    font-size: 14px;
}

.achievement-time {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
}

.achievement-title {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 999px;
    background: rgba(255, 215, 0, 0.1);
    color: #ffe680;
    font-size: 13px;
}

/* 칭호 */

.title-current {
    padding: 25px;
    margin-bottom: 15px;
    border: 1px solid rgba(146, 125, 255, 0.2);
    border-radius: 20px;
    background:
        linear-gradient(
            135deg,
            rgba(146, 125, 255, 0.16),
            rgba(255, 255, 255, 0.04)
        );
    text-align: center;
}

.title-current-label {
    color: var(--muted);
    font-size: 14px;
}

.title-current-name {
    margin-top: 10px;
    color: white;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
}

.title-list {
    display: none;
    margin-top: 15px;
}

.title-list.open {
    display: block;
    animation: fadeUp 0.35s ease;
}

.title-item {
    padding: 17px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.045);
    cursor: pointer;
    transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
}

.title-item:hover {
    transform: translateX(4px);
    background: rgba(255, 255, 255, 0.1);
}

.title-item.selected {
    border-color: var(--purple);
    background: rgba(146, 125, 255, 0.16);
    box-shadow: 0 0 22px rgba(146, 125, 255, 0.1);
}

.title-item-name {
    font-size: 18px;
    font-weight: 700;
}

.title-item-achievement {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
}

.title-change-button,
.title-save-button,
.title-cancel-button {
    width: 100%;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition:
        transform 0.25s ease,
        filter 0.25s ease,
        background 0.25s ease;
}

.title-change-button {
    height: 48px;
    color: #080822;
    background: white;
}

.title-save-button {
    height: 48px;
    margin-top: 12px;
    color: white;
    background: linear-gradient(
        100deg,
        var(--blue),
        var(--purple)
    );
}

.title-cancel-button {
    height: 43px;
    margin-top: 9px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.08);
}

.title-change-button:hover,
.title-save-button:hover,
.title-cancel-button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
}

/* 애니메이션 */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(22px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes contentFade {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulseRing {
    0%, 100% {
        transform: scale(1);
        opacity: 0.45;
    }

    50% {
        transform: scale(1.07);
        opacity: 0.9;
    }
}

/* 태블릿 */

@media (max-width: 850px) {
    .top-grid {
        grid-template-columns: 1fr;
    }

    .profile-card {
        min-height: auto;
    }

    .exp-box {
        min-height: auto;
    }
}

/* 모바일 */

@media (max-width: 560px) {
    .site-header {
        width: min(100% - 28px, 1180px);
        padding-top: 20px;
        align-items: flex-start;
    }

    .header-description {
        display: none;
    }

    .page-container {
        width: calc(100% - 28px);
        padding-top: 20px;
    }

    .profile-card {
        flex-direction: column;
        align-items: center;
        padding: 28px 20px;
        text-align: center;
    }

    .profile-info {
        width: 100%;
    }

    #이름 {
        text-align: center;
    }

    .profile-level,
    .profile-coin,
    .profile-id,
    #현재아이디 {
        text-align: center;
    }

    .status-box {
        padding: 16px !important;
        border-radius: 22px;
    }

    .status-tabs {
        gap: 6px;
    }

    .status-tab-button {
        min-height: 44px;
        padding: 0 4px;
        font-size: 13px;
    }

    .status-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
    }

    .status-value {
        text-align: left;
    }

    .achievement-item {
        padding: 16px;
    }

    .achievement-name {
        font-size: 17px;
    }

    .exp-box {
        padding: 24px !important;
    }

    .exp-title {
        font-size: 19px;
    }
}

/* 애니메이션 줄이기 설정 */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}
</style>


</head>

// =====================================================

function 숫자정리(value, 기본값 = 0) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 기본값;

}


// =====================================================
// HTML escape
// =====================================================

function HTML이스케이프(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

// =====================================================
// EXP 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    let level = 1;

    const levels =
        Object.keys(
            EXP레벨필요경험치
        )
        .map(Number)
        .sort(
            (a,b) => b-a
        );

    for (
        const 레벨 of levels
    ) {

        if (
            exp >=
            EXP레벨필요경험치[레벨]
        ) {

            level = 레벨;

            break;

        }

    }

    return level;

}


// =====================================================
// EXP 정보
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(exp)
        );

    const level =
        경험치로레벨계산(
            exp
        );

    const maxLevel =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );

    if (
        level >= maxLevel
    ) {

        return {

            level: maxLevel,

            currentExp:
                exp -
                EXP레벨필요경험치[maxLevel],

            requiredExp: 0,

            progress: 100,

            remaining: 0,

            maxLevel: true

        };

    }

    const currentStart =
        EXP레벨필요경험치[level];

    const nextStart =
        EXP레벨필요경험치[
            level + 1
        ];

    const currentExp =
        Math.max(
            0,
            exp - currentStart
        );

    const requiredExp =
        nextStart -
        currentStart;

    const progress =
        Math.min(
            100,
            Math.max(
                0,
                currentExp /
                requiredExp *
                100
            )
        );

    return {

        level,

        currentExp,

        requiredExp,

        progress,

        remaining:
            Math.max(
                0,
                nextStart - exp
            ),

        maxLevel: false

    };

}


// =====================================================
// EXP 화면
// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(
            exp
        );

    EXP레벨요소.textContent =

    현재EXP요소.textContent =

    필요EXP요소.textContent =
        정보.maxLevel
            ? "MAX"

    EXP진행바.style.width =

            : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

}


// =====================================================

function 업적데이터정리(data) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }

    return data;

}


function 업적획득여부(
    업적ID,
    획득업적
) {

    if (
        !획득업적 ||
        typeof 획득업적 !== "object"
    ) {

        return false;

    }

    return Boolean(
        획득업적[

    );

}

                rarity,

                icon,

            저장영역.style.display =
                "block";

            변경버튼.style.display =
                "none";

        }
    );


    document
        .querySelectorAll(
            ".title-item"
        )
        .forEach(
            item => {

                item.addEventListener(
                    "click",
                    () => {

                        선택된칭호 =
                            item.dataset.title;

                        document
                            .querySelectorAll(
                                ".title-item"
                            )
                            .forEach(
                                other => {

                                    other.classList.remove(
                                        "selected"
                                    );

                                }
                            );

                        item.classList.add(
                            "selected"
                        );

                    }
                );

            }
        );


    document
        .getElementById(
            "칭호취소버튼"
        )
        .addEventListener(
            "click",
            () => {

                칭호변경중 = false;

                선택된칭호 =
                    현재칭호;

                칭호화면표시();

            }
        );


    document
        .getElementById(
            "칭호저장버튼"
        )
        .addEventListener(
            "click",
            칭호저장
        );

}


// =====================================================
// 칭호 저장
// =====================================================

async function 칭호저장() {

    if (!현재유저정보) {

        return;

    }

    const 사용가능칭호 =
        획득한칭호목록();

    const 허용 =
        사용가능칭호.some(
            item =>
                item.title ===
                선택된칭호
        );


    if (
        선택된칭호 !== null &&
        !허용
    ) {

        alert(
            "획득하지 않은 칭호입니다."
        );

        return;

    }


    const {
        data: {
            user
        },
        error: authError
    } =
        await supabase.auth.getUser();


    if (
        authError ||
        !user
    ) {

        로그인페이지로이동();

        return;

    }


    const 저장값 =
        선택된칭호 ??
        null;


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                equipped_title:
                    저장값

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "칭호 저장 오류:",
            error
        );

        alert(
            "칭호 저장에 실패했습니다.\n\n" +
            error.message
        );

        return;

    }


    현재유저정보.equipped_title =
        저장값;

    칭호변경중 = false;


    alert(
        저장값
            ? `🏷️ "${저장값}" 칭호가 장착되었습니다!`
            : "🏷️ 칭호를 해제했습니다!"
    );


    칭호화면표시();

}


// =====================================================
// 탭 변경
// =====================================================

function 상태탭변경(탭) {

    if (
        ![
            "업적",
            "상세설명",
            "칭호"
        ].includes(탭)
    ) {

        return;

    }


    현재상태탭 =
        탭;


    업적버튼.classList.toggle(
        "active",
        탭 === "업적"
    );

    상세설명버튼.classList.toggle(
        "active",
        탭 === "상세설명"
    );

    칭호버튼.classList.toggle(
        "active",
        탭 === "칭호"
    );


    상태화면업데이트();

}


// =====================================================
// 상태 업데이트
// =====================================================

function 상태화면업데이트() {

    if (
        현재상태탭 === "업적"
    ) {

        업적화면표시();

        return;

    }


    if (
        현재상태탭 === "상세설명"
    ) {

        상세설명화면표시();

        return;

    }


    if (
        현재상태탭 === "칭호"
    ) {

        칭호화면표시();

    }

}


// =====================================================
// 사용자 화면
// =====================================================

function 사용자화면업데이트(
    유저정보
) {

    현재유저정보 =
        유저정보;


    if (
        사진요소 &&
        유저정보.profile_image
    ) {

        사진요소.src =
            유저정보.profile_image;

    }


    이름요소.textContent =
        `${
            유저정보.name ??
            "이름 없음"
        }님 환영합니다`;


    현재아이디요소.textContent =
        "현재 아이디 : " +
        (
            유저정보.login_id ??
            "없음"
        );


    const userLevel =
        숫자정리(
            유저정보.user_level,
            1
        );


    레벨요소.textContent =
        "현재 회원 등급 : " +
        (
            회원레벨이름[
                userLevel
            ] ??
            "일반"
        );


    const coin =
        숫자정리(
            유저정보.doldolcoin
        );


    돌돌코인수량요소.textContent =
        "현재 돌돌코인 : " +
        coin.toLocaleString();


    const exp =
        숫자정리(
            유저정보.exp
        );


    EXP화면업데이트(
        exp
    );


    상태화면업데이트();

}


// =====================================================
// 사용자 정보
// =====================================================

async function 사용자정보가져오기(
    user
) {

    const {
        data,
        error
    } =
        await supabase
            .from("users")
            .select(`
                user_number,
                user_id,
                login_id,
                user_level,
                exp,
                exp_level,
                doldolcoin,
                profile_image,
                name,
                user_achievement,
                equipped_title
            `)
            .eq(
                "user_id",
                user.id
            )
            .single();


    if (error) {

        throw error;

    }


    if (!data) {

        throw new Error(
            "사용자 정보를 찾을 수 없습니다."
        );

    }


    return data;

}


// =====================================================
// EXP DB 보정
// =====================================================

async function EXP레벨DB보정(
    user,
    exp,
    기존레벨
) {

    const 계산된 =
        경험치로레벨계산(
            exp
        );

    const 기존 =
        숫자정리(
            기존레벨,
            1
        );


    if (
        계산된 === 기존
    ) {

        return;

    }


    const {
        error
    } =
        await supabase
            .from("users")
            .update({

                exp_level:
                    계산된

            })
            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "EXP 레벨 보정 오류:",
            error
        );

        return;

    }

}


// =====================================================
// 프로필 업로드
// =====================================================

async function 프로필업로드처리() {

    try {

        const file =
            업로드요소.files?.[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "프로필 사진은 10MB 이하만 가능합니다."
            );

            업로드요소.value = "";

            return;

        }


        const {
            data: {
                user
            },
            error
        } =
            await supabase.auth.getUser();


        if (
            error ||
            !user
        ) {

            로그인페이지로이동();

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const allowed = [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp"
        ];


        if (
            !allowed.includes(ext)
        ) {

            alert(
                "JPG, PNG, GIF, WEBP만 사용할 수 있습니다."
            );

            업로드요소.value = "";

            return;

        }


        const fileName =
            `${user.id}.${ext}`;


        const {
            error: uploadError
        } =
            await supabase.storage
                .from(
                    "profile-images"
                )
                .upload(
                    fileName,
                    file,
                    {

                        upsert: true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }
                );


        if (uploadError) {

            throw uploadError;

        }


        const {
            data
        } =
            supabase.storage
                .from(
                    "profile-images"
                )
                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data.publicUrl;


        const {
            error: updateError
        } =
            await supabase
                .from("users")
                .update({

                    profile_image:
                        imageUrl

                })
                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            throw updateError;

        }


        사진요소.src =
            imageUrl +
            "?t=" +
            Date.now();


        현재유저정보.profile_image =
            imageUrl;


        alert(
            "🐶 프로필 사진이 변경되었습니다!"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );

        alert(
            "프로필 사진 변경에 실패했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// 프로필 버튼
// =====================================================

profileButton.addEventListener(
    "click",
    () => {

        업로드요소.click();

    }
);


업로드요소.addEventListener(
    "change",
    프로필업로드처리
);


// =====================================================
// 탭 버튼
// =====================================================

업적버튼.addEventListener(
    "click",
    () => {
        상태탭변경("업적");
    }
);


상세설명버튼.addEventListener(
    "click",
    () => {
        상태탭변경("상세설명");
    }
);


칭호버튼.addEventListener(
    "click",
    () => {
        상태탭변경("칭호");
    }
);


// =====================================================
// 페이지 초기화
// =====================================================

async function 페이지초기화() {

    try {

        const {
            data: {
                session
            },
            error
        } =
            await supabase.auth.getSession();


        if (
            error
        ) {

            throw error;

        }


        if (!session) {

            로그인페이지로이동();

            return;

        }


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabase.auth.getUser();


        if (
            userError ||
            !user
        ) {

            로그인페이지로이동();

            return;

        }


        // 사용자 정보

        const 유저정보 =
            await 사용자정보가져오기(
                user
            );


        // 업적

        try {

            await 업적정보가져오기();

        }

        catch (error) {

            console.error(
                "업적 조회 오류:",
                error
            );

            업적목록 = [];

        }


        // EXP 레벨 보정

        await EXP레벨DB보정(
            user,
            숫자정리(
                유저정보.exp
            ),
            유저정보.exp_level
        );


        유저정보.exp_level =
            경험치로레벨계산(
                숫자정리(
                    유저정보.exp
                )
            );


        // 화면

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "🐶 돌이사이트 설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(
            "페이지 초기화 오류:",
            error
        );

        alert(
            "페이지를 불러오지 못했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// 시작
// =====================================================

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        페이지초기화
    );

}
else {

    페이지초기화();

}


// =====================================================
// Auth 상태
// =====================================================

supabase.auth.onAuthStateChange(
    (
        event
    ) => {

        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }
);

</script>
