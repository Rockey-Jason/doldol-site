/* =====================================================
   숫자 처리
===================================================== */

function 숫자정리(
    value,
    기본값 = 0
) {

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 기본값;

}


/* =====================================================
   HTML Escape
===================================================== */

function HTML이스케이프(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

/* =====================================================
   EXP 레벨 계산
===================================================== */

function 경험치로레벨계산(
    exp
) {

    exp =
        Math.max(
            0,
            숫자정리(
                exp,
                0
            )
        );

    const 레벨목록 =
        Object.keys(
            EXP레벨필요경험치
        )
        .map(Number)
        .sort(
            (a, b) => b - a
        );

    for (
        const level
        of 레벨목록
    ) {

        if (
            exp >=
            EXP레벨필요경험치[level]
        ) {

            return level;

        }

    }

    return 1;

}


/* =====================================================
   EXP 정보
===================================================== */

function 경험치정보계산(
    exp
) {

    exp =
        Math.max(
            0,
            숫자정리(
                exp,
                0
            )
        );

    const level =
        경험치로레벨계산(
            exp
        );

    const 최고레벨 =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );


    if (
        level >=
        최고레벨
    ) {

        return {

            level:
                최고레벨,

            currentExp:
                exp -
                EXP레벨필요경험치[
                    최고레벨
                ],

            requiredExp:
                0,

            progress:
                100,

            remaining:
                0,

            maxLevel:
                true

        };

    }


    const 현재레벨EXP =
        EXP레벨필요경험치[
            level
        ];

    const 다음레벨EXP =
        EXP레벨필요경험치[
            level + 1
        ];

    const currentExp =
        Math.max(
            0,
            exp -
            현재레벨EXP
        );

    const requiredExp =
        다음레벨EXP -
        현재레벨EXP;

    const remaining =
        Math.max(
            0,
            다음레벨EXP -
            exp
        );

    let progress =
        (
            currentExp /
            requiredExp
        ) * 100;

    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );

    return {

        level,

        currentExp,

        requiredExp,

        progress,

        remaining,

        maxLevel:
            false

    };

}


/* =====================================================
   EXP 화면
===================================================== */

function EXP화면업데이트(
    exp
) {

    const 정보 =
        경험치정보계산(
            exp
        );


    EXP레벨요소.textContent =
        `Lv.${정보.level}`;


    현재EXP요소.textContent =
        `${정보.currentExp.toLocaleString()} EXP`;


    필요EXP요소.textContent =
        정보.maxLevel
            ? "MAX"
            : `${정보.requiredExp.toLocaleString()} EXP`;


    EXP진행바.style.width =
        `${정보.progress}%`;


    다음레벨요소.textContent =
        정보.maxLevel
            ? "✨ 최고 레벨!"
            : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

}


/* =====================================================

function 업적데이터정리(
    data
) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }

    return data;

}


/* =====================================================
   업적 획득 여부
===================================================== */

function 업적획득여부(
    id,
    획득업적
) {

    return Boolean(
        획득업적 &&
        typeof 획득업적 === "object" &&
        획득업적[id]
    );

}

                title,
                created_at
            `)

            .eq(
                "enabled",
                true
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        throw error;

    }


    업적목록 =
        Array.isArray(data)
            ? data.filter(
                item =>
                    item &&
                    item.id
            )
            : [];


    console.log(
        "🏆 업적:",
        업적목록
    );

}


/* =====================================================
   칭호 장착
===================================================== */

async function 칭호장착(
    업적ID
) {

    try {

        if (!현재유저정보) {

            alert(
                "사용자 정보를 불러오는 중입니다."
            );

            return;

        }


        const 업적 =
            업적목록.find(
                item =>
                    item.id ===
                    업적ID
            );


        if (!업적) {

            alert(
                "업적 정보를 찾을 수 없습니다."
            );

            return;

        }


        /* 칭호가 없는 업적은 장착 불가능 */

        if (
            !업적.title ||
            !String(
                업적.title
            ).trim()
        ) {

            alert(
                "이 업적에는 칭호가 없습니다."
            );

            return;

        }


        const 획득업적 =
            업적데이터정리(
                현재유저정보.user_achievement
            );


        /* 획득하지 않은 업적은 장착 불가능 */

        if (
            !업적획득여부(
                업적ID,
                획득업적
            )
        ) {

            alert(
                "먼저 이 업적을 획득해야 합니다."
            );

            return;

        }


        const 칭호 =
            String(
                업적.title
            ).trim();


        const {
            error
        } =
            await supabase

                .from("users")

                .update({

                    equipped_title:
                        칭호

                })

                .eq(
                    "user_id",
                    현재유저정보.user_id
                );


        if (error) {

            console.error(
                "칭호 장착 오류:",
                error
            );

            alert(
                "칭호 장착에 실패했습니다.\n\n" +
                error.message
            );

            return;

        }


        현재유저정보.equipped_title =
            칭호;


        사용자화면업데이트(
            현재유저정보
        );


        상태화면업데이트();


        alert(
            `🏷️ "${칭호}" 칭호를 장착했습니다!`
        );

    }

    catch (error) {

        console.error(
            "칭호 장착 오류:",
            error
        );

        alert(
            "칭호 장착 중 오류가 발생했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}

/* =====================================================
   프로필 업로드
===================================================== */

async function 프로필업로드처리(
    file
) {

    try {

        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );

            return;

        }


        const 최대크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대크기
        ) {

            alert(
                "프로필 사진은 10MB 이하만 사용할 수 있습니다."
            );

            return;

        }


        const {
            data: authData,
            error: authError
        } =
            await supabase.auth.getUser();


        if (authError) {

            throw authError;

        }


        const user =
            authData?.user;


        if (!user) {

            로그인페이지로이동();

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const 허용확장자 = [

            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp"

        ];


        if (
            !허용확장자.includes(
                ext
            )
        ) {

            alert(
                "JPG, PNG, GIF, WEBP 이미지만 사용할 수 있습니다."
            );

            return;

        }


        const fileName =
            `${user.id}.${ext}`;


        const {
            error: uploadError
        } =
            await supabase.storage

                .from(
                    "profile-images"
                )

                .upload(

                    fileName,

                    file,

                    {

                        upsert:
                            true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }

                );


        if (uploadError) {

            throw uploadError;

        }


        const {
            data: publicData
        } =
            supabase.storage

                .from(
                    "profile-images"
                )

                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            publicData?.publicUrl;


        if (!imageUrl) {

            throw new Error(
                "이미지 URL을 가져오지 못했습니다."
            );

        }


        const {
            error: updateError
        } =
            await supabase

                .from("users")

                .update({

                    profile_image:
                        imageUrl

                })

                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            throw updateError;

        }


        현재유저정보.profile_image =
            imageUrl;


        사진요소.src =
            imageUrl +
            "?t=" +
            Date.now();


        alert(
            "🐶 프로필 사진이 변경되었습니다!"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );


        alert(
            "프로필 사진 변경에 실패했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


/* =====================================================
   프로필 버튼
===================================================== */

프로필버튼.addEventListener(
    "click",
    () => {

        업로드요소.click();

    }
);


업로드요소.addEventListener(
    "change",
    () => {

        const file =
            업로드요소.files?.[0];

        if (file) {

            프로필업로드처리(
                file
            );

        }

    }
);


/* =====================================================
   초기화
===================================================== */

async function 페이지초기화() {

    try {

        console.log(
            "🐶 돌이 사이트 설정 페이지 시작"
        );


        /* 로그인 확인 */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (sessionError) {

            throw sessionError;

        }


        if (
            !sessionData?.session
        ) {

            로그인페이지로이동();

            return;

        }


        /* 현재 사용자 */

        const {
            data: userData,
            error: userError
        } =
            await supabase.auth.getUser();


        if (userError) {

            throw userError;

        }


        const user =
            userData?.user;


        if (!user) {

            로그인페이지로이동();

            return;

        }


        /* 업적 */

        try {

            await 업적정보가져오기();

        }

        catch (error) {

            console.error(
                "업적 조회 오류:",
                error
            );

            업적목록 = [];

        }


        /* 사용자 정보 */

        const 유저정보 =
            await 사용자정보가져오기(
                user
            );


        /* EXP DB 보정 */

        const exp =
            숫자정리(
                유저정보.exp,
                0
            );


        await EXP레벨DB보정(

            user,

            exp,

            유저정보.exp_level

        );


        유저정보.exp_level =
            경험치로레벨계산(
                exp
            );


        /* 화면 */

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "✅ 설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(
            "페이지 초기화 오류:",
            error
        );


        if (
            error?.code ===
            "PGRST116"
        ) {

            alert(
                "users 테이블에서 현재 사용자 정보를 찾을 수 없습니다."
            );

        }

        else {

            alert(
                "페이지를 불러오지 못했습니다.\n\n" +
                (
                    error?.message ??
                    "알 수 없는 오류"
                )
            );

        }

    }

}


/* =====================================================
   실행
===================================================== */

페이지초기화();


/* =====================================================
   Auth 감시
===================================================== */

supabase.auth.onAuthStateChange(
    (
        event
    ) => {

        console.log(
            "Auth 상태:",
            event
        );


        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }
);

</script>
