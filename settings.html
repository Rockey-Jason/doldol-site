// =====================================================
// 숫자 안전 처리
// =====================================================

function 숫자정리(
    value,
    기본값 = 0
) {

    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return 기본값;

    }


    return number;

}


// =====================================================
// HTML 안전 처리
// =====================================================

function HTML이스케이프(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// =====================================================

// =====================================================
// EXP → 레벨 계산
// =====================================================

function 경험치로레벨계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(
                exp,
                0
            )
        );


    let level = 1;


    const 레벨목록 =
        Object.keys(
            EXP레벨필요경험치
        )

        .map(Number)

        .sort(
            (a, b) =>
                b - a
        );


    for (
        const 레벨
        of 레벨목록
    ) {

        if (
            exp >=
            EXP레벨필요경험치[레벨]
        ) {

            level =
                레벨;

            break;

        }

    }


    return level;

}


// =====================================================
// EXP 정보 계산
// =====================================================

function 경험치정보계산(exp) {

    exp =
        Math.max(
            0,
            숫자정리(
                exp,
                0
            )
        );


    const level =
        경험치로레벨계산(
            exp
        );


    const 최고레벨 =
        Math.max(
            ...Object.keys(
                EXP레벨필요경험치
            ).map(Number)
        );


    if (
        level >=
        최고레벨
    ) {

        const 최고레벨필요EXP =
            EXP레벨필요경험치[
                최고레벨
            ];


        return {

            level:
                최고레벨,

            totalExp:
                exp,

            currentExp:
                Math.max(
                    0,
                    exp -
                    최고레벨필요EXP
                ),

            requiredExp:
                0,

            progress:
                100,

            remaining:
                0,

            maxLevel:
                true

        };

    }


    const 현재레벨필요EXP =
        EXP레벨필요경험치[
            level
        ];


    const 다음레벨필요EXP =
        EXP레벨필요경험치[
            level + 1
        ];


    const 현재구간EXP =
        Math.max(
            0,
            exp -
            현재레벨필요EXP
        );


    const 구간필요EXP =
        Math.max(
            0,
            다음레벨필요EXP -
            현재레벨필요EXP
        );


    let progress = 0;


    if (
        구간필요EXP > 0
    ) {

        progress =
            (
                현재구간EXP /
                구간필요EXP
            ) * 100;

    }


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    const remaining =
        Math.max(
            0,
            다음레벨필요EXP -
            exp
        );


    return {

        level,

        totalExp:
            exp,

        currentExp:
            현재구간EXP,

        requiredExp:
            구간필요EXP,

        progress,

        remaining,

        maxLevel:
            false

    };

}


// =====================================================
// EXP 화면 업데이트
// =====================================================

function EXP화면업데이트(exp) {

    const 정보 =
        경험치정보계산(
            exp
        );


    if (EXP레벨요소) {

        EXP레벨요소.textContent =
            `Lv.${정보.level}`;

    }


    if (현재EXP요소) {

        현재EXP요소.textContent =
            `${정보.currentExp.toLocaleString()} EXP`;

    }


    if (필요EXP요소) {

        필요EXP요소.textContent =
            정보.maxLevel

                ? "MAX"

                : `${정보.requiredExp.toLocaleString()} EXP`;

    }


    if (EXP진행바) {

        EXP진행바.style.width =
            `${정보.progress}%`;

    }


    if (다음레벨텍스트) {

        다음레벨텍스트.textContent =

            정보.maxLevel

                ? "✨ 최고 레벨!"

                : `다음 레벨까지 ${정보.remaining.toLocaleString()} EXP`;

    }

}


// =====================================================
// user_achievement 안전 처리
// =====================================================

function 업적데이터정리(data) {

    if (
        !data ||
        typeof data !== "object" ||
        Array.isArray(data)
    ) {

        return {};

    }


    return data;

}


// =====================================================
// ⭐ Supabase achievements 조회
// =====================================================

async function 업적정보가져오기() {

    const {

        data,

        error

    } =
        await supabase

            .from("achievements")

            .select(`
                id,
                name,
                description,
                rarity,
                reward_exp,
                reward_doldolcoin,
                icon,
                enabled,
                created_at
            `)

            .eq(
                "enabled",
                true
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "achievements 조회 오류:",
            error
        );


        throw error;

    }


    if (
        !Array.isArray(data)
    ) {

        업적목록 = [];

        return [];

    }


    업적목록 =
        data.filter(
            업적 =>
                업적 &&
                업적.id
        );


    console.log(
        "🏆 Supabase 업적 목록:",
        업적목록
    );


    return 업적목록;

}


// =====================================================
// 업적 획득 여부
// =====================================================

function 업적획득여부(
    업적ID,
    획득업적
) {

    if (
        !획득업적 ||
        typeof 획득업적 !== "object"
    ) {

        return false;

    }


    return Boolean(
        획득업적[
            업적ID
        ]
    );

}


// =====================================================
// 업적 화면
// =====================================================

function 업적화면표시() {

    if (!상태내용요소) {

        return;

    }


    const 획득업적 =
        업적데이터정리(
            현재유저정보?.user_achievement
        );


    if (
        업적목록.length === 0
    ) {

        상태내용요소.innerHTML = `

            <div
                class="achievement-empty"
            >

                🏆 등록된 업적이 없습니다.

            </div>

        `;

        return;

    }


    let html = "";


    for (
        const 업적
        of 업적목록
    ) {

        if (
            !업적 ||
            !업적.id
        ) {

            continue;

        }


        const 획득 =
            업적획득여부(
                업적.id,
                획득업적
            );


        const 아이콘 =
            업적.icon ??
            "🏆";


        const 이름 =
            업적.name ??
            "이름 없는 업적";


        const 설명 =
            업적.description ??
            "설명이 없습니다.";


        const 희귀도 =
            업적.rarity ??
            "Common";


        const 경험치 =
            숫자정리(
                업적.reward_exp,
                0
            );


        const 돌돌코인 =
            숫자정리(
                업적.reward_doldolcoin,
                0
            );


        let 획득부분 = "";


        if (획득) {

            let 시간 = "-";


            const 획득정보 =
                획득업적[
                    업적.id
                ];


            if (
                획득정보 &&
                typeof 획득정보 === "object"
            ) {

                const 획득시간 =
                    획득정보.획득시간 ??
                    획득정보.acquired_at ??
                    획득정보.obtained_at;


                if (
                    획득시간
                ) {

                    const 날짜 =
                        new Date(
                            획득시간
                        );


                    if (
                        !Number.isNaN(
                            날짜.getTime()
                        )
                    ) {

                        시간 =
                            날짜.toLocaleString(
                                "ko-KR"
                            );

                    }

                }

            }


            획득부분 = `

                <div
                    class="achievement-status"
                >

                    ✅ 획득 완료

                </div>


                <div
                    class="achievement-time"
                >

                    🕐 획득시간:
                    ${HTML이스케이프(
                        시간
                    )}

                </div>

            `;

        }

        else {

            획득부분 = `

                <div
                    class="achievement-status"
                >

                    🔒 아직 획득하지 않음

                </div>

            `;

        }


        html += `

            <div
                class="achievement-item"
            >

                <div
                    class="achievement-name"
                >

                    ${
                        획득
                            ? HTML이스케이프(
                                아이콘
                            )
                            : "🔒"
                    }

                    ${HTML이스케이프(
                        이름
                    )}

                </div>


                <div
                    class="achievement-description"
                >

                    ${HTML이스케이프(
                        설명
                    )}

                </div>


                <div
                    class="achievement-description"
                >

                    ⭐ 희귀도:
                    ${HTML이스케이프(
                        희귀도
                    )}

                </div>


                <div
                    class="achievement-reward"
                >

                    🎁 보상:

                    ${경험치.toLocaleString()}
                    EXP

                    /

                    ${돌돌코인.toLocaleString()}
                    돌돌코인

                </div>


                ${획득부분}

            </div>

        `;

    }


    if (!html) {

        html = `

            <div
                class="achievement-empty"
            >

                🏆 표시할 업적이 없습니다.

            </div>

        `;

    }


    상태내용요소.innerHTML =
        html;

}

async function 사용자정보가져오기(
    user
) {

    if (!user) {

        throw new Error(
            "로그인된 사용자가 없습니다."
        );

    }


    const {

        data: 유저정보,

        error

    } =
        await supabase

            .from("users")

            .select(`

                user_number,
                user_id,
                login_id,
                user_level,
                exp,
                exp_level,
                doldolcoin,
                profile_image,
                name,
                user_achievement

            `)

            .eq(
                "user_id",
                user.id
            )

            .single();


    if (error) {

        throw error;

    }


    if (!유저정보) {

        throw new Error(
            "users 테이블에서 사용자 정보를 찾을 수 없습니다."
        );

    }


    return 유저정보;

}


// =====================================================
// exp_level DB 보정
// =====================================================

async function EXP레벨DB보정(
    user,
    exp,
    기존EXP레벨
) {

    const 계산된EXP레벨 =
        경험치로레벨계산(
            exp
        );


    const DBEXP레벨 =
        숫자정리(
            기존EXP레벨,
            1
        );


    if (
        계산된EXP레벨 ===
        DBEXP레벨
    ) {

        return true;

    }


    console.log(
        "EXP 레벨 자동 보정:",
        DBEXP레벨,
        "→",
        계산된EXP레벨
    );


    const {

        error

    } =
        await supabase

            .from("users")

            .update({

                exp_level:
                    계산된EXP레벨

            })

            .eq(
                "user_id",
                user.id
            );


    if (error) {

        console.error(
            "exp_level 자동 보정 오류:",
            error
        );

        return false;

    }


    return true;

}


// =====================================================
// 프로필 업로드
// =====================================================

async function 프로필업로드처리() {

    try {

        if (!업로드요소) {

            return;

        }


        const file =
            업로드요소.files?.[0];


        if (!file) {

            alert(
                "사진을 선택하세요."
            );

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "이미지 파일만 업로드할 수 있습니다."
            );


            업로드요소.value =
                "";


            return;

        }


        const 최대크기 =
            10 * 1024 * 1024;


        if (
            file.size >
            최대크기
        ) {

            alert(
                "프로필 사진은 10MB 이하만 업로드할 수 있습니다."
            );


            업로드요소.value =
                "";


            return;

        }


        const {

            data: {
                user
            },

            error: authError

        } =
            await supabase.auth.getUser();


        if (authError) {

            console.error(
                authError
            );


            alert(
                "로그인 정보를 확인할 수 없습니다."
            );


            return;

        }


        if (!user) {

            로그인페이지로이동();

            return;

        }


        const ext =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const 허용확장자 = [

            "jpg",

            "jpeg",

            "png",

            "gif",

            "webp"

        ];


        if (
            !허용확장자.includes(
                ext
            )
        ) {

            alert(
                "JPG, PNG, GIF, WEBP 이미지만 사용할 수 있습니다."
            );


            업로드요소.value =
                "";


            return;

        }


        const fileName =
            `${user.id}.${ext}`;


        const {

            error: uploadError

        } =
            await supabase.storage

                .from(
                    "profile-images"
                )

                .upload(

                    fileName,

                    file,

                    {

                        upsert:
                            true,

                        contentType:
                            file.type,

                        cacheControl:
                            "3600"

                    }

                );


        if (uploadError) {

            console.error(
                uploadError
            );


            alert(
                "프로필 사진 업로드에 실패했습니다.\n\n" +
                uploadError.message
            );


            return;

        }


        const {

            data

        } =
            supabase.storage

                .from(
                    "profile-images"
                )

                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            data?.publicUrl;


        if (!imageUrl) {

            throw new Error(
                "프로필 이미지 URL을 가져오지 못했습니다."
            );

        }


        const {

            error: updateError

        } =
            await supabase

                .from("users")

                .update({

                    profile_image:
                        imageUrl

                })

                .eq(
                    "user_id",
                    user.id
                );


        if (updateError) {

            console.error(
                updateError
            );


            alert(
                "프로필 사진은 업로드되었지만 사용자 정보 저장에 실패했습니다.\n\n" +
                updateError.message
            );


            return;

        }


        if (사진요소) {

            사진요소.src =
                imageUrl +
                "?t=" +
                Date.now();

        }


        if (현재유저정보) {

            현재유저정보.profile_image =
                imageUrl;

        }


        alert(
            "프로필 사진이 변경되었습니다! 🐶"
        );


        업로드요소.value =
            "";

    }

    catch (error) {

        console.error(
            "프로필 업로드 오류:",
            error
        );


        alert(
            "프로필 사진 변경 중 오류가 발생했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}

            ) {

                alert(
                    "사용자 정보를 읽을 권한이 없습니다.\n\n" +
                    "Supabase users 테이블 RLS 정책을 확인하세요."
                );

            }

            else if (
                error?.code ===
                "PGRST116"
            ) {

                alert(
                    "users 테이블에서 현재 사용자의 정보를 찾을 수 없습니다."
                );

            }

            else {

                alert(
                    "사용자 정보를 불러오지 못했습니다.\n\n" +
                    메시지
                );

            }


            return;

        }


        // =================================================
        // ⭐ achievements 조회
        // =================================================

        try {

            await 업적정보가져오기();

        }

        catch (error) {

            console.error(
                "achievements 조회 오류:",
                error
            );


            /*
             * 업적 조회 실패 때문에
             * 사용자 정보 화면까지 전부 죽이지 않는다.
             */

            업적목록 = [];


            if (상태내용요소) {

                상태내용요소.innerHTML = `

                    <div
                        style="
                            text-align:center;
                            padding:30px;
                            opacity:0.8;
                        "
                    >

                        ⚠️ 업적 정보를 불러오지 못했습니다.

                        <br><br>

                        잠시 후 다시 시도해주세요.

                    </div>

                `;

            }

        }


        // =================================================
        // EXP
        // =================================================

        const exp =
            숫자정리(
                유저정보.exp,
                0
            );


        const DBEXP레벨 =
            숫자정리(
                유저정보.exp_level,
                1
            );


        // =================================================
        // exp_level 자동 보정
        // =================================================

        const 보정성공 =
            await EXP레벨DB보정(

                user,

                exp,

                DBEXP레벨

            );


        if (보정성공) {

            유저정보.exp_level =
                경험치로레벨계산(
                    exp
                );

        }


        // =================================================
        // 화면 업데이트
        // =================================================

        사용자화면업데이트(
            유저정보
        );


        console.log(
            "✅ 설정 페이지 정상 실행"
        );

    }

    catch (error) {

        console.error(
            "설정 페이지 초기화 오류:",
            error
        );


        alert(
            "페이지를 불러오는 중 오류가 발생했습니다.\n\n" +
            (
                error?.message ??
                "알 수 없는 오류"
            )
        );

    }

}


// =====================================================
// DOMContentLoaded
// =====================================================

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        페이지초기화
    );

}

else {

    페이지초기화();

}

supabase.auth.onAuthStateChange(

    async (
        event,
        session
    ) => {

        console.log(
            "Auth 상태 변경:",
            event
        );


        if (
            event ===
            "SIGNED_OUT"
        ) {

            location.href =
                "login.html";

        }

    }

);

</script>
